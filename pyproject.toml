[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
known-first-party = ["flext_infra"]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
allow-dunder-method-names = ["__base__", "__bases__"]

[tool.tomlsort]
all = true
in_place = true
sort_first = ["project", "build-system", "tool", "dependency-groups"]

[tool.vulture]
exclude = ["*/_protocols/*"]
min_confidence = 100
paths = ["src"]
verbose = false

[tool.yamlfix]
explicit_start = false
line_length = 88
preserve_quotes = true
section_whitelines = 1
whitelines = 1

[tool.uv]
constraint-dependencies = [
  "pillow>=13.0.0",
  "certifi>=2026.10.19",
  "setuptools>=84.1.0",
  "virtualenv>=21.14.13",
  "filelock>=4.2.1",
  "uv>=0.13.4",
]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
link-mode = "copy"
override-dependencies = [
  "rope @ git+https://github.com/marlon-costa-dc/rope.git@8414232e12b6328ba812bf49fe465fde65774dfd",
  "flext-cli @ git+https://github.com/flext-sh/flext-cli.git@0.12.0-dev",
  "flext-core @ git+https://github.com/flext-sh/flext-core.git@0.12.0-dev",
  "flext-tests @ git+https://github.com/flext-sh/flext-tests.git@0.12.0-dev",
]

[[tool.uv.exclude-dependencies]]
dependencies = ["flext-infra"]

[tool.uv.exclude-dependencies.package]
name = "flext-cli"

[[tool.uv.exclude-dependencies]]
dependencies = ["flext-infra"]

[tool.uv.exclude-dependencies.package]
name = "flext-core"

[[tool.uv.exclude-dependencies]]
dependencies = ["flext-infra"]

[tool.uv.exclude-dependencies.package]
name = "flext-tests"

[tool.interrogate]
fail-under = 70
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-module = false
ignore-private = true
ignore-property-decorators = true

[tool.pytest_env]
FLEXT_INFRA_LINT_SNAPSHOT_GATES = "lint"

[tool.radon]
cc_min = "B"
mi_min = "B"
