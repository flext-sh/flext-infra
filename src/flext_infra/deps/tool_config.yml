  mypy:
    plugins:
      - pydantic.mypy
      - returns.contrib.mypy.returns_plugin
    exclude: ^tests/fixtures(?:/|$)
    # The seven codes below are disabled globally based on empirical validation
    # against FLEXT's MRO composition + PEP 562 lazy __getattr__ in
    # flext_core/lazy.py + PEP 695 type aliases referencing namespace facades
    # (m/t/c/p/u). Evidence: .reports/refactor/t17-mypy-package-mode.log lines
    # 20-54, and user-reported cases in flext_core/_typings/base.py:28 and
    # flext_tap_oracle/models.py:26 where mypy rejects namespace-aliased types.
    # AGENTS.md:319 requires per-line/per-module justification; this block-level
    # YAML comment documents the systemic rationale. Removal depends on a
    # future lazy-getattr resolver plugin or generated .pyi stubs.
    disabled-error-codes:
      - assignment # dependency_injector binding chains misinterpreted by mypy
      - attr-defined # MRO-composed narrow types resolved to `object`
      - call-arg # Pydantic v2 plugin gap + lazy __getattr__
      - misc # List[dict[str, Any]] inference noise in MRO factories
      - name-defined # lazy __getattr__ in autogenerated __init__.py
      - prop-decorator # Pydantic v2 computed_field inside MRO mixins
      - valid-type # namespace facades (m/t/c/p/u) used in PEP 695 aliases
    boolean-settings:
      # Discovery + namespace (retained)
      ignore_missing_imports: true
      namespace_packages: true
      explicit_package_bases: true
      # Safe strict flags aligned with pyrefly (already 0/31 workspace-wide).
      # Noisier flags (disallow_untyped_defs, disallow_any_unimported,
      # ignore_missing_imports=false) are deferred to a follow-up cycle to
      # avoid surfacing ~20 unrelated stub issues in the same PR.
      check_untyped_defs: true
      extra_checks: true
      local_partial_types: true
      no_implicit_reexport: true
      # strict_concatenate is deprecated in mypy 1.20+; extra_checks covers it
      strict_equality: true
      warn_redundant_casts: true
      warn_return_any: true
      warn_unreachable: true
      warn_unused_ignores: true
    string-settings:
      follow_imports: normal
    overrides: []
  pydantic-mypy:
    init_forbid_extra: true
    init_typed: true
    warn_required_dynamic_aliases: true
    warn-untyped-fields: true
  pyright:
    strict-settings:
      pythonVersion: "3.13"
      pythonPlatform: Linux
      typeCheckingMode: strict
    extended-settings:
      reportArgumentType: none
      reportAttributeAccessIssue: none
      reportCallIssue: none
      reportConstantRedefinition: error
      reportIncompatibleMethodOverride: error
      reportIncompatibleVariableOverride: none
      reportInconsistentConstructor: error
      reportInvalidTypeForm: none
      reportMissingImports: error
      reportMissingModuleSource: error
      reportMissingTypeStubs: none
      reportPrivateUsage: warning
      reportUnknownArgumentType: none
      reportUnknownLambdaType: none
      reportUnknownMemberType: none
      reportUnknownParameterType: none
      reportUnknownVariableType: none
      reportUnnecessaryCast: error
      reportUnnecessaryComparison: warning
      reportUnnecessaryIsInstance: warning
      reportUnreachable: none
      reportUnsupportedDunderAll: none
      reportUntypedBaseClass: none
      reportUntypedFunctionDecorator: none
      reportUnusedClass: error
      reportUnusedFunction: error
      reportUnusedImport: error
      reportUnusedVariable: error
    lazy-import-suppressions:
      reportAttributeAccessIssue: "none"
      reportInvalidTypeForm: none
      reportPrivateImportUsage: "none"
      reportUnknownArgumentType: "none"
      reportUnknownLambdaType: "none"
      reportUnknownMemberType: none
      reportUnknownParameterType: "none"
      reportUnknownVariableType: "none"
      reportUnusedImport: "none"
    source-env-suppressions:
      reportGeneralTypeIssues: "none"
      reportReturnType: "none"
    test-like-env-suppressions:
      reportArgumentType: "none"
      reportReturnType: "none"
    path-rules:
      source-dir: src
      project-root: .
      env-dirs:
        - src
        - tests
        - examples
        - scripts
      test-like-dirs:
        - tests
        - examples
        - scripts
      default-excludes:
        - "**/node_modules"
        - "**/__pycache__"
        - "**/__pyrefly_virtual__/**"
        - "**/.mypy_cache"
        - "**/.ruff_cache"
        - "**/.pytest_cache"
        - "**/.*"
        - "**/tests/fixtures"
        - "**/tests/fixtures/**"
        - .venv
        - "**/.venv"
        - "**/.venv/**"
        - "**/venv"
        - "**/venv/**"
        - "**/site-packages"
        - "**/site-packages/**"
        - "**/dist-packages"
        - "**/dist-packages/**"
      dynamic-exclude-dirs:
        - .git
        - .reports
        - vendor
      root-typings-paths:
        - typings
        - typings/generated
      project-typings-paths:
        - ../typings
        - ../typings/generated
      ignored-diagnostic-globs:
        - "**/*.pyi"
      source-report-private-usage: error
      test-like-report-private-usage: none
      other-report-private-usage: none
      root-venv-path: .
      project-venv-path: ..
      venv-name: .venv
  coverage:
    fail-under:
      core: 45
      domain: 30
      platform: 25
      integration: 20
      app: 15
    show-missing: true
    skip-covered: false
    precision: 2
    exclude-also:
      - "if _t.TYPE_CHECKING:"
      - "if TYPE_CHECKING:"
      - "if typing.TYPE_CHECKING:"
    omit:
      - "*/dependency_injector/providers.pyx"
  pyrefly:
    disable-project-excludes-heuristics: true
    ignore-errors-in-generated-code: true
    python-version: "3.13"
    use-ignore-files: false
    strict-errors:
      # --- type safety ---
      - annotation-mismatch
      - bad-argument-count
      - bad-argument-type
      - bad-assignment
      - bad-class-definition
      - bad-context-manager
      - bad-dunder-all
      - bad-function-definition
      - bad-index
      - bad-instantiation
      - bad-keyword-argument
      - bad-match
      - bad-param-name-override
      - bad-raise
      - bad-return
      - bad-specialization
      - bad-typed-dict
      - bad-typed-dict-key
      - bad-unpacking
      - deprecated
      - implicit-abstract-class
      - implicit-any
      - implicit-import
      - implicitly-defined-attribute
      - inconsistent-inheritance
      - inconsistent-overload
      - invalid-annotation
      - invalid-argument
      - invalid-decorator
      - invalid-inheritance
      - invalid-literal
      - invalid-overload
      - invalid-param-spec
      - invalid-pattern
      - invalid-self-type
      - invalid-super-call
      - invalid-type-alias
      - invalid-type-var
      - invalid-type-var-tuple
      - invalid-variance
      - invalid-yield
      - missing-argument
      - missing-attribute
      - missing-import
      - missing-module-attribute
      - missing-override-decorator
      - missing-source
      - missing-source-for-stubs
      - no-access
      - no-matching-overload
      - not-a-type
      - not-async
      - not-callable
      - not-iterable
      - not-required-key-access
      - open-unpacking
      - protocol-implicitly-defined-attribute
      - read-only
      - redefinition
      - redundant-cast
      - redundant-condition
      - unannotated-attribute
      - unannotated-parameter
      - unannotated-return
      - unbound-name
      - unexpected-keyword
      - unexpected-positional-argument
      - unknown-name
      - unnecessary-comparison
      - unnecessary-type-conversion
      - unreachable
      - unresolvable-dunder-all
      - unsafe-overlap
      - unsupported
      - unsupported-delete
      - unsupported-operation
      - untyped-import
      - unused-coroutine
      - unused-ignore
      - variance-mismatch
      - inconsistent-overload-default
    disabled-errors:
      - abstract-method-call
      - bad-override
      - non-convergent-recursion
      - non-exhaustive-match
    project-exclude-globs:
      - "**/__pycache__"
      - "**/__pyrefly_virtual__/**"
      - "**/node_modules"
      - "**/.venv/**"
      - "**/*_pb2*.py"
      - "**/*_pb2_grpc*.py"
      - "**/site-packages/**"
      - "**/typings/**"
      - "**/venv/**"
      - "**/vendor/**"
      - ".flext-deps/**"
      - ".venv/**"
      - "typings/**"
      - "vendor/**"
    path-rules:
      env-dirs:
        - src
        - tests
        - examples
        - scripts
      source-dir: src
      project-root: .
      root-typings-paths: []
      project-typings-paths: []
      workspace-include-children: false
      workspace-include-child-env-dirs: []
      include-path-dependencies-in-search-path: true
      project-shared-search-paths:
        - scripts
  pytest:
    standard-markers:
      - "unit: unit tests"
      - "integration: integration tests"
      - "performance: performance and benchmark tests"
      - "slow: slow-running tests"
      - "docker: tests requiring Docker"
      - "e2e: end-to-end integration tests"
      - "edge_cases: edge case tests"
      - "stress: stress tests"
      - "resilience: resilience tests"
    standard-addopts:
      - --strict-markers
      - --markdown-docs
      - --durations=10
      - --ignore-glob=*/tests/constants.py
      - --ignore-glob=*/tests/models.py
      - --ignore-glob=*/tests/protocols.py
      - --ignore-glob=*/tests/typings.py
      - --ignore-glob=*/tests/utilities.py
      - --ignore-glob=*/tests/_constants/*
      - --ignore-glob=*/tests/_models/*
      - --ignore-glob=*/tests/_protocols/*
      - --ignore-glob=*/tests/_typings/*
      - --ignore-glob=*/tests/_utilities/*
  tomlsort:
    all: true
    in_place: true
    sort_first:
      - project
      - build-system
      - tool
      - dependency-groups
  yamlfix:
    line_length: 88
    preserve_quotes: true
    whitelines: 1
    section_whitelines: 1
    explicit_start: false

project-type-overrides:
  core:
    pyright: {}
  domain:
