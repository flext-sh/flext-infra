id: remove-cli-local-timeout-synthetic-status
valid:
  - |
    if received_signals:
        primary_exit = -abs(received_signals[0])
    elif return_code is None:
        primary_exit = None
invalid:
  - |
    if received_signals:
        primary_exit = -abs(received_signals[0])
    elif timed_out:
        primary_exit = timeout_exit_code
    elif return_code is None:
        primary_exit = None
