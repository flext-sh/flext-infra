# Generator declarations law (ADR-018, point 7): the lazy-init generator
# propagates exactly what a sibling module declares in its own `__all__`, and a
# module whose stem starts with a digit cannot be imported -- `from .02_x import`
# is a SyntaxError -- so an `__all__` in a numbered example or script is a dead
# declaration that the generator faithfully renders into an unimportable init.
# The defect is at the source: a numbered file is a runnable script, not a
# module, and publishes nothing to its package. This rule removes the
# declaration; the generator keeps no guard for the filename.
id: ban-numbered-script-all-declaration
language: python
severity: error
files:
  - "examples/[0-9]*.py"
  - "scripts/[0-9]*.py"
  - "examples/**/[0-9]*.py"
  - "scripts/**/[0-9]*.py"
rule:
  any:
    - pattern: "__all__ = $LIST"
    - pattern: "__all__: $TYPE = $LIST"
  inside:
    kind: module
    stopBy: end
fix: ""
message: >-
  A numbered example or script is not an importable module; its __all__ declares
  nothing to the package and makes the generated __init__ unimportable. Remove it.
