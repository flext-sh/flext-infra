# Keep each public runtime test's assertions with the invocation they validate.
id: repair-cli-streamed-process-live-assertion-owner
language: Python
severity: error
files:
  - "flext-cli/tests/unit/test_runtime_streamed_process.py"
rule:
  pattern:
    context: |
      class $CLASS:
          $$$BEFORE
          def test_combined_output_is_byte_exact_and_live(
              self, tmp_path: Path, capfd: pytest.CaptureFixture[str]
          ) -> None:
              $$$COMBINED
              result = u.Cli().run_to_file(
                  [sys.executable, "-c", script], output_file, live=True
              )
          def test_silent_live_process_emits_progress_only_to_stderr(
              self, tmp_path: Path, capfd: pytest.CaptureFixture[str]
          ) -> None:
              $$$HEARTBEAT
              expected = b"stdout-one\nstderr-two\n"
              tm.ok(result)
              tm.that(result.value, eq=0)
              $$$MOVED
          $$$AFTER
    selector: class_definition
fix: |
  class $CLASS:
      $$$BEFORE
      def test_combined_output_is_byte_exact_and_live(
          self, tmp_path: Path, capfd: pytest.CaptureFixture[str]
      ) -> None:
          $$$COMBINED
          result = u.Cli().run_to_file(
              [sys.executable, "-c", script], output_file, live=True
          )

          expected = b"stdout-one\nstderr-two\n"
          outcome = tm.ok(result)
          tm.that(outcome.raw_return_code, eq=c.Cli.EXIT_CODE_SUCCESS)
          tm.that(outcome.timed_out, eq=False)
          tm.that(outcome.forwarded_signal, is_=None)
          $$$MOVED

      def test_silent_live_process_emits_progress_only_to_stderr(
          self, tmp_path: Path, capfd: pytest.CaptureFixture[str]
      ) -> None:
          $$$HEARTBEAT
      $$$AFTER
message: Move byte-stream assertions to their owning public run_to_file invocation.
