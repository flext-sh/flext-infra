language: Python
severity: error
files:
  - "**/tests/*.py"
  - "**/tests/**/*.py"
rule:
  pattern: $OWNER.create_command_output(stdout=$STDOUT, returncode=$CODE)
constraints:
  OWNER:
    regex: '^(?:u\.Tests|TestsFlextInfraUtilities\.Tests)$'
message: Use the causal command-output fixture exit-code parameter.
fix: $OWNER.create_command_output(stdout=$STDOUT, exit_code=$CODE)
---
id: rewire-test-command-output-return-code-stderr
language: Python
severity: error
files:
  - "**/tests/*.py"
  - "**/tests/**/*.py"
rule:
  pattern: $OWNER.create_command_output(stderr=$STDERR, returncode=$CODE)
constraints:
  OWNER:
    regex: '^(?:u\.Tests|TestsFlextInfraUtilities\.Tests)$'
message: Use the causal command-output fixture exit-code parameter.
