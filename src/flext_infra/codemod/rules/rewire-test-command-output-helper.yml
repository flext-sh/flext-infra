---
id: rewire-test-command-output-constructor-to-factory
language: Python
severity: error
files:
  - "**/tests/utilities.py"
rule:
  pattern: m.Cli.CommandOutput(stdout=$STDOUT, stderr=$STDERR, exit_code=$CODE)
message: Route synthetic command outcomes through the typed test factory.
fix: TestsFlextInfraUtilities.Tests.create_command_output(stdout=$STDOUT, stderr=$STDERR, exit_code=$CODE)
---
id: rewire-detector-test-command-output-to-factory
language: Python
severity: error
files:
  - "**/tests/unit/deps/test_detector_main.py"
rule:
  pattern: m.Cli.CommandOutput(stdout=$STDOUT, stderr=$STDERR, exit_code=$CODE)
message: Route synthetic command outcomes through the typed test factory.
fix: u.Tests.create_command_output(stdout=$STDOUT, stderr=$STDERR, exit_code=$CODE)
---
id: rewire-timeout-test-command-outcome
language: Python
severity: error
files:
  - "**/tests/unit/_utilities/test_resource_limits.py"
rule:
  pattern: m.Cli.CommandOutput(stdout=$STDOUT, stderr=$STDERR, exit_code=c.Infra.PROCESS_TIMEOUT_EXIT_CODE)
message: Preserve the causal timeout state in the public command model.
fix: |-
  m.Cli.CommandOutput(
      stdout=$STDOUT,
      stderr=$STDERR,
      outcome=m.Cli.ProcessOutcome(
          raw_return_code=c.Infra.PROCESS_TIMEOUT_EXIT_CODE,
          timed_out=True,
          forwarded_signal=None,
      ),
  )
---
id: rewire-signal-test-command-outcome
language: Python
severity: error
files:
  - "**/tests/unit/_utilities/test_resource_limits.py"
rule:
  pattern: m.Cli.CommandOutput(stdout=$STDOUT, stderr=$STDERR, exit_code=-11)
message: Preserve the causal signal state in the public command model.
fix: |-
  m.Cli.CommandOutput(
      stdout=$STDOUT,
      stderr=$STDERR,
      outcome=m.Cli.ProcessOutcome(
          raw_return_code=-11,
          timed_out=False,
          forwarded_signal=None,
      ),
  )
