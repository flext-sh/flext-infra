id: rewire-test-command-output-helper
language: Python
severity: error
files:
  - "**/tests/*.py"
  - "**/tests/**/*.py"
rule:
  pattern: $OWNER.stub_run($$$ARGS)
constraints:
  OWNER:
    regex: '^(?:u\.Tests|TestsFlextInfraUtilities\.Tests)$'
message: Use the single typed command-output fixture factory.
fix: $OWNER.create_command_output($$$ARGS)
---
id: rewire-test-command-output-return-code-only
language: Python
severity: error
files:
  - "**/tests/*.py"
  - "**/tests/**/*.py"
rule:
  pattern: $OWNER.create_command_output(returncode=$CODE)
constraints:
  OWNER:
    regex: '^(?:u\.Tests|TestsFlextInfraUtilities\.Tests)$'
message: Use the causal command-output fixture exit-code parameter.
fix: $OWNER.create_command_output(exit_code=$CODE)
---
id: rewire-test-command-output-return-code-streams
language: Python
severity: error
files:
  - "**/tests/*.py"
  - "**/tests/**/*.py"
rule:
  pattern: $OWNER.create_command_output(stdout=$STDOUT, stderr=$STDERR, returncode=$CODE)
constraints:
  OWNER:
    regex: '^(?:u\.Tests|TestsFlextInfraUtilities\.Tests)$'
message: Use the causal command-output fixture exit-code parameter.
fix: $OWNER.create_command_output(stdout=$STDOUT, stderr=$STDERR, exit_code=$CODE)
---
