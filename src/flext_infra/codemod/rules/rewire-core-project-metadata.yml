# Project metadata is consumed through the package's canonical Infra utility
# facade so the composition chain remains explicit at every call site.
id: rewire-core-project-metadata
language: Python
severity: error
files:
  - "flext-infra/src/**/*.py"
rule:
  pattern: u.build_project_metadata($$$ARGS)
fix: u.Infra.build_project_metadata($$$ARGS)
message: Consume project metadata construction through the canonical u.Infra facade.
