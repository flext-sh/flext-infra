id: rewire-cli-process-outcome-failure-check
language: Python
severity: error
files:
  - "flext-infra/src/**/*.py"
  - "flext-infra/tests/**/*.py"
  - "flext-cli/tests/**/*.py"
rule:
  any:
    - pattern: $OUTCOME.raw_return_code != $SUCCESS
    - pattern: $SUCCESS != $OUTCOME.raw_return_code
constraints:
  SUCCESS:
    regex: "^(?:0|c\\.Cli\\.EXIT_CODE_SUCCESS)$"
fix: not u.Cli.process_succeeded($OUTCOME)
message: Classify non-success from the complete ProcessOutcome.
