# A flext_core Result is always exactly one of success/failure (mutually
# exclusive, jointly exhaustive) — asserting `X.success or X.failure` on the
# SAME expression is a tautology that always passes and proves nothing about
# runtime behavior (skill testing--observable-runtime / R25). Evidence: X-37
# (docs/auditor_tests.py). ast-grep metavariable equality ($X used twice)
# enforces that both sides reference the identical expression; `a.success or
# b.failure` on two different expressions is ordinary (non-tautological) logic
# and is not flagged. Detection-only: the fix is to assert the ONE outcome the
# test actually expects, which is a semantic call the rule cannot make safely.
id: ban-tautological-result-assertion
language: python
severity: error
files:
  - "tests/**/*.py"
rule:
  any:
    - pattern: tm.that($X.success or $X.failure, eq=True)
    - pattern: tm.that($X.failure or $X.success, eq=True)
    - pattern: assert $X.success or $X.failure
    - pattern: assert $X.failure or $X.success
message: >-
  [ban-tautological-result-assertion] Result assertion is always true
  (success xor failure, so `X.success or X.failure` proves nothing) — fix:
  assert the one outcome this test actually expects (`.success` or `.failure`
  alone, or the specific value) at the call site · ref: skill
  testing--observable-runtime
