# Enforce one public import boundary for every FLEXT consumer.
#
# Absolute imports of private implementation modules couple a consumer to an
# owner layout. Same-owner implementation modules use relative sibling imports;
# every other consumer uses a public facade discovered from its live assignment
# and inheritance graph.

id: ban-private-import
language: Python
severity: error
rule:
  all:
    - kind: import_from_statement
    - regex: '^from\s+\w[\w.]*\._[A-Za-z]\w*(\.[\w.]+)*\s+import\b'
message: >-
  Absolute private implementation import is forbidden. Use a relative sibling
  import inside the owner or consume the public facade discovered from source.
files:
  - "**/*.py"
