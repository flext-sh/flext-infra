# Ban pass-through wrapper functions (epic i2h4 flext-core refactor).
#
# FLEXT law: deduplicate via MRO / facade projections. A function whose entire
# body is `return other.fn(<the exact same args>)` adds an indirection layer
# with zero behavior — it hides the real owner, breaks rename/refactor
# chains, and violates "root cause, one owner".
#
# Detection is SHAPE-BASED: the wrapper forwards its parameters unchanged
# (same metavariable on both sides) to a single callee. Wrappers that add
# behavior (logging, adaptation, defaults, type conversion) never match.
#
# Detection-only: the correct replacement is to delete the wrapper and call
# the real owner directly, updating every consumer in the same cutover.

---
id: ban-pass-through-wrapper-def
language: Python
severity: error
rule:
  pattern: |
    def $FN($$$ARGS):
        return $CALLEE($$$ARGS)
message: >-
  Pass-through wrapper: this function only forwards its arguments unchanged
  to $CALLEE. Delete the wrapper and call the real owner directly.
note: >-
  Migration: point every caller at $CALLEE (the single owner), delete this
  def, and complete the cutover in one change. If the wrapper exists only to
  rename the callee, expose the name on the owning facade instead of
  duplicating the call.
files:
  - "**/*.py"
ignores:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/__pycache__/**"

---
id: ban-pass-through-wrapper-async-def
language: Python
severity: error
rule:
  pattern: |
    async def $FN($$$ARGS):
        return await $CALLEE($$$ARGS)
message: >-
  Pass-through async wrapper: this coroutine only forwards its arguments
  unchanged to $CALLEE. Delete the wrapper and call the real owner directly.
note: >-
  Migration: point every caller at $CALLEE (the single owner), delete this
  coroutine, and complete the cutover in one change. If the wrapper exists
  only to rename the callee, expose the name on the owning facade instead.
files:
  - "**/*.py"
ignores:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/__pycache__/**"
