# FLEXT codemod: `p.ConfigDict` in a model_config annotation crashes at import
# (FlextProtocols carries no ConfigDict). The canonical annotation is the same
# facade the construction value already uses:
#
#   model_config: ClassVar[p.ConfigDict] = m.ConfigDict(...)   # defect (import crash)
#                       ->
#   model_config: ClassVar[m.ConfigDict] = m.ConfigDict(...)   # canonical
#
# Idempotent: only `p.ConfigDict` matches; a canonical module yields zero
# matches on re-scan. The value must construct through `m.ConfigDict(...)`, so
# the rewritten annotation never introduces an unbound name. SettingsConfigDict
# is out of scope.
id: config-dict-type-from-typings
language: python
severity: error
files:
- "src/**/*.py"
- "tests/**/*.py"
rule:
  pattern: "model_config: ClassVar[p.ConfigDict] = $VAL"
constraints:
  VAL:
    regex: "^m\\.ConfigDict\\("
fix: "model_config: ClassVar[m.ConfigDict] = $VAL"
message: >-
  model_config annotation must be m.ConfigDict (p.ConfigDict does not exist: FlextProtocols has no ConfigDict, so the module crashes at import). The construction value m.ConfigDict(...) is kept.
