id: fstring-fail-missing-exception
language: python
severity: error
message: >-
  Interpolating a caught exception into r.fail drops its typed cause. Preserve
  the bound exception explicitly or use a contextual e.fail_* factory.
rule:
  pattern: $R.fail($MESSAGE)
  all:
    - has:
        field: arguments
        has:
          kind: interpolation
          stopBy: end
          has:
            field: expression
            kind: identifier
            pattern: $EXC
    - not:
        has:
          kind: keyword_argument
          stopBy: end
          has:
            field: name
            regex: "^exception$"
    - inside:
        kind: except_clause
        stopBy: end
        has:
          field: value
          kind: as_pattern
          has:
            field: alias
            kind: as_pattern_target
            has:
              kind: identifier
              pattern: $EXC
constraints:
  R:
    regex: '^r(?:\[.+\])?$'
fix: '$R.fail($MESSAGE, exception=$EXC)'
---
id: fstring-fail-missing-exception-review
language: python
severity: error
message: >-
  A caught exception is interpolated into r.fail with additional arguments, so
  an automatic edit cannot prove syntax or semantic preservation. Review and
  preserve the typed exception explicitly or use a contextual e.fail_* factory.
rule:
  pattern: $R.fail($$$ARGS)
  all:
    - not:
        pattern: $R.fail($MESSAGE)
    - has:
        field: arguments
        has:
          kind: interpolation
          stopBy: end
          has:
            field: expression
            kind: identifier
            pattern: $EXC
    - not:
        has:
          kind: keyword_argument
          stopBy: end
          has:
            field: name
            regex: "^exception$"
    - inside:
        kind: except_clause
        stopBy: end
        has:
          field: value
          kind: as_pattern
          has:
            field: alias
            kind: as_pattern_target
            has:
              kind: identifier
              pattern: $EXC
constraints:
  R:
    regex: '^r(?:\[.+\])?$'
