id: remove-cli-process-exit-result-timeout-parameter
language: Python
severity: error
rule:
  pattern:
    context: |
      def _process_exit_result($$$BEFORE, timeout_exit_code: int) -> $RETURN:
          $$$BODY
    selector: function_definition
fix: |
  def _process_exit_result($$$BEFORE) -> $RETURN:
      $$$BODY
message: Remove per-call timeout policy from the causal outcome owner.
