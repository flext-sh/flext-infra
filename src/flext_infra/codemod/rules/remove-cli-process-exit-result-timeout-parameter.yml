id: remove-cli-process-exit-result-timeout-parameter
language: Python
severity: error
rule:
    pattern:
        context: |
            def _process_exit_result(
                cmd: t.StrSequence,
                return_code: int | None,
                received_signals: list[int],
                diagnostics: t.VariadicTuple[str],
                *,
                timed_out: bool,
                legacy_timeout: bool,
                legacy_timeout_seconds: int | None,
                timeout_exit_code: int,
            ) -> p.Result[p.Cli.ProcessOutcome]:
                $DOC
                if legacy_timeout and timed_out:
                    $$$LEGACY_FAILURE
                if received_signals:
                    $$$SIGNAL_EXIT
                elif timed_out:
                    primary_exit = timeout_exit_code
                elif return_code is None:
                    $$$MISSING_EXIT
                else:
                    $$$NATIVE_EXIT
                $$$OUTCOME
        selector: function_definition
fix: |
    def _process_exit_result(
        return_code: int | None,
        received_signals: list[int],
        diagnostics: t.VariadicTuple[str],
        *,
        timed_out: bool,
    ) -> p.Result[p.Cli.ProcessOutcome]:
        $DOC
        if received_signals:
            $$$SIGNAL_EXIT
        elif return_code is None:
            $$$MISSING_EXIT
        else:
            $$$NATIVE_EXIT
        $$$OUTCOME
message: Remove per-call timeout policy from the causal outcome owner.
