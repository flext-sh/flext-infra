# Recomposition of the logging modernizer's rewrite contract onto `make mod`.
#
# The retired transformer selected `logging.getLogger` with `ast` and then
# produced the replacement text with `str.replace` / `re.sub` on the node's own
# source slice. This rule states the same contract structurally: the AST node is
# the unit of both selection and replacement, so an occurrence of the literal
# text inside a docstring, a string constant, or a comment is unreachable.
#
# Emitting `u.fetch_logger` is only safe when `u` is bound from a public FLEXT
# package in the same module; the missing-import case is the detection-only
# companion rule rewire-logging-get-logger-missing-u-import.
id: rewire-logging-get-logger-to-fetch-logger
language: python
severity: error
files:
  - "src/**/*.py"
  - "tests/**/*.py"
rule:
  all:
    - any:
        - pattern: logging.getLogger($$$ARGS)
        - all:
            - pattern: getLogger($$$ARGS)
            - inside:
                kind: module
                stopBy: end
                has:
                  stopBy: end
                  matches: get-logger-imported-from-logging
    - inside:
        kind: module
        stopBy: end
        has:
          stopBy: end
          matches: u-imported-from-flext
fix: u.fetch_logger($$$ARGS)
message: >-
  Stdlib logger construction must route through the FLEXT utilities facade
  (u.fetch_logger). The now-unused `logging` import is removed by Ruff F401.
