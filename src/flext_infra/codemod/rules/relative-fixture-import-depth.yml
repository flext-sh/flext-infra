# A test module imports its sibling `_fixtures` package, never a parent's
# (flext-itpd1.3, 2026-09-19).
#
# Hand-written test trees (the kilo-code make-check rescue, and every branch that
# replayed it) carry `from .._fixtures import ...` in modules whose own package
# already owns `_fixtures/`. The extra level resolves to a package that does not
# exist and the whole suite dies at collection. The canonical depth is one dot:
# the fixture package is a sibling of the test module, by the tests layout
# contract. This is the rule form of the nine hand edits made in
# tests/unit/validate/ on 2026-09-19 — never repeat them by hand.
id: relative-fixture-import-depth
language: Python
severity: error
files:
  - "**/tests/**/*.py"
rule:
  pattern: from .._fixtures import $$$NAMES
fix: from ._fixtures import $$$NAMES
message: Import the sibling `_fixtures` package with one dot; the parent has none.
