# flext-cli utilities compose once at base.py; services consume only that base.
# This removes private implementation imports and the duplicated service MRO path.

---
id: rewire-cli-service-base-utilities-import
language: Python
severity: error
files:
  - "flext-cli/src/flext_cli/base.py"
rule:
  all:
    - kind: import_from_statement
    - regex: '^from flext_cli import m, p, t$'
fix: from flext_cli import m, p, t, u
message: The flext-cli service base composes the public u.Cli utility facade.

---
id: rewire-cli-service-base-utilities-mro
language: Python
severity: error
files:
  - "flext-cli/src/flext_cli/base.py"
rule:
  pattern:
    context: |
      class FlextCliServiceBase[TDomainResult: p.Base = m.Cli.RuntimeStatus](
          s[TDomainResult]
      ):
          $$$BODY
    selector: class_definition
fix: |
  class FlextCliServiceBase[TDomainResult: p.Base = m.Cli.RuntimeStatus](
      s[TDomainResult], u.Cli
  ):
      $$$BODY
message: Compose public utilities once in the flext-cli service base.

---
id: rewire-cli-service-public-base-import
language: Python
severity: error
files:
  - "flext-cli/src/flext_cli/services/*.py"
rule:
  pattern: from flext_cli.base import s
fix: from flext_cli import s
message: Services consume the canonical public s facade.

---
id: rewire-cli-service-private-utility-mro
language: Python
severity: error
files:
  - "flext-cli/src/flext_cli/services/*.py"
rule:
  pattern: |
    class $SERVICE(s, $UTILITY):
        $$$BODY
constraints:
  UTILITY:
    regex: '^FlextCliUtilities(?:Docx|Pipeline|Pptx|Rules|Runtime|Xlsx|YamlModel)$'
fix: |
  class $SERVICE(s):
      $$$BODY
message: Services inherit utilities once through the public service base.

---
id: remove-cli-service-private-utility-import
language: Python
severity: error
files:
  - "flext-cli/src/flext_cli/services/*.py"
rule:
  all:
    - kind: import_from_statement
    - regex: '^from flext_cli\._utilities\.(?:docx|pipeline|pptx|rules|runtime|xlsx|yaml_model) import FlextCliUtilities(?:Docx|Pipeline|Pptx|Rules|Runtime|Xlsx|YamlModel)$'
fix: ""
message: Services consume utilities through s; remove the private import.
