# Canonical file identity and guarded publication live in flext-cli m.Cli/u.Cli.
# flext-infra owns transaction topology and Mise validation, never duplicate
# filesystem primitives or a second publication model.
id: rewire-codegen-publication-model
language: Python
severity: error
rule:
  pattern: m.Infra.MiseToolchainPublication
fix: m.Cli.AtomicFilePublication
message: Use the canonical generic atomic publication model.
---
id: rewire-codegen-binary-digest
language: Python
severity: error
rule:
  pattern: files.digest($CONTENT)
fix: u.Cli.sha256_bytes($CONTENT)
message: Hash exact bytes through the canonical CLI utility facade.
---
id: rewire-codegen-file-state-read
language: Python
severity: error
rule:
  pattern: files.read_state($PATH, required=$REQUIRED)
fix: u.Cli.atomic_read_binary_file_state($PATH, required=$REQUIRED)
message: Read authenticated file state through the canonical CLI utility facade.
---
id: rewire-codegen-file-publication
language: Python
severity: error
rule:
  pattern: files.write_publication($PUBLICATION)
fix: u.Cli.atomic_apply_file_publication_guarded($PUBLICATION)
message: Apply an atomic publication through the canonical CLI utility facade.
---
id: rewire-codegen-file-deletion
language: Python
severity: error
rule:
  pattern: files.delete_state($STATE)
fix: u.Cli.atomic_delete_binary_file_guarded($STATE)
message: Delete authenticated file state through the canonical CLI utility facade.
---
id: rewire-codegen-exclusive-file-create
language: Python
severity: error
rule:
  pattern: process.write_new($PATH, $CONTENT, $MODE)
fix: u.Cli.atomic_create_binary_file_guarded($PATH, $CONTENT, permission_mode=$MODE)
message: Create an absent file through the canonical CLI utility facade.
---
id: rewire-codegen-unqualified-exclusive-file-create
language: Python
severity: error
files:
  - "**/src/flext_infra/codegen/_mise_artifacts_process.py"
rule:
  pattern: write_new($PATH, $CONTENT, $MODE)
fix: u.Cli.atomic_create_binary_file_guarded($PATH, $CONTENT, permission_mode=$MODE)
message: Create an absent file through the canonical CLI utility facade.
