# run_to_file exposes the full ProcessOutcome declared by its public protocol.
id: rewire-cli-run-to-file-return-outcome
language: Python
severity: error
files:
  - "flext-cli/src/flext_cli/_utilities/_runtime_run_to_file.py"
rule:
  any:
    - pattern: "cls._execute_streamed_process($$$ARGS).map(lambda output: output.exit_code)"
    - pattern: "cls._execute_streamed_process($$$ARGS).map(lambda output: output.outcome.raw_return_code)"
fix: "cls._execute_streamed_process($$$ARGS).map(lambda output: output.outcome)"
message: Return the causal ProcessOutcome from run_to_file without flattening it.
