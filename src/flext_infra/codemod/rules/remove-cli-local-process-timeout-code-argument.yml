id: remove-cli-local-process-timeout-code-argument
language: Python
severity: error
rule:
  pattern: $CALL($$$BEFORE, timeout_exit_code=$VALUE)
constraints:
  CALL:
    regex: "^cls\\._(?:captured_process_result|process_exit_result)$"
fix: $CALL($$$BEFORE)
message: Remove the deleted timeout-code argument from lifecycle calls.
