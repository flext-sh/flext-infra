# Family file for the captured-process-outcome migration stages: stage one
# removes the timeout policy from `_captured_process_result`; stage two
# materializes the structural outcome at the Pydantic boundary. The mod
# circuit re-scans to a fixed point, so both stages apply in order.
id: remove-cli-captured-process-timeout-parameter
language: Python
severity: error
rule:
    pattern:
        context: |
            def _captured_process_result(
                cls,
                cmd: t.StrSequence,
                return_code: int | None,
                received_signals: list[int],
                diagnostics: t.VariadicTuple[str],
                stdout_output: bytearray,
                stderr_output: bytearray,
                duration: float,
                *,
                timed_out: bool,
                timeout_seconds: int | None,
                timeout_exit_code: int,
            ) -> p.Result[p.Cli.CommandBytesOutput]:
                $DOC
                return cls._process_exit_result(
                    cmd,
                    return_code,
                    received_signals,
                    diagnostics,
                    timed_out=timed_out,
                    legacy_timeout=timeout_seconds is not None,
                    legacy_timeout_seconds=timeout_seconds,
                    timeout_exit_code=timeout_exit_code,
                ).map($CONVERT)
        selector: function_definition
fix: |
    def _captured_process_result(
        cls,
        return_code: int | None,
        received_signals: list[int],
        diagnostics: t.VariadicTuple[str],
        stdout_output: bytearray,
        stderr_output: bytearray,
        duration: float,
        *,
        timed_out: bool,
    ) -> p.Result[p.Cli.CommandBytesOutput]:
        $DOC
        return cls._process_exit_result(
            return_code,
            received_signals,
            diagnostics,
            timed_out=timed_out,
        ).map($CONVERT)
message: Remove timeout policy from captured ProcessOutcome construction.
---
id: rewire-cli-captured-process-outcome-model
language: Python
severity: error
files:
  - "flext-cli/src/flext_cli/_utilities/_runtime_process_outcome.py"
rule:
    pattern:
        context: |
            def _captured_process_result($$$PARAMS) -> $RESULT:
                $DOC
                return $PROCESS.map(
                    lambda outcome: m.Cli.CommandBytesOutput(
                        stdout=$STDOUT,
                        stderr=$STDERR,
                        outcome=outcome,
                        duration=$DURATION,
                    )
                )
        selector: function_definition
fix: |
    def _captured_process_result($$$PARAMS) -> $RESULT:
        $DOC
        return $PROCESS.map(
            lambda outcome: m.Cli.CommandBytesOutput(
                stdout=$STDOUT,
                stderr=$STDERR,
                outcome=m.Cli.ProcessOutcome.model_validate(
                    outcome, from_attributes=True
                ),
                duration=$DURATION,
            )
        )
message: Materialize the structural process outcome at the Pydantic command boundary.
