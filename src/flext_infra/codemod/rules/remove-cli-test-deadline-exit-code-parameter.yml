id: remove-cli-test-deadline-exit-code-parameter
language: Python
severity: error
rule:
  pattern:
    context: |
      def _deadline(*, seconds: float, grace: float, exit_code: int = 124) -> $RETURN:
          $$$BODY
    selector: function_definition
fix: |
  def _deadline(*, seconds: float, grace: float) -> $RETURN:
      $$$BODY
message: Remove the obsolete exit-code selector from public deadline fixtures.
