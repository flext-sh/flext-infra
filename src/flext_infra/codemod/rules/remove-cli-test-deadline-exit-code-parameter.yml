id: remove-cli-test-deadline-exit-code-parameter
language: Python
severity: error
rule:
  all:
    - kind: typed_default_parameter
    - pattern: "exit_code: int = 124"
    - inside:
        kind: function_definition
        has:
          field: name
          regex: "^_deadline$"
        stopBy: end
fix: ""
message: Remove the obsolete exit-code selector from public deadline fixtures.
