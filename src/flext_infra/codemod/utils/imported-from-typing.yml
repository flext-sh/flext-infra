# Reusable binding guards for the bare-name legacy typing generic rewrites.
#
# Each guard is a sibling in one audited family: ``Dict`` and ``List`` are legal
# identifiers a module may bind from any package or define itself, so the
# rewrite is only provable when the module binds the exact name from ``typing``
# itself. An aliased import (``Dict as D``) binds ``D`` rather than ``Dict``,
# so it is deliberately excluded. Rules reference each guard by id with
# ``matches:``; ast-grep utils take no parameters, which is why the family is
# one file with one document per legacy generic rather than a parameterized
# selector.
---
id: dict-imported-from-typing
language: python
rule:
  kind: import_from_statement
  all:
    - has:
        field: module_name
        regex: "^typing$"
    - has:
        stopBy: end
        kind: dotted_name
        regex: "^Dict$"
        not:
          inside:
            kind: aliased_import
---
id: list-imported-from-typing
language: python
rule:
  kind: import_from_statement
  all:
    - has:
        field: module_name
        regex: "^typing$"
    - has:
        stopBy: end
        kind: dotted_name
        regex: "^List$"
        not:
          inside:
            kind: aliased_import
