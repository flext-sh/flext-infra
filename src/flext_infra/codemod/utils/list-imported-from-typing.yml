# Reusable binding guard for the bare-name ``List[T]`` rewrite.
#
# ``List`` is a legal identifier: a module may define its own ``class List`` or
# bind the name from any package. Rewriting such a name to ``t.SequenceOf``
# changes an unrelated type. The rewrite is only provable when the module binds
# ``List`` from ``typing`` itself, and an aliased import (``List as L``) binds
# ``L`` rather than ``List``, so it is deliberately excluded.
#
# Sibling of dict-imported-from-typing: one audited binding guard per legacy
# typing generic, referenced with ``matches:``.
id: list-imported-from-typing
language: python
rule:
  kind: import_from_statement
  all:
    - has:
        field: module_name
        regex: "^typing$"
    - has:
        stopBy: end
        kind: dotted_name
        regex: "^List$"
        not:
          inside:
            kind: aliased_import
