# Reusable binding guard for the bare-name ``Dict[K, V]`` rewrite.
#
# ``Dict`` is a legal identifier: a module may define its own ``class Dict`` or
# bind the name from any package. Rewriting such a name to ``t.MappingKV``
# changes an unrelated type. The rewrite is only provable when the module binds
# ``Dict`` from ``typing`` itself, and an aliased import (``Dict as D``) binds
# ``D`` rather than ``Dict``, so it is deliberately excluded.
id: dict-imported-from-typing
language: python
rule:
  kind: import_from_statement
  all:
    - has:
        field: module_name
        regex: "^typing$"
    - has:
        stopBy: end
        kind: dotted_name
        regex: "^Dict$"
        not:
          inside:
            kind: aliased_import
