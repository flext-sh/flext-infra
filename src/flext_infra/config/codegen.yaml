        pyproject.toml:
          source: base/pyproject.toml.j2
          profiles: [ workspace, standalone ]
          # CUSTOM vs MANAGED (humans read comments; this block is the owner):
          #   conflict_sections = MANAGED tables (template wins on make gen)
          #   preserve_project_keys = CUSTOM [project] keys (live wins on merge)
          #   [project] keys the template writes that are not in preserve_project_keys
          #     (requires-python) are MANAGED; live dependencies stay CUSTOM and
          #     the profile rows are seeded beside them
          #   [tool.*] absent from conflict_sections (bandit, …) is CUSTOM
          ownership:
            owner: codegen
            policy: merge
            conflict_sections:
            - build-system
            - dependency-groups
            - tool.pytest.ini_options
            - tool.uv.environments
            - tool.uv.link-mode
            - tool.uv.constraint-dependencies
            - tool.uv.override-dependencies
            - tool.uv.workspace.members
            - tool.ruff
            - tool.ruff.lint.isort
            - tool.mypy
            - tool.pyright
            - tool.pyrefly
            - tool.pytest
            - tool.coverage
            - tool.codespell
            - tool.tomlsort
            - tool.yamlfix
            - tool.deptry
            - tool.hatch.version
            - tool.pydantic-mypy
            - tool.vulture
            # Written by the conform pipeline from the project SSOT
            # (_sync_namespace_scope), so a conflict inside it is the owner's
            # own output and is recoverable. tool.flext.docs is deliberately
            # absent: the template seeds it with package_name at project creation
            # only, and afterwards it stays CUSTOM — keys such as site_title are
            # owned by the live repository and survive every gen. The sole exception
            # is documentation_language: _sync_documentation_language projects it
            # from repository.project and removes the leaf for the English default.
            - tool.flext.namespace
            preserve_project_keys:
            - name
            - description
            - authors
            - maintainers
            - scripts
            - entry-points
            - classifiers
            - keywords
            - license
            - urls
            - readme
            - version
            - dependencies
