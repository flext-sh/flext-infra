Infra:
  name: flext-infra
  # Seeded into a new project's pyproject by `codegen new`; every later change
  # goes through `make release` (the protocol is the only version writer).
  initial_project_version: "0.1.0"
  # Generic release protocol defaults. Repository-owned eligibility belongs
  # in the consumer's own Infra declaration.
  release:
    # GitHub Releases only; consumers opt into index publication explicitly.
    publish_index: false
    publishable_prefixes: []
    # A consumer workspace that also publishes distributions outside this
    # prefix declares the extra prefix in its own config/infra.yaml, or in
    # the gitignored config/infra.local.yaml when it is operator-private
    # (merged after the tracked layer).
    # Hash-pinned build backend for the isolated release build
    # (`uv build --build-constraints … --require-hashes`), rendered at build
    # time by the release policy phase.
    build_constraints:
      - name: hatchling
        version: 1.32.4
        hashes:
          - 08ecf7548fb48205e7f213d70c71e67b8271b7242093dc3f1da578b42c734a2c
          - c4468f73144c054d2aab4ef0f0378c43b9878bf07f8ffd6b79690e970d375f07
      - name: packaging
        version: "26.3"
        hashes:
          - 94edc256424af38762eb31306eed28beb9f0efc50a8837492c9d6fd6004aed79
          - d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
      - name: pathspec
        version: 1.1.1
        hashes:
          - 17db5ecd524104a120e173814c90367a96a98d07c45b2e10c2f3919fff91bf5a
          - a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189
      - name: pluggy
        version: 1.6.0
        hashes:
          - 7dcc130b76258d33b90f61b658791dede3486c3e6bfb003ee5c9bfb396dd22f3
          - e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746
      # Under `--require-hashes` every resolved build dependency of the
      # backend is listed here or the isolated build fails to resolve.
      - name: tomlkit
        version: 0.15.1
        hashes:
          - 177a05aece5a8ca5266fd3c448abb47b8d352f09d477d3ca8332db4d89b24304
          - e25bbf38843005246210a12982776f27f99cb9be67160e14434d0c0d21ee1e97
      - name: trove-classifiers
        version: 2026.9.21.13
        hashes:
          - 0a9ebc8d4e2f3e8a22848c5258033035bec17a3012ac3fea16dbaa764489eb71
          - 8b1ff4f9c191b1040b71c37f1e445ab99732911e3cd91de52838453a854d7a17
  # Heavy gates (check, tests, tests-full, gen, gen-scope, mod and ai-hub's
  # post-edit mypy/pyrefly/pytest) share one per-host FIFO queue (ADR-032):
  # two at normal host pressure, one when the host-budget owner publishes
  # high or critical pressure. A dead holder frees its slot at once; a live
  # holder whose heartbeat is older than ttl_seconds is reclaimed.
  gate_admission:
    capacity_normal: 2
    capacity_high: 1
    heartbeat_seconds: 10
    ttl_seconds: 120
    poll_seconds: 2
    # Each route arms its budget only after it is admitted. Generation keeps a
    # 30 s reserve so its profile checkpoint survives a budget kill; check
    # derives its budget from the gates it runs, tests from tools.pytest.
    generation:
      budget_seconds: 900
      grace_seconds: 30
    modification:
      budget_seconds: 120
      grace_seconds: 10
    # A full-weight run that succeeded in a checkout is refused before it
    # queues while its window is open (exit 75, naming the lighter form).
    # Failures never count; CI runners and the pre-push hook are not limited.
    repeat:
      check:
        window_seconds: 1800
        lighter: CHECK_PHASE=primary make check
      tests_full:
        window_seconds: 3600
        lighter: make tests (incremental Testmon selection)
      mod_full:
        window_seconds: 7200
        lighter: make mod LAWS=<law ids> or make mod RULES=<rule ids>
      mod_selection:
        window_seconds: 300
        lighter: make mod with a different LAWS or RULES selection
  source_scan:
    # tests/ and examples/ are first-class code under the same gates as src/;
    # leaving them out of the scan blinds every analyzer to half the
    # repository.
    roots:
      - src
      - scripts
      - tests
      - examples
  rope:
    preferred_import_style: from-global
    # NOTE (flext-jnm1.1 / flext-jnm1.4): ignored_resources was removed; the names
    # now derive from the codegen artifact SSOT (config/codegen.yaml artifacts
    # with source_scan_ignore=true) via CodegenConfigSpec.source_scan_ignored.
  # CSV-driven rename campaigns applied by the mod verb's rename phase
  # through the apply-renames engine. A campaign is declared by the
  # repository that owns the renamed definition, in ITS OWN
  # config/infra.yaml; this packaged layer declares none. Each entry: csv
  # (path to an old,new list, relative to the declaring repository's
  # config/ directory: services/mod.py resolves `<root>/config/<csv>`) and
  # optional roots (repository-root-relative scan directories; empty
  # selects the whole repository root). `bindings` expand the scan to every
  # native consumer of the bound owners, so one declaration in the definer
  # reaches all consumers. A campaign is declared only once every `new` name
  # already exists in the released definer.
  refactor_csv_campaigns:
    rewire_directory: config/rewires
    campaigns: []
