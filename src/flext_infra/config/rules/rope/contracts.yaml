rules:
  - id: namespace-final-constant
    phase: constant-consumers
    families: [c]
    scope_kinds: [Class]
    pattern: '${name}: ${final}[${contract}] = ${value}'
    goal: '${name}: ClassVar[${contract}] = ${value}'
    arguments:
      final: name=typing.Final
    imports:
      ClassVar: from typing import ClassVar
    bindings:
      ClassVar: typing.ClassVar
  - id: pydantic-adapter-construction
    phase: contract-normalization
    pattern: '${adapter}(${contract})'
    goal: 'u.type_adapter(TypeForm(${contract}))'
    arguments:
      adapter: name=pydantic.TypeAdapter
    imports:
      u: from flext_core import u
      TypeForm: from typing_extensions import TypeForm
    bindings:
      u.type_adapter: pydantic.TypeAdapter
      TypeForm: typing_extensions.TypeForm
  - id: pydantic-annotated-factory
    phase: contract-normalization
    model_bases: [pydantic.BaseModel]
    pattern: '${name}: ${annotated}[${contract}, ${field}(default_factory=${factory})]'
    goal: '${name}: ${contract} = ${field}(default_factory=${factory})'
    arguments:
      annotated: name=typing.Annotated
      field: name=pydantic.Field
  - id: pydantic-annotated-default
    phase: contract-normalization
    model_bases: [pydantic.BaseModel]
    pattern: '${name}: ${annotated}[${contract}, ${field}(default=${default})]'
    goal: '${name}: ${contract} = ${default}'
    arguments:
      annotated: name=typing.Annotated
      field: name=pydantic.Field
  - id: pydantic-empty-list-factory
    phase: contract-normalization
    model_bases: [pydantic.BaseModel]
    pattern: '${name}: ${collection}[${element}] = ${field}(default_factory=${collection})'
    goal: '${name}: ${collection}[${element}] = ${field}(default_factory=u.empty(TypeForm(${collection}[${element}])))'
    arguments:
      collection: name=__builtin__.list
      field: name=pydantic.Field
    imports:
      u: from flext_core import u
      TypeForm: from typing_extensions import TypeForm
    bindings:
      u.empty: flext_core._models.pydantic.FlextModelsPydantic.empty
      TypeForm: typing_extensions.TypeForm
  - id: pydantic-empty-dict-factory
    phase: contract-normalization
    model_bases: [pydantic.BaseModel]
    unshadowed_builtins: [dict]
    pattern: '${name}: dict[${parameters}] = ${field}(default_factory=dict)'
    goal: '${name}: dict[${parameters}] = ${field}(default_factory=u.empty(TypeForm(dict[${parameters}])))'
    arguments:
      field: name=pydantic.Field
    imports:
      u: from flext_core import u
      TypeForm: from typing_extensions import TypeForm
    bindings:
      u.empty: flext_core._models.pydantic.FlextModelsPydantic.empty
      TypeForm: typing_extensions.TypeForm
