# Universal contract rules only. A rule about one repository's own symbols
# belongs in that repository's overlay at the same relative path
# (config/rules/rope/contracts.yaml under its root), never here: a packaged
# rule naming a project identity fails every consumer that cannot import it.
rules:
  - id: namespace-final-constant
    phase: constant-consumers
    families: [c]
    scope_kinds: [Class]
    pattern: '${name}: ${final}[${contract}] = ${value}'
    goal: '${name}: ClassVar[${contract}] = ${value}'
    arguments:
      final: name=typing.Final
    imports:
      ClassVar: from typing import ClassVar
    bindings:
      ClassVar: typing.ClassVar
  - id: pydantic-adapter-construction
    phase: contract-normalization
    pattern: '${adapter}(${contract})'
    goal: 'u.type_adapter(TypeForm(${contract}))'
    arguments:
      adapter: name=pydantic.TypeAdapter
    imports:
      u: from flext_core import u
      TypeForm: from typing_extensions import TypeForm
    bindings:
      u.type_adapter: pydantic.TypeAdapter
      TypeForm: typing_extensions.TypeForm
  - id: pydantic-annotated-factory
    phase: contract-normalization
    reorders_annotation: true
    model_bases: [pydantic.BaseModel]
    pattern: '${name}: ${annotated}[${contract}, ${field}(default_factory=${factory})]'
    goal: '${name}: ${contract} = ${field}(default_factory=${factory})'
    arguments:
      annotated: name=typing.Annotated
      field: &pydantic_field_bindings
        - name=pydantic.Field
        - name=flext_core.FlextModels.Field
  - id: pydantic-annotated-default
    phase: contract-normalization
    reorders_annotation: true
    model_bases: [pydantic.BaseModel]
    pattern: '${name}: ${annotated}[${contract}, ${field}(default=${default})]'
    goal: '${name}: ${contract} = ${default}'
    arguments:
      annotated: name=typing.Annotated
      field: *pydantic_field_bindings
  # An empty collection factory derives from the field's own contract through
  # u.empty(TypeForm(...)), so the default's static type and runtime value
  # both come from the annotation. Annotated metadata stays where it is; only
  # its first argument, the contract, is evaluated again. ``dict`` is matched
  # as an unshadowed builtin: inside a model body Rope can resolve the name to
  # the inherited ``BaseModel.dict`` method.
  - id: pydantic-annotated-empty-factory
    phase: contract-normalization
    repeats: contract
    model_bases: [pydantic.BaseModel]
    pattern: '${name}: ${annotated}[${contract}, ${metadata}] = ${field}(default_factory=${collection})'
    goal: '${name}: ${annotated}[${contract}, ${metadata}] = ${field}(default_factory=u.empty(TypeForm(${contract})))'
    arguments:
      annotated: name=typing.Annotated
      collection: &empty_collections
        - name=__builtin__.list
        - name=__builtin__.set
        - name=__builtin__.tuple
      field: *pydantic_field_bindings
    imports: &empty_imports
      u: from flext_core import u
      TypeForm: from typing_extensions import TypeForm
    bindings: &empty_bindings
      u.empty: flext_core._models.pydantic.FlextModelsPydantic.empty
      TypeForm: typing_extensions.TypeForm
  - id: pydantic-annotated-empty-dict-factory
    phase: contract-normalization
    repeats: contract
    model_bases: [pydantic.BaseModel]
    unshadowed_builtins: [dict]
    pattern: '${name}: ${annotated}[${contract}, ${metadata}] = ${field}(default_factory=dict)'
    goal: '${name}: ${annotated}[${contract}, ${metadata}] = ${field}(default_factory=u.empty(TypeForm(${contract})))'
    arguments:
      annotated: name=typing.Annotated
      field: *pydantic_field_bindings
    imports: *empty_imports
    bindings: *empty_bindings
  - id: pydantic-empty-factory
    phase: contract-normalization
    repeats: contract
    model_bases: [pydantic.BaseModel]
    pattern: '${name}: ${contract} = ${field}(default_factory=${collection})'
    goal: '${name}: ${contract} = ${field}(default_factory=u.empty(TypeForm(${contract})))'
    arguments:
      collection: *empty_collections
      field: *pydantic_field_bindings
    imports: *empty_imports
    bindings: *empty_bindings
  - id: pydantic-empty-dict-factory
    phase: contract-normalization
    repeats: contract
    model_bases: [pydantic.BaseModel]
    unshadowed_builtins: [dict]
    pattern: '${name}: ${contract} = ${field}(default_factory=dict)'
    goal: '${name}: ${contract} = ${field}(default_factory=u.empty(TypeForm(${contract})))'
    arguments:
      field: *pydantic_field_bindings
    imports: *empty_imports
    bindings: *empty_bindings
  - id: pydantic-described-empty-factory
    phase: contract-normalization
    repeats: contract
    model_bases: [pydantic.BaseModel]
    pattern: '${name}: ${contract} = ${field}(default_factory=${collection}, description=${description})'
    goal: '${name}: ${contract} = ${field}(default_factory=u.empty(TypeForm(${contract})), description=${description})'
    arguments:
      collection: *empty_collections
      field: *pydantic_field_bindings
    imports: *empty_imports
    bindings: *empty_bindings
  - id: pydantic-described-empty-dict-factory
    phase: contract-normalization
    repeats: contract
    model_bases: [pydantic.BaseModel]
    unshadowed_builtins: [dict]
    pattern: '${name}: ${contract} = ${field}(default_factory=dict, description=${description})'
    goal: '${name}: ${contract} = ${field}(default_factory=u.empty(TypeForm(${contract})), description=${description})'
    arguments:
      field: *pydantic_field_bindings
    imports: *empty_imports
    bindings: *empty_bindings
