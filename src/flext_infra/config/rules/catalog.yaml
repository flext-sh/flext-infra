  agents_md_anchor: 2-6-settings-law
  skills: [lib-pydantic-settings]
  rules:
  - {engine: ast-grep, id: ban-flext-core-settings-library-import}
  - {engine: ast-grep, id: require-settings-base}
- id: ENFORCE-043
  severity: MEDIUM
  description: No pass-through wrapper delegating to another callable with identical arguments.
  agents_md_anchor: 3-5-integrity
  skills: [flext-refactoring-workflow]
  rules:
  - {engine: ast-grep, id: ban-pass-through-wrapper}
- id: ENFORCE-044
  severity: HIGH
  description: No hasattr/getattr/setattr probing of private attributes.
  agents_md_anchor: 3-6-test-standardization
  skills: [flext-strict-typing, testing-patterns]
  rules:
  - {engine: ast-grep, id: ban-getattr-private-probe}
- id: ENFORCE-045
  severity: HIGH
  description: >-
    pydantic is imported only by flext-core; consumers use the m, t, u facades
    (m.BaseModel, m.ConfigDict, u.Field, u.field_validator, ...).
  agents_md_anchor: 2-7-library-abstraction-boundaries
  skills: [flext-import-rules, pydantic-v2-patterns, pydantic-v2-governance]
  rules:
  - {engine: ast-grep, id: ban-direct-pydantic-import}
- id: ENFORCE-048
  severity: MEDIUM
  description: >-
    An inner namespace class with an empty body that re-inherits its outer
    namespace is redundant.
  agents_md_anchor: 2-3-mro-inheritance-namespace-composition
  skills: [flext-mro-namespace-rules]
  rules:
  - {engine: ast-grep, id: remove-redundant-inner-namespace}
- id: ENFORCE-050
  severity: MEDIUM
  description: >-
    A facade module declares one class, binds its alias once and closes with
    its `__all__`.
  agents_md_anchor: 4-import-law
  skills: [flext-import-rules, flext-mro-namespace-rules]
  rules:
  - {engine: ast-grep, id: declare-single-class-export}
  - {engine: ast-grep, id: require-all-last}
- id: ENFORCE-051
  severity: HIGH
  description: >-
    A facade family module never imports its own package's facade letters at
    runtime.
  agents_md_anchor: 4-import-law
  skills: [flext-import-rules]
  rules:
  - {engine: ast-grep, id: ban-constants-own-letter-import}
  - {engine: ast-grep, id: ban-typings-own-letter-import}
  - {engine: ast-grep, id: ban-protocols-own-letter-import}
  - {engine: ast-grep, id: ban-models-own-letter-import}
  - {engine: ast-grep, id: ban-utilities-own-letter-import}
- id: ENFORCE-052
  severity: HIGH
  description: >-
    An import that would run against the layer order is emitted under
    TYPE_CHECKING; a reverse runtime use stays a finding.
  agents_md_anchor: 4-import-law
  skills: [flext-import-rules]
  rules:
  - {engine: ast-grep, id: ban-reverse-runtime-import}
- id: ENFORCE-053
  severity: HIGH
  description: >-
    A multi-parent utilities facade resolves its MRO for the type checker: a
    self-referencing utilities module lists its explicit parent class.
  agents_md_anchor: 2-3-mro-inheritance-namespace-composition
  skills: [flext-mro-namespace-rules]
  rules:
  - {engine: gate, id: pyrefly}
- id: ENFORCE-055
  severity: HIGH
  description: >-
    Tests, examples and scripts import their aliases from the wrapper root
    package, never from a submodule.
  agents_md_anchor: 0-quick-reference-must-read
  skills: [flext-import-rules, flext-mro-namespace-rules, rules-scripts]
  rules:
  - {engine: ast-grep, id: ban-test-deep-module-import}
- id: ENFORCE-064
  severity: HIGH
  description: >-
    Consumers import a facade through its short alias, never its long class
    name (`from flext_core import FlextConstants` becomes `c`).
  agents_md_anchor: 4-import-law
  skills: [flext-import-rules, flext-agent-strict-rules]
  rules:
  - {engine: ast-grep, id: ban-long-facade-name-import}
- id: ENFORCE-066
  severity: MEDIUM
  description: No module-level CapWords alias (rename shim or nested-class hoist).
  agents_md_anchor: 2-4-no-backwards-compat-aliases
  skills: [flext-mro-namespace-rules]
  rules:
  - {engine: ast-grep, id: ban-compat-alias}
- id: ENFORCE-067
  severity: HIGH
  description: A module declares exactly one top-level class.
  agents_md_anchor: 3-1-supreme-law
  skills: [flext-mro-namespace-rules]
  rules:
  - {engine: ast-grep, id: require-module-class}
- id: ENFORCE-068
  severity: HIGH
  description: >-
    A class of a private facade tree is reached through its owning facade,
    never by importing the private module from outside the family.
  agents_md_anchor: 4-import-law
  skills: [flext-import-rules, flext-mro-namespace-rules]
  rules:
  - {engine: ast-grep, id: ban-own-family-internal-import}
- id: ENFORCE-069
  severity: HIGH
  description: >-
    Namespaces nest at most facade, domain and leaf; enumerations are leaves.
  agents_md_anchor: 2-3-mro-inheritance-namespace-composition
  skills: [flext-mro-namespace-rules]
  rules:
  - {engine: ast-grep, id: ban-deep-namespace-nesting}
- id: ENFORCE-070
  severity: HIGH
  description: >-
