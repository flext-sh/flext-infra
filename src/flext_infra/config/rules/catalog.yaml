# Static enforcement catalog: one row per FLEXT enforcement law and the owners
# that detect it. Each rule reference names exactly one owner:
#   ast-grep  a rule id declared under config/rules/ast-grep/rules
#   ruff      a Ruff rule name the tooling selection keeps enabled
#   gate      a registered check gate (smells rows add the qlty check code)
#   codegen   a codegen template entry whose managed projection owns the law
# The enforcement-catalog gate loads this file through
# u.Infra.enforcement_catalog() and fails on the first reference that names no
# declared or enabled owner. Ids are stable; laws added after the migration from
# the flext-core runtime catalog take ENFORCE-100 and above.
version: 1
rules:
- id: ENFORCE-001
  severity: HIGH
  description: >-
    Loose object at module level: every public symbol is nested inside its
    facade family.
  agents_md_anchor: 2-architecture-law
  skills: [flext-mro-namespace-rules]
  rules:
  - {engine: ast-grep, id: ban-loose-module-object}
- id: ENFORCE-002
  severity: HIGH
  description: A runtime alias is imported from its package root, never from a module.
  skills: [flext-import-rules]
  rules:
  - {engine: ast-grep, id: ban-noncanonical-alias-import}
- id: ENFORCE-003
  severity: HIGH
  description: >-
    A canonical alias is imported from the project that owns that slot, never
    from a foreign package.
  skills: [flext-import-rules, flext-mro-namespace-rules]
  rules:
  - {engine: ast-grep, id: ban-foreign-namespace-source}
- id: ENFORCE-004
  severity: MEDIUM
  description: A private module import never reaches outside its owning package boundary.
  skills: [flext-import-rules]
  rules:
  - {engine: ast-grep, id: ban-private-import}
- id: ENFORCE-005
  severity: MEDIUM
  description: Protocol classes are declared only in the protocols family.
  skills: [flext-mro-namespace-rules]
  rules:
  - {engine: ast-grep, id: ban-manual-protocol-outside-protocols}
- id: ENFORCE-006
  severity: CRITICAL
  description: No module-level runtime import closes a cycle of the import graph.
  skills: [flext-import-rules]
  rules:
  - {engine: ast-grep, id: ban-cyclic-import}
- id: ENFORCE-007
  severity: HIGH
  description: >-
    A runtime alias is bound once, by the module that declares it, to the facade
    class that module defines.
  skills: [flext-mro-namespace-rules]
  rules:
  - {engine: ast-grep, id: ban-runtime-alias-rebind}
- id: ENFORCE-008
  severity: MEDIUM
  description: Every Python module starts with `from __future__ import annotations`.
  skills: [rules-examples]
  rules:
  - {engine: ast-grep, id: require-future-annotations}
- id: ENFORCE-009
  severity: MEDIUM
  description: Typing aliases and typing factories are declared only in the typings family.
  skills: [flext-type-system]
  rules:
  - {engine: ast-grep, id: ban-manual-typing-alias-outside-typings}
- id: ENFORCE-010
  severity: LOW
  description: No backwards-compatibility alias survives a refactor.
  skills: [flext-refactoring-workflow]
  rules:
  - {engine: ast-grep, id: ban-compat-alias}
- id: ENFORCE-011
  severity: HIGH
  description: A class lives in the facade family its kind belongs to.
  skills: [flext-mro-namespace-rules]
  rules:
  - {engine: ast-grep, id: ban-class-wrong-facade-layer}
- id: ENFORCE-012
  severity: CRITICAL
  description: A facade composes every domain class its family package declares.
  skills: [flext-mro-namespace-rules]
  rules:
  - {engine: ast-grep, id: require-facade-mro-completeness}
- id: ENFORCE-014
  severity: CRITICAL
  description: A package publishes every canonical facade family.
  skills: [flext-mro-namespace-rules]
  rules:
  - {engine: ast-grep, id: require-canonical-facade-family}
- id: ENFORCE-015
  severity: HIGH
  description: >-
    Import discipline: no inline or dynamic import, no empty or misused
    TYPE_CHECKING block, no import-error fallback, no sys.path mutation, and
    consumers import only from a package root.
  skills: [flext-import-rules, flext-consumption-law]
  rules:
  - {engine: ast-grep, id: ban-dynamic-import}
  - {engine: ruff, id: import-outside-top-level}
  - {engine: ruff, id: empty-type-checking-block}
  - {engine: ast-grep, id: ban-reverse-runtime-import}
  - {engine: ast-grep, id: ban-import-error-fallback}
  - {engine: ast-grep, id: ban-sys-path-mutation}
  - {engine: ast-grep, id: ban-consumer-submodule-import}
- id: ENFORCE-016
  severity: HIGH
  description: >-
    Type-system law: no Any, object, Optional or bare dict annotation, no legacy
    typing form, no typing.Dict/List, and no `# type: ignore` bypass.
  agents_md_anchor: 3-2-types-and-contracts
  skills: [flext-strict-typing, flext-type-system]
  rules:
  - {engine: ast-grep, id: ban-type-ignore-comment}
  - {engine: ast-grep, id: ban-broad-annotation}
  - {engine: ruff, id: any-type}
  - {engine: ruff, id: non-pep585-annotation}
  - {engine: ruff, id: non-pep604-annotation-union}
  - {engine: ruff, id: deprecated-import}
  - {engine: ruff, id: non-pep695-type-alias}
  - {engine: ast-grep, id: typing-dict-to-mapping-kv}
  - {engine: ast-grep, id: typing-dict-missing-t-import}
  - {engine: ast-grep, id: typing-list-to-sequence-of}
  - {engine: ast-grep, id: typing-list-missing-t-import}
- id: ENFORCE-017
  severity: HIGH
  description: >-
    Bypass law: no `# noqa`, no `pragma: no cover`, no bare except, and no
    exception silencing or sentinel return on a failure branch.
  agents_md_anchor: 3-1-supreme-law
  skills: [flext-agent-strict-rules, lib-returns, flext-strict-typing]
  rules:
  - {engine: ast-grep, id: ban-noqa-comment}
  - {engine: ast-grep, id: ban-pragma-no-cover}
  - {engine: ast-grep, id: ban-pragma-no-cover-mixed-comment}
  - {engine: ast-grep, id: rewrite-bare-except-to-exception}
  - {engine: ast-grep, id: ban-silent-except-swallow}
  - {engine: ast-grep, id: ban-silent-suppress}
  - {engine: ast-grep, id: ban-silent-failure-sentinel}
- id: ENFORCE-018
  severity: CRITICAL
  description: A lower import layer never imports a higher layer at runtime.
  skills: [flext-architecture-layers]
  rules:
  - {engine: ast-grep, id: ban-reverse-runtime-import}
- id: ENFORCE-019
  severity: MEDIUM
  description: Tests use no monkeypatch, Mock, MagicMock or patch.
  skills: [testing-patterns]
  rules:
  - {engine: ast-grep, id: ban-test-doubles}
- id: ENFORCE-020
  severity: HIGH
  description: >-
    pyproject.toml tool tables are the managed projection of the typed tooling
    policy; no ignore_errors, unapproved Ruff ignore or relaxed strictness.
  skills: [flext-development-workflow]
  rules:
  - {engine: codegen, id: pyproject.toml}
- id: ENFORCE-021
  severity: MEDIUM
  description: >-
    Python code blocks in Markdown pass the same Ruff law as source: syntax,
    forbidden typings, future annotations and broad annotations.
  skills: [testing-patterns]
  rules:
  - {engine: gate, id: markdown-code}
- id: ENFORCE-022
  severity: HIGH
  description: >-
    A class and each facade member live in the family that owns their kind
    (the class-definition MRO law).
  skills: [flext-mro-namespace-rules, pydantic-v2-governance]
  rules:
  - {engine: ast-grep, id: ban-class-wrong-facade-layer}
  - {engine: ast-grep, id: facade-member-wrong-layer}
- id: ENFORCE-027
  severity: MEDIUM
  description: Source code never prints; output goes through the CLI display owner.
  agents_md_anchor: 3-1-supreme-law
  skills: [using-flext-core]
  rules:
  - {engine: ruff, id: print}
  - {engine: ast-grep, id: rewire-print-to-cli-display-text}
- id: ENFORCE-028
  severity: HIGH
  description: No `breakpoint()` or pdb call is left in code.
  agents_md_anchor: 3-1-supreme-law
  skills: [coding-standards]
  rules:
  - {engine: ast-grep, id: remove-breakpoint-debugger-statement}
  - {engine: ast-grep, id: remove-pdb-set-trace-statement}
- id: ENFORCE-029
  severity: MEDIUM
  description: Every text-mode open() declares its encoding.
  agents_md_anchor: 3-1-supreme-law
  skills: [coding-standards]
  rules:
  - {engine: ast-grep, id: add-open-builtin-default-mode-encoding}
  - {engine: ast-grep, id: add-open-builtin-text-mode-encoding}
  - {engine: ast-grep, id: add-path-open-default-mode-encoding}
  - {engine: ast-grep, id: add-path-open-text-mode-encoding}
- id: ENFORCE-033
  severity: HIGH
  description: No hardcoded `__version__` string; versions come from package metadata.
  agents_md_anchor: 3-4-tools-and-modules
  skills: [rules-pkg]
  rules:
  - {engine: ast-grep, id: ban-hardcoded-dunder-version}
- id: ENFORCE-039
  severity: HIGH
  description: No cast() call outside flext-core.
  agents_md_anchor: 3-2-types-and-contracts
  skills: [flext-strict-typing]
  rules:
  - {engine: ast-grep, id: ban-cast-outside-core}
- id: ENFORCE-041
  severity: HIGH
  description: No model_rebuild() call; declaration order resolves every reference.
  agents_md_anchor: 3-4-tools-and-modules
  skills: [pydantic-v2-governance]
  rules:
  - {engine: ast-grep, id: ban-model-rebuild}
- id: ENFORCE-042
  severity: HIGH
  description: >-
