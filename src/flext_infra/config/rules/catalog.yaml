  skills: [flext-quality-gates]
  rules:
  - {engine: gate, id: smells, code: "qlty:identical-code"}
- id: ENFORCE-078
  severity: LOW
  description: Similar code blocks are detected.
  agents_md_anchor: 3-1-supreme-law
  skills: [flext-quality-gates]
  rules:
  - {engine: gate, id: smells, code: "qlty:similar-code"}
- id: ENFORCE-079
  severity: MEDIUM
  description: >-
    A constant is declared in the constants family and consumed through `c`;
