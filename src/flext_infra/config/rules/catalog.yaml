    project that owns its abstraction.
  agents_md_anchor: 2-7-library-abstraction-boundaries
  skills: [flext-import-rules]
  rules:
  - {engine: ast-grep, id: ban-external-import-outside-facade-family}
  - {engine: ast-grep, id: ban-flext-core-library-import}
  - {engine: ast-grep, id: ban-flext-cli-library-import}
  - {engine: ast-grep, id: ban-flext-infra-library-import}
  - {engine: ast-grep, id: ban-flext-meltano-library-import}
  - {engine: ast-grep, id: ban-flext-db-oracle-library-import}
  - {engine: ast-grep, id: ban-flext-grpc-library-import}
  - {engine: ast-grep, id: ban-flext-web-library-import}
  - {engine: ast-grep, id: ban-flext-api-library-import}
- id: ENFORCE-071
