# Keep conditions in Python's conditional context. Materializing their values
# before matching can repeat truth conversion in short-circuit expressions.
id: rewire-test-assert-truth
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - pattern: "assert $COND"
    - not:
        has:
          nthChild: 2
    # One binary comparison is rewire-test-assert-compare.yml's single expression.
    - not:
        any:
          - pattern: "assert $LEFT in $RIGHT"
          - pattern: "assert $LEFT not in $RIGHT"
          - pattern: "assert $LEFT == $RIGHT"
          - pattern: "assert $LEFT != $RIGHT"
          - pattern: "assert ($LEFT in $RIGHT)"
          - pattern: "assert ($LEFT not in $RIGHT)"
          - pattern: "assert ($LEFT == $RIGHT)"
          - pattern: "assert ($LEFT != $RIGHT)"
    - not:
        has:
          kind: not_operator
          nthChild: 1
    - not:
        has:
          stopBy: end
          any:
            - pattern: "$VALUE is None"
            - pattern: "$VALUE is not None"
            - pattern: "isinstance($VALUE, $TYPE)"
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - matches: tm-binding-admissible
fix: |-
  if $COND:
      pass
  else:
      tm.reject()
message: Preserve native conditional evaluation and fail through tm.reject.
---
id: rewire-test-assert-falsity
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - pattern: "assert not $COND"
    - not:
        has:
          nthChild: 2
    - not:
        has:
          stopBy: end
          any:
            - pattern: "$VALUE is None"
            - pattern: "$VALUE is not None"
            - pattern: "isinstance($VALUE, $TYPE)"
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - matches: tm-binding-admissible
fix: |-
  if $COND:
      tm.reject()
message: Preserve native falsity evaluation and fail through tm.reject.
