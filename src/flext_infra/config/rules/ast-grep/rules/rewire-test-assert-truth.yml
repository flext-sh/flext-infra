---
id: rewire-test-assert-falsity-branch
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - pattern: "assert not $COND"
    - not:
        has:
          nthChild: 2
    - matches: assert-narrowing-free
constraints:
  COND:
    any:
      - kind: identifier
      - kind: attribute
      - kind: boolean_operator
      - kind: conditional_expression
      - kind: parenthesized_expression
        has:
          any:
            - kind: boolean_operator
            - kind: conditional_expression
