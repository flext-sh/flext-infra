# Keep conditions in Python's conditional context. Materializing their values
# before matching can repeat truth conversion in short-circuit expressions.
id: rewire-test-assert-truth
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - pattern: "assert $COND"
    - not:
        has:
          nthChild: 2
    - not:
        has:
          kind: not_operator
          nthChild: 1
    - not:
        has:
          stopBy: end
          any:
            - pattern: "$VALUE is None"
            - pattern: "$VALUE is not None"
            - pattern: "isinstance($VALUE, $TYPE)"
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - inside:
        kind: module
        stopBy: end
        has:
          matches: tm-imported-from-flext
          stopBy: end
fix: |-
  if $COND:
      pass
  else:
      tm.reject()
message: Preserve native conditional evaluation and fail through tm.reject.
---
id: rewire-test-assert-falsity
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - pattern: "assert not $COND"
    - not:
        has:
          nthChild: 2
    - not:
        has:
          stopBy: end
          any:
            - pattern: "$VALUE is None"
            - pattern: "$VALUE is not None"
            - pattern: "isinstance($VALUE, $TYPE)"
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - inside:
        kind: module
        stopBy: end
        has:
          matches: tm-imported-from-flext
          stopBy: end
fix: |-
  if $COND:
      tm.reject()
message: Preserve native falsity evaluation and fail through tm.reject.
