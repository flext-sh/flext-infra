# A plain condition is one tm.that native-truth expression: it adds no branch to
# the enclosing test. A bare name or attribute narrows Optional types by
# truthiness, and an and/or or conditional expression converts truth once only
# inside a branch, so those keep one conditional branch before tm.reject.
id: rewire-test-assert-truth
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - pattern: "assert $COND"
    - not:
        has:
          nthChild: 2
    - matches: assert-narrowing-free
    # One binary comparison is rewire-test-assert-compare.yml's single expression.
    - not:
        any:
          - pattern: "assert $LEFT in $RIGHT"
          - pattern: "assert $LEFT not in $RIGHT"
          - pattern: "assert $LEFT == $RIGHT"
          - pattern: "assert $LEFT != $RIGHT"
          - pattern: "assert ($LEFT in $RIGHT)"
          - pattern: "assert ($LEFT not in $RIGHT)"
          - pattern: "assert ($LEFT == $RIGHT)"
          - pattern: "assert ($LEFT != $RIGHT)"
    - not:
        has:
          kind: not_operator
          nthChild: 1
constraints:
  COND:
    not:
      any:
        - kind: identifier
        - kind: attribute
        - kind: boolean_operator
        - kind: conditional_expression
        - kind: parenthesized_expression
          has:
            any:
              - kind: boolean_operator
              - kind: conditional_expression
fix: "tm.that($COND, truth=True)"
message: Assert native truth through one tm.that expression.
---
id: rewire-test-assert-truth-branch
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - pattern: "assert $COND"
    - not:
        has:
          nthChild: 2
    - matches: assert-narrowing-free
constraints:
  COND:
    any:
      - kind: identifier
      - kind: attribute
      - kind: boolean_operator
      - kind: conditional_expression
      - kind: parenthesized_expression
        has:
          any:
            - kind: boolean_operator
            - kind: conditional_expression
fix: |-
  if not ($COND):
      tm.reject()
message: Preserve narrowing and short-circuit truth through one branch before tm.reject.
