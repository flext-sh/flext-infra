# A terminating failure preserves narrowing without rebinding local or global
# names, and evaluates an assertion message only when the condition fails.
id: rewire-test-assert-not-none
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - any:
        - all:
            - pattern: "assert $X is not None"
            - not:
                has:
                  nthChild: 2
        - pattern: |-
            if not ($X is not None):
                raise AssertionError
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - matches: tm-binding-admissible
constraints:
  X:
    kind: identifier
fix: |-
  if $X is None:
      tm.reject()
message: Preserve non-None narrowing and name bindings through tm.reject.
---
id: rewire-test-assert-not-none-message
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - any:
        - pattern: "assert $X is not None, $MSG"
        - pattern: |-
            if not ($X is not None):
                raise AssertionError($MSG)
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - matches: tm-binding-admissible
constraints:
  X:
    kind: identifier
fix: |-
  if $X is None:
      tm.reject($MSG)
message: Preserve non-None narrowing and lazy assertion arguments through tm.reject.
---
# A message-bearing observation is one tm.that native-truth expression that
# carries the original message, evaluated before the truth check; a narrowing
# or short-circuit condition keeps one branch and its lazy message.
id: rewire-test-assert-message-observation
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - any:
        - pattern: "assert $COND, $MSG"
        - pattern: |-
            if not ($COND):
                raise AssertionError($MSG)
    - matches: assert-narrowing-free
constraints:
  COND:
    not:
      any:
        - kind: identifier
        - kind: attribute
        - kind: boolean_operator
        - kind: conditional_expression
        - kind: parenthesized_expression
          has:
            any:
              - kind: boolean_operator
              - kind: conditional_expression
fix: "tm.that($COND, truth=True, assertion_message=$MSG)"
message: Assert native truth with the original message through one tm.that expression.
---
id: rewire-test-assert-message-observation-branch
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - any:
        - pattern: "assert $COND, $MSG"
        - pattern: |-
            if not ($COND):
                raise AssertionError($MSG)
    - matches: assert-narrowing-free
constraints:
  COND:
    any:
      - kind: identifier
      - kind: attribute
      - kind: boolean_operator
      - kind: conditional_expression
      - kind: parenthesized_expression
        has:
          any:
            - kind: boolean_operator
            - kind: conditional_expression
fix: |-
  if not ($COND):
      tm.reject($MSG)
message: Preserve narrowing, short-circuit truth, and the lazy message through tm.reject.
