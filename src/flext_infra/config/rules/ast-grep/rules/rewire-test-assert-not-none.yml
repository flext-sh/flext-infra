# A terminating failure preserves narrowing without rebinding local or global
# names, and evaluates an assertion message only when the condition fails.
id: rewire-test-assert-not-none
language: Python
severity: error
metadata:
  context:
    X:
      is: emitted-symbol
      arg: tm flext_tests tm
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - any:
        - all:
            - pattern: "assert $X is not None"
            - not:
                has:
                  nthChild: 2
        - pattern: |-
            if not ($X is not None):
                raise AssertionError
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - inside:
        kind: module
        stopBy: end
        has:
          matches: tm-imported-from-flext
          stopBy: end
constraints:
  X:
    kind: identifier
fix: |-
  if $X is None:
      tm.reject()
message: Preserve non-None narrowing and name bindings through tm.reject.
---
id: rewire-test-assert-not-none-message
language: Python
severity: error
metadata:
  context:
    X:
      is: emitted-symbol
      arg: tm flext_tests tm
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - any:
        - pattern: "assert $X is not None, $MSG"
        - pattern: |-
            if not ($X is not None):
                raise AssertionError($MSG)
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - inside:
        kind: module
        stopBy: end
        has:
          matches: tm-imported-from-flext
          stopBy: end
constraints:
  X:
    kind: identifier
fix: |-
  if $X is None:
      tm.reject($MSG)
message: Preserve non-None narrowing and lazy assertion arguments through tm.reject.
---
# Message-bearing observations keep native conditional and message evaluation.
id: rewire-test-assert-message-observation
language: Python
severity: error
metadata:
  context:
    COND:
      is: emitted-symbol
      arg: tm flext_tests tm
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - any:
        - pattern: "assert $COND, $MSG"
        - pattern: |-
            if not ($COND):
                raise AssertionError($MSG)
    - not:
        any:
          - has:
              pattern: "$VALUE is None"
              stopBy: end
          - has:
              pattern: "$VALUE is not None"
              stopBy: end
          - has:
              pattern: "isinstance($VALUE, $TYPE)"
              stopBy: end
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - inside:
        kind: module
        stopBy: end
        has:
          matches: tm-imported-from-flext
          stopBy: end
fix: |-
  if not ($COND):
      tm.reject($MSG)
message: Preserve conditional evaluation and lazy assertion arguments through tm.reject.
