# A method in a class body that takes neither self nor cls and is not
# declared @staticmethod/@classmethod cannot be bound: pytest fails to
# collect a fixture of that shape ("Could not determine arguments ...:
# invalid method signature"), and any other caller gets the instance as its
# first argument. The method is declared @staticmethod directly above its
# def, the order the working fixtures use. Idempotent: a declared method no
# longer matches.
id: class-method-without-self-needs-staticmethod
language: python
rule:
  kind: decorator
  pattern: $DECO
  precedes:
    kind: function_definition
    stopBy: neighbor
    has:
      field: parameters
      kind: parameters
      not:
        has:
          kind: identifier
          regex: ^(self|cls)$
          stopBy: end
  inside:
    kind: decorated_definition
    inside:
      kind: block
      inside:
        kind: class_definition
    not:
      has:
        kind: decorator
        regex: ^@(staticmethod|classmethod)$
severity: error
files:
  - "**/*.py"
ignores:
  - "**/config/rules/ast-grep/tests/**"
  # Scenario-data roots (codegen.exclusions.scenario_data_roots) are no
  # codemod's input; fixture holder classes there are aliased by conftest.
  - "**/tests/fixtures/**"
message: >-
  A class-body method without self or cls must be declared @staticmethod.
fix: "$DECO\n@staticmethod"
