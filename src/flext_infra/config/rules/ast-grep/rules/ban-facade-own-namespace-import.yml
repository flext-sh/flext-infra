# A facade letter read through its package module object: `import flext_cli`
# then `flext_cli.u.Cli.field_default(...)`, or `import flext_core` then
# `flext_core.u.config_merge(...)`. A letter is a lazy export of its package
# root; reaching it through the module object defers the binding to call time,
# a lazy import the import law forbids for every package, own or upstream.
#
# The repair depends on where the module sits, and the import laws above own
# each target: inside the letter's own family the own letter is the facade
# under assembly, so the member comes from its declaring sibling class through
# the family package (ENFORCE-051); everywhere else the letter is imported
# from its package root (`from flext_core import u`) and read directly.
#
# One document for every package and letter: $PACKAGE is the own package or a
# facade package (both generated utilities) and $NAME a single-letter alias.
# Detection-only: the repair target depends on the module's family.
id: ban-letter-module-object
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/__init__.py"
metadata:
  enforce: [ENFORCE-051]
  ruling: operator-ruling-2026-10-08-import-law
  description: >-
    A module never reads a facade letter through its package module object;
    it imports the letter from the package root, or, inside the letter's own
    family, the declaring sibling class through the family package.
constraints:
  PACKAGE:
    any:
      - matches: own-package
      - matches: facade-package
  NAME:
    regex: "^[a-z]$"
rule:
  kind: attribute
  all:
    - has:
        field: object
        kind: identifier
        pattern: $PACKAGE
    - has:
        field: attribute
        pattern: $NAME
message: >-
  Letter `$NAME` read through the package module object `$PACKAGE`: import it
  from the package root (`from $PACKAGE import $NAME`), or inside its own
  family import the declaring sibling class through the family package.
