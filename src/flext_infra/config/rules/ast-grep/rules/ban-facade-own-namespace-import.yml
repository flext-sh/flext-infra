# The facade letters' producers never bind their own product (the import law,
# operator-ruling-2026-10-08-import-law, per-letter reading).
#
# Every FLEXT package publishes its family letters (c, t, p, m, u, config,
# settings) as runtime aliases from the package root, and each letter has one
# producer tree: `constants.py`/`_constants/**` produce `c`,
# `typings.py`/`_typings/**` produce `t`, and so on through
# `models.py`/`_models/**`, `protocols.py`/`_protocols/**`,
# `utilities.py`/`_utilities/**`, `config.py`/`_config.py`/`_config/**` and
# `settings.py`/`_settings.py`/`_settings/**`. A producer that binds its own
# letter — `from ai_hub import c` inside `_constants/**` — reaches for a
# facade that is still being assembled from the very declarations the module
# carries, so the binding is an import cycle by construction and a hidden
# self-dependency even when the resolver tolerates it.
#
# The law is per letter, exactly as the operator ciphered it. Importing a
# DIFFERENT letter is subject to the independent strict layer-direction law
# (`t < m`: `_models/**` importing `t` is forward family assembly). Layer-zero
# config/settings cannot import ANY own-namespace object; the companion
# settings-config-boundary rule enforces that stronger boundary. Each letter
# gets its own document, scoped to
# its own producer tree, banning only its own letter; one document per letter
# in the style of settings-config-boundary.yml, whose per-file-family
# documents this file mirrors. `ban-infra-utility-module-self-facade-import`
# keeps its narrower flext-infra utilities scope beside the `u` document.
#
# Imported names are matched exactly, regardless of their local alias.
# The plain-import form (`import pkg.c`) binds the package but imports the
# letter as a submodule, which is the same self-letter reach. TYPE_CHECKING
# and function/class-local imports do not authorize a self-facade dependency.
#
# Genericity: no document names a package. The imported module's root is
# captured as $MODULE (or the dotted path as $PATH for the plain-import form)
# and constrained natively by the project's generated `own-package` utility
# (its declared package and internal tiers) — the same guard
# ban-private-import and the namespace law use. A letter imported from
# another package (`from
# flext_core import m` inside ai-hub's `_models/base.py`) is a legitimate
# cross-package facade binding and never matches.
#
# Detection-only: the repair rebinds the consumer to the declaring sibling
# class through its family package — the nearest generated lazy export, e.g.
# `from flext_infra._utilities import FlextInfraUtilitiesPytest` — never a
# private module path below it. A different family is read through the own
# root namespace (`from flext_infra import c, t, p, m`, earlier layers only).
#
# The upstream package's SAME letter (`from flext_cli import u` inside
# flext_infra's `_utilities/**`) is the canonical form (operator ruling
# 2026-10-25 for epic flext-1engx, tracker memory key
# operator-ruling-2026-10-25-upstream-letter-canonical):
# the own letter's facade class composes the upstream letter's class by MRO,
# so the upstream letter is the producer tree's only route to the inherited
# members while its own letter is still being assembled. No document here
# matches it: every own-letter document constrains the module to own-package.

id: ban-constants-own-letter-import
language: python
severity: error
files:
  - "**/_constants/**/*.py"
  - "**/constants.py"
ignores:
  - "**/__init__.py"
metadata:
  enforce: [ENFORCE-051]
  ruling: operator-ruling-2026-10-08-import-law
  description: >-
    The constants producer tree never binds its own package's c letter from
    the own package root; sibling declarations are imported through their
    family package (the nearest generated lazy export), never a
    private module path.
rule:
  any:
    - matches: root-imported-name
      pattern: $NAME
      inside:
        stopBy: end
        kind: import_from_statement
        has:
          field: module_name
          pattern: $MODULE
    - kind: dotted_name
      pattern: $PATH
      regex: "^[A-Za-z_][A-Za-z0-9_]*\\.(c|constants)$"
      any:
        - inside:
            kind: import_statement
        - inside:
            kind: aliased_import
            field: name
            inside:
              kind: import_statement
constraints:
  NAME:
    regex: "^c$"
  MODULE:
    matches: own-package
  PATH:
    matches: own-package
message: >-
  The constants producer binds its own letter from the own-package root: `c`
  is the facade this tree is still assembling. Import the sibling declaration
  through its family package (the nearest
  generated lazy export) instead, never a private module path.
---
