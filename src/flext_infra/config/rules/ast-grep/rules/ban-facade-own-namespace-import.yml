# The facade letters' producers never bind their own product (the import law,
# operator-ruling-2026-10-08-import-law, per-letter reading).
#
# A producer that binds its own letter — `from ai_hub import c` inside the
# constants family — reaches for a facade that is still being assembled from
# the very declarations the module carries, so the binding is an import cycle
# by construction and a hidden self-dependency even when the resolver
# tolerates it.
#
# One document, partitioned per letter family. The generated provider
# publishes `facade-family-<letter>` for every letter of the tooling
# import-layer order: the modules whose own `__all__` declares that letter and
# the members of the private family package of such a facade module. No file
# name is mapped to a letter (ADR-018, generator law p.1). Each rendered copy
# `ban-own-letter-import--<package>--<letter>` keeps that family's files and
# constrains `$NAME` to its letter, so importing a DIFFERENT letter stays
# subject only to the independent layer-direction law (`t < m`: `_models/**`
# importing `t` is forward family assembly). Layer-zero config/settings cannot
# import ANY own-namespace object; the companion settings-config-boundary rule
# enforces that stronger boundary.
#
# Imported names are matched exactly, regardless of their local alias. The
# plain-import form (`import pkg.c`) binds the package but imports the letter
# as a submodule, which is the same self-letter reach; its last segment is the
# letter. TYPE_CHECKING and function/class-local imports do not authorize a
# self-facade dependency.
#
# Genericity: no document names a package or a letter. The imported module's
# root is captured as $MODULE (or the dotted path as $PATH for the
# plain-import form) and constrained natively by the project's generated
# `own-package` utility. A letter imported from another package (`from
# flext_core import m` inside ai-hub's `_models/base.py`) is a legitimate
# cross-package facade binding and never matches. The upstream package's SAME
# letter (`from flext_cli import u` inside flext_infra's `_utilities/**`) is
# the canonical form (tracker memory
# operator-ruling-2026-10-25-upstream-letter-canonical): the own letter's
# facade class composes the upstream letter's class by MRO.
#
# Relocation: the consumer binds the declaring sibling class through its
# family package — the nearest generated lazy export, e.g.
# `from flext_infra._utilities import FlextInfraUtilitiesPytest` — never a
# private module path below it. Which sibling owns the member a module reads
# is a per-use semantic choice, so the rule carries no token fix.

id: ban-own-letter-import
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/__init__.py"
metadata:
  enforce: [ENFORCE-051]
  ruling: operator-ruling-2026-10-08-import-law
  scope:
    partition:
      variable: NAME
      holds: true
      selectors: facade-family-
      pattern: "^{key}$"
  description: >-
    A letter's producer family never binds its own package's letter from the
    own package root; sibling declarations are imported through their family
    package (the nearest generated lazy export), never a private module path.
rule:
  any:
    - matches: root-imported-name
      pattern: $NAME
      inside:
        stopBy: end
        kind: import_from_statement
        has:
          field: module_name
          pattern: $MODULE
    - kind: identifier
      pattern: $NAME
      not:
        precedes:
          kind: identifier
          stopBy: end
      inside:
        kind: dotted_name
        pattern: $PATH
        regex: "\\."
        any:
          - inside:
              kind: import_statement
          - inside:
              kind: aliased_import
              field: name
              inside:
                kind: import_statement
constraints:
  MODULE:
    matches: own-package
  PATH:
    matches: own-package
message: >-
  This module belongs to the `$NAME` family and binds its own letter from the
  own-package root: `$NAME` is the facade this family is still assembling.
  Import the sibling declaration through its family package (the nearest
  generated lazy export) instead, never a private module path.
---
id: ban-letter-module-object
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/__init__.py"
metadata:
  enforce: [ENFORCE-051]
  ruling: operator-ruling-2026-10-08-import-law
  description: >-
    A module never reads a facade letter through its package module object;
    it imports the letter from the package root, or, inside the letter's own
    family, the declaring sibling class through the family package.
constraints:
  PACKAGE:
    any:
      - matches: own-package
      - matches: facade-package
  NAME:
    regex: "^[a-z]$"
rule:
  kind: attribute
  all:
    - has:
        field: object
        kind: identifier
        pattern: $PACKAGE
    - has:
        field: attribute
        pattern: $NAME
message: >-
  Letter `$NAME` read through the package module object `$PACKAGE`: import it
  from the package root (`from $PACKAGE import $NAME`), or inside its own
  family import the declaring sibling class through the family package.
