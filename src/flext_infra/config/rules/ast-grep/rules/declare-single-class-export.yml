# A class-only source module declares its own publication before lazy-init
# propagates it. The class-stem- file groups prove the canonical class stem.
# Multi-class modules, explicit exports, loose behavior and module bindings
# require their existing semantic ownership phase; this rule never elects them.
#
# The law is the same in every tier (ADR-028 p.6): a test-suite module is one
# Tests<Stem> class plus its `__all__`, exactly like src; only conftest.py and
# tests/fixtures/** carry the tests-tier delta, and that delta concerns pytest
# fixtures and hooks, not publication. No path is exempt from this rule.
id: declare-single-class-export
language: python
severity: error
metadata:
  enforce: [ENFORCE-050]
  scope:
    partition:
      variable: NAME
      holds: true
      selectors: class-stem-
      pattern: "^(?:{alternatives})"
utils:
  import:
    any:
      - kind: import_statement
      - kind: import_from_statement
      - kind: future_import_statement
  import-guard:
    kind: if_statement
    has:
      field: condition
      any:
        - pattern: TYPE_CHECKING
        - pattern: typing.TYPE_CHECKING
    not:
      has:
        inside:
          kind: block
        not:
          any:
            - matches: import
            - kind: comment
        stopBy: end
rule:
  kind: class_definition
  pattern: $CLASS
  inside:
    kind: module
    stopBy: end
    not:
      has:
        inside:
          kind: module
        not:
          any:
            - matches: import
            - matches: import-guard
            - kind: class_definition
            - kind: comment
            - kind: expression_statement
              has:
                kind: string
        stopBy: end
  has:
    field: name
    pattern: $NAME
  not:
    any:
      - follows:
          stopBy: end
          kind: class_definition
      - precedes:
          stopBy: end
          kind: class_definition
      # A declaration module publishes a data-only class. A class carrying
      # behavior (a test suite, a service) has its own semantic ownership
      # phase and must never be rewritten by this projection.
      - has:
          stopBy: end
          kind: function_definition
fix: |-
  $CLASS


  __all__: list[str] = ["$NAME"]
message: >-
  Declare the canonical source class in __all__ before generating its lazy
  package export. Preserve the class and consume it through its owning package.
