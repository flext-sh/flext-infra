id: retire-publication-stack-receipt-model-copy
language: Python
severity: error
rule:
  pattern: $PLAN.model_copy(update=$UPDATE)
constraints:
  # Only a copy whose every updated key is retired receipt evidence collapses;
  # a copy also changing real content stays for its owner to reshape.
  UPDATE:
    kind: dictionary
    has:
      kind: pair
    not:
      has:
        kind: pair
        not:
          has:
            field: key
            regex: ^"(source_states|source_directories|source_query_topology|prepared_sources|dependency_group|validation_context)"$
fix: $PLAN
message: >-
  A copy that only re-attaches retired receipt evidence is the original plan;
  pass it by reference.
