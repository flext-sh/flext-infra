# Import law (docs guide "Imports and family composition", ADR-028 D10): a
# public name is imported from the package whose generated lazy initializer
# publishes it, never from a module path below that package. This is the one
# rule of that law for every tier (production, tests, examples); the
# detection-only rules (`ban-test-deep-module-import`,
# `ban-consumer-submodule-import`, `ban-own-family-internal-import`) report
# what this rule cannot repair.
#
# A module keeps its deep imports of its own top-level package: inside
# `<package>`, `from <package>.<module> import ...` stays. The package
# initializer publishes the importing module itself, so rewriting the import
# to the package (or to a package below it) closes a runtime import cycle
# (`<package>.api` -> `<package>` -> `<package>.api`). The `top-package-`
# file scope partitions the rule per top-level package of the project: an
# import whose module path starts with that package never matches in its own
# files, while every other top-level package's deep modules (a test tier
# importing the production package) are still rewritten.
#
# The `package-published-import` utility is the generated fact. It matches the
# module-path node of `from <package>.<module> import ...` only when the
# package has an initializer whose `__all__` publishes EVERY imported name
# (plain, aliased, one-name or many, parenthesized or not) and no other
# `from <package>.<module>` import in the same file imports an unpublished
# name. The whole header of a package's members therefore moves together or
# stays untouched. A package without an initializer publishes nothing, so
# directory existence alone never rewrites an import; the missing initializer
# is a generator defect that the detection rules keep reporting.
#
# The fix rewrites only the module path to its parent package: aliases,
# parentheses and every other imported name are preserved verbatim. A package
# compose module (`<facade-package>.{constants,models,protocols,typings,
# utilities}`) is the sanctioned static import surface and is never rewritten.
# Initializers are the generator's output and import deep modules by design.
id: rewire-deep-import-to-package
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/__init__.py"
  - "**/settings.py"
  - "**/config.py"
metadata:
  enforce: [ENFORCE-015, ENFORCE-055, ENFORCE-068, ENFORCE-099]
  scope:
    partition:
      variable: MODULE
      holds: false
      selectors: top-package-
      pattern: "^{key}\\."
rule:
  all:
    - kind: dotted_name
    - pattern: $MODULE
    - matches: package-published-import
    - not:
        matches: compose-module
transform:
  PACKAGE:
    replace:
      source: $MODULE
      replace: "\\.[A-Za-z0-9_]+$"
      by: ""
fix: $PACKAGE
message: >-
  Every name imported from `$MODULE` is published by its parent package
  `$PACKAGE`: import from the package, not from the module path below it.
