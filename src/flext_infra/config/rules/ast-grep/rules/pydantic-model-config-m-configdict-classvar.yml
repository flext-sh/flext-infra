# FLEXT declares model configuration explicitly as class metadata. The native
# annotation belongs to `t`; the runtime constructor remains on `m`.
#
# Idempotent: the rewrite yields an annotated assignment, which the plain
# assignment pattern never matches. The companion import rules bind `ClassVar`
# in the same pass.
id: pydantic-model-config-m-configdict-classvar
language: python
severity: error
files:
  - "**/*.py"
rule:
  all:
    - pattern: "model_config = $QUALIFIER.$CONFIG($$$ARGS)"
    - inside:
        kind: block
        stopBy: end
        inside:
          kind: class_definition
constraints:
  QUALIFIER:
    regex: "^(?:m|FlextModelsPydantic)$"
  CONFIG:
    regex: "^(Settings)?ConfigDict$"
fix: "model_config: ClassVar[t.$CONFIG] = $QUALIFIER.$CONFIG($$$ARGS)"
message: >-
  Declare model_config as ClassVar[t.ConfigDict] or
  ClassVar[t.SettingsConfigDict], retaining the matching m constructor.
