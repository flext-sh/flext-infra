# A pydantic model's `model_config` must be declared as a ClassVar; a bare
# assignment makes pydantic treat the ConfigDict as a model field (flext
# strict Pydantic law).
#
# Idempotent: the rewrite yields an annotated assignment, which the plain
# assignment pattern never matches. The companion import rules bind `ClassVar`
# in the same pass.
id: pydantic-model-config-m-configdict-classvar
language: python
severity: error
files:
  - "**/*.py"
rule:
  all:
    - pattern: "model_config = m.$CONFIG($$$ARGS)"
    - inside:
        kind: block
        stopBy: end
        inside:
          kind: class_definition
constraints:
  CONFIG:
    regex: "^(Settings)?ConfigDict$"
fix: "model_config: ClassVar[m.$CONFIG] = m.$CONFIG($$$ARGS)"
message: >-
  model_config must be a ClassVar; a bare assignment declares a pydantic
  field instead of model metadata.
