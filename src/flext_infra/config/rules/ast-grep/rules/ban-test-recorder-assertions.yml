# Test law: an interaction assertion is a claim about HOW the module is made.
#
# Recorder fields (`connect_calls`, `search_calls`, `delete_calls`,
# `plan_requests`, `*_requests`, `*_calls`, ...) exist only inside hand-rolled
# doubles, and asserting on them (`tm.that(ldap_client.connect_calls, eq=1)`,
# `calls[0]`, `len(writer.requests)`) validates the call choreography — the
# module's private sequence of collaborations — instead of the observable
# result. The Test Reality Law (ADR-0021) removes such tests, not the runtime.
#
# Any attribute access whose attribute name ends in `_calls` or `_requests`
# inside a test tier matches. Environment isolation (`monkeypatch.setenv`,
# `delenv`, `chdir`) stays legal under `ban-test-doubles` and is untouched
# here: it isolates reality, it does not record interactions.
#
# Detection-only: rewrite the scenario against the observable result, or
# delete the test.
id: ban-test-recorder-assertions
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/examples/**/*.py"
  - "**/conftest.py"
rule:
  kind: attribute
  has:
    field: attribute
    regex: '\w*_(calls|requests)$'
message: >-
  Interaction assertion on a recorder field (*_calls/_requests): this validates
  HOW the module collaborates, not what it observes. Rewrite the scenario
  against the observable result through public interfaces, or delete the test.
