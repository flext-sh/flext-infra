# FLEXT test law (ENFORCE-003): matchers (`that`, `ok`, `fail`) are reached
# through the flext-tests matcher facade `tm`, never through a utilities
# facade class (`TestsXxxUtilities.that`) or the `u`/`u.<Proj>.Tests`
# namespace. Measured 2026-11-04: flext-ldap 343 `u.Ldap.Tests.that/fail`,
# flext-auth 171 `TestsFlextAuthUtilities.that`/`u.that` (pyrefly
# missing-attribute). The fix rewrites the call head only; the import-header
# stage binds `tm` and Ruff F401 drops the unused facade import.
id: rewire-facade-matcher-to-tm
language: python
severity: error
metadata:
  enforce: [ENFORCE-003]
files:
  - "tests/**/*.py"
ignores:
  - "tests/utilities.py"
  - "tests/_utilities/**"
  - "**/conftest.py"
  - "tests/fixtures/**"
rule:
  kind: call
  all:
    - has:
        field: function
        kind: attribute
        all:
          - has:
              field: attribute
              pattern: $M
              regex: "^(that|ok|fail)$"
          - has:
              field: object
              pattern: $OWNER
              regex: '^(u(\.[A-Z]\w*)?(\.Tests)?|Tests\w*Utilities(\.Tests)?)$'
    - has:
        field: arguments
        pattern: $ARGS
fix: tm.$M$ARGS
message: >-
  `$OWNER.$M(...)` reaches a matcher through a utilities facade: call
  `tm.$M(...)`.
note: >-
  Where: this call. Why: matchers are owned by the flext-tests `tm` facade
  (ENFORCE-003); the utilities facade does not publish them to the type
  checker. How: `tm.$M(...)`.
