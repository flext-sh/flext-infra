# `u.json_mapping_adapter()` validates into a read-only `Mapping`; a payload
# that the same function then edits in place (`payload[key] = value`) must be
# validated into the mutable JSON dictionary flext-core already owns,
# `u.json_dict_adapter()`. Typing the edited value as a Mapping hides no
# defect: it makes every item assignment an unsupported operation.
id: rewire-mutated-json-mapping-to-dict-adapter
language: python
severity: error
files:
  - "**/*.py"
rule:
  kind: assignment
  pattern: $VAR = u.json_mapping_adapter().validate_python($$$ARGS)
  inside:
    kind: function_definition
    stopBy: end
    has:
      stopBy: end
      kind: assignment
      has:
        field: left
        kind: subscript
        has:
          field: value
          pattern: $VAR
fix: $VAR = u.json_dict_adapter().validate_python($$$ARGS)
message: >-
  `$VAR` is edited in place after validation: validate it with
  `u.json_dict_adapter()`, not the read-only `u.json_mapping_adapter()`.
