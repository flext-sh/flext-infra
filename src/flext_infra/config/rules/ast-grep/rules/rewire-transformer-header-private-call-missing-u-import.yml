# Detection-only companion of rewire-transformer-header-private-call.
#
# Flags a private transformer-header call in a module that does not bind `u`.
# The correct call is `u.Infra.$METHOD(...)`, but a blind textual fix would
# emit an undefined name (Ruff F821 / Pyrefly missing-name), and ast-grep
# cannot conditionally insert an import in a single textual `fix`. Bind `u`
# from a public FLEXT package first; the fixing rule then rewrites the call.
id: rewire-transformer-header-private-call-missing-u-import
language: Python
severity: error
files:
  - "flext-infra/src/**/*.py"
ignores:
  - "**/utilities.py"
rule:
  all:
    - pattern: FlextInfraUtilitiesTransformerHeader.$METHOD($$$ARGS)
    - inside:
        kind: module
        stopBy: end
        not:
          has:
            stopBy: end
            matches: u-imported-from-flext
constraints:
  METHOD:
    regex: "^(?:alias_locally_bound|alias_used|ensure_alias_import|ensure_future_annotations|has_alias_import)$"
message: >-
  Private transformer-header calls must route through u.Infra, but this module
  does not bind the utilities facade `u`. Add the facade import first; no
  auto-fix here avoids emitting an undefined name.
