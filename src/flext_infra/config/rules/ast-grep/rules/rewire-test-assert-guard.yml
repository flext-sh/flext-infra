# Explicit failure preserves native guard narrowing and lazy message evaluation.
# The emitted-symbol predicate requires the real tm facade binding.
# A non-None name narrows through tm.not_none and a name type guard through
# tm.instance (rewire-test-assert-not-none.yml, rewire-test-assert-instance.yml);
# any other non-narrowing condition is a tm.that observation.
id: rewire-test-assert-message
language: Python
severity: error
metadata:
  context:
    COND:
      is: emitted-symbol
      arg: tm flext_tests tm
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - pattern: "assert $COND, $MSG"
    - has:
        any:
          - pattern: "$VALUE is None"
          - pattern: "$VALUE is not None"
    - not:
        regex: "^assert [A-Za-z_][A-Za-z0-9_]* is not None,"
    - not:
        has:
          pattern: "isinstance($VALUE, $TYPE)"
          stopBy: end
fix: |-
  if not ($COND):
      tm.reject($MSG)
message: Preserve lazy assertion arguments and narrowing through tm.reject.
---
id: rewire-test-assert-guard
language: Python
severity: error
metadata:
  context:
    COND:
      is: emitted-symbol
      arg: tm flext_tests tm
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - pattern: "assert $COND"
    - not:
        matches: assert-has-message
    - has:
        any:
          - pattern: "$VALUE is None"
          - pattern: "$VALUE is not None"
    - not:
        regex: "^assert [A-Za-z_][A-Za-z0-9_]* is not None$"
    - not:
        has:
          pattern: "isinstance($VALUE, $TYPE)"
          stopBy: end
fix: |-
  if not ($COND):
      tm.reject()
message: Preserve native guard narrowing through tm.reject.
---
# A type guard the tm.instance rule cannot express (attribute subject, tuple
# kind, compound condition) retains native assertion failure and narrowing.
id: rewire-test-assert-type-guard
language: Python
severity: error
metadata:
  context:
    COND:
      is: emitted-symbol
      arg: tm flext_tests tm
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - any:
        - pattern: "assert $COND"
        - pattern: |-
            if not ($COND):
                raise AssertionError
    - not:
        has:
          nthChild: 2
          kind: string
    - has:
        pattern: "isinstance($VALUE, $TYPE)"
        stopBy: end
    - not:
        regex: "^(assert |if not \\()isinstance\\([A-Za-z_][A-Za-z0-9_]*, [^(]"
fix: |-
  if not ($COND):
      tm.reject()
message: Preserve type-guard narrowing and native assertion failure through tm.reject.
