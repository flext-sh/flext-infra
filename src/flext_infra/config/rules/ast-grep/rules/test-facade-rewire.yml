# Tests tier facade law (generator law p.5, ADR-018): the `tests` package is an
# internal tier whose `u` extends the project root `u` by class inheritance, so
# one binding reaches both the production namespaces (`u.Infra`, `u.Cli`) and
# `u.Tests`. A test module therefore binds `u` from `tests` only; a production
# `u` import beside it is a second, shadowed binding and an alias such as
# `u as test_u` is never needed.
#
# The fix removes the production `u` name from its import. The generated
# `import-header--<package>` rule of the deepest declaring package (`tests`)
# then inserts the binding the module uses and no longer binds, so the cascade
# reaches the fixed point without this rule emitting a name of its own. The tier facade modules themselves compose the root class
# and stay outside the scope.
id: test-utilities-tier-facade
language: Python
severity: error
files:
  - "**/tests/**/*.py"
ignores:
  - "**/tests/__init__.py"
  - "**/tests/utilities.py"
  - "**/tests/_utilities/**"
  - "**/tests/fixtures/**"
message: >-
  where: this test module imports `u` from the production package `$MODULE`.
  why: the tests tier `u` inherits the root `u` through its MRO and adds
  `u.Tests`, so it is the module's single utilities binding. fix: drop `u`
  from this import; the generated import header binds `from tests import u`.
rule:
  kind: import_from_statement
  pattern: $STATEMENT
  all:
    - inside:
        kind: module
    - has:
        field: module_name
        pattern: $MODULE
    - has:
        kind: dotted_name
        regex: "^u$"
        not:
          inside:
            kind: import_from_statement
            field: module_name
constraints:
  MODULE:
    all:
      - matches: facade-package
      - not:
          regex: "^tests(?:\\.|$)"
transform:
  STRIPPED:
    replace:
      source: $STATEMENT
      replace: "^from\\s+[\\w.]+\\s+import\\s+\\(?\\s*u\\s*,?\\s*\\)?$|,\\s*\\bu\\b|\\bu\\b\\s*,\\s*"
      by: ""
fix: $STRIPPED
