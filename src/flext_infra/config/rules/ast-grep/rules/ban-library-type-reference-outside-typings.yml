# FLEXT law (operator order 2026-10-24): a third-party library's types are
# aliased once in the typings family and every other module -- utilities
# included -- names them as `t.<Domain>.<Name>`. The owning utility may call
# the library's functions and constructors (`griffe.visit(...)`), but an
# attribute of the library module written as a type -- in an annotation or as
# an `isinstance`/`issubclass` operand -- is an implicit typings declaration.
#
# The library set is derived, never listed: the attribute's object must be a
# module the file binds with `import <module>` or `import <module> as <alias>`,
# and that module must be neither stdlib, the own package, nor a FLEXT facade
# package -- the same predicates the external-import boundary uses.
id: ban-library-type-reference-outside-typings
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/_typings/**"
  - "**/typings.py"
metadata:
  context:
    MODULE:
      - not: stdlib-module
      - not: own-package
      - not: facade-package
      - not: layer-zero-file
utils:
  type-check-call:
    kind: call
    has:
      field: function
      regex: "^(?:isinstance|issubclass)$"
  library-attribute:
    kind: attribute
    has:
      field: object
      kind: identifier
      pattern: $LIB
    inside:
      kind: module
      stopBy: end
      has:
        stopBy: end
        kind: import_statement
        any:
          - has:
              kind: dotted_name
              all:
                - pattern: $LIB
                - pattern: $MODULE
          - has:
              kind: aliased_import
              all:
                - has:
                    field: name
                    pattern: $MODULE
                - has:
                    field: alias
                    pattern: $LIB
rule:
  matches: library-attribute
  any:
    - inside:
        kind: type
        stopBy: end
    - all:
        - nthChild: 2
        - inside:
            kind: argument_list
            inside:
              matches: type-check-call
    - inside:
        stopBy: end
        any:
          - kind: binary_operator
          - kind: tuple
          - kind: parenthesized_expression
        nthChild: 2
        inside:
          kind: argument_list
          inside:
            matches: type-check-call
message: >-
  `$MODULE` library type named inline: alias it once in the typings family and
  reference it as `t.<Domain>.<Name>`.
note: >-
  Where: this attribute. Why: FLEXT law -- only `_typings` declares a library's
  types; an inline `lib.Type` in an annotation or isinstance/issubclass operand
  is a hidden second typings owner, even inside the utility that calls the
  library. How: add `type <Name> = lib.<Type>` (or the class alias for runtime
  checks) to this project's typings family and write `t.<Domain>.<Name>` here.
