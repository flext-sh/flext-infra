id: mod-scan-selection-conflict
language: Python
severity: error
message: Scanner rule IDs and a composed plan cannot compete for selection.
# The call reaches FlextInfraModGateEngine.scan: qualified, or as the
# engine's own classmethod.
constraints:
  CALL:
    any:
      - regex: "^FlextInfraModGateEngine\\.scan$"
      - all:
          - regex: "^(?:cls|self)\\.scan$"
          - inside:
              kind: class_definition
              stopBy: end
              has:
                field: name
                regex: "^FlextInfraModGateEngine$"
rule:
  all:
    - pattern: $CALL($$$ARGS)
    - has:
        field: arguments
        kind: argument_list
        all:
          - has:
              kind: keyword_argument
              has:
                field: name
                regex: "^(rule_ids|plan)$"
          - any:
              - has:
                  kind: keyword_argument
                  has:
                    field: name
                    regex: "^selection$"
              - all:
                  - has:
                      kind: keyword_argument
                      has:
                        field: name
                        regex: "^rule_ids$"
                  - has:
                      kind: keyword_argument
                      has:
                        field: name
                        regex: "^plan$"
