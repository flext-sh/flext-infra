# ClassVar metadata for foundation modules that bind the native ConfigDict
# contract directly. Facade-valued constructors use the companion typed rule.
#
# Idempotent: the rewrite yields an annotated assignment, which the plain
# assignment pattern never matches.
id: pydantic-model-config-configdict-classvar
language: python
severity: error
files:
  - "**/*.py"
rule:
  all:
    - pattern: "model_config = ConfigDict($$$ARGS)"
    - inside:
        kind: block
        stopBy: end
        inside:
          kind: class_definition
fix: "model_config: ClassVar[ConfigDict] = ConfigDict($$$ARGS)"
message: >-
  FLEXT model_config declarations explicitly identify class metadata with
  ClassVar while retaining the directly bound native constructor and type.
