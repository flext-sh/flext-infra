# A `Final[T]` constant on a `_constants` facade part is a field-like
# annotation, which the ADR-018 stand-in composition law (rule 5) refuses:
# `make gen` fails with "facade part ... cannot be a stand-in: field-like
# annotated attribute NAME" (measured in ai-hub, 364 constants, 2026-11-15).
# `ClassVar[T]` is the form a lazy stand-in represents.
#
# Only the body of a module-level class is rewritten; a nested class is not a
# facade part and keeps its annotation.
#
# Idempotent: the rewrite yields `ClassVar[T]`, which this rule never matches.
# facade-constant-classvar-import binds `ClassVar` in the same pass.
id: facade-constant-final-to-classvar
language: python
severity: error
files:
  - "src/**/_constants/**/*.py"
rule:
  all:
    - pattern: "$NAME: Final[$T] = $V"
    - matches: facade-part-constant
fix: "$NAME: ClassVar[$T] = $V"
message: >-
  A constant on a _constants facade part must be a ClassVar; a Final
  annotation is field-like and a lazy stand-in cannot represent it
  (ADR-018 stand-in composition law, rule 5).
