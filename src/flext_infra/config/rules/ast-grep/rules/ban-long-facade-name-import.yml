# Consumers reach a facade through its short runtime alias (`c`, `t`, `p`,
# `m`, `u`), never through the long facade class name. Only the facade
# families themselves (constants, typings, protocols, models, utilities and
# their private packages), the api and base composition modules and the
# generated package roots compose facades by their long names.
id: ban-long-facade-name-import
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/legado/**"
  - "**/legacy/**"
  - "**/node_modules/**"
  - "**/__init__.py"
  - "**/api.py"
  - "**/base.py"
  - "**/constants.py"
  - "**/typings.py"
  - "**/protocols.py"
  - "**/models.py"
  - "**/utilities.py"
  - "**/_constants/**"
  - "**/_typings/**"
  - "**/_protocols/**"
  - "**/_models/**"
  - "**/_utilities/**"
rule:
  kind: dotted_name
  regex: "^Flext[A-Za-z0-9]*(?:Constants|Types|Protocols|Models|Utilities)$"
  pattern: $NAME
  any:
    - inside:
        kind: import_from_statement
        field: name
    - inside:
        kind: aliased_import
        field: name
        inside:
          kind: import_from_statement
message: >-
  Long facade name `$NAME` imported outside its family: import the short alias
  (c, t, p, m, u) from the package root instead.
