# Keep the historical rule identity: concrete runtime Mixin ellipses and
# class-local typing shells are the same competing-implementation law. Only
# declaration-shaped bodies are candidates; Protocol classes
# (typing-base-class) and abstractmethod/overload declarations
# (declaration-decorated) keep their declarations, even behind import aliases.
id: concrete-mixin-runtime-ellipsis
language: python
severity: error
files:
  - "**/*.py"
message: >-
  A concrete class supplies a competing declaration-only method. Compose the actual
  implementation and state owner; use p.* only for a genuine dependency capability,
  never a copy of sibling signatures or a TYPE_CHECKING implementation.
utils:
  shell-body:
    kind: block
    all:
      - has:
          any:
            - kind: delete_statement
            - kind: expression_statement
              has:
                kind: ellipsis
      - not:
          has:
            not:
              any:
                - kind: delete_statement
                - kind: expression_statement
                  has:
                    any:
                      - kind: ellipsis
                      - kind: string
                - kind: raise_statement
                  any:
                    - pattern: raise NotImplementedError
                    - pattern: raise NotImplementedError($$$ARGS)
rule:
  kind: function_definition
  all:
    - has:
        field: name
        pattern: $METHOD
    - not:
        matches: declaration-decorated
    - has:
        field: body
        matches: shell-body
    - any:
        - all:
            - inside:
                kind: if_statement
                stopBy: end
                has:
                  field: condition
                  all:
                    - pattern: $GUARD
                    - matches: type-checking-flag
            - inside:
                kind: class_definition
                stopBy:
                  any:
                    - kind: class_definition
                    - kind: function_definition
                has:
                  field: name
                  pattern: $NAME
                not:
                  matches: typing-base-class
        - all:
            - any:
                - pattern: |
                    def $METHOD($$$PARAMS):
                        ...
                - pattern: |
                    def $METHOD($$$PARAMS) -> $RETURN:
                        ...
            - inside:
                kind: class_definition
                stopBy:
                  any:
                    - kind: class_definition
                    - kind: function_definition
                has:
                  field: name
                  all:
                    - pattern: $NAME
                    - regex: "Mixin$"
                not:
                  matches: typing-base-class
