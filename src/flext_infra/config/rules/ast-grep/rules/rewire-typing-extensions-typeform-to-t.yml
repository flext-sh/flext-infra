# FLEXT law (operator order 2026-10-24, ADR-028 points 1-2): a third-party
# library is reached only through the facades. flext-core's typings family
# owns `t.TypeForm` (the `typing_extensions.TypeForm` special form), so a
# module importing it from `typing_extensions` re-declares a typings member
# outside its owner. The two documents run in one pass: every reference of the
# imported name reads `t.TypeForm`, and the now-unused import is retired.
id: rewire-typing-extensions-typeform-reference
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/typings.py"
  - "**/_typings/**"
rule:
  kind: identifier
  regex: "^TypeForm$"
  not:
    any:
      - inside:
          kind: import_from_statement
          stopBy: end
      - inside:
          kind: attribute
          field: attribute
  inside:
    kind: module
    stopBy: end
    has:
      kind: import_from_statement
      all:
        - has:
            field: module_name
            regex: "^typing_extensions$"
        - has:
            field: name
            regex: "^TypeForm$"
fix: t.TypeForm
message: >-
  `TypeForm` imported from typing_extensions: read the typings member t.TypeForm.
---
id: retire-typing-extensions-typeform-import
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/typings.py"
  - "**/_typings/**"
rule:
  pattern: from typing_extensions import TypeForm
fix: ""
message: >-
  `from typing_extensions import TypeForm` re-declares the typings member
  t.TypeForm: remove it and read t.TypeForm.
