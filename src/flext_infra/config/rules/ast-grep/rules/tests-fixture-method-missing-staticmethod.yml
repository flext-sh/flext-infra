# ENFORCE-102: a method declared in a class without a `self`/`cls` first
# parameter is a @staticmethod, in every tier and every module shape (test
# classes, fixture holders under tests/fixtures, conftest-aliased holders,
# source). Without it pytest cannot bind a fixture ("Could not determine
# arguments ... invalid method signature") and a plain method call passes the
# instance as its first argument.
#
# One rule for the law (ADR-028 Decision 18): it supersedes the former
# class-method-without-self-needs-staticmethod duplicate. @staticmethod is
# placed directly above `def`, under every other decorator, which pytest 9
# requires for fixtures (`@pytest.fixture` outermost) and which keeps a
# fixture usable both inherited and aliased by a conftest (measured
# 2026-11-08, pytest 9.2: both forms resolve).
id: tests-fixture-method-missing-staticmethod
language: python
severity: error
metadata:
  enforce: [ENFORCE-102]
files:
  - "**/*.py"
rule:
  kind: function_definition
  pattern: $DEF
  any:
    - inside:
        kind: block
        inside:
          kind: class_definition
    - inside:
        kind: decorated_definition
        all:
          - not:
              has:
                kind: decorator
                regex: '^@(staticmethod|classmethod)$'
          - inside:
              kind: block
              inside:
                kind: class_definition
  not:
    has:
      field: parameters
      has:
        nthChild: 1
        regex: '^(self|cls)\b'
fix: |-
  @staticmethod
  $DEF
message: >-
  A method without `self`/`cls` is a @staticmethod (placed directly above
  `def`, under every other decorator).
