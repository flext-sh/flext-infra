# A pytest fixture declared as a method of a test class without `self` and
# without @staticmethod cannot be bound by pytest ("Could not determine
# arguments ... invalid method signature"), so the whole class fails
# collection. Measured 2026-11-04: flext-ldif 33, flext-observability 5,
# flext-oracle-wms 5, flext-auth 1 (collection error on HEAD). The fix places
# @staticmethod under the fixture decorator (pytest requires the fixture
# decorator outermost).
id: tests-fixture-method-missing-staticmethod
language: python
severity: error
metadata:
  enforce: [ENFORCE-102]
files:
  - "**/tests/**/*.py"
ignores:
  - "**/conftest.py"
  - "**/tests/fixtures/**"
rule:
  kind: function_definition
  pattern: $DEF
  inside:
    kind: decorated_definition
    all:
      - has:
          kind: decorator
          regex: '^@(pytest|u\.Tests)\.fixture\b'
      - not:
          has:
            kind: decorator
            regex: '^@(staticmethod|classmethod)$'
      - inside:
          kind: block
          inside:
            kind: class_definition
  not:
    has:
      field: parameters
      has:
        nthChild: 1
        kind: identifier
        regex: '^(self|cls)$'
fix: |-
  @staticmethod
  $DEF
message: >-
  A fixture method without `self` must be a @staticmethod: pytest cannot
  resolve its arguments otherwise.
