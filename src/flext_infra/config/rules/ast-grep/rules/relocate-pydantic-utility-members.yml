# Retired utility members move only after native source and destination proofs.
id: relocate-pydantic-utility-field-validator
language: Python
severity: error
constraints:
  OWNER:
    regex: '^u$'
  MEMBER:
    regex: '^field_validator$'
metadata:
  context:
    OWNER:
      is: member-relocation
      of: MEMBER
      arg: flext_core u m.field_validator flext_core m.field_validator
rule:
  pattern: $OWNER.$MEMBER
fix: m.$MEMBER
message: Consume the retired utility validator through its canonical model owner.
