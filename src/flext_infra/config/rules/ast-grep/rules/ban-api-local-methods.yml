# Ban local method definitions in api.py — the facade must be pure MRO.
# All handlers belong in services/*.py and are composed via cooperative MRO.
# The law binds the package-root composition module only: the generated
# `composition-root` scope (the project layout's `<package>/api.py`). A module
# that happens to be named `api.py` deeper in a package (e.g.
# `_utilities/_docs/api.py`) is an ordinary family module, governed by its
# family's rules.
id: ban-api-local-methods
language: Python
severity: error
files:
  - "**/api.py"
rule:
  kind: function_definition
  inside:
    kind: class_definition
    stopBy: end
# Detection only: handlers must be relocated by the semantic make mod planner.
message: |
  api.py must be a pure MRO facade — no local method definitions allowed.
  Move handlers to services/*.py and compose via MRO.
  See: ADR-014, flext-family-shape (api.py canonical form)
metadata:
  scope:
    in: [ composition-root ]
