# flext-cli owns the CLI domain: commands, prompts, terminal output, process
# exit, and JSON/YAML/CSV/TOML serialization. A project that consumes flext-cli
# routes every one of them through the flext-cli facade. `metadata.consumers_of`
# elects these rules only for projects whose runtime closure contains
# flext-cli, so flext-cli itself and the projects below it are never bound.
#
# Print calls are owned by Ruff (print) in every project, and subprocess
# imports by ban-subprocess-outside-run-owner; they are not repeated here.
#
# Detection only: the facade member that replaces a direct use is chosen per
# call site.
id: ban-cli-domain-library-import
language: python
severity: error
files:
  - "**/*.py"
metadata:
  consumers_of: flext-cli
rule:
  any:
    - any:
        - all:
            - kind: import_statement
            - has:
                stopBy: end
                kind: dotted_name
                regex: "^(?:typer|argparse|tabulate|colorama|prompt_toolkit|tqdm|getpass|ujson|simplejson)(?:\\.|$)"
        - all:
            - kind: import_from_statement
            - has:
                field: module_name
                regex: "^(?:typer|argparse|tabulate|colorama|prompt_toolkit|tqdm|getpass|ujson|simplejson)(?:\\.|$)"
    # Runtime imports of the libraries flext-cli owns are reported by
    # ban-flext-cli-library-import; a consumer may not name them even for
    # annotations.
    - all:
        - matches: inside-type-checking-guard
        - any:
            - all:
                - kind: import_statement
                - has:
                    stopBy: end
                    kind: dotted_name
                    regex: "^(?:rich|orjson|click)(?:\\.|$)"
            - all:
                - kind: import_from_statement
                - has:
                    field: module_name
                    regex: "^(?:rich|orjson|click)(?:\\.|$)"
message: >-
  The CLI domain belongs to flext-cli: commands and argument parsing through
  cli.register_result_command with a Pydantic model, prompts through
  cli.prompt / cli.confirm / cli.prompt_password, tables through
  cli.format_table / cli.show_table, progress through cli.display_progress,
  styled output through cli.print with c.Cli.MessageStyles, and JSON through
  u.Cli.json_* / cli.read_json_file / cli.write_json_file.
---
id: ban-toml-library-import
language: python
severity: error
files:
  - "**/*.py"
metadata:
  consumers_of: flext-cli
rule:
  any:
    - all:
        - kind: import_statement
        - has:
            stopBy: end
            kind: dotted_name
            regex: "^(?:tomllib|tomlkit)(?:\\.|$)"
    - all:
        - kind: import_from_statement
        - has:
            field: module_name
            regex: "^(?:tomllib|tomlkit)(?:\\.|$)"
message: >-
  TOML parsing belongs to flext-cli: read and write TOML through u.Cli.toml_*.
---
id: ban-sys-exit-call
language: python
severity: error
files:
  - "**/*.py"
metadata:
  consumers_of: flext-cli
rule:
  pattern: sys.exit($$$ARGS)
  all:
    - not:
        has:
          field: arguments
          has:
            kind: string
    - inside:
        kind: module
        stopBy: end
        has:
          stopBy: end
          matches: cli-imported-from-flext-cli
fix: cli.exit($$$ARGS)
message: >-
  Process exit belongs to flext-cli: end a command through cli.exit(), never
  sys.exit().
---
# The same law where the token fix cannot apply: the module does not bind the
# public `cli` facade (the emitted `cli.` would be undefined), or the exit
# carries a message string that `cli.exit(code: int)` does not accept.
id: ban-sys-exit-call-without-cli-binding
language: python
severity: error
files:
  - "**/*.py"
metadata:
  consumers_of: flext-cli
rule:
  pattern: sys.exit($$$ARGS)
  any:
    - has:
        field: arguments
        has:
          kind: string
    - inside:
        kind: module
        stopBy: end
        not:
          has:
            stopBy: end
            matches: cli-imported-from-flext-cli
message: >-
  where: this `sys.exit(...)`. why: process exit belongs to flext-cli. fix:
  bind `from flext_cli import cli` and pass an integer code so `make mod`
  rewrites it to `cli.exit(code)`; a message belongs to the raised failure,
  not to the exit.
---
id: ban-direct-serialization-call
language: python
severity: error
files:
  - "**/*.py"
metadata:
  consumers_of: flext-cli
rule:
  kind: attribute
  any:
    - all:
        - has:
            field: object
            kind: identifier
            regex: "^json$"
        - has:
            field: attribute
            regex: "^(?:dump|dumps|load|loads)$"
    - all:
        - has:
            field: object
            kind: identifier
            regex: "^yaml$"
        - has:
            field: attribute
            regex: "^(?:dump|load|safe_load)$"
    - all:
        - has:
            field: object
            kind: identifier
            regex: "^csv$"
        - has:
            field: attribute
            regex: "^(?:DictReader|DictWriter|reader|writer)$"
message: >-
  JSON, YAML and CSV serialization belongs to flext-cli: use u.Cli.json_* /
  cli.json_*, u.Cli.yaml_* / cli.yaml_*, or u.Cli.csv_* / cli.csv_*.
---
# A YAML file is read through its path-based owner, never by reading its text
# and parsing the text: only the path reader names the file in its failure
# (incident 2026-11-04: `make mod-snapshots` reported a scanner error without
# the file). The transform chain maps each text parser to its path reader, so
# one rule covers both parsers and both text readers.
id: rewire-yaml-text-read-to-path-reader
language: python
severity: error
files:
  - "**/*.py"
metadata:
  consumers_of: flext-cli
rule:
  any:
    - pattern: u.Cli.$PARSE(u.Cli.files_read_text($PATH).unwrap())
    - pattern: u.Cli.$PARSE($PATH.read_text($$$ARGS))
constraints:
  PARSE:
    regex: "^yaml_parse(?:_documents)?$"
transform:
  STREAM:
    replace:
      source: $PARSE
      replace: "^yaml_parse_documents$"
      by: "yaml_load_documents"
  READER:
    replace:
      source: $STREAM
      replace: "^yaml_parse$"
      by: "yaml_safe_load"
fix: u.Cli.$READER($PATH)
message: >-
  Read the YAML file through `u.Cli.$READER($PATH)`, which names the file on
  failure, not through `u.Cli.$PARSE` of its text.
---
# A consumer reaches flext-cli through its facades (cli, c, m, p, t, u, s),
# never through a concrete FlextCli<X> class. The facade extension modules of
# a package source tree extend the flext-cli facades by inheritance and are the
# only modules that name them.
id: ban-concrete-flext-cli-import
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/src/**/constants.py"
  - "**/src/**/models.py"
  - "**/src/**/protocols.py"
  - "**/src/**/typings.py"
  - "**/src/**/utilities.py"
  - "**/src/**/config.py"
  - "**/src/**/settings.py"
  - "**/src/**/_config.py"
  - "**/src/**/_settings.py"
metadata:
  consumers_of: flext-cli
rule:
  kind: import_from_statement
  all:
    - has:
        field: module_name
        regex: "^flext_cli$"
    - has:
        stopBy: end
        kind: dotted_name
        regex: "^FlextCli[A-Z]\\w*$"
message: >-
  Concrete flext-cli classes stay behind its facades: import cli, c, m, p, t,
  u or s from flext_cli instead.
