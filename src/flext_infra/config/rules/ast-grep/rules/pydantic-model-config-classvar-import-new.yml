# Adds the module-level `from typing import ClassVar` when a module declaring
# an unannotated model_config assignment has no module-level typing import at
# all. Anchored on the mandatory `from __future__ import annotations` (enforced
# by require-future-annotations) so the import lands in the import block.
#
# Idempotent: once a module-level typing import exists the rule no longer
# matches; pydantic-model-config-classvar-import then owns adding ClassVar.
id: pydantic-model-config-classvar-import-new
language: python
severity: error
files:
  - "**/*.py"
rule:
  all:
    - pattern: "from __future__ import annotations"
    - inside:
        kind: module
        all:
          - has:
              stopBy: end
              matches: pydantic-model-config-assignment
          - not:
              has:
                kind: import_from_statement
                has:
                  field: module_name
                  regex: "^typing$"
fix: "from __future__ import annotations\n\nfrom typing import ClassVar"
message: >-
  Modules declaring unannotated model_config assignments bind ClassVar at
  module level.
