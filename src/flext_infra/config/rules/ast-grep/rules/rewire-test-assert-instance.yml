# Keep the original type predicate and terminate its failing branch. Rebinding
# a referenced name can otherwise change Python's local/global name election.
# Tuple kinds and attribute subjects keep rewire-test-assert-guard.yml.
id: rewire-test-assert-instance
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - any:
        - all:
            - pattern: "assert isinstance($X, $KIND)"
            - not:
                has:
                  nthChild: 2
        - pattern: |-
            if not (isinstance($X, $KIND)):
                raise AssertionError
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - matches: tm-binding-admissible
constraints:
  X:
    kind: identifier
  KIND:
    not:
      kind: tuple
fix: |-
  if not isinstance($X, $KIND):
      tm.reject()
message: Preserve native type narrowing and name bindings through tm.reject.
---
id: rewire-test-assert-instance-message
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - any:
        - pattern: "assert isinstance($X, $KIND), $MSG"
        - pattern: |-
            if not (isinstance($X, $KIND)):
                raise AssertionError($MSG)
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - matches: tm-binding-admissible
constraints:
  X:
    kind: identifier
  KIND:
    not:
      kind: tuple
fix: |-
  if not isinstance($X, $KIND):
      tm.reject($MSG)
message: Preserve native type narrowing and lazy assertion arguments through tm.reject.
