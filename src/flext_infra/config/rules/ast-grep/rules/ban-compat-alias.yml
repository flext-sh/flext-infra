# Ban module-level backward-compatibility aliases (epic i2h4).
#
# FLEXT law: atomic consumer updates with direct uses and NO compatibility
# shims; complete cutover on refactors (Universal law §4/§28). A module-level
# `Old = New` assignment that exists only to keep an old name alive creates
# old+new coexistence — the exact banned pattern. Consumers must be migrated
# to the canonical name in the same change.
#
# Detection is SHAPE-BASED: a bare identifier-to-identifier assignment at
# module top level. Dunder protocol assignments (`__version__ = ...`) and
# class/dataclass fields never match.
#
# A name the module declares in its own __all__ is a published facade alias
# (generator law: the owner of a letter is the module that declares it), so
# the rule matches only when $NAME is absent from the module's own __all__
# (catalog utility declared-in-module-all). No alias name is listed here.
#
# Detection-only: the correct replacement is to rename at the owner and
# update every consumer in the same cutover.

id: ban-compat-alias
language: Python
severity: error
metadata:
  enforce: [ENFORCE-010, ENFORCE-066]
rule:
  all:
    - pattern: $NAME = $NEW
    - inside:
        kind: expression_statement
        inside:
          kind: module
    - not:
        matches: declared-in-module-all
constraints:
  NAME:
    kind: identifier
    regex: "^[A-Za-z][A-Za-z0-9_]+$"
  NEW:
    kind: identifier
    regex: '^[A-Za-z]\w*$'
message: >-
  Backward-compatibility alias `$NAME = $NEW` at module level is banned.
  Rename at the owner and migrate every consumer in the same cutover —
  no old+new coexistence.
note: >-
  Migration: keep only the canonical name ($NEW), delete the alias, update
  all importers of $NAME in the same change, and let pyrefly/mypy pinpoint
  any missed consumer. A name the module publishes in its __all__ is its
  declared facade alias, not a compatibility name.
files:
  - "**/*.py"
---
# FLEXT generator law point 5 (operator law 2026-09-20, flext-0in0k): internal
# tiers inherit by class MRO and declare their own letter in their own
# `__all__`; a subdirectory declares no short alias. Only a namespace-root
# facade module (`src/<package>/<module>.py` or `<tier>/<module>.py`) binds a
# family letter. A module below a package or tier subdirectory that binds a
# single-letter name at module level re-declares a letter its namespace root
# already publishes: its generated initializer then publishes a second owner of
# the letter, and the import law can no longer elect one origin for the
# family modules beside it.
#
# The fix deletes the assignment; the two documents below remove its
# `__all__` entry, and the regenerated initializer stops publishing it.
# Consumers bind the letter from the namespace root.
id: ban-subdirectory-short-alias
language: Python
severity: error
metadata:
  enforce: [ENFORCE-010, ENFORCE-066]
files:
  - "**/*.py"
ignores:
  - "src/*/*.py"
  - "**/__init__.py"
  # Family facade modules own the short alias their namespace root imports,
  # matching the add-facade-module-* declarations regardless of depth.
  - "**/constants.py"
  - "**/models.py"
  - "**/protocols.py"
  - "**/typings.py"
  - "**/utilities.py"
  - "**/utils.py"
rule:
  kind: expression_statement
  inside:
    kind: module
  has:
    kind: assignment
    all:
      - has:
          field: left
          kind: identifier
          regex: "^[a-z]$"
      - has:
          field: right
          regex: "."
fix: ""
message: >-
  A subdirectory module declares no short alias: the letter belongs to the
  namespace-root facade module that composes this class.
---
# Companion of ban-subdirectory-short-alias: the deleted alias leaves the
# module's own `__all__` exporting a name it no longer binds. An entry
# followed by a comma is removed with that comma.
id: ban-subdirectory-short-alias-export
language: Python
severity: error
metadata:
  enforce: [ENFORCE-010, ENFORCE-066]
files:
  - "**/*.py"
ignores:
  - "src/*/*.py"
  - "**/__init__.py"
  # Family facade modules own the short alias their namespace root imports,
  # matching the add-facade-module-* declarations regardless of depth.
  - "**/constants.py"
  - "**/models.py"
  - "**/protocols.py"
  - "**/typings.py"
  - "**/utilities.py"
  - "**/utils.py"
rule:
  kind: string
  regex: "^[\"'][a-z][\"']$"
  precedes:
    regex: "^,$"
  inside:
    any:
      - kind: list
      - kind: tuple
    inside:
      kind: assignment
      has:
        field: left
        regex: "^__all__$"
      inside:
        kind: expression_statement
        inside:
          kind: module
fix:
  template: ""
  expandEnd:
    regex: "^,$"
message: >-
  A subdirectory module exports no short alias: its namespace root publishes
  the letter.
---
# Companion of ban-subdirectory-short-alias: the last `__all__` entry, with
# no comma after it, is removed with the comma before it.
id: ban-subdirectory-short-alias-export-last
language: Python
severity: error
metadata:
  enforce: [ENFORCE-010, ENFORCE-066]
files:
  - "**/*.py"
ignores:
  - "src/*/*.py"
  - "**/__init__.py"
  # Family facade modules own the short alias their namespace root imports,
  # matching the add-facade-module-* declarations regardless of depth.
  - "**/constants.py"
  - "**/models.py"
  - "**/protocols.py"
  - "**/typings.py"
  - "**/utilities.py"
  - "**/utils.py"
rule:
  kind: string
  regex: "^[\"'][a-z][\"']$"
  not:
    precedes:
      regex: "^,$"
  inside:
    any:
      - kind: list
      - kind: tuple
    inside:
      kind: assignment
      has:
        field: left
        regex: "^__all__$"
      inside:
        kind: expression_statement
        inside:
          kind: module
fix:
  template: ""
  expandStart:
    regex: "^,$"
message: >-
  A subdirectory module exports no short alias: its namespace root publishes
  the letter.
