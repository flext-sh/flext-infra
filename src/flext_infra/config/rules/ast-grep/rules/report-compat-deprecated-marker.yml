# Operator order 2026-10-24: while a primitive moves to its owner, an old entry
# that still has callers survives only as a thin pass-through marked with the
# stdlib PEP 702 decorator
# `@warnings.deprecated("compat: <old> -> <new owner>; fix: <exact rewire>")`,
# and the old path plus its marker leave in the same cutover that rewires the
# last caller. This rule makes every surviving marker visible in the census;
# warnings are red, so the gate stays red until the last marker is gone.
id: report-compat-deprecated-marker
language: python
severity: warning
files:
  - "**/*.py"
rule:
  kind: decorator
  any:
    - has:
        kind: call
        has:
          field: function
          regex: "^(?:warnings\\.)?deprecated$"
    - has:
        kind: attribute
        regex: "^warnings\\.deprecated$"
message: >-
  Compatibility path marked for extermination: rewire its remaining callers to
  the named owner, then delete the old entry and this marker together.
note: >-
  Where: this decorator. Why: a compat pass-through is tolerated only while its
  callers are being rewired; any surviving marker keeps the gate red. How:
  apply the `fix:` rewire stated in the marker to every caller, then remove
  the decorated entry in the same cutover.
