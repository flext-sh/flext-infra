# A private facade-family package `<root>._<family>` is never spelled
# `<root>_<family>`: no such module exists, so the import fails at runtime.
# The collapsed spelling comes from a text rewrite that dropped the package
# separator (incident 2026-11-04: `ai_hub_models`, `flext_infra_models`).
#
# The generated `collapsed-facade-family-package` utility is the fact: it is
# computed with `facade-family-package` from the same roots and the facade
# family directories (`u.Infra.facade_families`), so this rule carries no
# family vocabulary. A family directory is one `_<word>` segment, so the
# transform restores the separator before the last segment. The import law
# (`rewire-deep-import-to-package`) owns any further move of the module path.
id: rewire-collapsed-family-package
language: python
severity: error
files:
  - "**/*.py"
metadata:
  enforce: [ENFORCE-015]
rule:
  kind: dotted_name
  pattern: $MODULE
  matches: collapsed-facade-family-package
  inside:
    kind: import_from_statement
    field: module_name
transform:
  PACKAGE:
    replace:
      source: $MODULE
      replace: "^(?<ROOT>.+?)(?<FAMILY>_[a-z0-9]+)$"
      by: "$ROOT.$FAMILY"
fix: $PACKAGE
message: >-
  `$MODULE` collapses the private family package `$PACKAGE`: import from it.
