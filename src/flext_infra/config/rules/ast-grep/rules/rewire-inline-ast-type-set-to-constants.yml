# FLEXT law (operator order 2026-10-24, ADR-028 point 3): outside the constants
# family no module spells a runtime type set. `ban-inline-type-set-outside-
# constants` detects every inline `isinstance` union or tuple; the stdlib `ast`
# node sets below are the recurring shapes, owned once by the constants family
# (FlextInfraConstantsSourceCode, read as `c.Infra.AST_*_TYPES`), so their
# rewrite is mechanical and propagates through `make mod`.
#
# Each document matches one exact node set in every operand order and both
# union and tuple spellings; a larger or different set never matches because
# the pattern binds the complete second argument.
id: rewire-ast-function-type-set
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/constants.py"
  - "**/_constants/**"
rule:
  any:
    - pattern: isinstance($VALUE, ast.FunctionDef | ast.AsyncFunctionDef)
    - pattern: isinstance($VALUE, ast.AsyncFunctionDef | ast.FunctionDef)
    - pattern: isinstance($VALUE, (ast.FunctionDef, ast.AsyncFunctionDef))
    - pattern: isinstance($VALUE, (ast.AsyncFunctionDef, ast.FunctionDef))
fix: isinstance($VALUE, c.Infra.AST_FUNCTION_TYPES)
message: >-
  Inline ast function node set: read c.Infra.AST_FUNCTION_TYPES.
---
