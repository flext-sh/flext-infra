# FLEXT law (operator order 2026-10-24, ADR-028): a test module is an ordinary
# module of its tier; it reaches pytest only through the flext-tests facades.
# flext-tests, the pytest plugin, is layer zero for pytest and publishes each
# pytest member in the family its object kind owns (tooling
# `facade-members.owners`): functions under `u.Tests`, types under `t.Tests`,
# constants/enums/exceptions under `c.Tests` (constant names upper-cased by the
# constants naming law). The owner is decided from pytest's own object by the
# generated `library-member-owner-pytest-<letter>` utilities, never from a
# list or a naming guess. `conftest.py` and `tests/fixtures/**` keep the tests-tier
# delta and import pytest directly.
#
# Activation: the documents stay `severity: off` until the flext-tests facade
# composition (generated by `make gen`) publishes the surface declared in
# flext_tests/_<family>/pytest_surface.py; the commit that consumes that regen
# flips them to `error`, so `make mod` never rewrites a test to a member that
# does not exist yet.
#
# Autofix order: these documents rewrite references only; the import-header
# stage binds the missing letters, and retire-pytest-import drops the import
# once no bare `pytest` reference remains.
id: rewire-pytest-function-to-tests-utilities
language: python
severity: off
files:
  - "tests/**/*.py"
ignores:
  - "**/conftest.py"
  - "tests/fixtures/**"
rule:
  kind: attribute
  all:
    - has:
        field: object
        kind: identifier
        regex: "^pytest$"
        pattern: $LIB
    - has:
        field: attribute
        pattern: $NAME
constraints:
  NAME:
    matches: library-member-owner-pytest-u
fix: u.Tests.$NAME
message: >-
  `pytest.$NAME` in a test module: call it through the flext-tests facade
  `u.Tests.$NAME`.
---
id: rewire-pytest-type-to-tests-typings
language: python
severity: off
files:
  - "tests/**/*.py"
ignores:
  - "**/conftest.py"
  - "tests/fixtures/**"
rule:
  kind: attribute
  all:
    - has:
        field: object
        kind: identifier
        regex: "^pytest$"
        pattern: $LIB
    - has:
        field: attribute
        pattern: $NAME
constraints:
  NAME:
    matches: library-member-owner-pytest-t
fix: t.Tests.$NAME
message: >-
  `pytest.$NAME` in a test module: read the type through the flext-tests
  facade `t.Tests.$NAME`.
---
id: rewire-pytest-constant-to-tests-constants
language: python
severity: off
files:
  - "tests/**/*.py"
ignores:
  - "**/conftest.py"
  - "tests/fixtures/**"
rule:
  kind: attribute
  all:
    - has:
        field: object
        kind: identifier
        regex: "^pytest$"
        pattern: $LIB
    - has:
        field: attribute
        pattern: $NAME
constraints:
  NAME:
    regex: "^[a-z_][a-z0-9_]*$"
    matches: library-member-owner-pytest-c
transform:
  CONSTANT:
    convert:
      source: $NAME
      toCase: upperCase
fix: c.Tests.$CONSTANT
message: >-
  `pytest.$NAME` in a test module: read the constant through the flext-tests
  facade `c.Tests.$CONSTANT`.
---
id: rewire-pytest-class-constant-to-tests-constants
language: python
severity: off
files:
  - "tests/**/*.py"
ignores:
  - "**/conftest.py"
  - "tests/fixtures/**"
rule:
  kind: attribute
  all:
    - has:
        field: object
        kind: identifier
        regex: "^pytest$"
        pattern: $LIB
    - has:
        field: attribute
        pattern: $NAME
constraints:
  NAME:
    regex: "^[A-Z][A-Za-z0-9]*$"
    matches: library-member-owner-pytest-c
fix: c.Tests.$NAME
message: >-
  `pytest.$NAME` in a test module: read the enum or exception through the
  flext-tests facade `c.Tests.$NAME`.
---
id: retire-pytest-import
language: python
severity: off
files:
  - "tests/**/*.py"
ignores:
  - "**/conftest.py"
  - "tests/fixtures/**"
rule:
  pattern: import pytest
  inside:
    kind: module
    not:
      has:
        stopBy: end
        kind: identifier
        regex: "^pytest$"
        not:
          any:
            - inside:
                kind: import_statement
                stopBy: end
            - inside:
                kind: attribute
                field: object
fix: ""
message: >-
  `import pytest` in a test module: pytest is reached through the flext-tests
  facades (`u.Tests`, `t.Tests`, `c.Tests`).
