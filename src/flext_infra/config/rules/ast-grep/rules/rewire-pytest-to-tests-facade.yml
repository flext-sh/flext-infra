# FLEXT law (operator order 2026-10-24, ADR-028): a test module is an ordinary
# module of its tier; it reaches pytest only through the flext-tests facades.
# flext-tests, the pytest plugin, is layer zero for pytest and publishes each
# pytest member in the family its object kind owns (tooling
# `facade-members.owners`): functions under `u.Tests`, types under `t.Tests`,
# constants/enums/exceptions under `c.Tests` (constant names upper-cased by the
# constants naming law). The owner is decided from pytest's own object by the
# generated `library-member-owner-pytest-<letter>` utilities, never from a
# list or a naming guess. `conftest.py` and `tests/fixtures/**` keep the tests-tier
# delta and import pytest directly.
#
# Activation: flext-tests publishes the surface declared in
# flext_tests/_<family>/pytest_surface.py (composed by its c/t/u facades from
# the flext-infra `Infra.Pytest` owners), so every document is `error`.
#
# Autofix order: these documents rewrite references only; the import-header
# stage binds the missing letters, and the `import-fix` stage (Ruff F401, the
# only owner of unused-import removal) drops `import pytest` once no bare
# `pytest` reference remains.
#
# `pytest.fail` stays: the generated `u` owner set is the kind classification
# intersected with what `u.Infra.Pytest` (flext-infra
# `_utilities/pytest_surface.py`) publishes, and that class does not publish
# `fail`, because `u.Tests` inherits it ahead of its result matchers and the
# matcher `fail` owns the name.
id: rewire-pytest-function-to-tests-utilities
language: python
severity: error
metadata:
  enforce: [ENFORCE-003]
files:
  - "tests/**/*.py"
ignores:
  - "**/conftest.py"
  - "tests/fixtures/**"
  - "tests/constants.py"
  - "tests/typings.py"
  - "tests/utilities.py"
  - "tests/models.py"
  - "tests/protocols.py"
rule:
  kind: attribute
  all:
    - has:
        field: object
        kind: identifier
        regex: "^pytest$"
        pattern: $LIB
    - has:
        field: attribute
        pattern: $NAME
constraints:
  NAME:
    matches: library-member-owner-pytest-u
fix: u.Tests.$NAME
message: >-
  `pytest.$NAME` in a test module: call it through the flext-tests facade
  `u.Tests.$NAME`.
---
id: rewire-pytest-type-to-tests-typings
language: python
severity: error
metadata:
  enforce: [ENFORCE-003]
files:
  - "tests/**/*.py"
ignores:
  - "**/conftest.py"
  - "tests/fixtures/**"
  - "tests/constants.py"
  - "tests/typings.py"
  - "tests/utilities.py"
  - "tests/models.py"
  - "tests/protocols.py"
rule:
  kind: attribute
  all:
    - has:
        field: object
        kind: identifier
        regex: "^pytest$"
        pattern: $LIB
    - has:
        field: attribute
        pattern: $NAME
    # Only type positions: a constructor call (`pytest.StashKey()`) stays on
    # the runtime owner, since `t.Tests.$NAME` is an alias, not a factory.
    - inside:
        kind: type
        stopBy: end
constraints:
  NAME:
    matches: library-member-owner-pytest-t
fix: t.Tests.$NAME
message: >-
  `pytest.$NAME` in a test module: read the type through the flext-tests
  facade `t.Tests.$NAME`.
---
id: rewire-pytest-constant-to-tests-constants
language: python
severity: error
metadata:
  enforce: [ENFORCE-003]
files:
  - "tests/**/*.py"
ignores:
  - "**/conftest.py"
  - "tests/fixtures/**"
  - "tests/constants.py"
  - "tests/typings.py"
  - "tests/utilities.py"
  - "tests/models.py"
  - "tests/protocols.py"
rule:
  kind: attribute
  all:
    - has:
        field: object
        kind: identifier
        regex: "^pytest$"
        pattern: $LIB
    - has:
        field: attribute
        pattern: $NAME
constraints:
  NAME:
    regex: "^[a-z_][a-z0-9_]*$"
    matches: library-member-owner-pytest-c
transform:
  CONSTANT:
    convert:
      source: $NAME
      toCase: upperCase
fix: c.Tests.$CONSTANT
message: >-
  `pytest.$NAME` in a test module: read the constant through the flext-tests
  facade `c.Tests.$CONSTANT`.
---
id: rewire-pytest-class-constant-to-tests-constants
language: python
severity: error
metadata:
  enforce: [ENFORCE-003]
files:
  - "tests/**/*.py"
ignores:
  - "**/conftest.py"
  - "tests/fixtures/**"
  - "tests/constants.py"
  - "tests/typings.py"
  - "tests/utilities.py"
  - "tests/models.py"
  - "tests/protocols.py"
rule:
  kind: attribute
  all:
    - has:
        field: object
        kind: identifier
        regex: "^pytest$"
        pattern: $LIB
    - has:
        field: attribute
        pattern: $NAME
constraints:
  NAME:
    regex: "^[A-Z][A-Za-z0-9]*$"
    matches: library-member-owner-pytest-c
fix: c.Tests.$NAME
message: >-
  `pytest.$NAME` in a test module: read the enum or exception through the
  flext-tests facade `c.Tests.$NAME`.
