# FLEXT law (operator order 2026-10-24, ADR-028): a test module is an ordinary
# module of its tier; it reaches pytest only through the flext-tests facades.
# flext-tests, the pytest plugin, is layer zero for pytest and publishes
# pytest's public names one-to-one: callables and namespaces
# (`mark`, `raises`, `fixture`, `param`, `fail`, ...) under `u.Tests`, classes
# (`MonkeyPatch`, `FixtureRequest`, `TempPathFactory`, ...) under `t.Tests`.
# The mapping is derived from the name's own case (pytest's public naming),
# never from a list. `conftest.py` and `tests/fixtures/**` keep the tests-tier
# delta and import pytest directly.
#
# Activation: the three documents stay `severity: off` until flext-tests
# publishes pytest's public names under u.Tests/t.Tests; the commit that
# consumes that surface flips them to `error`, so `make mod` never rewrites a
# test to a member that does not exist yet.
#
# Autofix order: this rule rewrites references only; the import-header stage
# binds the missing `t`/`u` letters, and retire-pytest-import drops the import
# once no bare `pytest` reference remains.
id: rewire-pytest-callable-to-tests-facade
language: python
severity: off
files:
  - "tests/**/*.py"
ignores:
  - "**/conftest.py"
  - "tests/fixtures/**"
rule:
  kind: attribute
  all:
    - has:
        field: object
        kind: identifier
        regex: "^pytest$"
    - has:
        field: attribute
        pattern: $NAME
constraints:
  NAME:
    regex: "^[a-z_][a-z0-9_]*$"
fix: u.Tests.$NAME
message: >-
  `pytest.$NAME` in a test module: read it through the flext-tests facade
  `u.Tests.$NAME`.
---
id: rewire-pytest-type-to-tests-facade
language: python
severity: off
files:
  - "tests/**/*.py"
ignores:
  - "**/conftest.py"
  - "tests/fixtures/**"
rule:
  kind: attribute
  all:
    - has:
        field: object
        kind: identifier
        regex: "^pytest$"
    - has:
        field: attribute
        pattern: $NAME
constraints:
  NAME:
    regex: "^[A-Z][A-Za-z0-9]*$"
fix: t.Tests.$NAME
message: >-
  `pytest.$NAME` in a test module: read the type through the flext-tests
  facade `t.Tests.$NAME`.
---
id: retire-pytest-import
language: python
severity: off
files:
  - "tests/**/*.py"
ignores:
  - "**/conftest.py"
  - "tests/fixtures/**"
rule:
  pattern: import pytest
  inside:
    kind: module
    not:
      has:
        stopBy: end
        kind: identifier
        regex: "^pytest$"
        not:
          any:
            - inside:
                kind: import_statement
                stopBy: end
            - inside:
                kind: attribute
                field: object
fix: ""
message: >-
  `import pytest` in a test module: pytest is reached through the flext-tests
  facades (`u.Tests`, `t.Tests`).
