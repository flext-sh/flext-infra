# Collection-size raw asserts rewired to the tm native truth criterion.
#
# Family law, guard, and exclusions are documented in
# rewire-test-assert-comparison.yml; this file adds the length shapes:
# Each fix retains the original len call and comparison as the matcher subject,
# preserving evaluation order and Python comparison semantics.
#
# The current patterns constrain the bound to an integer literal. The comparison
# documents exclude `len(...)` subjects, so the two families stay disjoint.
id: rewire-test-assert-len-eq
language: Python
severity: error
metadata:
  context:
    A:
      is: emitted-symbol
      arg: tm flext_tests tm
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - pattern: "assert len($A) == $N"
    - not:
        has:
          nthChild: 2
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - inside:
        kind: module
        stopBy: end
        has:
          matches: tm-imported-from-flext
          stopBy: end
constraints:
  N:
    regex: "^\\d+$"
fix: tm.that(len($A) == $N, truth=True)
message: Assert the collection size through the tm length criterion.
