id: rewire-typing-adapter-factories
language: python
severity: error
files:
  - "src/**/*.py"
  - "tests/**/*.py"
  - "examples/**/*.py"
  - "scripts/**/*.py"
# The called attribute is narrowed before the module-wide import anchor, so
# only adapter-factory calls pay for it.
rule:
  all:
    - pattern: $TYPES.$FACTORY($$$ARGS)
    - has:
        field: function
        has:
          field: attribute
          regex: "^[a-z][a-z0-9_]*_adapter$"
    - inside:
        kind: module
        stopBy: end
        has:
          stopBy: end
          matches: u-imported-from-flext
constraints:
  TYPES:
    regex: "^(?:t|Flext[A-Za-z0-9]*Types)$"
  FACTORY:
    regex: "^[a-z][a-z0-9_]*_adapter$"
fix: u.$FACTORY($$$ARGS)
message: Adapter factories belong to the utilities facade, not type declarations.
