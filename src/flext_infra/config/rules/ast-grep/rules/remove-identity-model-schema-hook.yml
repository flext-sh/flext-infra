# A concrete model already owns this exact schema. Remove the redundant callback.
id: remove-identity-model-schema-hook
language: Python
severity: error
files: ["**/*.py"]
rule:
  all:
  - matches: typing-annotated-form
  - any:
    - pattern: |-
        $FORM[$OWNER.$TYPE, m.GetPydanticSchema(lambda $SOURCE, $HANDLER: $HANDLER.generate_schema($OWNER.$TYPE))]
    - pattern:
        context: |-
          value: $FORM[$OWNER.$TYPE, m.GetPydanticSchema(lambda $SOURCE, $HANDLER: $HANDLER.generate_schema($OWNER.$TYPE))]
        selector: generic_type
  - inside:
      kind: module
      stopBy: end
      has:
        matches: m-imported-from-flext
        stopBy: end
constraints:
  OWNER:
    regex: "^m(?:\\.[A-Z][A-Za-z0-9_]*)*$"
  TYPE:
    kind: identifier
fix: $OWNER.$TYPE
message: The concrete model supplies its native schema directly; remove the identity schema callback.
metadata:
  enforce: [ENFORCE-115]
