# A model field typed by a protocol from `p` carries a runtime dependency, not
# a schema value. Pydantic 2 has no schema path for a protocol and its official
# mechanism for a hook-less type is a field-level `Annotated` marker: the
# flext-core owner `t.Port[P]` validates with `isinstance` on construction and
# assignment and skips the JSON Schema. A bare `p.*` reference in a model field
# annotation either breaks class creation or hides behind
# `arbitrary_types_allowed`, so it is wrapped in `t.Port[...]` where it stands,
# inside unions, mapping values and sequences included.
#
# Scope: annotated assignments written directly in the body of a class whose
# bases name the model owner: an `m.*` preset or family, a `FlextModels*`
# family, an `s[...]` service, or a base whose name ends in `Model` or
# `Settings`. Classes on SDK bases (rope `Project`), plain namespaces,
# protocols and enums are not models and stay untouched. References already
# inside `t.Port[...]`, inside metadata calls (`m.Field(...)`), and inside
# `Callable[...]` signatures or `type[...]`, and type arguments of a generic
# model (`Family.Rule[p.X]`, whose own field owns the port) are left
# untouched: a callable's parameter and return types and a class object are
# never instance-checked, so wrapping them would be wrong. A second pass
# changes nothing.
id: rewire-model-protocol-field-to-port
language: python
severity: error
files:
- "**/*.py"
ignores:
- "**/.git/**"
- "**/.venv/**"
- "**/legado/**"
- "**/legacy/**"
- "**/node_modules/**"
- "**/protocols.py"
- "**/_protocols/**"
- "**/config/rules/ast-grep/tests/**"
rule:
  all:
  - pattern: $PORT
  - any:
    - kind: attribute
      regex: "^p(?:\\.[A-Za-z_][A-Za-z0-9_]*)+$"
      not:
        any:
        - inside:
            kind: attribute
        - inside:
            kind: subscript
            field: value
    - kind: subscript
      has:
        field: value
        kind: attribute
        regex: "^p(?:\\.[A-Za-z_][A-Za-z0-9_]*)+$"
  - not:
      inside:
        stopBy: end
        kind: subscript
        has:
          field: value
          regex: "^t\\.Port$"
  - not:
      inside:
        stopBy: end
        kind: call
  - not:
      inside:
        stopBy: end
        any:
        - kind: subscript
          has:
            field: value
            regex: "(?:^|\\.)(?:Callable|type|Type)$"
        - kind: generic_type
          has:
            kind: identifier
            regex: "^(?:Callable|type|Type)$"
        - kind: subscript
          has:
            field: value
            kind: attribute
            not:
              regex: "^[tp]\\."
  - inside:
      stopBy: end
      kind: type
      inside:
        kind: assignment
        matches: model-field-assignment
        inside:
          kind: expression_statement
          inside:
            kind: block
            inside:
              kind: class_definition
              has:
                field: superclasses
                has:
                  regex: "^(?:m|FlextModels[A-Za-z0-9_]*)\\.|^s\\[|(?:Model|Settings)$"
fix: t.Port[$PORT]
message: >-
  Model field annotation references the protocol `$PORT` bare: wrap it in `t.Port[...]` so the model validates it by `isinstance` without `arbitrary_types_allowed`.
