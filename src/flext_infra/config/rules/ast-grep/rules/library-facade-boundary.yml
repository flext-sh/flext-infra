# A third-party library with an owning FLEXT facade is imported at runtime
# only by its owner; every other package routes through the owner's facade.
# One document per owning distribution, split per library where the
# enforcement catalog names a library rule; `metadata.owner` names the owning distribution,
# whose own rule plan drops the rule. Imports under `if TYPE_CHECKING:` never
# run and are outside the boundary. Configuration (`_config.py`) and settings
# modules are layer-0 of the c/t/p/m/u chain and import their foundation
# libraries directly.
#
# Detection only: the facade member that replaces a direct use is chosen per
# call site.
id: ban-direct-pydantic-import
language: python
severity: error
files:
- "**/*.py"
metadata:
  enforce: [ENFORCE-045]
  owner: flext-core
  context:
    MODULE:
      not: layer-zero-file
rule:
  all:
  - pattern: $MODULE
  - matches: library-import-name
  - regex: "^(?:pydantic|pydantic_core)(?:\\.|$)"
message: >-
  pydantic is owned by flext-core: use m.BaseModel, m.ConfigDict, m.TypeAdapter, m.Field and the other m/t/u facade members, and close a missing member at flext-core.
---
id: ban-direct-structlog-import
language: python
severity: error
files:
- "**/*.py"
metadata:
  enforce: [ENFORCE-094]
  context:
    MODULE:
      not: implementation-owner
      arg: flext_core u.fetch_logger
rule:
  all:
  - pattern: $MODULE
  - matches: library-import-name
  - regex: "^(?:structlog)(?:\\.|$)"
message: >-
  Only the native implementation of the public logging primitive imports structlog; consumers use the canonical utilities logging contract.
---
id: ban-flext-core-library-import
language: python
severity: error
files:
- "**/*.py"
metadata:
  enforce: [ENFORCE-070]
  owner: flext-core
  context:
    MODULE:
      not: layer-zero-file
rule:
  all:
  - pattern: $MODULE
  - matches: library-import-name
  - regex: "^(?:dependency_injector|returns|yaml)(?:\\.|$)"
message: >-
  dependency_injector, returns and yaml are owned by flext-core: route through its c/t/p/m/u facades and close a missing member at flext-core.
---
id: ban-flext-core-settings-library-import
language: python
severity: error
files:
- "**/*.py"
metadata:
  enforce: [ENFORCE-042]
  owner: flext-core
  context:
    MODULE:
      not: layer-zero-file
rule:
  all:
  - pattern: $MODULE
  - matches: library-import-name
  - regex: "^(?:pydantic_settings)(?:\\.|$)"
message: >-
  pydantic_settings is owned by flext-core: only settings modules declare `class X(FlextSettings, BaseSettings)`; every other module uses the settings facade.
