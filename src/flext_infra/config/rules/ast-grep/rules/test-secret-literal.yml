# Test-tier credentials are generated, never written into the source
# (bandit B105/B106/B107 at their root cause; no `nosec`, no bandit
# configuration). A credential literal (`secret-literal-value`) in a
# credential position (`secret-credential-slot`) becomes
# `secrets.token_urlsafe()`, so each run uses a fresh value that no reader
# can reuse.
#
# A value that repeats is one value: when a later statement of the same
# function gives or asserts the same literal, test-secret-literal-bind binds
# it once to a local named after its key and test-secret-literal-reuse reads
# that binding at every occurrence. A literal an assertion of another
# function compares stays: a per-file rewrite cannot keep that assertion
# true, so the native scan reports it as residue for its owner.
#
# Fixtures (`conftest.py`, scenario data) publish their values to other
# modules, whose assertions a per-file rewrite cannot see; constants modules
# hold identities (field names, wire values) under credential-like names.
# Neither is this rule's input.
#
# Idempotent: a generated value is a call, never a literal, so no rewrite
# matches twice.
id: test-secret-literal
language: python
severity: error
files:
  - "tests/**/*.py"
ignores:
  - "**/conftest.py"
  - "**/tests/fixtures/**"
  - "**/constants.py"
  - "**/_constants/**"
rule:
  all:
    - matches: secret-literal-value
    - pattern: $V
    - matches: secret-credential-slot
    - not: {matches: secret-literal-exempt}
    # An assertion of the module compares the same value.
    - not:
        inside:
          stopBy: end
          kind: module
          has: {stopBy: end, pattern: $V, matches: secret-credential-assertion}
    # Another statement of the function gives or asserts the same value.
    - not:
        inside:
          stopBy: end
          matches: function-body-statement
          any:
            - follows: &repeated-secret
                stopBy: end
                has:
                  stopBy: end
                  pattern: $V
                  any:
                    - matches: secret-credential-slot
                    - matches: secret-credential-assertion
            - precedes: *repeated-secret
    # A sibling credential entry of the same call or dict repeats it.
    - not:
        inside:
          all:
            - any: [{kind: pair}, {kind: keyword_argument}]
            - any:
                - follows: &sibling-secret
                    stopBy: end
                    has: {pattern: $V, matches: secret-credential-slot}
                - precedes: *sibling-secret
message: >-
  Test credentials are generated (`secrets.token_urlsafe()`), never literals.
fix: secrets.token_urlsafe()
---
# Binds a credential literal that later statements of the same function give
# or assert again: `$KEY = secrets.token_urlsafe()` is inserted before the
# first statement that gives it, named after the dict key or keyword that
# gives it; test-secret-literal-reuse then reads the binding at every
# occurrence. A function that already binds that name keeps its literal for
# its owner.
#
# Idempotent: once the binding precedes the statement the rule no longer
# matches.
id: test-secret-literal-bind
language: python
severity: error
files:
  - "tests/**/*.py"
ignores:
  - "**/conftest.py"
  - "**/tests/fixtures/**"
  - "**/constants.py"
  - "**/_constants/**"
rule:
  all:
    - matches: function-body-statement
    - pattern: $STMT
    - has:
        stopBy: end
        all:
          - matches: secret-literal-producer
          - inside:
              stopBy: end
              matches: function-body-statement
              precedes: &repeated-secret-value
                stopBy: end
                has:
                  stopBy: end
                  pattern: $V
                  any:
                    - matches: secret-credential-slot
                    - matches: secret-credential-assertion
              not:
                any:
                  - follows: *repeated-secret-value
                  - follows:
                      stopBy: end
                      kind: expression_statement
                      has:
                        kind: assignment
                        pattern: $KEY = secrets.token_urlsafe()
          - not:
              inside:
                stopBy: end
                kind: function_definition
                has:
                  stopBy: end
                  kind: identifier
                  pattern: $KEY
                  matches: name-binding
message: >-
  A repeated test credential is generated once into a local binding.
fix: |-
  $KEY = secrets.token_urlsafe()
  $STMT
---
# Reads the binding test-secret-literal-bind introduced: every occurrence of
# the bound credential literal, where the function gives or asserts it from
# the binding statement on, becomes the binding's name.
id: test-secret-literal-reuse
language: python
severity: error
files:
  - "tests/**/*.py"
ignores:
  - "**/conftest.py"
  - "**/tests/fixtures/**"
  - "**/constants.py"
  - "**/_constants/**"
rule:
  all:
    - matches: secret-literal-value
    - pattern: $V
    - any:
        - matches: secret-credential-slot
        - matches: secret-credential-assertion
    - not: {matches: secret-literal-exempt}
    # The statement giving it under `$KEY`, once bound, or a later one.
    - inside:
        stopBy: end
        matches: function-body-statement
        any:
          - all: &bound-secret-statement
              - has: {stopBy: end, matches: secret-literal-producer}
              - follows:
                  stopBy: end
                  kind: expression_statement
                  has:
                    kind: assignment
                    pattern: $KEY = secrets.token_urlsafe()
          - follows:
              stopBy: end
              matches: function-body-statement
              all: *bound-secret-statement
message: >-
  A repeated test credential reads its generated local binding.
fix: $KEY
---
# Binds the `secrets` module the credential rewrites call. Anchored on the
# mandatory `from __future__ import annotations`, the import lands in the
# module's import block, where the import law orders it.
#
# Idempotent: once the module binds `secrets` the rule no longer matches.
id: test-secret-literal-import
language: python
severity: error
files:
  - "tests/**/*.py"
rule:
  all:
    - pattern: from __future__ import annotations
    - inside:
        kind: module
        all:
          - has:
              stopBy: end
              kind: call
              has:
                field: function
                kind: attribute
                has: {field: object, regex: '^secrets$'}
          - not:
              has:
                stopBy: end
                kind: identifier
                regex: '^secrets$'
                matches: name-binding
message: >-
  A module that generates test credentials binds the `secrets` module.
fix: "from __future__ import annotations\n\nimport secrets"
