# Pydantic dumps without computed fields natively: `model_dump` and
# `model_dump_json` take `exclude_computed_fields=True`, and the flext-core
# `p.BaseModel` protocol declares it. Rebuilding the exclusion from the class
# (`exclude=set(type(x).model_computed_fields)`) reads class-level Pydantic
# metadata through `type(...)` of an instance that is typed by its protocol, so
# the type checker cannot see the attribute, and it duplicates what the native
# keyword already does.
id: rewire-computed-field-exclude-to-native
language: python
severity: error
files:
  - "**/*.py"
rule:
  kind: keyword_argument
  all:
    - has:
        field: name
        regex: "^exclude$"
    - has:
        field: value
        pattern: set(type($OWNER).model_computed_fields)
  inside:
    kind: call
    stopBy: end
    has:
      field: function
      kind: attribute
      has:
        field: attribute
        regex: "^model_dump(?:_json)?$"
fix: exclude_computed_fields=True
message: >-
  Dump without computed fields through the native keyword
  `exclude_computed_fields=True`, not by rebuilding the exclusion from
  `type(...).model_computed_fields`.
