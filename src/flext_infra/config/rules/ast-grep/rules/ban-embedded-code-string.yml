# FLEXT law (operator order 2026-10-24): long source code written as a string
# constant — in a constants family, inline, or in tests — is a grave violation.
# A program kept in string literals escapes every gate the repository applies to
# code (lint, format, type, the declarative rule catalog), duplicates fixtures
# between tests, and hides its contract inside a literal nobody can review.
#
# Shape detected: an implicitly concatenated string whose fragments carry three
# or more line breaks, i.e. a multi-line program or file body assembled one line
# per literal. Single messages split by the formatter and two-line strings are
# not programs and stay outside the rule.
#
# No token fix: the body moves to a fixture data file owned by the tests tier
# (tests/fixtures/), loaded through the shared fixture owner; the relocation
# derives the file name from the test that consumes it.
id: ban-embedded-code-string
language: python
severity: error
files:
  - "**/*.py"
rule:
  kind: concatenated_string
  regex: '(?s)(\\n["''].*){3,}'
message: >-
  Multi-line source embedded as a string literal: a program or file body is
  declared as a constant instead of living in a fixture file.
note: >-
  Where: this concatenated string. Why: FLEXT law — code kept in literals
  bypasses every lint/type/rule gate and duplicates fixtures; it is a grave
  violation in constants, inline code and tests alike. How: move the body to a
  fixture data file under the project's tests/fixtures/ tree, expose it through
  the shared fixture owner (conftest / tm fixtures), and have the test receive
  the loaded text or path from that fixture; production code reads such bodies
  from its declared template or config owner, never from a literal.
