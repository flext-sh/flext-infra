# Binds `ClassVar` for the pydantic-model-config rewrites. The annotation is
# resolved by pydantic at class creation, so the name must be bound at module
# runtime level (a TYPE_CHECKING import would leave it unbound).
#
# Only the module-level `from typing import ...` is extended, and only in
# modules that declare an unannotated model_config assignment.
#
# Idempotent: once `ClassVar` is imported the rule no longer matches.
id: pydantic-model-config-classvar-import
language: python
severity: error
files:
  - "**/*.py"
rule:
  all:
    - pattern: "from typing import $$$NAMES"
    - not:
        has:
          stopBy: end
          kind: dotted_name
          regex: "^ClassVar$"
    - inside:
        kind: module
        has:
          stopBy: end
          matches: pydantic-model-config-assignment
fix: "from typing import ClassVar, $$$NAMES"
message: >-
  Modules declaring unannotated model_config assignments bind ClassVar at
  module level.
