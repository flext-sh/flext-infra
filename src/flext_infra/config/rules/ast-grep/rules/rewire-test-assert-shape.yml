    A:
      is: emitted-symbol
      arg: tm flext_tests tm
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - pattern: "assert $A.startswith($P)"
    - not:
        has:
          nthChild: 2
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - inside:
        kind: module
        stopBy: end
        has:
          matches: tm-imported-from-flext
          stopBy: end
fix: tm.that($A.startswith($P), truth=True)
message: Assert the string prefix through the tm matcher facade.
