# A module that declares a public top-level class while assigning an empty
# __all__ publishes nothing: the generated lazy init exports no name and every
# consumer silently loses the class (measured on ai-hub 2026-10-24: 28 modules).
# The generator is right; the empty declaration is the defect.
#
# 1. declare-empty-all-single-class-alias: the only top-level class and the
#    module-level short alias bound to it are published together, the lazy-init
#    convention (`__all__: list[str] = ["FlextInfraModels", "m"]`).
# 2. declare-empty-all-single-class: the only top-level class is published.
# 3. ban-empty-all-with-public-classes: several top-level classes need an owner
#    decision, so the empty declaration is reported without a fix.
id: declare-empty-all-single-class-alias
language: python
severity: error
utils:
  empty-all:
    kind: expression_statement
    inside:
      kind: module
    has:
      kind: assignment
      all:
        - has:
            field: left
            regex: ^__all__$
        - has:
            field: right
            regex: ^(?:\(\s*\)|\[\s*\])$
  decorated-class:
    kind: decorated_definition
    has:
      field: definition
      kind: class_definition
rule:
  matches: empty-all
  inside:
    kind: module
    all:
      - has:
          kind: class_definition
          has:
            field: name
            regex: ^[A-Za-z]
            pattern: $NAME
          not:
            any:
              - follows:
                  stopBy: end
                  kind: class_definition
              - precedes:
                  stopBy: end
                  kind: class_definition
      - has:
          kind: expression_statement
          has:
            kind: assignment
            all:
              - has:
                  field: left
                  kind: identifier
                  pattern: $ALIAS
              - has:
                  field: right
                  kind: identifier
                  pattern: $NAME
      - not:
          has:
            matches: decorated-class
fix: '__all__: list[str] = ["$NAME", "$ALIAS"]'
message: >-
  `__all__` is empty while the module declares the public class `$NAME`
  and its alias `$ALIAS`: the generated lazy init exports nothing.
note: >-
  Where: this module's `__all__`. Why: an empty declaration hides the class
  and its alias from the generated lazy exports. How: `make mod` publishes the
  class and its alias.
---
id: declare-empty-all-single-class
language: python
severity: error
utils:
  empty-all:
    kind: expression_statement
    inside:
      kind: module
    has:
      kind: assignment
      all:
        - has:
            field: left
            regex: ^__all__$
        - has:
            field: right
            regex: ^(?:\(\s*\)|\[\s*\])$
  decorated-class:
    kind: decorated_definition
    has:
      field: definition
      kind: class_definition
rule:
  matches: empty-all
  inside:
    kind: module
    all:
      - has:
          kind: class_definition
          has:
            field: name
            regex: ^[A-Za-z]
            pattern: $NAME
          not:
            any:
              - follows:
                  stopBy: end
                  kind: class_definition
              - precedes:
                  stopBy: end
                  kind: class_definition
      - not:
          has:
            kind: expression_statement
            has:
              kind: assignment
              all:
                - has:
                    field: left
                    kind: identifier
                - has:
                    field: right
                    kind: identifier
                    pattern: $NAME
      - not:
          has:
            matches: decorated-class
fix: '__all__: list[str] = ["$NAME"]'
message: >-
  `__all__` is empty while the module declares the public class `$NAME`:
  the generated lazy init exports nothing.
note: >-
  Where: this module's `__all__`. Why: an empty declaration hides the class
  from the generated lazy exports. How: `make mod` publishes the class.
