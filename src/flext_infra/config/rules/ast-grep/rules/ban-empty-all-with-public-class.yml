id: ban-empty-all-with-public-classes
language: python
severity: error
utils:
  empty-all:
    kind: expression_statement
    inside:
      kind: module
    has:
      kind: assignment
      all:
        - has:
            field: left
            regex: ^__all__$
        - has:
            field: right
            regex: ^(?:\(\s*\)|\[\s*\])$
  public-class:
    any:
      - kind: class_definition
        has:
          field: name
          regex: ^[A-Za-z]
      - kind: decorated_definition
        has:
          field: definition
          kind: class_definition
          has:
            field: name
            regex: ^[A-Za-z]
  any-class:
    any:
      - kind: class_definition
      - kind: decorated_definition
        has:
          field: definition
          kind: class_definition
rule:
  matches: empty-all
  inside:
    kind: module
    has:
      matches: public-class
      any:
        - follows:
            stopBy: end
            matches: any-class
        - precedes:
            stopBy: end
            matches: any-class
        - kind: decorated_definition
message: >-
  `__all__` is empty while the module declares public top-level classes: the
  generated lazy init exports nothing.
note: >-
  Where: this module's `__all__`. Why: an empty declaration hides every class
  from the generated lazy exports. How: list the published classes (one owner
  class per module) in `__all__`.
