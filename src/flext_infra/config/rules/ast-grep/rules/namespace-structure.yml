# FLEXT namespace structure and import laws that need project facts
# (enforcement catalog ENFORCE-006, -012, -014 and the namespace validator's
# import, structure and contract laws).
#
# Each document matches one file's syntax and names the project file scopes
# its verdict holds in under metadata.scope (the runtime import graph is the
# ENFORCE-006 graph gate of mod and check, codemod_import_cycle_issues): the
# facade modules, the facades whose nested namespace misses a family class
# (incomplete-composition-), the modules of each class-stem group
# (class-stem-), the packages lacking a layer (lacks-layer-) and the family
# packages without base.py. The project's generated provider derives those
# file sets from the project and its tooling configuration; no package,
# module or alias name is listed here.

# ENFORCE-012: a facade's nested namespace composes, through its bases, every
# class its family package (`_<stem>/` beside `<stem>.py`) declares in
# __all__.
id: require-facade-mro-completeness
language: python
severity: error
files:
  - "**/*.py"
metadata:
  enforce: [ENFORCE-012]
  scope:
    partition:
      variable: NAME
      holds: true
      selectors: incomplete-composition-
rule:
  kind: class_definition
  has:
    field: name
    pattern: $NAME
  inside:
    kind: block
    inside:
      kind: class_definition
      inside:
        kind: module
message: >-
  Facade namespace `$NAME` does not compose every class its family package
  declares: add the missing mixins to its bases.
---
# ENFORCE-014: the package publishes every canonical layer. The layers a
# package always provides are named here; the service layers are required
# together (require-service-facade-layers).
id: require-canonical-facade-family
language: python
severity: error
files:
  - "src/*/__init__.py"
metadata:
  enforce: [ENFORCE-014]
  scope:
    in:
      - lacks-layer-settings
      - lacks-layer-config
      - lacks-layer-c
      - lacks-layer-t
      - lacks-layer-p
      - lacks-layer-m
      - lacks-layer-u
      - lacks-layer-cli
rule:
  kind: identifier
  pattern: $NAME
  regex: "^__all__$"
  inside:
    kind: assignment
    field: left
    inside:
      kind: expression_statement
      inside:
        kind: module
message: >-
  The package does not provide every canonical layer (settings, config, the
  c/t/p/m/u facades, cli): add the missing facade module.
---
# A package with a services layer also provides its base and api facades.
id: require-service-facade-layers
language: python
severity: error
files:
  - "src/*/__init__.py"
ignores:
  # The rule owns the package ROOT facade only. Private-layer namespaces
  # (src/<pkg>/_*/__init__.py) are internal nesting, not the facade, and the
  # generated lazy-init __all__ there is the generator's, judged by gen.
  - "src/*/_*/__init__.py"
  - "src/*/_*/**/__init__.py"
metadata:
  scope:
    in: [lacks-layer-base, lacks-layer-api]
    not-in: [lacks-layer-services]
rule:
  kind: identifier
  pattern: $NAME
  regex: "^__all__$"
  inside:
    kind: assignment
    field: left
    inside:
      kind: expression_statement
      inside:
        kind: module
message: >-
  A package with services provides its base and api facades.
---
# A private family package begins with base.py.
id: require-family-base-module
language: python
severity: error
files:
  - "src/**/_*/*.py"
metadata:
  scope:
    in: [family-without-base]
rule:
  kind: identifier
  pattern: $NAME
  regex: "^__all__$"
  inside:
    kind: assignment
    field: left
    inside:
      kind: expression_statement
      inside:
        kind: module
message: >-
  The family package holding this module has no base.py: the family begins
  with its base module.
---
# Imports of the own package keep their names: an alias renames a published
# facade or module for one file. Under TYPE_CHECKING, binding one of the
# project's runtime letters to its facade class is the canonical letter
# binding (operator-ruling-2026-10-01-facade-rebind-mypy-scope): a facade that
# rebinds its letter leaves mypy the upstream binding, so static analyzers
# receive the class itself. The branch captures the letter as $LETTER, which
# matches only when it is not one of the project's runtime aliases.
id: ban-local-import-alias
language: python
severity: error
files:
  - "**/*.py"
constraints:
  MODULE:
    matches: own-package
  LETTER:
    not:
      matches: local-alias
rule:
  kind: aliased_import
  not:
    all:
      - has:
          field: name
          pattern: $NAME
      - has:
          field: alias
          pattern: $NAME
      - inside:
          kind: import_from_statement
  any:
    - not:
        matches: inside-type-checking-guard
      any:
        - inside:
            kind: import_from_statement
            has:
              field: module_name
              pattern: $MODULE
        - has:
            field: name
            pattern: $MODULE
    - matches: inside-type-checking-guard
      has:
        field: alias
        pattern: $LETTER
      any:
        - inside:
            kind: import_from_statement
            has:
              field: module_name
              pattern: $MODULE
        - has:
            field: name
            pattern: $MODULE
message: >-
  Local import aliases are forbidden: import the own package's names as
  published.
---
# The module's class carries the project class stem (Tests + stem in tests).
id: require-project-class-stem
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/__init__.py"
  - "**/__main__.py"
  - "**/__version__.py"
  - "**/conftest.py"
metadata:
  scope:
    partition:
      variable: NAME
      holds: true
      matching: false
      selectors: class-stem-
      pattern: "^(?:{alternatives})"
rule:
  kind: class_definition
  has:
    field: name
    pattern: $NAME
  any:
    - inside:
        kind: module
    - inside:
        kind: decorated_definition
        inside:
          kind: module
  not:
    follows:
      stopBy: end
      any:
        - kind: class_definition
        - kind: decorated_definition
message: >-
  Module class `$NAME` does not carry the project class stem.
---
# A module declares its class: a module without a class, an export manifest
# or an entry-point guard holds loose code.
id: require-module-class
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/__init__.py"
  - "**/__main__.py"
  - "**/__version__.py"
  - "**/conftest.py"
rule:
  kind: module
  not:
    any:
      - has:
          kind: class_definition
      - has:
          kind: decorated_definition
      - has:
          kind: if_statement
      - has:
          kind: raise_statement
      - has:
          kind: expression_statement
          has:
            kind: call
            has:
              field: function
              regex: "(?:^|\\.)main$"
      - has:
          kind: expression_statement
          has:
            kind: assignment
            has:
              field: left
              regex: "^__all__$"
message: >-
  Module declares no class: nest its code in the module's facade class.
metadata:
  enforce: [ENFORCE-067]
---
# A facade class extends the owner it specializes.
id: require-facade-base
language: python
severity: error
files:
  - "**/*.py"
metadata:
  scope:
    in: [facade-module]
rule:
  kind: class_definition
  has:
    field: name
    pattern: $NAME
  not:
    has:
      field: superclasses
      pattern: $_
  inside:
    kind: module
message: >-
  Facade class `$NAME` must extend its declared owner.
---
# A facade composes one local namespace.
id: ban-facade-second-namespace
language: python
severity: error
files:
  - "**/*.py"
metadata:
  scope:
    in: [facade-module]
rule:
  kind: class_definition
  has:
    field: name
    pattern: $NAME
  inside:
    kind: block
    inside:
      kind: class_definition
      inside:
        kind: module
  follows:
    stopBy: end
    kind: class_definition
message: >-
  Facade composes a second namespace `$NAME`: a facade composes one local
  namespace.
---
# Service constructors receive protocols, never concrete FLEXT classes.
id: ban-concrete-service-dependency
language: python
severity: error
files:
  - "src/*/services/**/*.py"
rule:
  kind: identifier
  regex: "^Flext\\w+$"
  not:
    inside:
      kind: attribute
      field: attribute
  inside:
    kind: type
    stopBy: end
    inside:
      any:
        - kind: typed_parameter
        - kind: typed_default_parameter
      inside:
        kind: parameters
        inside:
          kind: function_definition
          has:
            field: name
            regex: "^__init__$"
message: >-
  Service dependency is a concrete class: inject it through a `p` protocol.
---
# Dependencies are injected, never looked up.
id: ban-service-locator-call
language: python
severity: error
files:
  - "**/*.py"
rule:
  kind: call
  has:
    field: function
    any:
      - kind: identifier
        regex: "^(?:container|get_service|locator|resolve_service|service_locator)$"
      - kind: attribute
        has:
          field: attribute
          regex: "^(?:container|get_service|locator|resolve_service|service_locator)$"
message: >-
  Service locator call: inject the dependency's `p` contract instead.
---
# Annotations use the typed vocabulary: no Any, Optional, object or bare dict.
# Names inside a call (a field factory such as `default_factory=dict`) are
# values, not annotations.
#
# Named owners declare the vocabulary itself and are out of scope: the typings
# SSOT files define the canonical alias spellings (`type JsonDict =
# dict[str, ...]`) every consumer must reference — flagging the definition
# site would ban the vocabulary. Dunder comparison/equality methods keep
# their LSP-required `object` parameter (mypy rejects the narrowed @override
# signature), so parameter annotations of those dunders are exempt too.
id: ban-broad-annotation
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/flext_core/_typings/base.py"
  - "**/flext_core/typings.py"
rule:
  kind: identifier
  regex: "^(?:Any|Optional|object|dict)$"
  not:
    any:
      - inside:
          kind: call
          stopBy:
            kind: type
      - inside:
          kind: parameters
          stopBy: end
          inside:
            kind: function_definition
            has:
              field: name
              regex: "^__(?:eq|ne|hash|contains|lt|le|gt|ge)__$"
  inside:
    kind: type
    stopBy: end
message: >-
  Broad annotation: type through the `t` aliases and `p` protocols (no Any,
  Optional, object or dict).
metadata:
  enforce: [ENFORCE-016, ENFORCE-105]
