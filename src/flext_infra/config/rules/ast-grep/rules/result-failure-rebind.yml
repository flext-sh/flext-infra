---
id: result-directory-native-failure
language: python
severity: error
message: Directory compensation retains the initiating failure and exact effect receipt.
metadata:
  context:
    CALL:
      is: resolved-symbol
      arg: flext_infra.codegen._codegen_transaction_recovery FlextInfraCodegenTransactionRecovery._compensate_directory_persistence
constraints:
  RESULT:
    kind: identifier
  CONTEXT:
    kind: string
    not:
      has:
        kind: call
        stopBy: end
rule:
  pattern: $CALL($LAYOUT, $CREATED, $RESULT.error or $CONTEXT, journal_write=$WRITE)
  inside:
    pattern: |
      if $RESULT.failure:
          $$$BODY
    stopBy: end
    not:
      has:
        pattern: $RESULT = $VALUE
        stopBy: end
fix: $CALL($LAYOUT, $CREATED, $RESULT, journal_write=$WRITE, context=$RESULT.error or $CONTEXT)
---
id: result-recovery-authored-cause
language: python
severity: error
message: Construct a native failure for an authored transaction rejection before recovery.
metadata:
  context:
    CALL:
      is: resolved-symbol
      arg: flext_infra.codegen._codegen_transaction_recovery FlextInfraCodegenTransactionRecovery._recover_failure
constraints:
  CONTEXT:
    any:
      - kind: string
      - kind: concatenated_string
    not:
      has:
        kind: call
        stopBy: end
rule:
  pattern: $CALL($LAYOUT, $CONTEXT)
fix: $CALL($LAYOUT, r[bool].fail($CONTEXT))
