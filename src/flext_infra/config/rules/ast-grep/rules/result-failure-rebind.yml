id: result-failure-rebind
language: python
severity: error
message: >-
  Preserve the complete failure inside its proven failure guard by rebinding it
  instead of rebuilding it from error text.
rule:
  pattern: r[$TYPE].fail($RESULT.error or $FALLBACK)
  inside:
    pattern: |
      if $RESULT.failure:
          $$$BODY
    stopBy: end
constraints:
  RESULT:
    kind: identifier
fix: r[$TYPE].from_failure($RESULT)
---
id: result-recovery-native-failure
language: python
severity: error
message: Pass the native failure to its resolved recovery owner, retaining context separately.
metadata:
  context:
    CALL:
      is: resolved-symbol
      arg: flext_infra.codegen._codegen_transaction_recovery FlextInfraCodegenTransactionRecovery._recover_failure
constraints:
  RESULT:
    kind: identifier
  CONTEXT:
    kind: string
    not:
      has:
        kind: call
        stopBy: end
rule:
  any:
    - pattern: $CALL($LAYOUT, $RESULT.error or $CONTEXT)
    - pattern: $CALL($LAYOUT, $RESULT.error or $CONTEXT, exception=$RESULT.exception, error_code=$RESULT.error_code, error_data=$RESULT.error_data)
  inside:
    pattern: |
      if $RESULT.failure:
          $$$BODY
    stopBy: end
    not:
      has:
        pattern: $RESULT = $VALUE
        stopBy: end
fix: $CALL($LAYOUT, $RESULT, context=$RESULT.error or $CONTEXT)
---
