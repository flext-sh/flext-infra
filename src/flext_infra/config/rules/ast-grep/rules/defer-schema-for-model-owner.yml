# ADR-018 amendment 2026-11-03 (deferred schema owner): the model a protocol-typed
# field delegates its schema to is passed as a zero-argument callable, resolved when
# the schema is generated. An eager owner is evaluated with the annotation; inside a
# holder the owner names the holder still being defined, so the field stays
# incomplete at class creation and a subclass in another module must re-resolve it
# in its own namespace (measured: DepsToml.MemberRequirements, `p` undefined).
# Deferring the same expression changes no validation, serialization or JSON Schema.
# Idempotent: a lambda owner does not match. Only a qualified owner (`m.X`,
# `Holder.X`) is rewritten: a bare name may be a class-local sibling, which a
# lambda cannot see (class scope), so deferring it would raise NameError.
id: defer-schema-for-model-owner
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/config/rules/ast-grep/tests/**"
rule:
  pattern: t.schema_for_model($OWNER)
constraints:
  OWNER:
    kind: attribute
fix: 't.schema_for_model(lambda: $OWNER)'
message: >-
  The schema owner is deferred: t.schema_for_model(lambda: Model) keeps the field
  complete at class creation (ADR-018 amendment 2026-11-03).
