# Pydantic declaration law (pydantic-development skill, operator order
# 2026-10-24): model configuration is a typed `ConfigDict` owned by the `m.*`
# presets. Every rule here carries a fix or a zero-occurrence detection so
# `make mod` stays at a green fixed point.
#
# `model_config` is a `ConfigDict`; a raw dict bypasses the typed key set. The
# dict literal is rewritten to the equivalent `m.ConfigDict(key=value, ...)`
# call (each string-keyed pair becomes a keyword argument). A module that does
# not bind `m` yet receives it from the generated import-header rule of its
# declaring package in the same `make mod` fixed point, and the
# pydantic-model-config-*-classvar rules add the `ClassVar[...]` annotation.
# The models family itself (still assembling `m`) and layer zero (which imports
# no own-namespace object) are scoped out and reported by the companion rule.
id: rewire-raw-model-config-dict
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
metadata:
  scope:
    not-in: [ facade-family-m, layer-zero ]
rule:
  all:
    - kind: assignment
    - has:
        field: left
        regex: ^model_config$
    - has:
        field: right
        kind: dictionary
        pattern: $DICT
rewriters:
  - id: string-pair-to-keyword
    rule:
      kind: pair
      all:
        - has:
            field: key
            kind: string
            pattern: $KEY
        - has:
            field: value
            pattern: $VALUE
    transform:
      NAME:
        replace:
          source: $KEY
          replace: "^[\"'](?<name>[A-Za-z_][A-Za-z0-9_]*)[\"']$"
          by: "$name"
    fix: $NAME=$VALUE
transform:
  KEYWORDS:
    rewrite:
      rewriters: [string-pair-to-keyword]
      source: $DICT
  KWARGS:
    replace:
      source: $KEYWORDS
      replace: "(?s)^\\{\\s*(?<body>.*?)\\s*,?\\s*\\}$"
      by: "$body"
fix: "model_config = m.ConfigDict($KWARGS)"
message: >-
  `model_config` as a raw dict skips the typed `ConfigDict` contract; it becomes
  `m.ConfigDict(...)`. Prefer inheriting the `m.*` preset that already encodes
  this configuration.
---
# Detection-only companion: a raw `model_config` dict inside the models family
# or layer zero, where the `m` facade is not yet available. The typed form there
# is pydantic's own `ConfigDict` bound by the family's foundation owner, or the
# inherited `m.*` preset; which one applies is the owner's decision.
id: rewire-raw-model-config-dict-in-foundation
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
metadata:
  scope:
    in: [ facade-family-m, layer-zero ]
rule:
  all:
    - kind: assignment
    - has:
        field: left
        regex: ^model_config$
    - has:
        field: right
        kind: dictionary
message: >-
  where: this `model_config` is a raw dict inside the models family or layer
  zero. why: the typed `ConfigDict` contract owns model configuration and `m`
  is not available here. fix: declare `ConfigDict(...)` through the foundation
  owner's binding, or inherit the `m.*` preset that encodes it.
---
# `t.Port[P]` validates the value with `isinstance` (pydantic `InstanceOf`), which
# needs one class. An optional port keeps `None` outside the port so each union
# member owns its own schema and no model needs `arbitrary_types_allowed`.
id: hoist-optional-out-of-port
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
rule:
  pattern: t.Port[$A | None]
fix: t.Port[$A] | None
message: >-
  `t.Port[X | None]` asks `isinstance` to check a union. Write
  `t.Port[X] | None` so the port validates one class and `None` stays a plain
  union member.
