# Sequence abstractions lose concrete list APIs and Pydantic field semantics.
# The exact ListOf alias preserves both; a canonical binding is still required.
id: typing-list-missing-t-import
language: python
severity: error
rule:
  all:
    - matches: typing-list-generic
    - inside:
        stopBy: end
        kind: module
        not:
          has:
            stopBy: end
            matches: t-locally-bound
message: >-
  typing.List must become the exact t.ListOf[T] contract, but a canonical `t`
  binding is not established. Resolve the facade binding before rewriting;
  SequenceOf and MutableSequenceOf are not concrete list replacements.
metadata:
  enforce: [ENFORCE-016]
---
id: typing-list-to-sequence-of
language: python
severity: error
rule:
  all:
    - matches: typing-list-generic
    - pattern: $WHOLE
    - inside:
        stopBy: end
        kind: module
        has:
          stopBy: end
          matches: t-locally-bound
transform:
  NEW:
    replace:
      source: $WHOLE
      replace: "^(?:typing\\.)?List"
      by: "t.ListOf"
fix: $NEW
message: >-
  Replace typing.List with t.ListOf[T], preserving the exact concrete list API,
  mutations and Pydantic field contract rather than a sequence abstraction.
metadata:
  enforce: [ENFORCE-016]
