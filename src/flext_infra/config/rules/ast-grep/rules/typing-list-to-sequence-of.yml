# Sequence abstractions lose concrete list APIs and Pydantic field semantics.
# The native list contract preserves both without an unused facade import.
id: typing-list-to-sequence-of
language: python
severity: error
rule:
  all:
    - matches: typing-list-generic
    - pattern: $WHOLE
transform:
  NEW:
    replace:
      source: $WHOLE
      replace: "^(?:typing\\.)?List"
      by: "list"
fix: $NEW
message: >-
  Replace typing.List with list[T], preserving the exact concrete list API,
  mutations and Pydantic field contract rather than a sequence abstraction.
metadata:
  enforce: [ENFORCE-016, ENFORCE-091, ENFORCE-092]
