# Test law: an assertion that cannot fail against a wrong runtime is deleted,
# not reworded.
#
# ban-test-tautology owns the tautology law and stays detection-only because a
# rewrite cannot choose the outcome the test meant to prove. Two tautology
# shapes, however, prove NOTHING by construction, so the law's action for them
# is removal and this rule applies it mechanically:
#
#   * an owned constant, config or settings value compared with a hardcoded
#     literal (`assert c.Ns.KEY == "value"`, `tm.that(settings.Ns.key, eq=3)`):
#     the assertion restates the SSOT, breaks on every legitimate config
#     change (P0), and proves no behaviour — the lines are removed;
#   * `X.success or X.failure` on one FlextResult: a flext Result is always
#     exactly one of them, so the assertion is always true — removed.
#
# Indeterminate tautologies (call-bearing self-comparisons, isinstance of the
# object just built) stay owned by ban-test-tautology for worker triage: a
# worker either rewrites the scenario against its one observable outcome or
# deletes the whole test. A test whose body this rule empties is itself a
# fake test and is caught by the worker pass and the suite gates.
#
# The owned-facade guard is the same one ban-test-tautology uses: a local
# variable named `c`, `config` or `settings` is the facade only where the
# module imports that name from a FLEXT package or the tests facade.
id: remove-test-own-literal-tautology
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/examples/**/*.py"
  - "**/conftest.py"
utils:
  owned-facade-read:
    kind: attribute
    any:
      - all:
          - regex: '^c\.[A-Za-z_][\w.]*$'
          - inside:
              kind: module
              stopBy: end
              has:
                stopBy: end
                kind: import_from_statement
                regex: '^from\s+(?:flext_\w+|tests)(?:\.\w+)*\s+import\s+[\s\S]*\bc\b'
      - all:
          - regex: '^config\.[A-Za-z_][\w.]*$'
          - inside:
              kind: module
              stopBy: end
              has:
                stopBy: end
                kind: import_from_statement
                regex: '^from\s+(?:flext_\w+|tests)(?:\.\w+)*\s+import\s+[\s\S]*\bconfig\b'
      - all:
          - regex: '^settings\.[A-Za-z_][\w.]*$'
          - inside:
              kind: module
              stopBy: end
              has:
                stopBy: end
                kind: import_from_statement
                regex: '^from\s+(?:flext_\w+|tests)(?:\.\w+)*\s+import\s+[\s\S]*\bsettings\b'
  owned-literal:
    any:
      - kind: string
      - kind: integer
      - kind: float
      - kind: "true"
      - kind: "false"
rule:
  any:
    - all:
        - kind: assert_statement
        - has:
            kind: comparison_operator
            all:
              - has:
                  matches: owned-facade-read
              - has:
                  matches: owned-literal
    - all:
        - pattern: tm.that($OWNED, eq=$LITERAL)
        - has:
            kind: argument_list
            all:
              - has:
                  nthChild: 1
                  matches: owned-facade-read
              - has:
                  kind: keyword_argument
                  all:
                    - has:
                        field: name
                        regex: "^eq$"
                    - has:
                        field: value
                        matches: owned-literal
    - all:
        - any:
            - pattern: $X.success or $X.failure
            - pattern: $X.failure or $X.success
        - inside:
            stopBy: end
            kind: assert_statement
fix: ""
message: >-
  Tautological assertion that proves nothing (an owned SSOT value restated as
  a literal, or success-or-failure on one Result): removed by law — assert a
  real observable outcome instead, or leave the test without this line.
