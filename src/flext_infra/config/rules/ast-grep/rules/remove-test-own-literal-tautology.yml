# Detection-only contract repair, retaining the existing finding ID.
# Owned SSOT/literal comparisons violate P0 but are not logical tautologies:
# correct them against the consumer contract, never erase their failure behavior.
# Result-shaped expressions require receiver identity, purity and evaluation
# evidence before removal. Syntax alone proves none of these, especially inside
# compound assertions or assertions with messages. No automatic fix is declared.
# ban-test-tautology retains the broader detection law; residual findings stay red
# without preventing unrelated safe rewrites through the canonical mod pipeline.
#
# The owned-facade guard is the same one ban-test-tautology uses: a local
# variable named `c`, `config` or `settings` is the facade only where the
# module imports that name from a FLEXT package or the tests facade.
id: remove-test-own-literal-tautology
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/examples/**/*.py"
  - "**/conftest.py"
utils:
  owned-facade-read:
    kind: attribute
    any:
      - all:
          - regex: '^c\.[A-Za-z_][\w.]*$'
          - inside:
              kind: module
              stopBy: end
              has:
                stopBy: end
                kind: import_from_statement
                regex: '^from\s+(?:flext_\w+|tests)(?:\.\w+)*\s+import\s+[\s\S]*\bc\b'
      - all:
          - regex: '^config\.[A-Za-z_][\w.]*$'
          - inside:
              kind: module
              stopBy: end
              has:
                stopBy: end
                kind: import_from_statement
                regex: '^from\s+(?:flext_\w+|tests)(?:\.\w+)*\s+import\s+[\s\S]*\bconfig\b'
      - all:
          - regex: '^settings\.[A-Za-z_][\w.]*$'
          - inside:
              kind: module
              stopBy: end
              has:
                stopBy: end
                kind: import_from_statement
                regex: '^from\s+(?:flext_\w+|tests)(?:\.\w+)*\s+import\s+[\s\S]*\bsettings\b'
  owned-literal:
    any:
      - kind: string
      - kind: integer
      - kind: float
      - kind: "true"
      - kind: "false"
rule:
  any:
    - all:
        - kind: assert_statement
        - has:
            kind: comparison_operator
            all:
              - has:
                  matches: owned-facade-read
              - has:
                  matches: owned-literal
    - all:
        - pattern: tm.that($OWNED, eq=$LITERAL)
        - has:
            kind: argument_list
            all:
              - has:
                  nthChild: 1
                  matches: owned-facade-read
              - has:
                  kind: keyword_argument
                  all:
                    - has:
                        field: name
                        regex: "^eq$"
                    - has:
                        field: value
                        matches: owned-literal
    - all:
        - any:
            - pattern: $X.success or $X.failure
            - pattern: $X.failure or $X.success
        - inside:
            stopBy: end
            kind: assert_statement
message: >-
  Assertion requires contract-driven review: an owned SSOT value compared with
  a literal, or a success-or-failure expression without proven receiver purity.
  Preserve evaluation, meaningful checks and messages; correct the contract
  rather than automatically deleting behavior.
