# Automatic repair of require-field-description: the field gets the canonical
# description derived from its name (`parallel_workers` -> "Parallel workers."),
# the same convention the summary-docstring recipe uses for symbols. Each rule
# owns one declaration shape; a shape none of them covers stays a
# require-field-description finding for authored text.
id: require-field-description-bare
language: python
severity: error
files:
  - "**/models.py"
  - "**/_models.py"
  - "**/_models/**/*.py"
transform:
  WORDS:
    replace:
      source: $NAME
      replace: "_"
      by: " "
  TEXT:
    convert:
      source: $WORDS
      toCase: capitalize
rule:
  all:
    - matches: model-field-assignment
    - pattern: "$NAME: $TYPE"
    - not:
        has:
          field: right
          regex: "."
    - not:
        regex: "\\bdescription\\s*="
    - regex: "^[^\\n]{0,65}$"
constraints:
  TYPE:
    not:
      regex: "^Annotated\\["
fix: '$NAME: $TYPE = m.Field(description="$TEXT.")'
message: Describe the field `$NAME` with its canonical name-derived description.
metadata:
  enforce: [ENFORCE-103]

---
# Long-head sibling of the rule above: when `name: Type` is multi-line or longer
# than 65 columns, `<indent>name: Type = m.Field(` cannot fit the 88-column line
# (88 - 11 for ` = m.Field(` - 12 of class-body indent) and ruff format has no
# stable layout for it. The description then goes into multi-line `Annotated`
# metadata and the value, if any, stays assigned. Same match as the short rule
# with the head-length guard negated: the pair is exclusive and exhaustive.
id: require-field-description-bare-annotated
language: python
severity: error
files:
  - "**/models.py"
  - "**/_models.py"
  - "**/_models/**/*.py"
transform:
  WORDS:
    replace:
      source: $NAME
      replace: "_"
      by: " "
  TEXT:
    convert:
      source: $WORDS
      toCase: capitalize
  BARE:
    replace:
      source: $TYPE
      replace: "^\\(\\s*(?<INNER>[^()#]*[^()#\\s])\\s*\\)$"
      by: "$INNER"
rule:
  all:
    - matches: model-field-assignment
    - pattern: "$NAME: $TYPE"
    - not:
        has:
          field: right
          regex: "."
    - not:
        regex: "\\bdescription\\s*="
    - not:
        regex: "^[^\\n]{0,65}$"
constraints:
  TYPE:
    not:
      regex: "^Annotated\\["
fix: "$NAME: Annotated[\n    $BARE,\n    m.Field(description=\"$TEXT.\"),\n]"
message: Describe the field `$NAME` with its canonical name-derived description.
metadata:
  enforce: [ENFORCE-103]

---
id: require-field-description-default
language: python
severity: error
files:
  - "**/models.py"
  - "**/_models.py"
  - "**/_models/**/*.py"
transform:
  WORDS:
    replace:
      source: $NAME
      replace: "_"
      by: " "
  TEXT:
    convert:
      source: $WORDS
      toCase: capitalize
rule:
  all:
    - matches: model-field-assignment
    - pattern: "$NAME: $TYPE = $DEFAULT"
    - not:
        regex: "\\bdescription\\s*="
    - regex: "^[^\\n=]{0,65}\\s*(?:=|$)"
constraints:
  TYPE:
    not:
      regex: "^Annotated\\["
  DEFAULT:
    not:
      regex: "^m\\.Field\\("
fix: '$NAME: $TYPE = m.Field(default=$DEFAULT, description="$TEXT.")'
message: Describe the field `$NAME` with its canonical name-derived description.
metadata:
  enforce: [ENFORCE-103]

