# Protocol facades describe structural types; only the model facade constructs data.
id: ban-protocol-constructor
language: python
severity: error
files:
  - "**/*.py"
rule:
  any:
    - pattern: p.$MODEL($$$ARGS)
    - pattern: p.$NAMESPACE.$MODEL($$$ARGS)
  inside:
    kind: module
    stopBy: end
    has:
      matches: p-imported-from-flext
      stopBy: end
constraints:
  MODEL:
    regex: "^[A-Z][A-Za-z0-9_]*$"
message: >-
  A p facade member is a Protocol contract, not a constructor. Instantiate the
  matching model through m and keep p for annotations and runtime checks.
