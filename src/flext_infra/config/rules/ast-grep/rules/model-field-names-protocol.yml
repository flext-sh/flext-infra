# A model field holding another family model is typed by its protocol mirror
# and delegates its schema to the owning model: `Annotated[p.<Family>.<Member>,
# t.schema_for_model(lambda: <Holder>.<Member>)]`. The protocol annotation lets
# the field accept the protocol values other models hand out; the deferred
# schema owner keeps validation, parsing and JSON Schema exactly those of the
# model (flext-core `t.schema_for_model`), so nothing is lost at the boundary.
# Matches a holder member (`Flext<Family>Models<Holder>.<Member>`) in a
# class-body field annotation, at any depth of the annotation (containers,
# optionals); construction, class positions and already-converted members are
# left alone. The family derives from the holder's own name. Idempotent: a
# converted member sits inside `t.schema_for_model(...)`, a call.
id: model-field-names-protocol
language: python
severity: error
files:
  - "**/_models/**/*.py"
  - "**/models.py"
ignores:
  - "**/config/rules/ast-grep/tests/**"
rule:
  pattern: $HOLDER.$MEMBER
  not:
    inside:
      kind: attribute
  inside:
    stopBy: end
    kind: type
    inside:
      kind: assignment
      inside:
        kind: expression_statement
        inside:
          kind: block
          inside:
            kind: class_definition
  all:
    - not: { inside: { stopBy: end, kind: call } }
    - not:
        inside:
          stopBy: end
          kind: generic_type
          has: { kind: identifier, regex: "^(type|ClassVar)$" }
constraints:
  HOLDER: { kind: identifier, regex: "^Flext[A-Z][a-z]+Models[A-Za-z0-9_]*$" }
  MEMBER: { regex: "^[A-Z][A-Za-z0-9_]*$" }
transform:
  FAMILY:
    replace:
      source: $HOLDER
      replace: "^Flext([A-Z][a-z]+)Models[A-Za-z0-9_]*$"
      by: "$1"
fix: "Annotated[p.$FAMILY.$MEMBER, t.schema_for_model(lambda: $HOLDER.$MEMBER)]"
message: >-
  A model field holding a family model is typed by its protocol mirror with a
  deferred schema owner.
