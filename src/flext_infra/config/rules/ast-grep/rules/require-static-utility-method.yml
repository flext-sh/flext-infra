# Utilities are stateless: every public method of a utilities-family class is
# a staticmethod or classmethod (properties and overload stubs declare no
# instance behaviour, and an @override implements the instance method its
# framework base declares). A class declared inside a function is local data. A Protocol nested in a utilities module describes a
# structure, not a utility, and a private (underscore) helper class is a
# stateful implementation detail of its utility, not a public utility
# namespace. FlextUtilitiesLogging is the p.Logger protocol
# adapter: fetch_logger returns stateful instances whose bound name and
# structlog logger are the state the protocol's logging methods require.
id: require-static-utility-method
language: python
severity: error
files:
  - "**/utilities.py"
  - "**/_utilities.py"
  - "**/_utilities/**/*.py"
ignores:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/legado/**"
  - "**/legacy/**"
  - "**/node_modules/**"
  - "**/tests/unit/**"
  - "**/tests/integration/**"
  - "**/tests/e2e/**"
rule:
  matches: class-body-method
  has:
    field: name
    pattern: $NAME
  not:
    any:
      - inside:
          kind: decorated_definition
          has:
            kind: decorator
            regex: "^@(?:staticmethod|classmethod|property|(?:[A-Za-z_][A-Za-z0-9_]*\\.)*(?:setter|deleter|cached_property|overload|override))\\b"
      - inside:
          kind: function_definition
          stopBy: end
      - inside:
          kind: class_definition
          stopBy: end
          any:
            - has:
                field: superclasses
                regex: "\\bProtocol\\b"
            - has:
                field: name
                regex: "^(?:_|FlextUtilitiesLogging$)"
message: >-
  Utility method `$NAME` reads instance state: declare it @staticmethod or
  @classmethod.
  Detection only: the method reads instance state; methods that never read self are repaired by the make fix static-method recipe (no-self-use).
