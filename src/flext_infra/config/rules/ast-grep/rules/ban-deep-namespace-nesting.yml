# A facade nests one domain level: `Facade.Domain.Declaration`. A class with
# three enclosing classes (`Facade.Redundant.Domain.Declaration`) nests a
# redundant facade level; remove that level and keep the domain and declaration
# as separate classes. Prefix-merging `Domain.Declaration` is forbidden: it
# duplicates the inherited namespace instead of reusing it directly. Classes
# declared inside a function are local data; an enumeration is a leaf value
# set, not a namespace.
id: ban-deep-namespace-nesting
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
rule:
  kind: class_definition
  has:
    field: name
    pattern: $NAME
  inside:
    kind: class_definition
    stopBy: end
    inside:
      kind: class_definition
      stopBy: end
      inside:
        kind: class_definition
        stopBy: end
  not:
    any:
      - inside:
          kind: function_definition
          stopBy: end
      - has:
          field: superclasses
          regex: "Enum\\b"
message: >-
  `$NAME` nests a namespace three classes deep: remove the redundant facade
  level and keep the canonical `Facade.Domain.Declaration` shape. Never
  prefix-merge the domain and declaration into one class.
  Detection only: removing the redundant level renames the class at every
  consumer.
metadata:
  enforce: [ENFORCE-069]
