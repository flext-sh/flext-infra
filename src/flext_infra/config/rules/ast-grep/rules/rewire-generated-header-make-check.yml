# Migration of the retired generation verb out of existing projections (ADR-037).
#
# `make check` converges generation, fixes and formatting; `gen`, `fmt` and
# `fix` are not public verbs. The generator now writes the `make check` header
# and `@flext-regenerate` banner, but projections rendered before the cutover
# still carry the retired verb on their first comment line. This rule rewrites
# that comment node in place so `make mod`/`make check` migrates the fleet; no
# ownership check accepts the retired wording.
id: rewire-generated-header-make-check
language: python
severity: error
rule:
  kind: comment
  regex: "^# AUTO-GENERATED FILE — Regenerate with: make gen$"
fix: "# AUTO-GENERATED FILE — Regenerate with: make check"
message: >-
  The generated header names the retired `make gen` verb; `make check` owns
  regeneration (ADR-037).
---
id: rewire-regenerate-banner-make-check
language: python
severity: error
rule:
  kind: comment
  regex: "^# @flext-regenerate: make gen$"
fix: "# @flext-regenerate: make check"
message: >-
  The regenerate banner names the retired `make gen` verb; `make check` owns
  regeneration (ADR-037).
---
id: rewire-regenerate-banner-make-check-yaml
language: yaml
severity: error
rule:
  kind: comment
  regex: "^# @flext-regenerate: make gen$"
fix: "# @flext-regenerate: make check"
message: >-
  The regenerate banner names the retired `make gen` verb; `make check` owns
  regeneration (ADR-037).
