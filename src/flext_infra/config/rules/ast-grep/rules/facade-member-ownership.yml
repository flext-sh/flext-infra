# One owner per facade member (operator order 2026-10-24). The owner letter of
# a member is derived from the kind of the runtime object it binds through
# tooling `facade-members.owners`; nothing here lists a member.
#
# 1. retire-foreign-facade-member deletes the duplicate declaration a non-owner
#    family module carries when the owner already binds the identical object.
# 2. relocate-facade-member-to-<letter> moves every consumer reference of the
#    retired member to its owner through the native member-relocation proof.
# 3. facade-member-wrong-layer guides the declarations whose owner does not
#    bind the member yet: move the declaration, then make mod relocates.
id: retire-foreign-facade-member
language: python
severity: error
files:
  - "**/_constants/**/*.py"
  - "**/_typings/**/*.py"
  - "**/_protocols/**/*.py"
  - "**/_models/**/*.py"
  - "**/_utilities/**/*.py"
constraints:
  NAME:
    regex: "^[A-Za-z][A-Za-z0-9_]*$"
metadata:
  context:
    NAME:
      is: foreign-facade-member
      arg: exposed
utils:
  class-member:
    kind: block
    inside:
      kind: class_definition
rule:
  any:
    - kind: expression_statement
      has:
        kind: assignment
        has:
          field: left
          kind: identifier
          pattern: $NAME
      inside:
        matches: class-member
    - kind: type_alias_statement
      has:
        field: left
        has:
          kind: identifier
          pattern: $NAME
      inside:
        matches: class-member
fix: ""
message: >-
  `$NAME` is re-exported by a facade that does not own it.
note: >-
  Where: this family declaration. Why: one owner per facade member; the
  owner letter is derived from the bound object's kind (tooling
  `facade-members.owners`) and already exposes the identical object. How:
  `make mod` deletes this duplicate and relocates every consumer to the owner.
---
id: facade-member-wrong-layer
language: python
severity: warning
files:
  - "**/_constants/**/*.py"
  - "**/_typings/**/*.py"
  - "**/_protocols/**/*.py"
  - "**/_models/**/*.py"
  - "**/_utilities/**/*.py"
constraints:
  NAME:
    regex: "^[A-Za-z][A-Za-z0-9_]*$"
metadata:
  context:
    NAME:
      is: foreign-facade-member
      arg: missing
utils:
  class-member:
    kind: block
    inside:
      kind: class_definition
rule:
  any:
    - kind: expression_statement
      has:
        kind: assignment
        has:
          field: left
          kind: identifier
          pattern: $NAME
      inside:
        matches: class-member
    - kind: type_alias_statement
      has:
        field: left
        has:
          kind: identifier
          pattern: $NAME
      inside:
        matches: class-member
message: >-
  `$NAME` is declared in a facade layer that does not own its kind.
note: >-
  Where: this family declaration. Why: the owner letter of a facade member is
  derived from the kind of the object it binds (exception/enum/constant -> c,
  type -> t, protocol -> p, model and model declaration -> m, function -> u;
  tooling `facade-members.owners`), and the owner does not declare it yet.
  How: move this declaration into the owner family's module (for pydantic
  surface, the owner's `pydantic.py`); `make mod` then retires every other
  copy and relocates consumers to the owner.
---
id: relocate-facade-member-to-c
language: python
severity: error
constraints:
  OWNER:
    regex: "^[ctpmu]$"
  MEMBER:
    regex: "^[A-Za-z_][A-Za-z0-9_]*$"
metadata:
  context:
    OWNER:
      is: facade-member-owner
      of: MEMBER
      arg: c
rule:
  pattern: $OWNER.$MEMBER
fix: c.$MEMBER
message: Consume `$MEMBER` through its owner facade `c`.
