id: rewire-mod-scan-selection
language: Python
severity: error
message: The resolved scanner consumes one rule selection authority.
# The call reaches FlextInfraModGateEngine.scan: qualified, or as the
# engine's own classmethod.
constraints:
  CALL:
    any:
      - regex: "^FlextInfraModGateEngine\\.scan$"
      - all:
          - regex: "^(?:cls|self)\\.scan$"
          - inside:
              kind: class_definition
              stopBy: end
              has:
                field: name
                regex: "^FlextInfraModGateEngine$"
rule:
  all:
    - kind: keyword_argument
    - pattern: $KEYWORD
    - has:
        field: name
        regex: "^(rule_ids|plan)$"
    - inside:
        kind: argument_list
        not:
          any:
            - has:
                kind: keyword_argument
                has:
                  field: name
                  regex: "^selection$"
            - all:
                - has:
                    kind: keyword_argument
                    has:
                      field: name
                      regex: "^rule_ids$"
                - has:
                    kind: keyword_argument
                    has:
                      field: name
                      regex: "^plan$"
        inside:
          pattern: $CALL($$$ARGS)
transform:
  SELECTED:
    replace:
      source: $KEYWORD
      replace: "^[A-Za-z_][A-Za-z0-9_]*"
      by: selection
fix: $SELECTED
