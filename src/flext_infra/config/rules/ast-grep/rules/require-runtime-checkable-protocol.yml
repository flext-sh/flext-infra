# A protocol is the structural contract of a dependency boundary, and its
# conformance is checked at runtime (pydantic `InstanceOf`, isinstance
# guards): every class listing `Protocol` among its bases is decorated with
# `@runtime_checkable`.
#
# In a module that binds `runtime_checkable` from typing, `make mod` adds the
# decorator. In a module without that binding the companion rule first adds
# `from typing import runtime_checkable` after the module's future import
# (every FLEXT module starts with it; `require-future-annotations` adds it
# where missing), the formatter merges it with the module's typing import, and
# the decorator rule applies on the next pass.
id: require-runtime-checkable-protocol
language: python
severity: error
files:
  - "**/protocols.py"
  - "**/_protocols.py"
  - "**/_protocols/**/*.py"
utils:
  undecorated-protocol:
    kind: class_definition
    all:
      - has:
          field: superclasses
          has:
            regex: "^(?:typing\\.)?Protocol(?:\\[.*\\])?$"
      - not:
          inside:
            kind: decorated_definition
            has:
              kind: decorator
              regex: "^@(?:typing\\.)?runtime_checkable$"
rule:
  matches: undecorated-protocol
  pattern: $CLASS
  inside:
    kind: module
    stopBy: end
    has:
      kind: import_from_statement
      stopBy: end
      all:
        - has:
            field: module_name
            regex: "^typing(?:_extensions)?$"
        - has:
            kind: dotted_name
            regex: "^runtime_checkable$"
fix: |-
  @runtime_checkable
  $CLASS
message: >-
  Protocol is not runtime-checkable: `make mod` decorates it with
  `@runtime_checkable`.
metadata:
  enforce: [ENFORCE-111]
---
id: require-runtime-checkable-protocol-missing-import
language: python
severity: error
files:
  - "**/protocols.py"
  - "**/_protocols.py"
  - "**/_protocols/**/*.py"
utils:
  undecorated-protocol:
    kind: class_definition
    all:
      - has:
          field: superclasses
          has:
            regex: "^(?:typing\\.)?Protocol(?:\\[.*\\])?$"
      - not:
          inside:
            kind: decorated_definition
            has:
              kind: decorator
              regex: "^@(?:typing\\.)?runtime_checkable$"
rule:
  kind: future_import_statement
  inside:
    kind: module
    all:
      - has:
          stopBy: end
          matches: undecorated-protocol
          has:
            field: name
            pattern: $NAME
      - not:
          has:
            kind: import_from_statement
            stopBy: end
            all:
              - has:
                  field: module_name
                  regex: "^typing(?:_extensions)?$"
              - has:
                  kind: dotted_name
                  regex: "^runtime_checkable$"
fix: |-
  from __future__ import annotations

  from typing import runtime_checkable
message: >-
  Protocol `$NAME` is not runtime-checkable and the module does not bind
  `runtime_checkable`: `make mod` imports it from typing, then decorates the
  protocol.
metadata:
  enforce: [ENFORCE-111]
