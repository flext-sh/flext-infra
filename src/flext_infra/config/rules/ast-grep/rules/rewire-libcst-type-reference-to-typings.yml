# FLEXT law (operator order 2026-10-24, ADR-028 point 2): a third-party
# library's types are named only through the typings family. flext-infra owns
# libcst; its node classes are aliased once as `t.Infra.Cst.<Name>` (runtime
# class aliases, so they serve annotations and isinstance operands alike). A
# module that binds `import libcst as cst` and writes `cst.<Name>` as a type --
# in an annotation or an isinstance/issubclass operand -- reads the alias
# instead. Constructor and function calls (`cst.Name("x")`,
# `cst.parse_module(...)`) stay with the owning utility and never match.
#
# The contexts mirror ban-library-type-reference-outside-typings, whose
# findings this rule repairs for the libcst owner.
id: rewire-libcst-type-reference-to-typings
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/typings.py"
  - "**/_typings/**"
utils:
  type-check-call:
    kind: call
    has:
      field: function
      regex: "^(?:isinstance|issubclass)$"
  libcst-module:
    kind: module
    has:
      stopBy: end
      kind: import_statement
      has:
        kind: aliased_import
        all:
          - has:
              field: name
              regex: "^libcst$"
          - has:
              field: alias
              regex: "^cst$"
rule:
  kind: attribute
  pattern: cst.$NAME
  inside:
    stopBy: end
    matches: libcst-module
  any:
    - inside:
        kind: type
        stopBy: end
    - all:
        - nthChild: 2
        - inside:
            kind: argument_list
            inside:
              matches: type-check-call
    - inside:
        stopBy: end
        any:
          - kind: binary_operator
          - kind: tuple
          - kind: parenthesized_expression
        nthChild: 2
        inside:
          kind: argument_list
          inside:
            matches: type-check-call
constraints:
  NAME:
    regex: "^[A-Z][A-Za-z0-9]*$"
fix: t.Infra.Cst.$NAME
message: >-
  libcst type `cst.$NAME` named inline: read the typings alias t.Infra.Cst.$NAME.
