id: rewire-cli-json-list-adapter
language: python
severity: error
files:
- "src/**/*.py"
- "tests/**/*.py"
- "examples/**/*.py"
- "scripts/**/*.py"
rule:
  all:
  - pattern: u.Cli.JSON_LIST_ADAPTER
  - inside:
      kind: module
      stopBy: end
      has:
        stopBy: end
        matches: u-imported-from-flext
fix: u.Cli.JSON_LIST_ADAPTER
message: Use the original JSON list adapter factory on the utilities facade.
