# Binds `ClassVar` for the facade-constant rewrites. Only the module-level
# `from typing import ...` is extended (a TYPE_CHECKING import would leave the
# name unbound at runtime), and only in `_constants` modules that declare an
# annotated constant on a module-level class.
#
# Idempotent: once `ClassVar` is imported the rule no longer matches.
id: facade-constant-classvar-import
language: python
severity: error
files:
  - "src/**/_constants/**/*.py"
rule:
  all:
    - pattern: "from typing import $$$NAMES"
    - not:
        has:
          stopBy: end
          kind: dotted_name
          regex: "^ClassVar$"
    - inside:
        kind: module
        has:
          stopBy: end
          matches: facade-part-constant
fix: "from typing import ClassVar, $$$NAMES"
message: >-
  Modules declaring annotated constants on a _constants facade part bind
  ClassVar at module level.
