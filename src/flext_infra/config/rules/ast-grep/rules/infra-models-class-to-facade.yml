# A consumer names the models facade, never the concrete namespace class.
#
# The protocol path is the typing contract; executable consumers retain the
# concrete `m.Infra.*` model. This rule is deliberately constrained to a type
# region so it cannot rewrite constructors, `Result[...]` operands, factories
# or runtime metadata before the protocol projection exists.
#
# The declaring modules are excluded: there the name is a definition, not a
# consumer reference. The receiver is narrowed before the module-wide import
# anchor, so only concrete-class references pay for it.
id: infra-models-class-to-facade
language: python
severity: error
files:
- "src/**/*.py"
- "tests/**/*.py"
ignores:
- "src/*/_models/**/*.py"
- "src/*/models.py"
rule:
  all:
  - pattern: $CLS.$ATTR
  - has:
      field: object
      regex: "^FlextInfraModels[A-Z][A-Za-z0-9]*$"
  - inside:
      kind: module
      stopBy: end
      has:
        stopBy: end
        matches: m-imported-from-flext
  - inside:
      matches: semantic-type-context
constraints:
  CLS:
    regex: "^FlextInfraModels[A-Z][A-Za-z0-9]*$"
fix: p.Infra.$ATTR
message: >-
  Name the protocol facade (p.Infra.*) in a type annotation; executable model
  access remains m.Infra.*.
