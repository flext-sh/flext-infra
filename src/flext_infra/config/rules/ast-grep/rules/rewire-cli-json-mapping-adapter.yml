id: rewire-cli-json-mapping-adapter
language: python
severity: error
files:
  - "src/**/*.py"
  - "tests/**/*.py"
  - "examples/**/*.py"
  - "scripts/**/*.py"
rule:
  all:
    - pattern: t.Cli.JSON_MAPPING_ADAPTER
    - inside:
        kind: module
        stopBy: end
        has:
          stopBy: end
          matches: u-imported-from-flext
fix: u.Cli.JSON_MAPPING_ADAPTER
message: Use the original JSON mapping adapter factory on the utilities facade.
