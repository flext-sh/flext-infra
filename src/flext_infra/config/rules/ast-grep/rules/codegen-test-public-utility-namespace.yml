# The codegen test helpers moved behind the public test facade `u`. A
# reference through the legacy `tests.utilities` owner migrates to `u` only
# where `u` is the module's binding of that same facade (tests-u-bound); the
# owner is the one the module's own import resolves (tests-utilities-owner).
id: codegen-test-public-utility-namespace
language: python
severity: error
files:
  - "tests/unit/codegen/*.py"
rule:
  pattern: $OWNER.CodegenTestSupport.Ci
  inside:
    kind: module
    stopBy: end
    matches: tests-u-bound
constraints:
  OWNER:
    matches: tests-utilities-owner
fix: u.CodegenTestSupport.Ci
message: Consume the helper through the already-bound identical public test facade.
---
id: codegen-test-public-utility-binding-required
language: python
severity: error
files:
  - "tests/unit/codegen/*.py"
rule:
  pattern: $OWNER.CodegenTestSupport.Ci
  inside:
    kind: module
    stopBy: end
    not:
      matches: tests-u-bound
constraints:
  OWNER:
    matches: tests-utilities-owner
message: >-
  The legacy helper resolves to the canonical utilities owner, but u does not
  bind that same class here. No token fixer may create or overwrite that binding;
  a semantic import cutover must establish it before the reference can migrate.
---
# A module import no executable code reads: nothing in the module reaches
# through `tests.utilities`.
id: codegen-test-public-utility-import-semantic-required
language: python
severity: error
files:
  - "tests/unit/codegen/*.py"
rule:
  all:
    - kind: import_statement
    - pattern: $IMPORT
    - regex: '^import tests\.utilities$'
    - inside:
        kind: module
        not:
          has:
            stopBy: end
            kind: attribute
            regex: "^tests\\.utilities\\."
message: >-
  This legacy module import has no executable reader. Its semantic import owner
  must adjudicate retirement; a textual import-to-facade replacement is unsafe.
