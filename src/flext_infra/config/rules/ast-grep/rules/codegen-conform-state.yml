id: codegen-conform-state-request-workspace
language: python
severity: error
files: ["tests/**/*.py", "examples/**/*.py", "scripts/**/*.py"]
rule:
  pattern: FlextInfraCodegenConform(repository_root=$ROOT, request=$REQUEST, initial_workspace=$WORKSPACE)
fix: |-
  FlextInfraCodegenConform(
      repository_root=$ROOT,
      state=m.Infra.CodegenConformState(
          repository_root=$ROOT,
          request=$REQUEST,
          initial_workspace=$WORKSPACE,
      ),
  )
message: Pass conform request data through its declared state model.
