# The flext-infra CLI entry point is the facade static method
# `FlextInfraCli.infra_main` (single-nested-class law: no loose module-level
# `main`; console script `flext_infra.cli:FlextInfraCli.infra_main`). These
# rules rewire every consumer of the retired root export `main`.
id: rewire-flext-infra-cli-entry-import
language: python
severity: error
files:
  - "**/*.py"
# Generated package inits are lazy-init projections; their export of `main`
# follows cli.py's __all__ through `make gen`, never through this rewrite.
ignores:
  - "**/__init__.py"
rule:
  kind: import_from_statement
  pattern: $STATEMENT
  all:
    - has:
        field: module_name
        regex: "^flext_infra(?:\\.cli)?$"
    - has:
        kind: dotted_name
        regex: "^main$"
transform:
  REWIRED:
    replace:
      source: $STATEMENT
      replace: "\\bmain\\b"
      by: FlextInfraCli
fix: $REWIRED
message: >-
  `main` is no longer exported by flext_infra: import `FlextInfraCli` and call
  `FlextInfraCli.infra_main(...)`.
---
id: rewire-flext-infra-cli-entry-call
language: python
severity: error
files:
  - "**/*.py"
rule:
  kind: call
  all:
    - has:
        field: function
        kind: identifier
        regex: "^main$"
    - has:
        field: arguments
        pattern: $ARGS
  inside:
    kind: module
    stopBy: end
    has:
      kind: import_from_statement
      regex: "^from flext_infra(?:\\.cli)? import[\\s\\S]*\\b(?:main|FlextInfraCli)\\b"
    not:
      has:
        stopBy: end
        any:
          - kind: function_definition
            has:
              field: name
              regex: "^main$"
          - kind: assignment
            has:
              field: left
              regex: "^main$"
fix: FlextInfraCli.infra_main$ARGS
message: >-
  Call the flext-infra CLI through `FlextInfraCli.infra_main(...)`.
---
id: rewire-flext-infra-cli-entry-attribute
language: python
severity: error
files:
  - "**/*.py"
rule:
  pattern: flext_infra.main
fix: flext_infra.FlextInfraCli.infra_main
message: >-
  Call the flext-infra CLI through `flext_infra.FlextInfraCli.infra_main(...)`.
