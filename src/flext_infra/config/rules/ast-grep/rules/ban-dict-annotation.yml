# Native dict annotations in functions need no rewrite or facade binding.
# The separate model-field contract still rejects dict origins outside functions;
# choosing Mapping/MutableMapping and its default belongs to the semantic owner.
id: dict-annotation-field-contract
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/typings.py"
  - "**/_typings/**"
rule:
  all:
    - matches: builtin-dict-generic
    - not:
        inside:
          kind: function_definition
          stopBy: end
message: >-
  `dict[K, V]` declared outside a function: a field or alias contract is
  Mapping[K, V] (MutableMapping when mutated) with a `u.empty` factory,
  never a dict origin.
metadata:
  enforce: [ENFORCE-030]
