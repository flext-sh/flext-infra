# A builtin `dict[K, V]` spelled in a type context outside the typings family
# re-declares a typings member (ENFORCE-030, enforced by flext-core only at
# runtime until now). The typings family itself declares the aliases and is out
# of scope.
#
# Two targets, chosen by context, never by guess:
# - inside a function (parameters, returns, locals) the exact concrete contract
#   is `t.DictKV[K, V]`, the same target as the typing.Dict modernization; the
#   rewrite preserves the concrete dict API.
# - outside a function (model fields, class attributes, module annotations,
#   PEP 695 aliases) the runtime model law rejects dict origins in Pydantic
#   fields: the contract is `t.MappingKV`/`t.MutableMappingKV` with a `u.empty`
#   factory, which changes the default as well, so that document is
#   detection-only and the semantic fix belongs to its owner.
id: dict-annotation-missing-t-import
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/typings.py"
  - "**/_typings/**"
rule:
  all:
    - matches: builtin-dict-generic
    - inside:
        stopBy: end
        kind: module
        not:
          has:
            stopBy: end
            matches: t-locally-bound
message: >-
  `dict[K, V]` in a type context must become a typings member (t.DictKV in a
  function, t.MappingKV in a field), but a canonical `t` binding is not
  established. Resolve the facade binding first.
metadata:
  enforce: [ENFORCE-030]
---
id: dict-annotation-to-dict-kv
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/typings.py"
  - "**/_typings/**"
rule:
  all:
    - matches: builtin-dict-generic
    - pattern: $WHOLE
    - inside:
        kind: function_definition
        stopBy: end
    - inside:
        stopBy: end
        kind: module
        has:
          stopBy: end
          matches: t-locally-bound
transform:
  NEW:
    replace:
      source: $WHOLE
      replace: "^dict"
      by: "t.DictKV"
fix: $NEW
message: >-
  Replace the builtin `dict[K, V]` type with the typings member t.DictKV[K, V].
metadata:
  enforce: [ENFORCE-030]
---
id: dict-annotation-field-contract
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/typings.py"
  - "**/_typings/**"
rule:
  all:
    - matches: builtin-dict-generic
    - not:
        inside:
          kind: function_definition
          stopBy: end
    - inside:
        stopBy: end
        kind: module
        has:
          stopBy: end
          matches: t-locally-bound
message: >-
  `dict[K, V]` declared outside a function: a field or alias contract is
  t.MappingKV[K, V] (t.MutableMappingKV when mutated) with a `u.empty` factory,
  never a dict origin.
metadata:
  enforce: [ENFORCE-030]
