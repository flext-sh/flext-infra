---
# ENFORCE-003 for annotation-only imports: an `if TYPE_CHECKING:` import of
# an alias the own package publishes, bound from another facade package.
# Annotations never run, so the own package's letter is cycle-free in every
# consumer module and every layer. ENFORCE-003 and ENFORCE-080 both skip
# guarded imports, which left this shape unowned; the file scope is
# ENFORCE-003's, unchanged.
#
# The facade families' declaration modules (c, t, p, m, u and their family
# packages, base and settings composition) are out of scope by design: while
# the own facades are being composed, binding the UPSTREAM packages' letters
# (`from flext_cli import c, t, p, m, u`) for hierarchical composition is the
# canonical form (operator ruling 2026-10-25 for epic flext-1engx, tracker
# memory key operator-ruling-2026-10-25-upstream-letter-canonical), and the
# own letter there is ENFORCE-051's cycle.
id: ban-foreign-namespace-annotation-source
language: python
severity: error
files:
  - "**/*.py"
ignores:
  # Generator-contract bootstrap modules, as in ENFORCE-003
  # (operator-ruling-2026-10-05-bootstrap-model-imports).
  - "**/_config_models.py"
  - "**/_settings_models.py"
  - "**/utilities.py"
  - "**/__init__.py"
  - "**/_constants/**"
  - "**/_models/**"
  - "**/_protocols/**"
  - "**/_typings/**"
  - "**/_utilities/**"
  - "**/base.py"
  - "**/_base.py"
  - "**/settings.py"
  - "**/_settings.py"
  - "**/tests/**"
  - "**/conftest.py"
metadata:
  enforce: [ENFORCE-003]
  relocation: own-package-import
  # A layer-zero module binds no own-namespace object at all, and a facade
  # module composes the upstream letters: one native document, its scopes
  # rendered as native ignores.
  scope:
    not-in: [layer-zero, facade-module]
constraints:
  MODULE:
    all:
      - not:
          matches: own-package
      - matches: facade-package
  NAME:
    matches: local-alias
rule:
  kind: dotted_name
  pattern: $NAME
  not:
    inside:
      kind: import_from_statement
      field: module_name
  matches: inside-type-checking-guard
  inside:
    kind: import_from_statement
    has:
      field: module_name
      kind: dotted_name
      pattern: $MODULE
      not:
        regex: "\\."
message: >-
  Annotation import binds `$NAME` from `$MODULE`, a package that does not own
  this project's `$NAME`: import it from the own package.
---
# ENFORCE-099: a consumer imports another facade package through its public
# root or its public family compose modules: a module path below the root is
# the owner's layout, with the family-shape exemption the generated
# compose-module utility proves — the canonical public compose leaf
# (constants/models/protocols/typings/utilities, bead flext-6e72w) is the
# sanctioned static surface every consumer imports the composed classes from.
# Runtime aliases are ENFORCE-002's and private paths ban-private-import's; a
# root import of a name the root does not declare in __all__ is the type
# checkers' private-import-usage finding. The one sanctioned literal is the
# lazy defining module below: every generated consumer initializer imports
# the lazy helpers from it (contract #1362 — the root bootstrap no longer
# publishes those names), and a static YAML rule cannot read the Python
# constants catalog, so the name mirrors the SSOT constant
# `c.Infra.LAZY_BOOTSTRAP_MODULE` (flext-infra
# src/flext_infra/_constants/codegen_lazy.py, value "flext_core.lazy");
# change the two together.
#
# Family-shape amendment (cosmos-h5y3o): the package's public family compose
# modules (`<facade-package>.{constants,models,protocols,typings,utilities}`
# — the compose-module context) are the sanctioned static import surface a
# consumer may reach below the root: the compose classes are the only form
# the type checkers resolve through the generated lazy root, and the lazy
# root keeps re-exporting them for runtime. Every other submodule path stays
# banned.
id: ban-consumer-submodule-import
language: python
severity: error
files:
  - "**/*.py"
ignores:
  # Test files legitimately import from flext-tests (tests) submodules
  - "**/tests/**"
  - "**/conftest.py"
metadata:
  enforce: [ENFORCE-015]
constraints:
  MODULE:
    all:
      - not:
          matches: own-package
      - matches: facade-package
      - not:
          matches: compose-module
  NAME:
    not:
      matches: runtime-alias
rule:
  any:
    - kind: dotted_name
      pattern: $NAME
      not:
        inside:
          kind: import_from_statement
          field: module_name
      any:
        - inside:
            kind: import_from_statement
            has:
              field: module_name
              kind: dotted_name
              pattern: $MODULE
              regex: "\\."
              not:
                any:
                  - regex: "\\._"
                  - regex: "^flext_core\\.lazy$"
        - inside:
            kind: aliased_import
            field: name
            inside:
              kind: import_from_statement
              has:
                field: module_name
                kind: dotted_name
                pattern: $MODULE
                regex: "\\."
                not:
                  any:
                    - regex: "\\._"
                    - regex: "^flext_core\\.lazy$"
    - kind: dotted_name
      pattern: $MODULE
      regex: "\\."
      not:
        any:
          - regex: "\\._"
          - regex: "^flext_core\\.lazy$"
      any:
        - inside:
            kind: import_statement
        - inside:
            kind: aliased_import
            field: name
            inside:
              kind: import_statement
      has:
        nthChild: 1
        kind: identifier
        pattern: $NAME
message: >-
  `$MODULE` is a module path below a facade package root: import the names the
  root publishes, from the root.
---
# ENFORCE-007: a runtime alias is bound only by the module that declares it
# in __all__, exactly once, to the facade class that module defines. Each
# branch captures its own variable, each constrained natively. A name
# declared in __all__ and never bound is the type checkers'
# unsupported-dunder-all finding. An import of the alias is a binding too:
# mypy keeps the imported type and rejects the later assignment.
id: ban-runtime-alias-rebind
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/__init__.py"
metadata:
  enforce: [ENFORCE-007]
rule:
  any:
    # Bound after a module-level import of the same name. Listed first: a
    # match keeps the first matching branch, and the undeclared branch
    # matches every module-level binding.
    - all:
        - kind: expression_statement
        - inside:
            kind: module
        - has:
            kind: assignment
            has:
              field: left
              kind: identifier
              pattern: $SHADOWED
        - follows:
            stopBy: end
            kind: import_from_statement
            # A field relation reaches only the first imported name; the
            # module path is the statement's first named child.
            any:
              - has:
                  kind: dotted_name
                  not:
                    nthChild: 1
                  has:
                    kind: identifier
                    pattern: $SHADOWED
              - has:
                  kind: aliased_import
                  has:
                    field: alias
                    pattern: $SHADOWED
        # ENFORCE-046 Pattern-A consumer admission: a consumer's canonical
        # facade imports the letter and rebinds it to the consumer-named
        # class the module defines (flext-core forbids the bare-class import
        # a peer uses). The consumer-name gate is an inline regex on the
        # rebind target — the complement of the facade naming law's
        # ^(?:Tests)?Flext[A-Z] peer pattern, enumerated for Rust regex (no
        # lookaround) — because constraints are not enforced on metavariables
        # bound inside a not sub-rule. A peer target or a target this module
        # does not define stays a finding.
        - not:
            all:
              - has:
                  kind: assignment
                  has:
                    field: right
                    pattern: $CONSUMER
                    regex: "^(?:[^FT].*|F|F[^l].*|Fl|Fl[^e].*|Fle|Fle[^x].*|Flex|Flex[^t].*|Flext|Flext[^A-Z].*|T|T[^e].*|Te|Te[^s].*|Tes|Tes[^t].*|Test|Test[^s].*|Tests|Tests[^F].*|TestsF|TestsF[^l].*|TestsFl|TestsFl[^e].*|TestsFle|TestsFle[^x].*|TestsFlex|TestsFlex[^t].*|TestsFlext|TestsFlext[^A-Z].*)$"
              - inside:
                  kind: module
                  any:
                    - has:
                        kind: class_definition
                        has:
                          field: name
                          pattern: $CONSUMER
                    - has:
                        kind: decorated_definition
                        has:
                          field: definition
                          kind: class_definition
                          has:
                            field: name
                            pattern: $CONSUMER
    # Bound by a module that does not declare it.
    - all:
        - kind: expression_statement
        - inside:
            kind: module
        - has:
            kind: assignment
            has:
              field: left
              kind: identifier
              pattern: $NAME
        - not:
            matches: declared-in-module-all
    # Bound twice.
    - all:
        - kind: expression_statement
        - inside:
            kind: module
        - has:
            kind: assignment
            has:
              field: left
              kind: identifier
              pattern: $REBOUND
        - follows:
            stopBy: end
            kind: expression_statement
            has:
              kind: assignment
              has:
                field: left
                pattern: $REBOUND
    # Bound to a name that is not a class this module defines.
    - all:
        - kind: expression_statement
        - inside:
            kind: module
        - has:
            kind: assignment
            all:
              - has:
                  field: left
                  kind: identifier
                  pattern: $ALIAS
              - has:
                  field: right
                  pattern: $TARGET
        - not:
            inside:
              kind: module
              has:
                kind: class_definition
                has:
                  field: name
                  pattern: $TARGET
        - not:
            inside:
              kind: module
              has:
                kind: decorated_definition
                has:
                  field: definition
                  kind: class_definition
                  has:
                    field: name
                    pattern: $TARGET
# Each branch binds one of the own package's runtime aliases (the generated
# local-alias utility); dunders are module protocol.
constraints:
  NAME:
    matches: local-alias
  REBOUND:
    matches: local-alias
  SHADOWED:
    matches: local-alias
  ALIAS:
    matches: local-alias
message: >-
  Runtime alias bound outside its owner: the module that declares it in
  __all__ binds it once, to the facade class it defines.
---
# ENFORCE-011: a class lives in the facade family its kind belongs to: a
# class extending a model preset in the models family, an enumeration in
# the constants family, a utilities class in the utilities family. The
# family letter is derived from the declaration and compared with the
# family the module belongs to. A class composing Mixin-suffixed
# superclasses over a preset is the service-composite shape, not a
# declaration-layer entity, so it is exempt wherever it lives. Protocol
# classes are ban-manual-protocol-outside-protocols's.
id: ban-class-wrong-facade-layer
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/__init__.py"
  - "**/conftest.py"
  - "**/tests/**"
metadata:
  enforce: [ENFORCE-011, ENFORCE-022]
  relocation: facade-class
  # One native document per family the declaration's kind selects, scoped
  # outside that family's modules (the facade letter's own family files).
  scope:
    partition:
      variable: KIND
      holds: false
      selectors: facade-family-
      keys:
        c: "^(?:Str|Int)?Enum$"
        m: "^m\\.\\w+$"
        u: "Utilities$"
rule:
  kind: class_definition
  has:
    field: name
    pattern: $NAME
  all:
    - any:
        - inside:
            kind: module
        - inside:
            kind: decorated_definition
            inside:
              kind: module
    # Fires only outside legitimate composition: no Mixin base and no
    # upstream facade base (Flext*Aliases, FlextFooCache, ...).
    - not:
        has:
          field: superclasses
          has:
            kind: identifier
            regex: "Mixin$"
    - not:
        has:
          field: superclasses
          has:
            kind: identifier
            regex: "^Flext[A-Z]"
  any:
    - has:
        field: superclasses
        has:
          pattern: $KIND
          any:
            - kind: attribute
              regex: "^m\\.\\w+$"
            - kind: identifier
              regex: "^(?:Str|Int)?Enum$"
    - has:
        field: name
        pattern: $KIND
        regex: "Utilities$"
transform:
  ENUM:
    replace:
      source: $KIND
      replace: "^(?:Str|Int)?Enum$"
      by: c
  MODEL:
    replace:
      source: $ENUM
      replace: "^m\\.\\w+$"
      by: m
  FAMILY:
    replace:
      source: $MODEL
      replace: "^\\w+Utilities$"
      by: u
message: >-
  Class `$NAME` belongs to the `$FAMILY` facade family; declare it in that
  family's module or package.
