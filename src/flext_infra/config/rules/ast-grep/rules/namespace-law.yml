# FLEXT namespace law as rule data (enforcement catalog ENFORCE-001, -002,
# -003, -007, -011, -014, -080, -099).
#
# Each document matches one file's syntax; what the project means by a name
# is read from its own sources of truth through the project's stable
# generated utilities (matches:) and published file scopes (metadata.scope):
# the own package (pyproject), the runtime closure (installed distributions),
# the runtime aliases a package publishes (its generated lazy exports), the
# aliases the own package binds (its modules' __all__), a module's own
# __all__, and the facade family a module belongs to (__all__ of the module
# or of its family package's facade, over the tooling import-layer order).
# No package, alias or file name is listed here, with one sanctioned
# exception: the lazy defining module literal in ENFORCE-099, which mirrors
# the SSOT constant `c.Infra.LAZY_BOOTSTRAP_MODULE` because a static YAML
# rule cannot read the Python constants catalog.

# ENFORCE-001: every symbol lives inside the module's facade class. A module
# body holds that one class, its alias binding, __all__ and imports; a
# function, a value binding that is not an alias of a name, and any further
# class are loose objects. The law binds every Python file of the repository
# (src, tests, scripts, examples, docs code). Its only exception data, each
# with a fixture: an executable module's guarded `main()` entry point and
# generator-emitted dunders (generator law p.11; generated `__init__.py` is
# out of scope as a projection), plus the tests-tier delta of ADR-028 p.6 --
# pytest fixtures, `pytest_*` hooks and `pytest_plugins`, whose placement in
# conftest.py and tests/fixtures/** is enforced by
# ban-pytest-hook-outside-conftest.
# Typing location is also ban-manual-typing-alias-outside-typings's. The one
# admitted value binding is the facade's self-typed public instance: the
# class-nesting cutover itself keeps it at module level (it reads the owner
# while the owner is being defined), and the pattern owner publishes it as
# facade instance, either shared or independently validated. Publication
# does not change the facade's ownership or registry isolation contract.
id: ban-loose-module-object
language: python
severity: error
# Generator law p.11 binds every module and p.4 makes every non-src root
# folder an internal namespace tier. The governed inventory owns scope; tests,
# scripts, examples, vendored sources and special modules share this contract.
files:
  - "**/*.py"
ignores:
  - "**/__init__.py"
rule:
  any:
    - all:
        - kind: function_definition
        - has:
            field: name
            pattern: $NAME
        - any:
            - inside:
                kind: module
            - inside:
                kind: decorated_definition
                inside:
                  kind: module
        # Exception data (generator law p.11, ADR-028 p.6). Each entry has a
        # fixture in ban-loose-module-object-test.yml; any further entry
        # needs the operator.
        # 1. An executable module's `main()` entry point, admitted only when
        #    the module carries the `if __name__ == "__main__":` guard.
        - not:
            all:
              - has:
                  field: name
                  regex: "^main$"
              - inside:
                  kind: module
                  stopBy: end
                  has:
                    kind: if_statement
                    has:
                      field: condition
                      regex: "^__name__ == ['\"]__main__['\"]$"
        # 2. Tests-tier delta: pytest fixtures and `pytest_*` hooks. Their
        #    placement (conftest.py and tests/fixtures/** only) is enforced by
        #    ban-pytest-hook-outside-conftest, so ordinary test modules stay
        #    bound by this law.
        - not:
            any:
              - has:
                  field: name
                  regex: "^pytest_\\w+$"
              - inside:
                  kind: decorated_definition
                  has:
                    kind: decorator
                    regex: "^@(?:pytest\\.)?fixture(?:\\(|$)"
    - all:
        - kind: expression_statement
        - inside:
            kind: module
        # 2. (cont.) `pytest_plugins`, the conftest global pytest reads to
        #    load fixture modules; placement is enforced by the same rule.
        - not:
            has:
              kind: assignment
              has:
                field: left
                regex: "^pytest_plugins$"
        # The facade's self-typed instance: the binding reads the owner
        # class while it is being defined, so the class-nesting cutover
        # keeps it at module level; it is admitted only when the
        # annotation, the construction receiver and a class this module
        # defines carry one name.
        - not:
            all:
              - has:
                  kind: assignment
                  all:
                    - has:
                        field: type
                        pattern: $OWNER
                    - has:
                        field: right
                        kind: call
                        has:
                          field: function
                          kind: attribute
                          all:
                            - has:
                                field: object
                                kind: identifier
                                pattern: $OWNER
                            - has:
                                field: attribute
                                kind: identifier
                                regex: "^(fetch_global|model_validate)$"
              - inside:
                  kind: module
                  has:
                    kind: class_definition
                    has:
                      field: name
                      pattern: $OWNER
        - has:
            kind: assignment
            all:
              - has:
                  field: left
                  kind: identifier
                  pattern: $NAME
              - not:
                  has:
                    field: left
                    regex: "^__\\w+__$"
              - has:
                  field: right
                  pattern: $_
                  not:
                    kind: identifier
    - all:
        - kind: type_alias_statement
        - inside:
            kind: module
        - has:
            field: left
            has:
              kind: identifier
              pattern: $NAME
              stopBy: end
    - all:
        - kind: expression_statement
        - inside:
            kind: module
        - has:
            kind: assignment
            all:
              - has:
                  field: left
                  pattern: $NAME
              - has:
                  field: type
                  regex: "^(?:[A-Za-z_][A-Za-z0-9_]*\\.)*TypeAlias$"
    - all:
        - kind: class_definition
        - has:
            field: name
            pattern: $NAME
        - any:
            - all:
                - inside:
                    kind: module
                - follows:
                    stopBy: end
                    any:
                      - kind: class_definition
                      - kind: decorated_definition
                        has:
                          field: definition
                          kind: class_definition
            - inside:
                kind: decorated_definition
                inside:
                  kind: module
                follows:
                  stopBy: end
                  any:
                    - kind: class_definition
                    - kind: decorated_definition
                      has:
                        field: definition
                        kind: class_definition
    # An import-time expression other than the entry-point call.
    - all:
        - kind: expression_statement
        - inside:
            kind: module
        - has:
            kind: call
            pattern: $NAME
            not:
              has:
                field: function
                regex: "(?:^|\\.)main$"
message: >-
  Loose object at module level: nest `$NAME` inside the module's single facade
  class. Only that class, its canonical published bindings, __all__ and imports
  live at module level in every Python file of the repository; the sole
  exceptions are a guarded executable `main()`, generator-emitted dunders and,
  in conftest.py and tests/fixtures/** only, pytest fixtures and hooks.
metadata:
  enforce: [ENFORCE-001]
---
# ADR-028 p.6 tests-tier delta: tests follow the same FLEXT law as src, with
# one extra freedom -- conftest.py and tests/fixtures/** may declare pytest
# fixtures, `pytest_*` hooks and `pytest_plugins` at module level. This rule
# is the placement half of that exception: the same objects anywhere else
# (ordinary test modules, src, scripts, examples) are loose. The ignores are
# the exception data, one entry per sanctioned location.
id: ban-pytest-hook-outside-conftest
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/conftest.py"
  - "**/tests/fixtures/**"
rule:
  any:
    - all:
        - kind: function_definition
        - any:
            - inside:
                kind: module
            - inside:
                kind: decorated_definition
                inside:
                  kind: module
        - any:
            - has:
                field: name
                regex: "^pytest_\\w+$"
            - inside:
                kind: decorated_definition
                has:
                  kind: decorator
                  regex: "^@(?:pytest\\.)?fixture(?:\\(|$)"
    - all:
        - kind: expression_statement
        - inside:
            kind: module
        - has:
            kind: assignment
            has:
              field: left
              regex: "^pytest_plugins$"
message: >-
  Module-level pytest fixture or hook outside conftest.py and tests/fixtures/**:
  move it there, or nest the test behavior in the module's single Tests class.
---
# ENFORCE-002: a runtime alias is imported from the package root, never from
# one of its modules (`from pkg.models import m` binds the module's own
# rebinding, which type checkers resolve as Any). Private module paths are
# ban-private-import's. The relocation rebinds the name from the root.
id: ban-noncanonical-alias-import
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/tests/**"
  - "**/conftest.py"
metadata:
  enforce: [ENFORCE-002]
  relocation: package-root-import
constraints:
  MODULE:
    matches: facade-package
  NAME:
    matches: runtime-alias
rule:
  kind: dotted_name
  pattern: $NAME
  not:
    any:
      - inside:
          kind: import_from_statement
          field: module_name
      # The canonical static publication: a generated initializer's
      # TYPE_CHECKING import of an alias from a module directly below the own
      # package root, mirroring its lazy export for the type checkers.
      - all:
          - matches: inside-type-checking-guard
          - inside:
              kind: module
              stopBy: end
              matches: generated-module
          - inside:
              kind: import_from_statement
              has:
                field: module_name
                regex: "^[^.]+\\.[^.]+$"
                matches: own-package
  inside:
    kind: import_from_statement
    has:
      field: module_name
      kind: dotted_name
      pattern: $MODULE
      regex: "\\."
      not:
        regex: "\\._"
message: >-
  Runtime alias `$NAME` imported from module `$MODULE`: import it from the
  package root.
---
# ENFORCE-003: a module-level import binds an alias the own package defines
# from another package. The family implementation packages, base and
# settings modules extend the parent facades and import their aliases by
# design; the facade modules themselves are matched by file family. The
# relocation rebinds the name from the own package.
id: ban-foreign-namespace-source
language: python
severity: error
files:
  - "**/*.py"
ignores:
  # Generator-contract bootstrap modules: the generator emits these fixed
  # file names importing the framework facade directly — the own-package
  # facade is not importable at that bootstrap layer
  # (operator-ruling-2026-10-05-bootstrap-model-imports).
  - "**/_config_models.py"
  - "**/_settings_models.py"
  - "**/utilities.py"
  - "**/__init__.py"
  - "**/_constants/**"
  - "**/_models/**"
  - "**/_protocols/**"
  - "**/_typings/**"
  - "**/_utilities/**"
  - "**/base.py"
  - "**/_base.py"
  - "**/settings.py"
  - "**/_settings.py"
  # Test files legitimately import from flext-tests (tests) facade
  - "**/tests/**"
  - "**/conftest.py"
metadata:
  enforce: [ENFORCE-003]
  relocation: own-package-import
  # A layer-zero module binds no own-namespace object, and a facade module
  # composes the upstream letters by design (operator ruling 2026-10-25,
  # tracker key operator-ruling-2026-10-25-upstream-letter-canonical): one
  # native document, its scopes rendered as native ignores.
  scope:
    not-in: [layer-zero, facade-module]
constraints:
  MODULE:
    all:
      - not:
          matches: own-package
      - matches: facade-package
  NAME:
    matches: local-alias
rule:
  kind: dotted_name
  pattern: $NAME
  not:
    inside:
      kind: import_from_statement
      field: module_name
  inside:
    kind: import_from_statement
    inside:
      kind: module
    has:
      field: module_name
      kind: dotted_name
      pattern: $MODULE
      not:
        regex: "\\."
message: >-
  Alias `$NAME` imported from `$MODULE`, a package that does not own this
  project's `$NAME`: import it from the own package.
---
