# PEP 747 `TypeForm` is re-bound by every FLEXT `t` facade as a runtime
# callable (`t.TypeForm(X)`, ADR-028 amended 2026-10-29): consumers never
# import `typing_extensions.TypeForm` themselves — one typed surface, no
# third-party spelling at call sites. flext-core's own `_typings` modules are
# the only legal importers (they own the re-binding). Calls through the
# facade are the required form at every use site.
id: typeform-call-via-facade
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/_typings/**"
rule:
  pattern: from typing_extensions import $$$NAMES
constraints:
  NAMES:
    regex: ".*\\bTypeForm\\b.*"
message: >-
  Call `t.TypeForm(X)` through the facade instead of importing
  `typing_extensions.TypeForm` (ADR-028 amended 2026-10-29): `t` re-binds the
  special form as a callable; the import is owned by flext-core's typings only.
fix: t.TypeForm
note: >-
  Where: this import. Why: the facade owns the PEP 747 re-binding so consumers
  keep one typed surface. How: drop the import and call `t.TypeForm(...)` via
  the package's `t` letter.
