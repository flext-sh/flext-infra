# PEP 747 `TypeForm` is called and annotated through its canonical owner,
# `from typing_extensions import TypeForm` (ADR-028; operator ruling
# 2026-10-31, option B, superseding the 2026-10-29 `t.TypeForm` order). mypy
# recognizes the PEP 747 conversion only when the callee's fullname is
# `typing_extensions.TypeForm`; the facade attribute `t.TypeForm` is a class
# attribute, so mypy reports `"<typing special form>" not callable` and the
# result is `Any`. Every `t.TypeForm` reference (call, subscript, bare) is
# rewritten to the bare name; `pydantic-typeform-import` binds it.
#
# The typings family is out of scope: it still holds the re-binding, which is
# deleted at its owner in a separate step, never by this rule.
id: ban-typeform-alias-call
language: python
severity: error
files:
  - "**/*.py"
metadata:
  scope:
    not-in: [ facade-family-t ]
rule:
  kind: attribute
  all:
    - has:
        field: object
        regex: "^t$"
    - has:
        field: attribute
        regex: "^TypeForm$"
fix: TypeForm
message: >-
  Use `TypeForm` from `typing_extensions`, not `t.TypeForm` (ADR-028, operator
  ruling 2026-10-31): mypy honours the PEP 747 call only for the fullname
  `typing_extensions.TypeForm`; the facade attribute is `"<typing special
  form>" not callable` and yields `Any`.
note: >-
  Where: this `t.TypeForm` reference. Why: mypy reads the facade attribute as
  a non-callable special form. How: the fix writes the bare name and
  `pydantic-typeform-import` adds `from typing_extensions import TypeForm`.
