# One binary comparison per assert becomes one tm.that expression. Unlike the
# truth rules, nothing short-circuits here: `assert` already evaluates both
# operands exactly once, and tm.that evaluates them once as arguments, so the
# rewrite preserves evaluation order and binds no new name. A branchless
# expression also keeps the enclosing test's complexity unchanged. A comparison
# wrapped in one parenthesized_expression (the multi-line formatter shape) is the
# same comparison, so each rule matches both shapes.
id: rewire-test-assert-contains
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - any:
        - pattern: "assert $A in $B"
        - pattern: "assert ($A in $B)"
    - not:
        has:
          nthChild: 2
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - matches: tm-binding-admissible
fix: "tm.that($B, has=$A)"
message: Assert the contained operand through tm.that.
---
id: rewire-test-assert-excludes
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - any:
        - pattern: "assert $A not in $B"
        - pattern: "assert ($A not in $B)"
    - not:
        has:
          nthChild: 2
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - matches: tm-binding-admissible
fix: "tm.that($B, lacks=$A)"
message: Assert the excluded operand through tm.that.
---
id: rewire-test-assert-equal
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - any:
        - pattern: "assert $A == $B"
        - pattern: "assert ($A == $B)"
    - not:
        has:
          nthChild: 2
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - matches: tm-binding-admissible
fix: "tm.that($A, eq=$B)"
message: Assert the equal operands through tm.that.
---
id: rewire-test-assert-unequal
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - any:
        - pattern: "assert $A != $B"
        - pattern: "assert ($A != $B)"
    - not:
        has:
          nthChild: 2
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - matches: tm-binding-admissible
fix: "tm.that($A, ne=$B)"
message: Assert the unequal operands through tm.that.
