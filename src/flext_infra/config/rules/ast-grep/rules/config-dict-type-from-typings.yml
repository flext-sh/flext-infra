# ConfigDict's type contract belongs to `t`; its constructor belongs to `m`.
# Keep the configured value unchanged and bind any newly used facade through
# the existing import-header stage of the same semantic candidate.
# Idempotent: canonical `t` annotations do not match. Model and settings
# configuration retain their distinct native contracts.
id: config-dict-type-from-typings
language: python
severity: error
files:
  - "src/**/*.py"
  - "tests/**/*.py"
rule:
  pattern: "model_config: ClassVar[$OWNER.$CONFIG] = $VAL"
constraints:
  OWNER:
    regex: "^(c|m|p)$"
  CONFIG:
    regex: "^(Settings)?ConfigDict$"
  VAL:
    regex: "^m\\.(Settings)?ConfigDict\\("
fix: "model_config: ClassVar[t.$CONFIG] = $VAL"
message: >-
  model_config annotations use their native t.ConfigDict or
  t.SettingsConfigDict contract; retain the m constructor and all arguments.
---
# A constants spelling does not supply the runtime constructor. Preserve its
# arguments while selecting the existing annotation and value owners. The
# import-header stage binds `t`; this existing rule requires `m` to be bound.
id: config-dict-from-constants
language: python
severity: error
files:
  - "src/**/*.py"
  - "tests/**/*.py"
rule:
  pattern: "model_config: ClassVar[c.$CONFIG] = c.$CONFIG($$$ARGS)"
  inside:
    kind: module
    stopBy: end
    has:
      kind: import_from_statement
      regex: "(?s)\\bimport\\b.*\\bm\\b"
      stopBy: end
constraints:
  CONFIG:
    regex: "^(Settings)?ConfigDict$"
fix: "model_config: ClassVar[t.$CONFIG] = m.$CONFIG($$$ARGS)"
message: >-
  model_config uses t.ConfigDict for its annotation and m.ConfigDict for its
  runtime constructor; preserve the original configuration arguments.
