# Mapping abstractions lose concrete dict APIs and Pydantic field semantics.
# The native dict contract preserves both without an unused facade import.
id: typing-dict-to-mapping-kv
language: python
severity: error
rule:
  all:
    - matches: typing-dict-generic
    - pattern: $WHOLE
transform:
  NEW:
    replace:
      source: $WHOLE
      replace: "^(?:typing\\.)?Dict"
      by: "dict"
fix: $NEW
message: >-
  Replace typing.Dict with dict[K, V], preserving the exact concrete dict API,
  mutations and Pydantic field contract rather than a mapping abstraction.
metadata:
  enforce: [ENFORCE-016, ENFORCE-031, ENFORCE-032]
