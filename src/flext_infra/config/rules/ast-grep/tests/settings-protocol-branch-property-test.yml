id: settings-protocol-branch-property
# `valid` MUST NOT match: read-only branches, scalar members, non-settings
# protocols and non-Protocol classes.
valid:
  - |
    class FlextLdifProtocolsBase:
        class Settings(p.Cli.Settings, Protocol):
            @property
            def Ldif(self) -> FlextLdifProtocolsBase.LdifSettings: ...
  - |
    class FlextLdapProtocolsSettings:
        class LdapSettings(FlextLdifProtocols.Model, Protocol):
            host: str
            port: int
  - |
    class FlextThingProtocols:
        class Service(Protocol):
            Branch: FlextThingProtocols.Branch
  - |
    class FlextThingSettings(FlextSettings):
        Thing: ThingSettings = m.Field(default_factory=ThingSettings)
# `invalid` MUST match and become a read-only property.
invalid:
  - |
    class FlextLdifProtocolsBase:
        class Settings(p.Cli.Settings, Protocol):
            Ldif: FlextLdifProtocolsBase.LdifSettings
  - |
    class FlextLdapProtocolsSettings:
        class Settings(FlextLdifProtocols.Ldif.Settings, Protocol):
            Ldap: FlextLdapProtocolsSettings.LdapSettings
