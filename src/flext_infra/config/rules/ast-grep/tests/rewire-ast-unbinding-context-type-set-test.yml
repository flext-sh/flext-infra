id: rewire-ast-unbinding-context-type-set
# `valid` MUST NOT match: the constants owner is already read, the set differs,
# or the construct is not an isinstance check.
valid:
  - ok = isinstance(node, c.Infra.AST_UNBINDING_CONTEXT_TYPES)
  - ok = isinstance(node, ast.Store | ast.Load)
  - kinds = (ast.Del, ast.Store)
# `invalid` MUST match: the exact node set spelled inline.
invalid:
  - ok = isinstance(node, ast.Store | ast.Del)
  - ok = isinstance(node, (ast.Del, ast.Store))
