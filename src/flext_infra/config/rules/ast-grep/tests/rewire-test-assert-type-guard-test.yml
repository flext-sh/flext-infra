id: rewire-test-assert-type-guard
# Every rewrite requires an admissible `tm` binding at the occurrence.
valid:
- |
  from other_library import tm
  assert isinstance(self.value, Entry)
- |
  def check(tm: object) -> None:
      assert isinstance(self.value, Entry)
- |
  from flext_tests import tm
  assert value is None
- |
  from flext_tests import tm
  assert isinstance(value, Entry)
- |
  from flext_tests import tm
  if not (isinstance(value, Entry)):
      raise AssertionError
invalid:
- assert isinstance(self.value, Entry)
- |
  from flext_tests import tm
  assert isinstance(self.value, Entry)
- |
  from flext_tests import tm
  assert isinstance(value, (Entry, Schema))
- |
  from tests import tm
  if not (isinstance(self.value, Entry)):
      raise AssertionError
- |
  from tests import tm
  if not (isinstance(value, (Entry, Schema))):
      raise AssertionError
