id: rewire-test-assert-truth
valid:
- |
  from other_library import tm
  assert path.is_file()
- |
  def check(tm: object, path: object) -> None:
      assert path.is_file()
- |
  from tests import tm
  assert path.is_file(), "missing"
- |
  from tests import tm
  assert not path.exists()
- |
  from tests import tm
  assert value is not None
- |
  from tests import tm
  assert isinstance(value, Entry)
- |
  from tests import tm
  try:
      run()
  except ValueError:
      assert handled
- |
  from tests import tm
  assert (
      left in right
  )
- |
  from tests import tm
  assert verdict() or unexpected()
invalid:
- assert path.is_file()
- |
  from flext_tests import tm
  def check():
      assert verdict()
- |
  from tests import tm
  assert path.is_file()
- |
  from tests import tm
  assert 0 < count < limit
