# The facade class is the one its module declares in __all__; the
# facade-module and family- file scopes narrow findings only in a native stage.
valid:
- |
  class FlextMeltanoModels(m):
      pass
  __all__ = ["FlextMeltanoModels"]
- |
  class FlextMeltanoModels(FlextCliModels, m):
      pass
# __all__ string-form membership is semantic (rope: public_export_names_source owns it; bead flext-wjxd7) — not expressible as ast-grep textual equality.
invalid:
