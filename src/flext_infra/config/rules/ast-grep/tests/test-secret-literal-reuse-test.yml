id: test-secret-literal-reuse
# `valid` MUST NOT match: no binding precedes the value, or the value only
# appears outside credential positions.
valid:
  - |
    def test_unbound() -> None:
        settings = make({"password": "x"})
        tm.that(settings.password, eq="x")
  - |
    def test_other_values() -> None:
        password = secrets.token_urlsafe()
        settings = make({"username": "test"})
        tm.that(settings.username, eq="test")
# `invalid` MUST match: every credential position of the bound value.
invalid:
  - |
    def test_round_trip() -> None:
        password = secrets.token_urlsafe()
        settings = make({"Db": {"username": "test", "password": "test"}})
        tm.that(settings.Db.username, eq="test")
        tm.that(settings.Db.password, eq="test")
