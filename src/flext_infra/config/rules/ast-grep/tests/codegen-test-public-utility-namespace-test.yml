id: codegen-test-public-utility-namespace
# The owner resolves through the module's own import (utils/tests-utilities-owner.yml)
# and `u` binds the same facade (utils/tests-u-bound.yml).
valid:
  - u.CodegenTestSupport.Ci
  - 'payload = "utilities.TestsFlextInfraUtilities.CodegenTestSupport.Ci"'
  - 'kind: Literal["utilities.TestsFlextInfraUtilities.CodegenTestSupport.Ci"]'
  # Without u bound, the binding-required rule owns the finding.
  - |
    from tests import utilities
    utilities.TestsFlextInfraUtilities.CodegenTestSupport.Ci
  # An unimported owner resolves nowhere.
  - |
    from tests import u
    utilities.TestsFlextInfraUtilities.CodegenTestSupport.Ci
invalid:
  - |
    from tests import u, utilities
    utilities.TestsFlextInfraUtilities.CodegenTestSupport.Ci
  - |
    import tests.utilities
    from tests import u
    tests.utilities.TestsFlextInfraUtilities.CodegenTestSupport.Ci
