id: rewire-yaml-text-read-to-path-reader
valid:
# Path-based owners, and text parsers fed by text that is not a file read.
- documents = u.Cli.yaml_load_documents(rule).unwrap()
- payload = u.Cli.yaml_safe_load(config).unwrap()
- documents = u.Cli.yaml_parse_documents(observed.content.decode("utf-8")).unwrap()
- payload = u.Cli.yaml_parse(text).unwrap()
- payload = u.Cli.json_parse(path.read_text(encoding="utf-8"))
