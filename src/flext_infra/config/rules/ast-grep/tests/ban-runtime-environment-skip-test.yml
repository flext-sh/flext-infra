invalid:
  - |
    from tests import u

    def probe(names: tuple[str, ...]) -> None:
        missing = [name for name in names if not u.Cli.env_read(name, u.Cli.process_env()).unwrap()]
        if missing:
            u.Tests.skip(f"secret missing: {missing}")
