    written = FlextInfraMisePublication.publish_file_plan(
        planned,
        phase=c.Infra.CodegenStagedFilePhase.LAYOUT,
    )
  - |
    published = FlextInfraMisePublication.publish_file_plan(planned, phase="version-file")
