id: rewire-mod-scan-selection
valid:
  # Another engine's scan is not the mod engine's.
  - OtherEngine.scan(root, fix=False, rule_ids=rules, plan=plan)
  - FlextInfraModGateEngine.scan(root, fix=False, selection=rules)
  - FlextInfraModGateEngine.scan(root, fix=False, rule_ids=rules, selection=rules)
  - FlextInfraModGateEngine.scan(root, fix=False, plan=plan, rule_ids=rules)
  - FlextInfraModGateEngine.scan(root, fix=False, selection=other(argument=rules))
invalid:
  - FlextInfraModGateEngine.scan(root, fix=False, rule_ids=rules)
  - FlextInfraModGateEngine.scan(root, fix=False, plan=plan)
  - |
    FlextInfraModGateEngine.scan(
        root, fix=False,
        rule_ids=rules,  # Keep the argument comment.
    )
  - FlextInfraModGateEngine.scan(root, fix=False, rule_ids=choose(plan=plan))
