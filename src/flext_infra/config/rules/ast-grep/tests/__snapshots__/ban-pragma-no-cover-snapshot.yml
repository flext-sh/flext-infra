id: ban-pragma-no-cover
snapshots:
  ? |-
    def unreachable():  # pragma: no cover
        raise RuntimeError
  : fixed: "def unreachable():  \n    raise RuntimeError"
    labels:
    - source: '# pragma: no cover'
      style: primary
      start: 20
      end: 38
  ? |-
    if TYPE_CHECKING:  # pragma:no cover
        pass
  : fixed: "if TYPE_CHECKING:  \n    pass"
    labels:
    - source: '# pragma:no cover'
      style: primary
      start: 19
      end: 36
