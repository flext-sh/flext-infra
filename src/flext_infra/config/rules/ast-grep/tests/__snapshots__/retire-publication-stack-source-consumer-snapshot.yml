id: retire-publication-stack-source-consumer
snapshots:
  ? |
    with cls._semantic_source_project(
        rope_workspace.rope_project
    ) as source_project:
        captured = load(source_project)
  : fixed: |+
      source_project = rope_workspace.rope_project
      captured = load(source_project)

    labels:
    - source: |-
        with cls._semantic_source_project(
            rope_workspace.rope_project
        ) as source_project:
            captured = load(source_project)
      style: primary
      start: 0
      end: 123
  ? |
    with cls._semantic_source_project(workspace.rope_project) as source_project:
        for rule in rules:
            check(rule, source_project)
  : fixed: |+
      source_project = workspace.rope_project
      for rule in rules:
          check(rule, source_project)

    labels:
    - source: |-
        with cls._semantic_source_project(workspace.rope_project) as source_project:
            for rule in rules:
                check(rule, source_project)
      style: primary
      start: 0
      end: 135
