id: remove-orphan-keyword-separator
snapshots:
  ? |
    def f(
        self,
        root,
        *,
    ) -> None: ...
  : fixed: |
      def f(
          self,
          root,
          ,
      ) -> None: ...
    labels:
    - source: '*'
      style: primary
      start: 31
      end: 32
    - source: |-
        (
            self,
            root,
            *,
        )
      style: secondary
      start: 5
      end: 35
  ? |
    def f(a, *,): ...
