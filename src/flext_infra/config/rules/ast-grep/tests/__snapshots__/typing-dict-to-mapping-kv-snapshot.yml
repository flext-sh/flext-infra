  : fixed: |
      from flext_core import m, t, u
      from typing import Annotated, Dict, TypeAliasType, get_args, get_origin
      from typing_extensions import TypeForm
      LEGACY = Dict[str, int]
      FACTORY = dict[str, int]
      type Contract = Annotated[t.DictKV[str, int], LEGACY]
      class LegacyBase(Dict[str, int]): ...
      # The model field obeys the runtime model law (dict origins are rejected in
      # pydantic fields: MappingKV + u.empty factory); value positions keep the
      # concrete dict contract this rule preserves.
      class Payload(m.ArbitraryTypesModel):
          values: t.MappingKV[str, int] = m.Field(description="test values", default_factory=u.empty(TypeForm(t.MappingKV[str, int])))
      def make(values: Dict[str, int] = u.empty(TypeForm(t.DictKV[str, int]))()) -> Dict[str, int]:
          return values
      assert get_origin(LEGACY) is dict
      assert FACTORY() == {}
      assert isinstance(LegacyBase(), dict)
      annotated_type, metadata = get_args(Contract.__value__)
      assert metadata is LEGACY
      assert Payload().values == {}
      assert Payload().values is not Payload().values
      payload = Payload()
      payload.values["example"] = 1
      assert payload.values["example"] == 1
      payload.values.update({"updated": 2})
      assert payload.values.copy() | {"last": 3} == {"example": 1, "updated": 2, "last": 3}
      payload.values |= {"last": 3}
      assert payload.values.pop("last") == 3
      assert Payload.model_validate({"values": {"input": "4"}}, strict=False).values == {"input": 4}
      assert Payload.model_validate_json(payload.model_dump_json()).values == payload.values
      assert make() == {}
      for annotation in (annotated_type, make.__annotations__["values"], make.__annotations__["return"]):
          origin = get_origin(annotation)
          # PEP 695 aliases retain identity while their values own concrete origins.
          while isinstance(origin, TypeAliasType):
              origin = get_origin(origin.__value__)
          assert origin is get_origin(LEGACY)
          assert get_args(annotation) == get_args(LEGACY)
