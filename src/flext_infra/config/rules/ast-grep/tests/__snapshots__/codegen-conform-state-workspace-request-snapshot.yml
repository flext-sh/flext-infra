    FlextInfraCodegenConform(repository_root=root, initial_workspace=workspace, request=request)
  : fixed: |
      FlextInfraCodegenConform(
          repository_root=root,
          state=m.Infra.CodegenConformState(
              repository_root=root,
              initial_workspace=workspace,
              request=request,
          ),
      )
    labels:
    - source: FlextInfraCodegenConform(repository_root=root, initial_workspace=workspace, request=request)
      style: primary
      start: 0
      end: 92
