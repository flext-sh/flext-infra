id: ban-git-ancestry-scope-walk
snapshots:
  "while True:\n    if (current / \".git\").exists():\n        return current\n    parent = current.parent\n    if parent == current:\n        return None\n    current = parent\n":
    labels:
    - source: |-
        while True:
            if (current / ".git").exists():
                return current
            parent = current.parent
            if parent == current:
                return None
            current = parent
