id: rewire-pytest-constant-to-tests-constants
snapshots:
  ? |
    @pytest.mark.slow
    def test_value() -> None: ...
  : fixed: |
      @c.Tests.MARK.slow
      def test_value() -> None: ...
    labels:
    - source: pytest.mark
      style: primary
      start: 1
      end: 12
    - source: pytest
      style: secondary
      start: 1
      end: 7
    - source: mark
      style: secondary
      start: 8
      end: 12
