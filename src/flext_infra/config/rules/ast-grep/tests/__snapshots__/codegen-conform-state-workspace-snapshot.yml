id: codegen-conform-state-workspace
snapshots:
  ? |
    FlextInfraCodegenConform(repository_root=root, initial_workspace=workspace)
  : fixed: |
      FlextInfraCodegenConform(
          repository_root=root,
          state=m.Infra.CodegenConformState(
              repository_root=root,
              initial_workspace=workspace,
          ),
      )
    labels:
    - source: FlextInfraCodegenConform(repository_root=root, initial_workspace=workspace)
      style: primary
      start: 0
      end: 75
