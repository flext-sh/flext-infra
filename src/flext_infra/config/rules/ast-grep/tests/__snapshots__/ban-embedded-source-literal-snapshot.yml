id: ban-embedded-source-literal
snapshots:
  ? |
    SCAFFOLD: Final[str] = "from __future__ import annotations\n\nclass X:\n    pass\n"
  : labels:
    - source: '"from __future__ import annotations\n\nclass X:\n    pass\n"'
      style: primary
      start: 23
      end: 83
  ? |
    code = (
        "from flext_cli import u\n"
        "e = {'b': ('c',)}\n"
        "print(u.Cli.dag_waves(e).error)\n"
    )
  : labels:
    - source: |-
        "from flext_cli import u\n"
            "e = {'b': ('c',)}\n"
            "print(u.Cli.dag_waves(e).error)\n"
      style: primary
      start: 13
      end: 106
  ? |
    module = """
    class FlextDemo:
        pass
    """
  : labels:
    - source: |-
        """
        class FlextDemo:
            pass
        """
      style: primary
      start: 9
      end: 42
  ? |
    path.write_text("def main() -> int:\n    return 0\n", encoding="utf-8")
  : labels:
    - source: '"def main() -> int:\n    return 0\n"'
      style: primary
      start: 16
      end: 52
  ? |
    source = "import os\nVALUE = os.sep\n"
  : labels:
    - source: '"import os\nVALUE = os.sep\n"'
      style: primary
      start: 9
      end: 38
