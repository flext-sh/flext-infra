id: codegen-conform-state-ports
snapshots:
  ? |
    FlextInfraCodegenConform(repository_root=root, ports=ports)
  : fixed: |
      FlextInfraCodegenConform(
          repository_root=root,
          state=m.Infra.CodegenConformState(
              repository_root=root,
              ports=ports,
          ),
      )
    labels:
    - source: FlextInfraCodegenConform(repository_root=root, ports=ports)
      style: primary
      start: 0
      end: 59
