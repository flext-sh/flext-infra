id: overload-unused-parameter-read
snapshots:
  "from typing import TYPE_CHECKING, overload\n\nclass Collection:\n    @overload\n    @staticmethod\n    def map[T, U](\n        items: tuple[T, ...]\n        mapper,\n    ) -> tuple[U, ...]:\n        _ = items, mapper\n        raise NotImplementedError\n":
    fixed: |
      from typing import TYPE_CHECKING, overload
      
      class Collection:
          @overload
          @staticmethod
          def map[T, U](
              items: tuple[T, ...]
              mapper,
          ) -> tuple[U, ...]:
              raise NotImplementedError
