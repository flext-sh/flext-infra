id: dict-annotation-field-contract
valid:
  - |
    from flext_core import t
    class Payload:
        values: t.MappingKV[str, int]
  - |
    from flext_core import t
    def f(x: dict[str, int]) -> None: ...
  - |
    from flext_core import t
    FACTORY = dict[str, int]
invalid:
  - |
    from flext_core import t
    class Payload:
        values: dict[str, int]
  - |
    from flext_core import t
    REGISTRY: dict[str, int] = {}
  - |
    from flext_core import t
    type Table = dict[str, int]
