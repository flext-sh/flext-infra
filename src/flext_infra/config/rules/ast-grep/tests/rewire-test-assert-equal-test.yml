id: rewire-test-assert-equal
valid:
- |
  from other_library import tm
  assert left == right
- |
  def check(tm: object) -> None:
      assert left == right
- |
  from tests import tm
  assert left == right, "message"
invalid:
- assert left == right
- |
  from tests import tm
  assert left == right
- |
  from tests import tm
  assert len(lines) == _EXPECTED_LINES
- |
  from tests import tm
  assert (
      "a long expected fragment"
      == observed
  )
