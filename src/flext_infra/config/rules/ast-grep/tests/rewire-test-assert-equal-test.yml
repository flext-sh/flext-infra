id: rewire-test-assert-equal
valid:
- assert left == right
- |
  from tests import tm
  assert left == right, "message"
invalid:
- |
  from tests import tm
  assert left == right
- |
  from tests import tm
  assert len(lines) == _EXPECTED_LINES
- |
  from tests import tm
  assert (
      "a long expected fragment"
      == observed
  )
