id: rewire-ast-assignment-type-set
# `valid` MUST NOT match: the constants owner is already read, the set differs,
# or the construct is not an isinstance check.
valid:
  - ok = isinstance(node, c.Infra.AST_ASSIGNMENT_TYPES)
  - ok = isinstance(node, ast.Assign | ast.AnnAssign | ast.TypeAlias)
  - kinds = (ast.AnnAssign, ast.Assign)
# `invalid` MUST match: the exact node set spelled inline.
invalid:
  - ok = isinstance(node, ast.Assign | ast.AnnAssign)
  - ok = isinstance(node, (ast.AnnAssign, ast.Assign))
