id: rewire-raw-model-config-dict
# `valid` MUST NOT match: already a ConfigDict call, or another name assigned a
# dict. Fixtures carry no file scope: the models family and layer zero are
# scoped out only in a native stage.
valid:
- |
  from flext_core import m, p
  class Spec(m.FrozenModel):
      model_config = m.ConfigDict(frozen=True)
- |
  from flext_core import m, p
  settings = {"frozen": True}
# `invalid` MUST match: raw dict configs, whether or not the module binds `m`
# yet (the generated import header binds it).
invalid:
- |
  from flext_core import m, p
  class Spec(m.FrozenModel):
      model_config = {"frozen": False}
- |
  from flext_core import m, p
  class Spec(m.FrozenModel):
      model_config: ClassVar = {"populate_by_name": True, "extra": "forbid"}
- |
  class Spec:
      model_config = {"frozen": True}
