id: dict-annotation-to-dict-kv
valid:
  - |
    from flext_core import t
    def f(x: dict[str, int]) -> dict[str, int]: ...
  # runtime values are not type nodes
  - |
    from flext_core import t
    def f() -> None:
        value = dict[str, int]()
  # outside a function: owned by dict-annotation-field-contract
  - |
    from flext_core import t
    class Payload:
        values: dict[str, int]
  # no canonical t binding: owned by dict-annotation-missing-t-import
  - |
    def f(x: dict[str, int]) -> None: ...
  # a PEP 695 type parameter rebinds `t`: the facade binding is not certified
  - |
    from flext_core import t
    def f[t](x: dict[str, int]) -> None: ...
  # the typings family declares the alias
  - |
    from flext_core import t
    def f(x: Mapping[str, int]) -> None: ...
invalid:
  - |
    from flext_core import t
    def f(x: dict[str, int]) -> None: ...
  - |
    from flext_core import t
    def f() -> dict[str, int]: ...
  - |
    from flext_core import t
    def f() -> dict[str, t.JsonValue]: ...
  - |
    from flext_core import t
    def f() -> None:
        acc: dict[str, int] = {}
  - |
    from flext_core import t
    class Owner:
        def method(self, value: dict[str, int] | None = None) -> None: ...
