# The captured alias is one of the fixture project's runtime aliases
# (fixture-utils/local-alias.yml). __all__ membership is not this rule's
# concern: a literal __all__ cannot be read by the rule (utils/declared-in-
# module-all.yml), so the canonical `c = <class this module defines>` binding
# is valid whatever its __all__ shape (operator decision, 2026-11-03).
id: ban-runtime-alias-rebind
valid:
- |
  from flext_core import FlextModels, m
  class AiHubModels(FlextModels):
      pass
  m = AiHubModels
  __all__ = ["AiHubModels", "m"]
# ENFORCE-046 Pattern-A: an imported letter rebound to the consumer-named
# class the module defines and declares.
# A name that is no runtime alias of the project is out of scope.
- |
  class FlextFooConstants:
      pass
  limit = FlextFooConstants
- |
  class FlextFooConstants:
      pass
  c = FlextFooConstants
  __all__ = ["FlextFooConstants", "c"]
- |
  from flext_core import c
  __all__ = ["c"]
- |
  class FlextFooConstants:
      LIMIT = 3
invalid:
- |
  class FlextFooConstants:
      pass
  c = FlextFooConstants
  c = FlextFooConstants
  __all__ = ["FlextFooConstants", "c"]
- |
  from flext_core import FlextConstants
  c = FlextConstants
  __all__ = ["c"]
- |
  from flext_core import s
  class FlextFooServiceBase(s):
      pass
  s = FlextFooServiceBase
  __all__ = ["FlextFooServiceBase", "s"]
- |
  from flext_core import FlextSettings, s
  class FlextFooServiceBase(s):
      pass
  s = FlextFooServiceBase
  __all__ = ["FlextFooServiceBase", "s"]
- |
  from flext_core import FlextSettings, FlextService as s
  class FlextFooServiceBase(s):
      pass
  s = FlextFooServiceBase
  __all__ = ["FlextFooServiceBase", "s"]
- |
  from flext_core import FlextService as s
  class FlextFooServiceBase(s):
      pass
  s = FlextFooServiceBase
  __all__ = ["FlextFooServiceBase", "s"]
# A peer-named target stays a finding even in a consumer-style module.
- |
  from flext_cli import p
  class FlextFooProtocols(p):
      pass
  p = FlextFooProtocols
  __all__ = ["FlextFooProtocols", "p"]
