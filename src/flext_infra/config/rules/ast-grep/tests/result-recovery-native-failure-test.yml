id: result-recovery-native-failure
valid:
  - |
    if result.success:
        return recover(layout, result.error or "context")
  - |
    if other.failure:
        return recover(layout, result.error or "context")
  - |
    if result.failure:
        return recover(layout, result.error or compute_context())
  - |
    if result.failure:
        return recover(layout, result.error or "context", exception=other.exception, error_code=result.error_code, error_data=result.error_data)
  - |
    if result.failure:
        result = other
        return recover(layout, result.error or "context")
  - |
    if result.failure:
        return recover(layout, result, context="context")
  - |
    if owner.result.failure:
        return recover(layout, owner.result.error or "context", exception=owner.result.exception, error_code=owner.result.error_code, error_data=owner.result.error_data)
  - |
    if produce().failure:
        return recover(layout, produce().error or "context")
  - |
    if result.failure:
        return recover(layout, result.error or f"{context()}")
invalid:
  - |
    if result.failure:
        return recover(layout, result.error or "context")
  - |
    if result.failure:
        return target.from_failure(
            self.recover(
                current.plan.layout,
                result.error or f"cannot stage {phase}",
                exception=result.exception,
                error_code=result.error_code,
                error_data=result.error_data,
            ),
        )
