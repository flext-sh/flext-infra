id: ban-manual-protocol-outside-protocols
# A declared protocol names a typing construct among its direct bases
# (utils/typing-base-class.yml): a bare name counts only when imported from
# typing or typing_extensions, under that name or an alias.
valid:
  - |
    class Plain:
        pass
  - |
    from typing import Protocol
    def build() -> type:
        class Local(Protocol):
            def run(self) -> None: ...
        return Local
  - |
    class Metadata:
        class Field:
            label: str
        @property
        def protocol(self) -> str:
            return "Protocol"
  # Implementing a class is not declaring a protocol.
  - |
    class Service(Base):
        pass
  # An unimported name is no typing construct.
  - |
    class Reader(Protocol):
        def read(self) -> str: ...
invalid:
  - |
    from typing import Protocol
    class Reader(Protocol):
        def read(self) -> str: ...
  - |
    from typing import Protocol, TypeVar
    class Box(Protocol[T]):
        def get(self) -> T: ...
  - |
    class Writer(typing.Protocol):
        def write(self, data: str) -> None: ...
  - |
    from typing import Protocol as Contract
    class Reader(Contract):
        def read(self) -> str: ...
  - |
    from typing import Protocol as Contract
    class Root:
        class Input(Contract):
            @property
            def value(self) -> str: ...
