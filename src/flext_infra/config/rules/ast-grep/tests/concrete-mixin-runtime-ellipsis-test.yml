id: concrete-mixin-runtime-ellipsis
# Protocol classes (typing-base-class) and abstractmethod/overload
# declarations (declaration-decorated) keep their declarations, aliases
# included; the guard is the typing.TYPE_CHECKING flag (type-checking-flag).
valid:
  - |
    from typing import Protocol as Contract
    class ReaderMixin(Contract):
        def read(self) -> str: ...
  - |
    from abc import ABC, abstractmethod as required
    class ReaderMixin(ABC):
        @required
        def read(self) -> str: ...
  - |
    from typing import overload as signature
    class Runtime:
        if TYPE_CHECKING:
            @signature
            def select(self, value: int) -> int: ...
            @signature
            def select(self, value: str) -> str: ...
        def select(self, value: int | str) -> int | str:
            return value
  - |
    class Runtime:
        if DEBUG:
            def process(self, value: str) -> str:
                del value
  - |
    class RuntimeMixin:
        def run(self) -> int:
            return 0
  - |
    class RuntimeProtocol(Protocol):
        def run(self) -> int: ...
  - |
    class AbstractReader(ABC):
        @abstractmethod
        def run(self) -> int: ...
  - |
    from typing import overload

    @overload
    def run(value: int) -> str: ...
  - |
    if TYPE_CHECKING:
        from pathlib import Path
    class Runtime:
        if TYPE_CHECKING:
            type Paths = tuple[Path, ...]
        def run(self, value: int) -> int:
            return value
  - |
    class RuntimeMixin:
        class RuntimeProtocol(Protocol):
            def run(self) -> int: ...
  - |
    class Runtime:
        def discard(self, value: int) -> None:
            del value
  - |
    class Runtime:
        def run(self) -> int:
            def deferred() -> int: ...
            return 1
  - |
    class Runtime:
        if TYPE_CHECKING:
            def run(self, value: int) -> int:
                del value
                return 1
invalid:
  - |
    class RuntimeMixin:
        def run(self) -> int: ...
  - |
    class Runtime:
        if TYPE_CHECKING:
            @property
            def source_project(self) -> Project: ...
  - |
    class Runtime:
        if typing.TYPE_CHECKING:
            @staticmethod
            def generated(content: bytes | None) -> bool:
                del content
  - |
    class Runtime:
        if TYPE_CHECKING:
            def cleanup(self, plan: Plan) -> Result:
                del plan
                raise NotImplementedError(type(self).__qualname__)
  - |
    from typing import TYPE_CHECKING as types_only
    class Runtime:
        if types_only:
            def process(self, state, *, dry_run):
                del state, dry_run
  - |
    if TYPE_CHECKING:
        class Runtime:
            def run(self) -> int: ...
  - |
    # AUTO-GENERATED FILE
    class Runtime:
        if TYPE_CHECKING:
            @classmethod
            def process(cls, value: str) -> str:
                del value
  - |
    class Runtime:
        if TYPE_CHECKING:
            async def process(self, value: str) -> str:
                del value
  - |
    class Runtime:
        if TYPE_CHECKING:
            def process(self, value: str) -> str:
                """A copied signature is still a shell."""
                del value
