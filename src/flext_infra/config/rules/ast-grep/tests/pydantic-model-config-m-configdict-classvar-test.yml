id: pydantic-model-config-m-configdict-classvar
valid:
  - |
    class Model:
        model_config: ClassVar[t.ConfigDict] = m.ConfigDict(frozen=True)
  - |
    class Settings:
        model_config: ClassVar[t.SettingsConfigDict] = m.SettingsConfigDict()
  - |
    class Base:
        model_config: ClassVar[t.ConfigDict] = FlextModelsPydantic.ConfigDict()
  - |
    class Model:
        model_config = other.ConfigDict()
invalid:
  - |
    class Model:
        model_config = m.ConfigDict(frozen=True, extra='forbid')
  - |
    class Model:
        model_config = m.ConfigDict()
  - |
    class Settings:
        model_config = m.SettingsConfigDict(env_prefix='APP_')
  - |
    class Base:
        model_config = FlextModelsPydantic.ConfigDict(frozen=True)
