# Shape only: the engine admits a finding when the imported module's root is
# the scanned project's own package (context own-package). The law is per
# letter: this producer tree bans only its own letter `c` — a different
# letter from the own root is facade assembly (consumption-law.md:52) and
# stays legal.
id: ban-constants-own-letter-import
valid:
  - |
    from ai_hub import cextra as c
  - |
    from c import unrelated
  # A different letter from the own root is legal facade assembly.
  - |
    from ai_hub import settings
  # The canonical producer form: the sibling through its private submodule.
  - |
    from ai_hub._constants.base import AiHubConstantsBase
  # A non-letter root binding is the public class export, not a letter.
  - |
    from ai_hub import AiHubSettings
  # The letter regex is anchored: a name that merely starts with the letter is
  # a different binding.
  - |
    from ai_hub import cextra
  # A root binding without a letter component reaches no family facade.
  - |
    import ai_hub
invalid:
  - |
    from typing import TYPE_CHECKING
    if TYPE_CHECKING:
        from ai_hub import c as aliased
  - |
    from ai_hub import c as aliased
  - |
    def load() -> None:
        from ai_hub import c
  - |
    from typing import TYPE_CHECKING
    if TYPE_CHECKING:
        from ai_hub import c
  - |
    import ai_hub.constants
  # The producer binds its own letter from the own root.
  - |
    from ai_hub import c
  - |
    from ai_hub import c, t
  # The plain-import form reaches the letter as a submodule of the root.
  - |
    import ai_hub.c
