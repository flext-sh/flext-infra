    settings = make({"oauth_token_url": "https://identity.example/oauth2/v1/token"})
  - |
    def test_admin(credential: str) -> None:
        auth.register(password=f"{credential}-admin")
  - |
    settings = make({"username": "app", "service_name": "TEST"})
  - |
    def test_short_secret_is_rejected() -> None:
        with u.Tests.raises(c.ValidationError):
            _ = settings.clone(Web={"secret_key": "short"})
