id: test-secret-literal
# `valid` MUST NOT match: no credential literal, a deliberate rejected input,
# an identity, a generated module, a value another function asserts, a value
# the bind rule shares, an already generated value, or a parameter default.
valid:
  - |
    auth.register_user(username="", email="invalid_email", password="")
