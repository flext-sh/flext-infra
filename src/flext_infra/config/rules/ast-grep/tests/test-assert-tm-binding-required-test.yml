id: test-assert-tm-binding-required
# A bare assert is a finding only where no `tm` binding to the flext-tests
# matchers exists (utils/tm-imported-from-flext.yml): there the tm rewrites
# repair it instead.
valid:
  - tm.that(condition, truth=True)
  - |
    def consume(value: str | None) -> str:
        assert value is not None
        return value.upper()
  - |
    def consume(value: str | int) -> str:
        assert isinstance(value, str)
        return value.upper()
  - assert value is None
  - assert observed == expected, details()
  - |
    from tests import tm
    assert left == right
invalid:
  - assert condition
  - |
    from other_library import tm
    assert left == right
