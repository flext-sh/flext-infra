id: ban-embedded-source-literal
valid:
  - |
    def render() -> str:
        """Render the module.

        Example::

            from flext_infra import u
            u.Infra.render()
        """
        return u.Cli.template_render(path, context)
  - |
    payload = '[project]\nname = "sample"\ndependencies = ["owned>=2"]\n'
  - |
    message = "import failed: missing module"
  - |
    source = tm.ok(u.Tests.fixture_text("lazy_init/owner.py"))
  - |
    text = "line one\nline two\n"
  - |
    error = (
        "import supplier differs from the selected lock: "
        f"{name}\n"
    )
  - |
    report = f"cwd={root}\nreturn-code={code}\n"
  - |
    message = (
        "a long error message split by the formatter "
        "over two lines without line breaks"
    )
  - two = "first line\n" "second line\n"
invalid:
  - source = f"value = {name!r}\n" f"other = 1\n" f"third = 2\n"
  - |
    code = (
        "from flext_cli import u\n"
        "e = {'b': ('c',)}\n"
        "print(u.Cli.dag_waves(e).error)\n"
    )
  - |
    source = "import os\nVALUE = os.sep\n"
  - |
    module = """
    class FlextDemo:
        pass
    """
  - |
    path.write_text("def main() -> int:\n    return 0\n", encoding="utf-8")
  - |
    SCAFFOLD: Final[str] = "from __future__ import annotations\n\nclass X:\n    pass\n"
