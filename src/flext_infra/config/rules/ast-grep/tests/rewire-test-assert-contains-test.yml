id: rewire-test-assert-contains
valid:
- |
  from other_library import tm
  assert left in right
- |
  def check(tm: object) -> None:
      assert left in right
- |
  from tests import tm
  assert left in right, "message"
invalid:
- assert left in right
- |
  from tests import tm
  assert left in right
- |
  from tests import tm
  assert (
      "a long expected fragment"
      in observed
  )
