id: rewire-ast-name-reference-type-set
# `valid` MUST NOT match: the constants owner is already read, the set differs,
# or the construct is not an isinstance check.
valid:
  - ok = isinstance(node, c.Infra.AST_NAME_REFERENCE_TYPES)
  - ok = isinstance(node, ast.Name | ast.Attribute | ast.Call)
  - kinds = (ast.Attribute, ast.Name)
# `invalid` MUST match: the exact node set spelled inline.
invalid:
  - ok = isinstance(node, ast.Name | ast.Attribute)
  - ok = isinstance(node, (ast.Attribute, ast.Name))
