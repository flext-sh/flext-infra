id: facade-constant-classvar-import-new
# `valid` MUST NOT match: a typing import already exists, or the module
# declares no annotated constant on a module-level class.
valid:
  - |
    from __future__ import annotations
    from typing import Final
    class FlextThingConstants:
        RETRIES: Final[int] = 30
  - |
    from __future__ import annotations
    class FlextThingConstants:
        RETRIES = 30
  - |
    from __future__ import annotations
    class FlextThingConstants:
        class Inner:
            RETRIES: int = 30
# `invalid` MUST match and add the typing import.
invalid:
  - |
    from __future__ import annotations
    class FlextThingConstants:
        RETRIES: int = 30
  - |
    from __future__ import annotations
    import re
    class FlextThingConstants:
        NAME: str = "x"
