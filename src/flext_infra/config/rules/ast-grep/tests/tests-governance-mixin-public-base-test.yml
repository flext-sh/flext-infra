id: tests-governance-mixin-public-base
# `valid` MUST NOT match: already renamed, or an unrelated local class of the
# same name (no flext_tests import).
valid:
- |
  from flext_tests import FlextTestsModuleGovernance
  class TestsGov(FlextTestsModuleGovernance):
      pass
- |
  class ModuleGovernanceMixin:
      pass
  class TestsGov(ModuleGovernanceMixin):
      pass
invalid:
- |
  from flext_tests.utilities import ModuleGovernanceMixin
  class TestsGov(ModuleGovernanceMixin):
      pass
