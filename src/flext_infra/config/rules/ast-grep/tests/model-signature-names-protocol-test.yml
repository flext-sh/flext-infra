id: model-signature-names-protocol
valid:
  - "class A(m.FrozenModel):\n    other: FlextInfraModelsX.Leaf"
  - "def f(x: p.Infra.Leaf) -> p.Infra.Leaf: ..."
  - "def f(kind: type[FlextInfraModelsX.Leaf]) -> None: ..."
  - "class A(m.FrozenModel):\n    @m.computed_field\n    @property\n    def leaves(self) -> Mapping[str, FlextInfraModelsX.Leaf]: ..."
invalid:
  - "def f(x: FlextInfraModelsConfigMake.Leaf) -> None: ..."
  - "def f() -> FlextInfraModelsX.Leaf: ..."
  - "class A(m.FrozenModel):\n    def build(self, leaf: FlextInfraModelsX.Leaf) -> tuple[FlextInfraModelsX.Leaf, ...]: ..."
