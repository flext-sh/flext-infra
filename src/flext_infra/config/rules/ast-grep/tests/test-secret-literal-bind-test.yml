id: test-secret-literal-bind
# `valid` MUST NOT match: the value does not repeat, the function already
# binds the key's name, or the key cannot name a local.
valid:
  - |
    def test_single() -> None:
        settings = make({"password": "pass"})
        tm.that(settings.username, eq="pass")
  - |
    def test_bound(password: str) -> None:
        settings = make({"password": "zz"})
        tm.that(settings.password, eq="zz")
  - |
    def test_already_bound() -> None:
        password = secrets.token_urlsafe()
        settings = make({"password": "zz"})
        tm.that(settings.password, eq="zz")
  - |
    def test_environment() -> None:
        env = {"ORACLE_PASSWORD": "pw"}
        tm.that(load(env).password, eq="pw")
# `invalid` MUST match: the first statement that gives a credential literal
# a later statement gives or asserts again.
invalid:
  - |
    def test_round_trip() -> None:
        """Values round-trip."""
        settings = make({"Db": {"username": "app", "password": "apppass"}})
        tm.that(settings.Db.username, eq="app")
        tm.that(settings.Db.password, eq="apppass")
  - |
    def test_register_then_login() -> None:
        auth.register(user="someone", password="pw1")
        tm.ok(auth.login(user="someone", password="pw1"))
