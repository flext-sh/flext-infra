id: rewire-cst-import-type-set
# `valid` MUST NOT match: the constants owner is already read, the set differs,
# or the construct is not an isinstance check.
valid:
  - ok = isinstance(node, c.Infra.CST_IMPORT_TYPES)
  - ok = isinstance(node, c.Infra.Cst.Import | c.Infra.Cst.ImportAlias)
  - kinds = (c.Infra.Cst.Import, c.Infra.Cst.ImportFrom)
# `invalid` MUST match: the exact node set spelled inline.
invalid:
  - ok = isinstance(node, c.Infra.Cst.Import | c.Infra.Cst.ImportFrom)
  - ok = isinstance(node, (c.Infra.Cst.Import, c.Infra.Cst.ImportFrom))
