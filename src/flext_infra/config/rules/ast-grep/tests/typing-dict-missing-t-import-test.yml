id: typing-dict-missing-t-import
# `valid` MUST NOT match: the module binds canonical `t` (its companion owns it),
# `Dict` is not typing's, or the text is not a type node.
valid:
  - |
    from flext_core import t
    from typing import Dict
    def f(x: Dict[str, int]) -> None: ...
  - |
    from typing import Dict
    ALIAS = Dict[str, int]
    VALUE = Dict[str, int]()
    def f(factory: type = Dict[str, int]): ...
    field = Field(default_factory=Dict[str, int])
    class Derived(Dict[str, int]): ...
  - |
    from flext_core import t
    import typing
    def f(y: typing.Dict[str, int]) -> None: ...
  # locally defined Dict, no typing binding
  - |
    class Dict: ...
    def f(x: Dict[str, int]) -> None: ...
  # docstring text is not a type node
  - |
    """Rewrite ``Dict[K, V]`` to ``t.MappingKV[K, V]``."""
    from typing import Dict
# `invalid` MUST match: legacy generic with no `t` binding to rewrite into.
invalid:
  - |
    from typing import Dict
    def f(x: Dict[str, int]) -> None: ...
  - |
    import typing
    def f(y: typing.Dict[str, int]) -> None: ...
  - |
    from typing import Dict
    ALIAS: Dict[str, int] = {}
  - |
    from typing import Dict
    type ALIAS = Dict[str, int]
  - |
    import typing
    type ALIAS = typing.Dict[str, int]
  - |
    from typing import Dict
    def local():
        from flext_core import t
    value: Dict[str, int]
  - |
    from unrelated import t
    from typing import Dict
    value: Dict[str, int]
  - |
    from flext_core import u as t
    from typing import Dict
    value: Dict[str, int]
  - |
    from flext_core import t
    from typing import Dict
    def f(t, value: Dict[str, int]): ...
  - |
    from flext_core import t
    from typing import Dict
    t = None
    value: Dict[str, int]
  - |
    from flext_core import t
    from unrelated import t
    from typing import Dict
    value: Dict[str, int]
  - |
    from typing import Dict, TYPE_CHECKING
    if TYPE_CHECKING:
        from flext_core import t
    value: Dict[str, int]
