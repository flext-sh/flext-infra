id: test-secret-literal-import
# `valid` MUST NOT match: the module binds `secrets`, or does not call it.
valid:
  - |
    from __future__ import annotations

    import secrets

    settings = {"password": secrets.token_urlsafe()}
  - |
    from __future__ import annotations

    settings = {"username": "app"}
# `invalid` MUST match and bind the `secrets` module.
invalid:
  - |
    from __future__ import annotations

    from tests import tm

    settings = {"password": secrets.token_urlsafe()}
