id: rewire-test-assert-message
# Every rewrite requires an admissible `tm` binding at the occurrence.
valid:
- |
  from other_library import tm
  assert value is None, "No value is expected"
- |
  def check(tm: object) -> None:
      assert value is None, "No value is expected"
- |
  from flext_tests import tm
  assert result.success
- |
  from flext_tests import tm
  assert result.success, result.error
- |
  from flext_tests import tm
  assert value == expected, f"Unexpected value {value!r}"
- |
  from flext_tests import tm
  assert value is not None, "A value is required"
- |
  from flext_tests import tm
  assert isinstance(value, Entry), "An entry is required"
- |
  from flext_tests import tm
  if not result.success:
      raise AssertionError(result.error)
invalid:
- assert value is None, "No value is expected"
- |
  from flext_tests import tm
  assert self.value is not None, "A value is required"
- |
  from tests import tm
  assert value is None, "No value is expected"
