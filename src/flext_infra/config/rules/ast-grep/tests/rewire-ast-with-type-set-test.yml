id: rewire-ast-with-type-set
# `valid` MUST NOT match: the constants owner is already read, the set differs,
# or the construct is not an isinstance check.
valid:
  - ok = isinstance(node, c.Infra.AST_WITH_TYPES)
  - ok = isinstance(node, ast.With | ast.AsyncWith | ast.Try)
  - kinds = (ast.With, ast.AsyncWith)
# `invalid` MUST match: the exact node set spelled inline.
invalid:
  - ok = isinstance(node, ast.With | ast.AsyncWith)
  - ok = isinstance(node, (ast.With, ast.AsyncWith))
