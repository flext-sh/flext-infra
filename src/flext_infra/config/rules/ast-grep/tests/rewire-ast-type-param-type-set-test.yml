id: rewire-ast-type-param-type-set
# `valid` MUST NOT match: the constants owner is already read, the set differs,
# or the construct is not an isinstance check.
valid:
  - ok = isinstance(node, c.Infra.AST_TYPE_PARAM_TYPES)
  - ok = isinstance(node, ast.TypeVar | ast.ParamSpec)
  - kinds = (ast.TypeVar, ast.TypeVarTuple, ast.ParamSpec)
# `invalid` MUST match: the exact node set spelled inline.
invalid:
  - ok = isinstance(node, ast.TypeVar | ast.ParamSpec | ast.TypeVarTuple)
  - ok = isinstance(node, (ast.TypeVar, ast.TypeVarTuple, ast.ParamSpec))
