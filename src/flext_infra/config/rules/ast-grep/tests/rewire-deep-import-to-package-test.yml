id: rewire-deep-import-to-package
valid:
# Already imported from the publishing package, from a compose module, or from
# a package-root facade.
- from flext_infra.workspace import FlextInfraWorkspaceDetector
- from flext_infra.workspace import FlextInfraWorkspaceDetector as Detector
- from flext_ldif.models import FlextLdifModels
- from flext_ldif import ldif
# Target package without an initializer or without the name in its published
# exports: directory existence alone never rewrites (generator defect, reported
# by the detection rules).
- from flext_infra._protocols._codegen.fix import FlextInfraProtocolsCodegenFix
- from flext_infra.workspace.detector import FlextInfraRopeWorkspaceMissing
- from flext_infra.workspace.detector import FlextInfraWorkspaceDetector, FlextInfraRopeWorkspaceMissing
- from flext_infra.workspace.detector import *
# Mixed header: one statement imports an unpublished name from a module of the
# same package, so no import of that package's members moves.
- |
  from flext_infra.workspace.detector import FlextInfraWorkspaceDetector
  from flext_infra.workspace.governance import FlextInfraRopeWorkspaceMissing
- |
  from flext_infra.workspace.detector import FlextInfraWorkspaceDetector
  from flext_infra.workspace.governance import (
      FlextInfraWorkspaceGovernance,
      FlextInfraRopeWorkspaceMissing,
  )
- |
  from flext_infra.workspace.detector import FlextInfraWorkspaceDetector
  if TYPE_CHECKING:
      from flext_infra.workspace.governance import FlextInfraRopeWorkspaceMissing as Missing
# Plain module imports are not from-imports of members.
- import flext_infra.workspace.detector
- from . import detector
invalid:
# One name, aliased, many names, parenthesized: the module path alone moves.
- from flext_infra.workspace.detector import FlextInfraWorkspaceDetector
- from flext_infra.workspace.detector import FlextInfraWorkspaceDetector as Detector
- from flext_infra.workspace.detector import FlextInfraWorkspaceDetector, FlextInfraWorkspaceGovernance
- from flext_ldif.services.parser import FlextLdifParser
- |
  from flext_infra.workspace.detector import (
      FlextInfraWorkspaceDetector,
      FlextInfraWorkspaceGovernance as Governance,
  )
# A complete header: every import of the package's members moves together.
- |
  from flext_infra.workspace.detector import FlextInfraWorkspaceDetector
  from flext_infra.workspace.governance import FlextInfraWorkspaceGovernance
# A guarded import follows the same law.
- |
  if TYPE_CHECKING:
      from flext_infra.workspace.detector import FlextInfraWorkspaceDetector
