id: report-compat-deprecated-marker
valid:
  - |
    @staticmethod
    def release_specifier(version: str) -> str:
        return version
  - |
    @m.field_validator("name")
    def check(cls, value: str) -> str:
        return value
invalid:
  - |
    @warnings.deprecated("compat: old -> u.Infra.new; fix: call u.Infra.new")
    def old(value: str) -> str:
        return value
  - |
    from warnings import deprecated
    @deprecated("compat: old -> u.Infra.new; fix: call u.Infra.new")
    def old(value: str) -> str:
        return value
