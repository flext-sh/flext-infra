id: ban-arbitrary-types-allowed
# `valid` MUST NOT match: other config keys, comments, plain strings.
valid:
  - model_config = m.ConfigDict(extra="forbid", frozen=True)
  - "# arbitrary_types_allowed is banned"
  - flag = "arbitrary_types_allowed"
  - model_config = m.ConfigDict(arbitrary_types_allowed=False)
  - 'model_config = {"arbitrary_types_allowed": False}'
# `invalid` MUST match: keyword and dict-key forms.
invalid:
  - model_config = m.ConfigDict(arbitrary_types_allowed=True)
  - model_config = ConfigDict(frozen=True, arbitrary_types_allowed=True)
  - 'model_config = {"arbitrary_types_allowed": True}'
  - model_config = SettingsConfigDict(arbitrary_types_allowed=True, extra="forbid")
