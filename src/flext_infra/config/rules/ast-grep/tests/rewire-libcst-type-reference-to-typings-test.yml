id: rewire-libcst-type-reference-to-typings
# `valid` MUST NOT match: the typings alias is already read, the reference is a
# call rather than a type, or `cst` is not the libcst module binding.
valid:
  - |
    import libcst as cst
    tree = cst.parse_module(source)
  - |
    import libcst as cst
    node = cst.Name("value")
  - |
    from flext_infra import t
    def leaf(node: t.Infra.Cst.CSTNode) -> bool:
        return isinstance(node, t.Infra.Cst.Name)
  - |
    cst = load()
    def leaf(node: cst.Node) -> bool:
        return isinstance(node, cst.Node)
# `invalid` MUST match: a libcst class named as a type through the module.
invalid:
  - |
    import libcst as cst
    def leaf(node: cst.CSTNode) -> str: ...
  - |
    import libcst as cst
    ok = isinstance(node, cst.Name)
  - |
    import libcst as cst
    ok = isinstance(node, cst.List | cst.Tuple)
