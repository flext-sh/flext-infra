id: rewire-test-assert-excludes
valid:
- |
  from other_library import tm
  assert left not in right
- |
  def check(tm: object) -> None:
      assert left not in right
- |
  from tests import tm
  assert left not in right, "message"
invalid:
- assert left not in right
- |
  from tests import tm
  assert left not in right
- |
  from tests import tm
  assert (
      "a long expected fragment"
      not in observed
  )
