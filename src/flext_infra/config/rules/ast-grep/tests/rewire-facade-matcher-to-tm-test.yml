id: rewire-facade-matcher-to-tm
valid:
  - |
    tm.that(value, eq=1)
  - |
    u.Tests.raises(ValueError)
  - |
    u.Auth.normalize(value)
  - |
    result.that(value)
invalid:
  - |
    TestsFlextAuthUtilities.that(value, eq=1)
  - |
    u.that(value, none=True)
  - |
    u.Ldap.Tests.fail(result)
  - |
    u.Tests.ok(result)
