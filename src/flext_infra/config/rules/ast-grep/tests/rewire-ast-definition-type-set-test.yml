id: rewire-ast-definition-type-set
# `valid` MUST NOT match: the constants owner is already read, the set differs,
# or the construct is not an isinstance check.
valid:
  - ok = isinstance(node, c.Infra.AST_DEFINITION_TYPES)
  - ok = isinstance(node, ast.ClassDef | ast.FunctionDef)
  - kinds = (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)
# `invalid` MUST match: the exact node set spelled inline.
invalid:
  - ok = isinstance(node, ast.ClassDef | ast.FunctionDef | ast.AsyncFunctionDef)
  - ok = isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))
