id: consumer-annotation-names-protocol
valid:
- |
  class Envelope(m.Value):
      @m.computed_field
      @property
      def record(self) -> m.Infra.Record: ...
- |
  @m.validate_call
  def validate(value: m.Infra.Record) -> m.Infra.Record: ...
- |
  class Bootstrap(s[p.Infra.CodegenResult]):
      state: Annotated[
          m.Infra.CodegenConformState,
          m.Field(description="State."),
      ]
- "def f(x: p.Infra.Leaf) -> p.Infra.Leaf: ..."
- "leaf = m.Infra.Leaf(name='a')"
- "def f(kind: type[p.Infra.Leaf]) -> None: ..."
- "def f(op: m.Infra.DepsToml.SetOp) -> None: ..."
invalid:
- "def f(x: m.Infra.Leaf) -> None: ..."
- "def f() -> tuple[m.Infra.Leaf, ...]: ..."
- "items: dict[str, m.Cli.AtomicFileState] = {}"
