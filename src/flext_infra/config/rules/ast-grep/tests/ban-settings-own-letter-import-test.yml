# The fixture project is `ai_hub` (fixture-utils/own-package.yml): only an
# import whose root is that own package matches. The law is per
# letter: this document detects its own `settings` alias. The companion
# settings-config-boundary rule rejects ALL other own-namespace imports at
# layer zero, even when this narrower document does not match them.
id: ban-settings-own-letter-import
valid:
  # Another package's letter is a cross-package facade binding.
  - |
    from flext_core import settings
  - |
    from ai_hub import settingsextra as settings
  # Not the settings alias; the stronger boundary owns this finding.
  - |
    from ai_hub import m
  # The canonical producer form: the sibling through its private submodule.
  - |
    from ai_hub._settings.base import AiHubSettingsSources
  # A non-letter root binding is the public class export, not a letter.
  - |
    from ai_hub import AiHubSettings
  # The letter regex is anchored: a name that merely starts with the letter is
  # a different binding.
  - |
    from ai_hub import settingsextra
  # A root binding without a letter component reaches no family facade.
  - |
    import ai_hub
invalid:
  - |
    from ai_hub import settings as aliased
  - |
    def load() -> None:
        from ai_hub import settings
  - |
    from typing import TYPE_CHECKING
    if TYPE_CHECKING:
        from ai_hub import settings
  # The producer binds its own letter from the own root.
  - |
    from ai_hub import settings
  - |
    from ai_hub import settings, m
  # The plain-import form reaches the letter as a submodule of the root.
  - |
    import ai_hub.settings
