id: ban-broad-annotation
valid:
  - "def run(values: Mapping[str, str]) -> Sequence[str]: ..."
  - "values: Annotated[Mapping[str, str], m.Field(default_factory=dict)]"
  - "value = dict(name='x')"
  - "values: dict[str, str] = {}"
  - "fields: dict[str, tuple[int, int]] = {}"
  - "def run(values: dict[str, t.JsonValue]) -> dict[str, int]: ..."
  - "def __eq__(self, other: object) -> bool: ..."
invalid:
  - "def run(values: Any) -> None: ..."
  - "def run(values: str) -> Optional[str]: ..."
  - "value: object = None"
  - "values: dict = {}"
  - "def run(values: Mapping[str, dict]) -> None: ..."
  - "def run() -> dict: ..."
  - "values: dict[str, Any] = {}"
