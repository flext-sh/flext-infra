id: ban-import-module-cycle-escape
valid:
  - module = import_module(module_name)
  - module = importlib.import_module(self._module)
  - value = load("flext_core.dispatcher")
invalid:
  - module = import_module("flext_core.dispatcher")
  - module = importlib.import_module("flext_core._utilities.beartype_conf")
