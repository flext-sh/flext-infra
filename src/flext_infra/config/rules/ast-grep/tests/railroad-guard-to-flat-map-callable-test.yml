id: railroad-guard-to-flat-map-callable
valid:
  - |
    def run(self) -> p.Result[str]:
        return self._load().flat_map(self._next_step)
  - |
    def run_raw(self) -> str:
        result = self._load()
        if result.failure:
            return r.from_failure(result)
        return self._next_step(result.value)
invalid:
  - |
    def run(self) -> p.Result[str]:
        result = self._load()
        if result.failure:
            return r[str].from_failure(result)
        return self._next_step(result.value)
  - |
    def run_direct(self) -> r[int]:
        result = self._load()
        if result.failure:
            return result
        return parse_int(result.value)
