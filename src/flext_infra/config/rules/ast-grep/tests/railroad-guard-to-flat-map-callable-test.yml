id: railroad-guard-to-flat-map-callable
valid:
  - |
    def run(self) -> p.Result[str]:
        return self._load().flat_map(self._next_step)
  - |
    def run_raw(self) -> str:
        result = self._load()
        if result.failure:
            return r.from_failure(result)
        return self._next_step(result.value)
  - |
    def run_bound_raw(self) -> str:
        first = self._load()
        if first.failure:
            return first
        second = self._parse(first.value)
        return second.map(self._normalize)
  - |
    def run_unwrap_head(self) -> p.Result[str]:
        first = self._load()
        if first.failure:
            return first
        second = self._parse(first.value)
        return second.unwrap_or(self._default)
  - |
    def run_bound_in_argument(self) -> p.Result[str]:
        first = self._load()
        if first.failure:
            return r[str].from_failure(first)
        second = self._parse(first.value)
        return second.map(lambda value: (value, second.error))
  - |
    def run_bound_unwrapped(self) -> p.Result[str]:
        first = self._load()
        if first.failure:
            return r[str].from_failure(first)
        second = self._parse(first.value)
        return r[str].ok(second.value)
  - |
    def run_other_receiver(self) -> p.Result[str]:
        first = self._load()
        if first.failure:
            return r[str].from_failure(first)
        second = self._parse(first.value)
        return third.map(second)
  - |
    def run_reads_guarded(self) -> p.Result[str]:
        first = self._load()
        if first.failure:
            return first
        return first.value.parse(first.value)
invalid:
