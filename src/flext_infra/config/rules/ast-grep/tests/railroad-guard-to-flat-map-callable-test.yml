        return parse_int(result.value)
  - |
    def run_bound(self) -> p.Result[str]:
        first = self._load()
        if first.failure:
            return first
        second = self._parse(first.value)
        return second
  - |
    def run_sequential(self) -> p.Result[str]:
        first = self._load()
        if first.failure:
            return r[str].from_failure(first)
        second = self._parse(first.value)
        return second.flat_map(self._next_step).map(self._normalize)
  - |
    def run_after_guard(self) -> p.Result[str]:
        loaded = self._load()
        if loaded.failure:
            return r[str].from_failure(loaded)
        result = self._parse(loaded.value, strict=True)
        if result.failure:
            return r[str].from_failure(result)
        return self._next_step(result.value)
