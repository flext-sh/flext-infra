# Fixture value of the generated `facade-package` utility: the fixture project,
# its tests facade, the infrastructure owner and the FLEXT packages the tests import.
id: facade-package
language: Python
rule:
  regex: "^(?:ai_hub|flext_cli|flext_core|flext_infra|flext_meltano|flext_tests|tests)(?:[.\\s]|$)"
