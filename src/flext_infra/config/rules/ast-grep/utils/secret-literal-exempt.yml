# Where a credential literal stays: parametrize case data in a decorator, and
# a credential that is the only entry of its dict or call inside a `raises`
# context, are deliberately rejected inputs (the short or malformed secret is
# the case under test); an enum member's value is the member's identity; a
# generated module is regenerated by its owner.
id: secret-literal-exempt
language: python
rule:
  any:
    - inside: {stopBy: end, kind: decorator}
    - all:
        - inside:
            stopBy: end
            kind: with_statement
            has:
              stopBy: end
              kind: with_item
              has:
                stopBy: end
                kind: call
                has: {field: function, regex: '(^|\.)raises$'}
        - any:
            - inside:
                kind: pair
                inside: {kind: dictionary, not: {has: {nthChild: 2}}}
            - inside:
                kind: keyword_argument
                inside: {kind: argument_list, not: {has: {nthChild: 2}}}
    - inside:
        stopBy: end
        kind: class_definition
        has:
          field: superclasses
          has: {regex: 'Enum$'}
    - inside: {stopBy: end, kind: module, matches: generated-module}
