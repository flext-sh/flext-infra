# One owner for the legacy `Dict[K, V]` / `typing.Dict[K, V]` generic shapes the
# typing.Dict modernization pair selects. Both the detection-only companion and the
# auto-fixing rewrite referenced this block verbatim; extracting it here keeps the
# shape selection (and its `dict-imported-from-typing` guard on the bare-name forms)
# in one place instead of duplicating it in each rule document.
#
# The util captures `$K`/`$V` locally; the auto-fixing rule re-captures the matched
# node through its own `pattern` because ast-grep metavariables never cross a
# `matches` boundary.
id: typing-dict-generic
language: python
rule:
  any:
    - all:
        - pattern:
            context: "def f(x: Dict[$K, $V]) -> None: ..."
            selector: generic_type
        - inside:
            stopBy: end
            kind: module
            has:
              stopBy: end
              matches: dict-imported-from-typing
    - all:
        - pattern:
            context: "ALIAS = Dict[$K, $V]"
            selector: subscript
        - inside:
            stopBy: end
            kind: module
            has:
              stopBy: end
              matches: dict-imported-from-typing
    - pattern:
        context: "ALIAS = typing.Dict[$K, $V]"
        selector: subscript
