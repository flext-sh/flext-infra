# Reusable ast-grep utility rules for the FLEXT test-assertion codemods.
#
# GLOBAL utilities (wired via `utilDirs` in sgconfig.yml) so every assert->tm
# rule references one shared, audited guard via `matches:` instead of
# duplicating a 7-line import-presence block. Improving a guard here improves
# every consuming rule at once (SSOT for the codemod guards).
#
# Reference from a rule:
#   rule:
#     all:
#       - <the assert shape>
#       - not: { matches: assert-has-message }
#       - inside:
#           kind: module
#           stopBy: end
#           has: { matches: tm-imported-from-flext, stopBy: end }

# `tm` bound to the flext-tests matchers in the module. Gate for every
# tm-emitting fix: rewriting to `tm.*` is only correct when `tm` is that
# binding. It is imported under its own name from `flext_tests` or from the
# generated `tests` facade that re-exports it (`from tests import c, tm`);
# `from x import tm as other` binds no `tm`, and `from x import y as tm`
# binds another object.
id: tm-imported-from-flext
language: Python
rule:
  kind: import_from_statement
  all:
    - has:
        field: module_name
        any:
          - regex: "^(?:flext_tests|tests)$"
          # A tests module's package-relative import of its own facade.
          - kind: relative_import
    - has:
        kind: dotted_name
        regex: "^tm$"
        not:
          inside:
            kind: import_from_statement
            field: module_name
