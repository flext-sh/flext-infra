# A credential value written into the source: a non-empty string literal
# without interpolation, or a `+` assembly whose leftmost operand is one (the
# `"s" + c.ParserBooleanToken.ONE * 16` spelling that only hides the literal
# from bandit). An empty string is a deliberate missing-credential input and
# a URL is an endpoint whose owner is the package settings default, so
# neither is a generated secret.
id: secret-literal-value
language: python
rule:
  any:
    - kind: string
      has: {kind: string_content}
      not:
        any:
          - has: {kind: interpolation}
          - has: {kind: string_content, regex: '^[A-Za-z][A-Za-z0-9+.-]*://'}
    - kind: binary_operator
      all:
        - has: {field: operator, regex: '^\+$'}
        - has: {field: left, matches: secret-literal-value}
        - not:
            has:
              stopBy: end
              any: [{kind: call}, {kind: interpolation}]
