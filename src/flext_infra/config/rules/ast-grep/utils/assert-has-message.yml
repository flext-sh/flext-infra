# Reusable guard: an assert statement that carries an explicit failure message
# (`assert <cond>, <msg>`). Observation codemods skip it through
# `not: { matches: assert-has-message }`; rewire-test-assert-message owns its
# explicit failure and preserves lazy message evaluation.
id: assert-has-message
language: Python
rule:
  kind: assert_statement
  pattern: "assert $COND, $MSG"
