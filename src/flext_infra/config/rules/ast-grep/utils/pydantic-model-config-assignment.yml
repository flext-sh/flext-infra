# Reusable guard: an unannotated `model_config` assignment whose value is a
# ConfigDict call, declared directly in a class body. The FLEXT declaration
# contract makes class metadata explicit with a native ClassVar annotation.
id: pydantic-model-config-assignment
language: Python
rule:
  all:
    - kind: assignment
    - has:
        field: left
        kind: identifier
        regex: "^model_config$"
    - has:
        field: right
        kind: call
        regex: "ConfigDict\\("
    - inside:
        kind: block
        stopBy: end
        inside:
          kind: class_definition
