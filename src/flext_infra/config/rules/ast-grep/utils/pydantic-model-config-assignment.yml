# Reusable guard: an unannotated `model_config` assignment, declared directly in
# a class body, that a ClassVar annotator rewrites. The FLEXT declaration
# contract makes class metadata explicit with a native ClassVar annotation.
#
# The callee is exactly what the annotators cover: the native `ConfigDict`
# (pydantic-model-config-configdict-classvar) and the `m` facade constructors
# (pydantic-model-config-m-configdict-classvar). The ClassVar import rules bind
# the name only for those rewrites; an aliased facade constructor or an
# inherited `Parent.model_config` has no annotator, so importing ClassVar there
# leaves an unused binding and the cascade never converges.
id: pydantic-model-config-assignment
language: Python
rule:
  all:
    - kind: assignment
    - has:
        field: left
        kind: identifier
        regex: "^model_config$"
    - has:
        field: right
        kind: call
        has:
          field: function
          any:
            - kind: identifier
              regex: "^ConfigDict$"
            - kind: attribute
              regex: "^m\\.(Settings)?ConfigDict$"
    - inside:
        kind: block
        stopBy: end
        inside:
          kind: class_definition
