# A read of a credential: an identifier or attribute name, or a subscript
# key, that is a credential name. A keyword argument's name is a parameter
# label, not a read.
id: secret-credential-reference
language: python
rule:
  any:
    - kind: identifier
      matches: secret-credential-name
      not: {inside: {kind: keyword_argument, field: name}}
    - kind: string_content
      matches: secret-credential-name
      inside: {kind: string, inside: {kind: subscript, field: subscript}}
