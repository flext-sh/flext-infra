# A rewrite that emits ``u.*`` is only F821-safe when the canonical utilities
# facade is bound as the plain name ``u`` in the same module.
#
# Two binding forms qualify, and both are audited here because both bind the
# name: an absolute import from a package that the generated ``facade-package``
# fact authenticates, and the package-relative import a facade package uses on
# itself (``from ... import u``, ``from . import u``). Package identity comes
# from the shared export owner, not from a FLEXT spelling convention: a
# consumer such as ``ai_hub`` publishes the same utilities boundary. The
# relative form keeps that boundary available while a package composes itself.
#
# ``import flext_infra.u`` and ``from x import u as util`` still do not bind
# ``u`` and stay excluded: the emitted text is a fixed ``u.``, so an aliased or
# dotted binding would emit an unbound name.
#
# Sibling of r-imported-from-flext (result facade) and t-locally-bound (typings
# facade): one audited binding guard per facade, referenced with ``matches:``.
id: u-imported-from-flext
language: python
rule:
  kind: import_from_statement
  all:
    - has:
        pattern: u
        stopBy: end
    - any:
        - has:
            field: module_name
            matches: facade-package
        - has:
            kind: relative_import
    - not:
        has:
          kind: aliased_import
          stopBy: end
          has:
            pattern: u
            stopBy: end
