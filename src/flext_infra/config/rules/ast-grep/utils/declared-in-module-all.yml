# The captured $NAME is a name the enclosing module publishes in its own
# __all__: a literal sequence of strings, or the generated
# `__all__ = tuple(<NAME>)` form that publishes another module-level literal.
# A consuming rule binds the candidate name as $NAME before matching this.
# The string-literal `__all__` form is NOT recognized: this ast-grep version
# cannot assert textual equality between the caller's $NAME capture and a
# string_content descendant, so the branch would suppress the report on ANY
# string content. Publish aliases in the generated tuple form — the shape
# the lazy-init generator emits (bead flext-wjxd7).
id: declared-in-module-all
language: python
rule:
  inside:
    kind: module
    stopBy: end
    any:
      - all:
          - has:
              kind: expression_statement
              has:
                kind: assignment
                all:
                  - has:
                      field: left
                      regex: "^__all__$"
                  - has:
                      field: right
                      kind: call
                      has:
                        field: arguments
                        has:
                          kind: identifier
                          pattern: $PUBLISHED
          - has:
              kind: expression_statement
              has:
                kind: assignment
                all:
                  - has:
                      field: left
                      pattern: $PUBLISHED
                  - has:
                      field: right
                      has:
                        stopBy: end
                        kind: string_content
                        pattern: $NAME
