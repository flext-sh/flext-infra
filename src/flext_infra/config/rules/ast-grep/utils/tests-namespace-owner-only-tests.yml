# A `<Project>` owner class nested in a module-level test facade whose body
# holds only its docstring, comments and one `class Tests`: the deprecated
# nested test namespace (ENFORCE-054) in the shape that flattens mechanically.
id: tests-namespace-owner-only-tests
language: python
rule:
  kind: class_definition
  all:
    - has:
        field: name
        regex: "^[A-Z][A-Za-z0-9]*$"
    - has:
        field: body
        has:
          kind: class_definition
          has: {field: name, regex: "^Tests$"}
    - not:
        has:
          field: body
          has:
            not:
              any:
                - kind: comment
                - kind: expression_statement
                  has: {kind: string}
                - kind: class_definition
                  has: {field: name, regex: "^Tests$"}
  inside:
    kind: block
    inside:
      kind: class_definition
      inside:
        kind: module
