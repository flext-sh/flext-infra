# A value position that holds a credential: the value of a dict entry, a
# keyword argument or an assignment whose key, name or target is a
# credential name (bandit's B105 dict and assignment and B106 positions), or
# the sole argument of a type's constructor in such a position
# (`password=t.SecretStr("...")`); a method call there (`settings.get("KEY")`,
# `.decode("ascii")`) takes no credential. A parameter default (B107) is not
# a slot: a generated default is a call evaluated once at definition (ruff
# B008), so the signature's owner supplies the value instead.
id: secret-credential-slot
language: python
rule:
  any:
    - inside:
        kind: pair
        field: value
        has:
          field: key
          kind: string
          has: {kind: string_content, matches: secret-credential-name}
    - inside:
        kind: keyword_argument
        field: value
        has: {field: name, matches: secret-credential-name}
    - inside:
        kind: assignment
        field: right
        has:
          field: left
          any:
            - {kind: identifier, matches: secret-credential-name}
            - kind: attribute
              has: {field: attribute, matches: secret-credential-name}
    - inside:
        kind: argument_list
        not: {has: {nthChild: 2}}
        inside:
          kind: call
          has: {field: function, regex: '(^|\.)[A-Z][A-Za-z0-9]*$'}
          matches: secret-credential-slot
