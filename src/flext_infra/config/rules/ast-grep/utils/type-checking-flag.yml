# The `typing.TYPE_CHECKING` flag as an `if` condition: the bare or qualified
# name, or an alias the module imports it under from `typing` or
# `typing_extensions`.
id: type-checking-flag
language: python
rule:
  any:
    - regex: "^(?:typing(?:_extensions)?\\.)?TYPE_CHECKING$"
    - all:
        - kind: identifier
        - pattern: $TYPE_CHECKING_FLAG
        - inside:
            kind: module
            stopBy: end
            has:
              stopBy: end
              kind: import_from_statement
              all:
                - has:
                    field: module_name
                    regex: "^typing(?:_extensions)?$"
                - has:
                    stopBy: end
                    kind: aliased_import
                    all:
                      - has:
                          field: name
                          regex: "^TYPE_CHECKING$"
                      - has:
                          field: alias
                          pattern: $TYPE_CHECKING_FLAG
