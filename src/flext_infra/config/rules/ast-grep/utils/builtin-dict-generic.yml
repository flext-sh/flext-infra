# One owner for the builtin `dict[K, V]` generic shapes in a type context, shared
# by the model-field contract rule. Structural kinds, not a pattern:
# a `dict[$K, $V]` pattern misses arguments that are attributes
# (`dict[str, t.JsonValue]`), the common case in FLEXT code.
id: builtin-dict-generic
language: python
rule:
  all:
    - matches: semantic-type-context
    - any:
        - all:
            - kind: generic_type
            - has:
                kind: identifier
                nthChild: 1
                regex: "^dict$"
        - all:
            - kind: subscript
            - has:
                field: value
                kind: identifier
                regex: "^dict$"
