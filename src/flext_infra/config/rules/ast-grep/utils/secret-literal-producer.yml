# A credential literal `$V` given under a key or keyword `$KEY` that can name
# a local binding: a lowercase identifier other than the `pass` keyword.
id: secret-literal-producer
language: python
rule:
  all:
    - matches: secret-literal-value
    - pattern: $V
    - not: {matches: secret-literal-exempt}
    - any:
        - inside:
            kind: pair
            field: value
            has:
              field: key
              kind: string
              has:
                kind: string_content
                regex: '^[a-z_][a-z0-9_]*$'
                matches: secret-credential-name
                not: {regex: '^pass$'}
                pattern: $KEY
        - inside:
            kind: keyword_argument
            field: value
            has:
              field: name
              regex: '^[a-z_][a-z0-9_]*$'
              matches: secret-credential-name
              not: {regex: '^pass$'}
              pattern: $KEY
