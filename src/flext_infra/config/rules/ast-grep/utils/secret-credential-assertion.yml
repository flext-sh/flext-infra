# A value an assertion compares with a credential: a keyword argument of a
# call whose first positional argument reads a credential
# (`tm.that(settings.Db.password, eq="...")`,
# `tm.that(str(dumped["client_secret"]), lacks="...")`), or the right
# operand of a comparison whose left operand reads one.
id: secret-credential-assertion
language: python
rule:
  any:
    - inside:
        kind: keyword_argument
        field: value
        inside:
          kind: argument_list
          has:
            nthChild: 1
            not: {kind: keyword_argument}
            any:
              - matches: secret-credential-reference
              - has: {stopBy: end, matches: secret-credential-reference}
    - inside:
        kind: comparison_operator
        has:
          nthChild: 1
          any:
            - matches: secret-credential-reference
            - has: {stopBy: end, matches: secret-credential-reference}
