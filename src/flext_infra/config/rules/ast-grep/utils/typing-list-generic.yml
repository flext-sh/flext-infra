# One owner for the legacy `List[T]` / `typing.List[T]` generic shapes the
# typing.List modernization selects. Its native list rewrite uses this util to keep the
# shape selection (and its `list-imported-from-typing` guard on the bare-name forms)
# in one place.
#
# The util captures `$T` locally; the auto-fixing rule re-captures the matched node
# through its own `pattern` because ast-grep metavariables never cross a `matches`
# boundary.
id: typing-list-generic
language: python
rule:
  all:
    - matches: semantic-type-context
    - any:
        - all:
            - any:
                - pattern:
                    context: "def f(x: List[$T]) -> None: ..."
                    selector: generic_type
                - pattern:
                    context: "ALIAS = List[$T]"
                    selector: subscript
            - inside:
                stopBy: end
                kind: module
                has:
                  stopBy: end
                  matches: list-imported-from-typing
        - pattern:
            context: "ALIAS = typing.List[$T]"
            selector: subscript
