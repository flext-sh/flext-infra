# A name that spells a credential under bandit's B105/B106/B107 candidate law
# (`RE_CANDIDATES`): the whole name, or one underscore-delimited segment of
# it, is password (and its pass/passwd/pwd spellings), passphrase, token or
# secret, in any case. Applied to an identifier or a string key's content.
id: secret-credential-name
language: python
rule:
  regex: '(?i)(^(pas+wo?r?d|pass(phrase)?|pwd|token|secrete?)$|_(pas+wo?r?d|pass(phrase)?|pwd|token|secrete?)_|^(pas+wo?r?d|pass(phrase)?|pwd|token|secrete?)_|_(pas+wo?r?d|pass(phrase)?|pwd|token|secrete?)$)'
