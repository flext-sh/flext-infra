Infra:
  tooling:
    # Canonical validated native tooling policy; diagnostics remain blocking.
    raw-check-receipt-suffix: .raw.log
    derived-tool-roots: [ deptry, mypy, pyrefly, pyright, pytest, ruff, vulture ]
    derived-settings:
      mypy: [ python_version, mypy_path, namespace_packages, explicit_package_bases, exclude, overrides, disable_error_code ]
      pyrefly: [ python-version, sub-config ]
      pyright: [ pythonVersion, executionEnvironments, extraPaths, include, exclude, venv, venvPath ]
      pytest.ini_options: [ flext_slow_timeout_seconds, markers, flext_fixture_trees_root, flext_make_ci_variable, flext_make_ci_value ]
      ruff: [ target-version ]
    # Native options are free key/value pairs, grouped by their tool table.
    # The same catalog drives modernization and every projected template.
    settings:
      codespell:
      - [ check-filenames, true ]
      - [ ignore-words-list, 'crate,nd' ]
      pydantic-mypy:
      - [ init_forbid_extra, true ]
      - [ init_typed, true ]
      - [ warn_required_dynamic_aliases, true ]
      pyrefly:
      - [ disable-project-excludes-heuristics, true ]
      - [ use-ignore-files, false ]
      - [ project-excludes, [] ]
      pyrefly.errors:
      # Preserve every diagnostic from the strict-error policy during cutover.
      - [ bad-argument-count, error ]
      - [ bad-argument-type, error ]
      - [ bad-assignment, error ]
      - [ bad-class-definition, error ]
      - [ bad-context-manager, error ]
      - [ bad-dunder-all, error ]
      - [ bad-function-definition, error ]
      - [ bad-index, error ]
      - [ bad-instantiation, error ]
      - [ bad-keyword-argument, error ]
      - [ bad-match, error ]
      - [ bad-param-name-override, error ]
      - [ bad-raise, error ]
      - [ bad-return, error ]
      - [ bad-specialization, error ]
      - [ bad-typed-dict, error ]
      - [ bad-typed-dict-key, error ]
      - [ bad-unpacking, error ]
      - [ deprecated, error ]
      - [ implicit-abstract-class, error ]
      - [ implicit-any, error ]
      - [ implicit-import, error ]
      - [ implicitly-defined-attribute, error ]
      - [ inconsistent-inheritance, error ]
      - [ inconsistent-overload, error ]
      - [ invalid-annotation, error ]
      - [ invalid-argument, error ]
      - [ invalid-decorator, error ]
      - [ invalid-inheritance, error ]
      - [ invalid-literal, error ]
      - [ invalid-overload, error ]
      - [ invalid-param-spec, error ]
      - [ invalid-pattern, error ]
      - [ invalid-self-type, error ]
      - [ invalid-super-call, error ]
      - [ invalid-type-alias, error ]
      - [ invalid-type-var, error ]
      - [ invalid-type-var-tuple, error ]
      - [ invalid-variance, error ]
      - [ invalid-yield, error ]
      - [ missing-argument, error ]
      - [ missing-attribute, error ]
      - [ missing-import, error ]
      - [ missing-module-attribute, error ]
      - [ missing-override-decorator, error ]
      - [ missing-source, error ]
      - [ missing-source-for-stubs, error ]
      - [ no-access, error ]
      - [ no-matching-overload, error ]
      - [ not-a-type, error ]
      - [ not-async, error ]
      - [ not-callable, error ]
      - [ not-iterable, error ]
      - [ not-required-key-access, error ]
      - [ open-unpacking, error ]
      - [ protocol-implicitly-defined-attribute, error ]
      - [ read-only, error ]
      - [ redefinition, error ]
      - [ redundant-cast, error ]
      - [ redundant-condition, error ]
      - [ unannotated-attribute, error ]
      - [ unannotated-parameter, error ]
      - [ unannotated-return, error ]
      - [ unbound-name, error ]
      - [ unexpected-keyword, error ]
      - [ unexpected-positional-argument, error ]
      - [ unknown-name, error ]
      - [ unnecessary-comparison, error ]
      - [ unnecessary-type-conversion, error ]
      - [ unreachable, error ]
      - [ unresolvable-dunder-all, error ]
      - [ unsafe-overlap, error ]
      - [ unsupported, error ]
      - [ unsupported-delete, error ]
      - [ unsupported-operation, error ]
      - [ untyped-import, error ]
      - [ unused-coroutine, error ]
      - [ unused-ignore, error ]
      - [ variance-mismatch, error ]
      - [ inconsistent-overload-default, error ]
      deptry:
      - [ optional_dependencies_dev_groups, [ dev ] ]
      coverage.run:
      - [ source, [ src ] ]
      - [ omit, [ "*/dependency_injector/providers.pyx", "*/protocols.py", "*/_protocols/*" ] ]
      coverage.report:
      - [ show_missing, true ]
      - [ skip_covered, false ]
      - [ precision, 2 ]
      - [ exclude_also, [ "if _t.TYPE_CHECKING:", "if TYPE_CHECKING:", "if typing.TYPE_CHECKING:" ] ]
      hatch.metadata:
      - [ allow-direct-references, true ]
      tomlsort:
      - [ all, true ]
      - [ in_place, true ]
      - [ sort_first, [ project, build-system, tool, dependency-groups ] ]
      vulture:
      - [ exclude, [ "*/_protocols/*" ] ]
      - [ min_confidence, 100 ]
      - [ paths, [ src ] ]
      - [ verbose, false ]
      yamlfix:
      - [ line_length, &formatting_width 88 ]
      - [ preserve_quotes, true ]
      - [ whitelines, 1 ]
      - [ section_whitelines, 1 ]
      - [ explicit_start, false ]
      pytest.ini_options:
      - [ asyncio_default_fixture_loop_scope, function ]
      - [ python_files, [ "*_test.py", "*_tests.py", "test_*.py" ] ]
      - [ testpaths, [ tests ] ]
      - [ minversion, "8.0" ]
      - [ python_classes, [ "Test*" ] ]
      - [ filterwarnings, [ error, "once::pytest.PytestAssertRewriteWarning" ] ]
      - [ addopts, [ --benchmark-disable, --strict-markers, --markdown-docs, --durations=10 ] ]
      pyright:
      - [ pythonPlatform, Linux ]
      - [ reportCallIssue, error ]
      - [ reportConstantRedefinition, error ]
      - [ reportIncompatibleMethodOverride, error ]
      - [ reportInconsistentConstructor, error ]
      - [ reportMissingImports, error ]
      - [ reportMissingModuleSource, error ]
      - [ reportPrivateUsage, error ]
      - [ reportUnnecessaryCast, error ]
      - [ reportUnnecessaryComparison, error ]
      - [ reportUnnecessaryIsInstance, error ]
      - [ reportUnusedClass, error ]
      - [ reportUnusedFunction, error ]
      - [ reportUnusedImport, error ]
      - [ reportUnusedVariable, error ]
      - [ typeCheckingMode, strict ]
      - [ useLibraryCodeForTypes, true ]
      ruff:
      - [ namespace-packages, [ tests, examples, scripts ] ]
      - [ fix, false ]
      - [ line-length, *formatting_width ]
      - [ preview, true ]
      - [ respect-gitignore, true ]
      - [ show-fixes, true ]
      - [ src, [ src, tests, examples, scripts ] ]
      ruff.format:
      - [ docstring-code-format, true ]
      - [ indent-style, space ]
      - [ line-ending, lf ]
      - [ quote-style, double ]
      - [ skip-magic-trailing-comma, false ]
      ruff.lint:
      - [ select, [ ALL ] ]
      - [ ignore, [] ]
      # non-pep695-type-alias (UP040) is disabled by the generic facade
      # publication axiom below and, should it return, is never autofixed:
      # its fix turns a facade class publication `Name: TypeAlias = Owner`
      # into a PEP 695 `type` statement, replacing the class with a
      # TypeAliasType (2026-10-25: `type Cli = FlextCliUtilitiesCli` killed the
      # flext-infra CLI fleet-wide).
      - [ unfixable, [ multi-value-repeated-key-literal, multi-value-repeated-key-variable, non-pep695-type-alias, p-print, print, pytest-duplicate-parametrize-test-cases ] ]
      - [ extend-safe-fixes, [ relative-imports, camelcase-imported-as-lowercase ] ]
      - [ extend-select, [ missing-blank-line-after-last-section ] ]
      ruff.lint.flake8-tidy-imports:
      - [ ban-relative-imports, all ]
      - - banned-api
        - argparse: { msg: "Use cli.register_result_command + Pydantic model from flext_cli." }
          click: { msg: "Use flext_cli.cli application, registration, execution, and invocation methods." }
          rich: { msg: "Use cli.print / cli.display_message / cli.render_panel / cli.render_table." }
          tabulate: { msg: "Use cli.render_table from flext_cli." }
          typer: { msg: "Use cli.create_app_with_common_params / cli.register_command from flext_cli." }
      ruff.lint.flake8-copyright:
      - [ notice-rgx, 'Copyright \(c\) \d{4} \S[^\n]*\. All rights reserved\.' ]
      ruff.lint.isort:
      - [ combine-as-imports, true ]
      - [ force-single-line, false ]
      - [ split-on-trailing-comma, false ]
      ruff.lint.pydocstyle:
      - [ convention, google ]
      ruff.lint.pylint:
      - [
          allow-dunder-method-names,
          [
            __base__,
            __bases__,
            __get_pydantic_core_schema__,
            __get_pydantic_json_schema__,
          ],
        ]
      # Axiom (operator decision 2026-11-05, tracker key
      # operator-decisions-2026-11-05-ws7iv-testverbs-timeout-ldap-pydantic,
      # answer "Exceção-axioma"): the Pydantic protocol module mirrors
      # Pydantic's own public method signatures (p.BaseModel.model_dump keeps
      # pydantic's keyword set, every keyword with fleet consumers). The
      # argument count is the external SDK's contract, not a local design, so
      # too-many-arguments cannot coexist with the faithful protocol. Scoped to
      # that one module path; every other module keeps the rule.
      ruff.lint.per-file-ignores:
      - [ '**/_protocols/pydantic.py', [ too-many-arguments ] ]
      # Generated protocol mirrors preserve the owning model's member names
      # verbatim: a capitalized Pydantic field (``Mise``, ``Gitignore``) must
      # stay capitalized in the read-only `p.*` contract, so the function-name
      # rule cannot apply to generated `_protocols` sources.
      - [ '**/_protocols/**', [ invalid-function-name, too-many-public-methods ] ]
      # The command contract mandates the ``# /// flext-command`` metadata
      # block: its single-line JSON entries exceed the line budget and its
      # commented declarations are data, not dead code.
      - [ 'scripts/**/*.py', [ commented-out-code, invalid-module-name, line-too-long ] ]
      # The fleet testing contract expresses expectations with ``assert``.
      - [ 'tests/**/*.py', [ assert ] ]
      mypy:
      - [ plugins, [ pydantic.mypy ] ]
      - [ allow_redefinition, true ]
      - [ check_untyped_defs, true ]
      - [ extra_checks, true ]
      - [ follow_untyped_imports, true ]
      - [ local_partial_types, true ]
      - [ no_implicit_reexport, true ]
      - [ show_traceback, true ]
      - [ strict_equality, true ]
      - [ warn_redundant_casts, true ]
      - [ warn_return_any, true ]
      - [ warn_unreachable, true ]
      - [ warn_unused_ignores, true ]
      - [ follow_imports, normal ]
    tools:
      # Non-linter tool sections are config-owned as well.
      markdown:
        # rumdl exits 1 on any violation and 2 on an error: a repair verb
        # completes with findings under this status; any other fails it.
        findings-exit-codes: [ 1 ]
        # Projected blocks written by a foreign writer between its own marker
        # lines (rule generators-not-projections): the markdown lint reads
        # their inner lines masked, so a finding there is corrected only by
        # that writer, never by hand. Marker lines stay visible, line numbers
        # are preserved, and every finding outside a block is still reported.
        # An unbalanced or unclosed marker fails the gate. FLEXT-owned blocks
        # are never declared here.
        projected-blocks:
        - writer: beads
          begin: '<!-- BEGIN BEADS (?P<block>[A-Z]+(?: [A-Z]+)*)(?:[: ].*)? -->'
          end: '<!-- END BEADS (?P<block>[A-Z]+(?: [A-Z]+)*) -->'
        - writer: rtk
          begin: '<!-- rtk-instructions v(?P<version>\d+) -->'
          end: '<!-- /rtk-instructions -->'
        # Rules not named in `rules` stay enabled. Turning this off would make
        # `rules` a strict allowlist; the fleet keeps rumdl's complete default
        # set and declares every intentional configuration below.
        default-enabled: true
        # MD060 (aligned tables, repaired by `rumdl fmt`) is opt-in in rumdl.
        extend-enable: [ MD060 ]
        # rumdl is the ONE Markdown engine: CLI (make fmt/fix/check) and editor
        # (rvben.rumdl reads the generated .rumdl.toml for diagnostics and
        # formatting). It implements every markdownlint rule (MD001-MD060)
        # plus MD061+, so markdownlint is retired everywhere (codegen.yaml
        # retires .markdownlintignore and silences the extension).
        rules:
        # Wave 1 (active): every rule here is either repaired by `rumdl fmt`
        # (`make fmt`) or was already enforced, so the policy lands together
        # with its automatic repair and no consumer is left red. Measured on
        # the fleet (2026-11-04): 18040 findings, 15573 repaired by rumdl fmt.
        # Wave 2 (disabled below, per-repo text migration, bead flext-5yu64):
        # MD036/MD041/MD042/MD051/MD057 have no automatic repair (2467 sites).
        - [ MD001, true ]
        - [ MD003, { style: atx } ]
        - [ MD004, { style: dash } ]
        - [ MD007, { indent: 2 } ]
          # MD013 prose and code lengths are THE markdown line contract for
          # both rumdl surfaces: `rumdl check` (markdown gate, `make fix`) and
          # `rumdl fmt` (markdown-format gate, `make fmt`) read this one rule
          # set through the generated .rumdl.toml. Headings use
          # MD013.heading_line_length because no tool can reflow a heading.
          #
          # Wrapping is hand-owned, not tool-owned: rumdl's normalize reflow
          # joins a hand-wrapped paragraph into one line and cannot re-split
          # lines containing inline-code spans. With reflow off, nobody
          # rewrites an author's breaks, and MD013 stays the check-only line
          # contract. Neither `strict` nor `stern` is set: measured on the
          # consumers (merges 801, devops-oud-iac +212 unfixable lines), both
          # turn hand-wrapped legacy prose into findings no tool can repair.
          # Tightening MD013 is a separate, per-repo text migration.
        - - MD013
          - line_length: *formatting_width
            heading_line_length: 200
            # Code blocks carry verbatim shell/JSON/policy lines that must not
            # be wrapped; prose keeps the formatting width, code gets the same
            # leniency as headings.
            code_block_line_length: 200
            tables: false
            reflow: false
        - [ MD022, true ]
        - [ MD023, true ]
        - [ MD024, { siblings_only: true } ]
        - [ MD025, { level: 1, front_matter_title: title } ]
        # one_or_ordered accepts lazy `1. 1. 1.` and
        # sequential numbering, consistent per list; `ordered` produced 3057
        # findings with no repair value (inventory 2026-11-04, flext-2vrgl).
        - [ MD029, { style: one_or_ordered } ]
        - [ MD031, true ]
        - [ MD033, { allowed_elements: [ br, details, summary, kbd ] } ]
        - [ MD036, false ]
        - [ MD040, true ]
        - [ MD041, false ]
        - [ MD042, false ]
        - [ MD046, { style: fenced } ]
        - [ MD048, { style: backtick } ]
        - [ MD049, { style: asterisk } ]
        - [ MD050, { style: asterisk } ]
        - [ MD051, false ]
        - [ MD055, { style: leading_and_trailing } ]
        # MD057 (relative link targets) has no repair: wave 2 with MD051.
        - [ MD057, false ]
        - [ MD060, { style: aligned } ]
        native_settings:
        - [ per-file-flavor, { 'docs/**/*.md': mkdocs } ]
      ruff:
        # Ruff exits 1 on findings. Remaining findings block repair acceptance;
        # the gate verifies the repaired state through the native read-only check.
        findings-exit-codes: [ 1 ]
        # The codegen artifact registry (analysis_exclude and the declared
        # exclusion registry) is the only exclusion source. Generation ownership
        # alone never excludes owned executable sources from analysis.
        # Lint covers every tracked Python surface; `.gitignore` and the
        # artifact registry decide visibility, never a copied exclude list.
        # tests, examples, and scripts are dev/tooling source roots (see `src`
        # below), not installed packages: they hold namespace/command modules
        # loaded by path (e.g. the scripts/<verb>/<what> dispatch pattern), so
        # ruff must not demand an __init__.py (INP001) there.
        lint:
          # The native format gate owns layout in the complete canonical
          # check/repair contract. Projection verifies that owner's election.
          rule-owners:
            missing-trailing-comma: format
          # Enforcement law ids each Ruff rule claims; the enforcement catalog
          # is derived from these claims and the other owners' declarations.
          enforce:
            import-outside-top-level: [ ENFORCE-015, ENFORCE-081 ]
            any-type: [ ENFORCE-016 ]
            non-pep585-annotation: [ ENFORCE-016 ]
            non-pep604-annotation-union: [ ENFORCE-016 ]
            deprecated-import: [ ENFORCE-016 ]
            non-pep695-type-alias: [ ENFORCE-016 ]
            print: [ ENFORCE-027 ]
            magic-value-comparison: [ ENFORCE-097 ]
          # Axiom (operator authorization 2026-11-02, tracker key
          # operator-order-2026-11-02-ruff-type-checking-axiom-off): Ruff's
          # whole type-checking family (its native family code TC) is off;
          # "RUFF FALHA MISERAVELMENTE COM PYDANTIC". TYPE_CHECKING placement
          # is calculated by the import-law rules (cycles plus Pydantic
          # runtime evaluation) and proven by fresh import.
          ruling-disabled-rules:
          - TC
          # Axiom "generic facade publication" (operator decisions 2026-11-13:
          # "Axiom TypeAlias in facade", "extend the axiom", "extenda o axioma para
          # global no mypy"). mypy 2.4.1 binds `C.attr` in an expression only from
          # C's own names (semanal.visit_member_expr), so a generic member class a
          # facade namespace inherits from its family part is not subscriptable
          # there: `m.Ns.Box[int](...)` becomes `types.GenericAlias`
          # (https://github.com/python/mypy/issues/22457). The generated `Name: TypeAlias = Part.Name`
          # publication is the only form that keeps the class itself at runtime and
          # subscriptable for mypy; ruff UP040 (non-pep695-type-alias), pyright
          # reportMissingTypeArgument and pyrefly implicit-any-type-argument
          # reject that bare generic alias, and pyrefly bad-override rejects the
          # alias shadowing the inherited member class (operator decision
          # 2026-11-13: "coloque como axioma global"). Retire all four when
          # mypy resolves #22457.
          - non-pep695-type-alias
          # RUF067 flags the generated family __init__ files that carry the
          # install_lazy_exports call: that PEP 562 lazy facade IS the
          # canonical projection shape, so the rule is structurally
          # incompatible with the architecture.
          - non-empty-init-module
          # make fix never deletes information. The lint
          # repair applies safe fixes only (make.ruff.lint_fix rejects
          # --unsafe-fixes), and these rules are never auto-fixed at all,
          # because their fixes delete a diagnostic print, an assignment, a
          # redefinition, a duplicated key/value/test case or a version block
          # (print once deleted print(..., file=sys.stderr) from a consumer
          # script and turned its failures silent). Ruff keeps reporting them;
          # the author decides. Also guards direct and IDE Ruff runs.
          # OPERATOR LAW 2026-10-05 (direct order, OBLIGATORY, NEVER DISABLED
          # AGAIN): `make fix` ALWAYS applies Ruff's unsafe fixes — the
          # mandatory lint_fix surface carries --unsafe-fix in codegen.yaml
          # and MakeRuffSpec fails validation without it. This list keeps its
          # historical evidence records for the rules whose fixes were proven
          # semantics-preserving while the channel was opt-in; it no longer
          # gates the channel (nothing needs promotion into a channel that is
          # always on). Rules whose fixes would destroy information remain in
          # `unfixable` above — that is rule selection, never disabling the
          # mandatory unsafe channel.
          # Operator ruling 2026-10-14 (docstring campaign flext-ez35p):
          # D413 missing-blank-line-after-last-section is re-enabled on top of
          # the Google convention: every docstring closes with one blank line
          # between its last section block and the closing quotes. Explicit
          # selectors take precedence over the convention baseline in Ruff.
          # Every import is absolute: make mod rewrites relative imports and
          # the lazy-init generator renders absolute import statements.
          # Every module carries the copyright notice (CPY001) in the shape the
          # scaffold templates render from the project's declared author and
          # copyright year. The fix recipe writes the module's project-relative
          # path, without its shared suffix, between that sentence and the
          # SPDX line so the notice is not one stamp.
          # Repairs make fix applies after Ruff's own fixes, to findings Ruff
          # reports without a fix: each Ruff rule name maps to one recipe the
          # lint gate derives from the source (docstring sections from the
          # signature, summary and raise statement; a documented exception the
          # body no longer raises loses only its own Raises entry; summaries from the declared
          # name; the notice from the project's declared author and copyright
          # year; a method that never reads its instance becomes a static
          # method, its signature and decorators edited and its body kept
          # byte for byte; an inline import runs through the import-law engine,
          # operator-ruling-2026-10-08-import-law; a long string literal or
          # comment Ruff format cannot wrap is split without changing the AST).
          fix-recipes:
            missing-copyright-notice: copyright-notice
            undocumented-public-class: summary-docstring
            undocumented-public-method: summary-docstring
            undocumented-public-function: summary-docstring
            docstring-missing-returns: returns-section
            docstring-missing-yields: yields-section
            docstring-missing-exception: raises-section
            docstring-extraneous-exception: extraneous-raises
            no-self-use: static-method
            import-outside-top-level: normalize-imports
            line-too-long: wrap-long-line
          # Phases run in order and Ruff re-reads the tree after each: imports
          # settle first (their rewrite can shorten or lengthen lines), a new
          # summary exposes the sections its function needs, and line wrapping
          # runs last over the final text.
          fix-recipe-phases:
          - [ normalize-imports ]
          - [ summary-docstring, copyright-notice, static-method ]
          - [ returns-section, yields-section, raises-section, extraneous-raises ]
          - [ wrap-long-line ]
          # Banned API messages are policy data, never template literals.
          # Operator ruling 2026-10-01 (docstring convention): docstrings follow
          # the Google convention, the shape the docstring fix recipes render.
          # Ruff then disables the docstring rules that convention does not
          # use, one of each mutually exclusive pair select ALL enables
          # (D203/D211, multi-line-summary-first-line/D213) included, so no run warns about them.
          # Authority: tracker memory operator-ruling-2026-10-09-ruff-dunder-descriptors.
          # Python type.__base__ is the native layout base; type.__bases__ is
          # the tuple of direct bases. Protocols expose both as read-only
          # properties without changing their signatures or native identity.
          # https://docs.python.org/3.13/reference/datamodel.html#type.__base__
          # https://docs.python.org/3.13/reference/datamodel.html#type.__bases__
          # https://docs.astral.sh/ruff/rules/bad-dunder-method-name/
          # bad-dunder-method-name remains enabled for every other unrecognized dunder name.
      mypy:
        # Default analysis budget, not the project ceiling. Project overlays
        # may select a measured finite budget up to max_timeout_seconds.
        # Neither field is controlled through environment variables.
        timeout_seconds: 90
        max_timeout_seconds: 600
        # Pydantic 2 and pydantic.mypy are mandatory (operator 2026-10-05).
        # Missing, empty, and v1 plugin declarations fail validation rather
        # than being silently repaired by schema defaults.
        # Analyze source distributions that have real annotations but omit
        # the PEP 561 marker. Rope 1.14 is one such runtime owner; skipping
        # it converts every public boundary into Any and makes its imports
        # fail before our typed protocols can validate them.
        # strict_concatenate is deprecated in mypy 1.20+; extra_checks covers it
        # Operator ruling 2026-10-05 (mypy-pydantic law): call-arg and
        # prop-decorator stay suspended until the fleet facade-alias family
        # is cured; pydantic.mypy remains mandatory. Operator order 2026-11-13
        # restores the 2026-11-08 suspension set that 387febe2ec reduced to two
        # codes without authorization. Mutating these codes is a regression to
        # revert.
        ruling-disable-error-codes: [ call-arg, prop-decorator, arg-type, assignment, attr-defined, has-type, list-item, misc, name-defined, no-any-return, override, unreachable, valid-type, var-annotated ]
        overrides:
        - modules: [ rope.* ]
          settings: [ [ follow_untyped_imports, true ] ]
          justification: >-
            Analyze Rope's installed source without suppressing import-untyped; https://mypy.readthedocs.io/en/stable/config_file.html#follow-untyped-imports
      pyright:
        # Global axioms (operator order 2026-11-03, verbatim:
        # "reportMissingTypeStubs tb tem que entrar em tooling.yaml global como
        # axioma, lembre-se que axiomas tem que ser autorizados unicamente pelo
        # operador e ser globais"; earlier ruling
        # operator-ruling-20261022-missing-type-stubs): strict mode requires a
        # stub file for an untyped third-party import even when Pyright already
        # infers the library source. Used surfaces stay typed through `p`
        # protocols at one boundary module per library. Axioms are global and
        # only the operator authorizes them; no project overrides them.
         ruling-disabled-rules:
         - reportMissingTypeStubs
         # Axiom (operator authorization 2026-11-08): pyright cannot resolve
         # structural protocol members / advanced type forms derived from
         # Pydantic models the way pyrefly does; the canonical form uses p.*
         # protocols and is validated by pyrefly + mypy. These codes are
         # silenced globally until the canonical protocol projection lands.
         - reportUnknownMemberType
         - reportUnknownArgumentType
         - reportInvalidTypeForm
         - reportUnknownVariableType
         - reportUnknownParameterType
         - reportUnknownLambdaType
         - reportIncompatibleVariableOverride
         # Axiom (operator authorization 2026-11-08, continuation): pyright
         # cannot resolve the protocol/model duality (p.* vs m.*) and the
         # advanced typing forms used across the fleet; these are false
         # positives from linter incapacity, not real defects. Silenced
         # globally until the canonical projection lands.
         - reportUndefinedVariable
         - reportGeneralTypeIssues
         - reportUnnecessaryIsInstance
         - reportArgumentType
         - reportAttributeAccessIssue
         - reportCallIssue
         - reportUntypedFunctionDecorator
         - reportAssignmentType
         - reportReturnType
         - reportAbstractUsage
         # Axiom "generic facade publication" (python/mypy#22457): justification
         # and retirement condition at tools.ruff.lint.ruling-disabled-rules.
         - reportMissingTypeArgument
         path-rules:
          # Source and tracked consumer surfaces are all
          # first-class environments so no analyzer can hide their diagnostics.
          source-dir: src
          project-root: .
          env-dirs: [ src, tests, examples, scripts ]
          test-like-dirs: [ tests, examples, scripts ]
          default-excludes:
          - "**/.*"
          ignored-diagnostic-globs: []
          # Authorized, path-scoped type-checker rule exceptions: the single
          # list for both checkers. One entry renders the Pyright
          # executionEnvironment and the Pyrefly sub-config of its root. Each
          # entry names root (an existing project-relative file or directory),
          # rationale, authorization (tracker-key, or operator-words + date +
          # channel) and changes (checker, rule, old, new). A missing
          # authorization or root fails.
          diagnostic-path-exceptions: []
          source-report-private-usage: error
          test-like-report-private-usage: error
          other-report-private-usage: error
      pyrefly:
        findings-exit-codes: [ 1 ]
        # Axiom "generic facade publication" (python/mypy#22457): justification
        # and retirement condition at tools.ruff.lint.ruling-disabled-rules.
        ruling-disabled-rules:
        - implicit-any-type-argument
        - bad-override
        path-rules:
          source-dir: src
          project-root: .
          env-dirs: [ src, tests, examples, scripts ]
          workspace-include-children: false
          workspace-include-child-env-dirs: []
          # Empty: scripts/ owns scripts/__init__.py, so every script module
          # resolves as `scripts.*` with the repo root as CWD. Adding "." or
          # "scripts" here makes the same file reachable under a second module
          # name, which mypy reports as source-file-found-twice. scripts/ is
          # analyzed because `files` names it, not because the search path
          # does.
          project-shared-search-paths: []
      pytest:
        # Scaffold and modernizer share the aggregate execution policy. Ordinary
        # items have no per-item deadline; the runner owns the invocation wall.
        # Slow marks are a narrow integration-harness budget, not permission
        # for an unbounded test. Cases that exceed it require owner repair.
        # Operator order operator-order-2026-10-25-make-timeout-60s-cprofile:
        # every make verb finishes within 60s; slower runs are profiled with
        # cProfile and cured at their owner. The slow-phase stop reserve is
        # xdist items per worker x slow-timeout + grace = 2 x 25 + 2 = 52 s,
        # which must stay below run-timeout-seconds.
        slow-timeout-seconds: 25
        # Marker selection never removes the aggregate operation deadline.
        # Slow items also retain their declared per-item integration budget.
        slow-marker: slow
        # A local suite that cannot finish within run-timeout-seconds is a
        # performance defect. Collection, lease waits and every suite child
        # share the entrypoint clock, with termination grace inside this wall.
        run-timeout-seconds: 240
        termination-grace-seconds: 2
        # One failure stops the invocation. The next run starts from the
        # corrected owner instead of accumulating a backlog of unrelated
        # failures.
        max-failures: 1
        enforcement-plugin: flext_tests.enforcement_plugin
        # Retain the complete selection, but expose known failures first.
        progress-args: [ --verbose, --failed-first ]
        report-args: [ -ra, --durations=25, --durations-min=0.001, --tb=short ]
        diagnostic-args: [ -rA, --durations=0, --tb=long, --showlocals ]
        # One worker makes maxfail exact: no second in-flight case can fail
        # after the first failure has stopped the invocation.
        parallel-workers: 1
        # Per declared-project worker ceilings ([project].name → workers),
        # resolved by the runner over the default above: a consumer whose
        # measured suite cannot fit the single-worker process boundary
        # declares its ceiling here, inside the fleet cycle, instead of
        # patching projections. With workers > 1 maxfail still stops the
        # invocation; in-flight cases may report after the stop, which the
        # declaring consumer accepts by declaring. A project's own
        # [tool.flext.project.tests] parallel-workers declaration wins over
        # this map.
        parallel-worker-overrides:
          merges:
            workers: 4
          cosmos-docgen:
            workers: 4
          # dc-finan measured 2026-11-13 (20 cores, shared host): cold suite,
          # 528 passed + 104 subtests, -n 8 289 s, -n 16 183 s. The critical
          # path is two suites still spawning `python -m`; their in-process
          # cure lowers the run and then this ceiling is re-measured.
          dc-finan:
            workers: 16
          # The measured ceiling for this suite; higher ceilings regressed the
          # cold run because per-window dispatch overhead dominates.
          flext-infra:
            workers: 4
          # flext-tests slow phase measured 2026-10-02 (load ~7, 20 cores):
          # 34 slow items, 89.4s of call time across 32 of them; every item
          # passes, but each pytester case boots a child pytest with the full
          # facade stack, so the serial phase reached the 120s entry clock at
          # its 33rd item. The cases are host-lock and namespace isolated.
          flext-tests:
            workers: 1
          # CPU-fraction ceilings (cpu_fraction: "n/d") resolve at runtime
          # against the process CPU count.
          # Reserve physical memory for each xdist worker and its child process
          # tree; this bound may reduce the tested ceiling on smaller hosts.
          # Reserve physical memory for each xdist worker and its child process
          # tree; this bound may reduce the tested ceiling on smaller hosts.
        parallel-worker-memory-gb: 2
        # Keep scheduling centralized within the measured worker budget.
        parallel-distribution: load
        # Preserve xdist's native scope-size ordering unless a project declares
        # collection order as part of its loadscope execution contract.
        loadscope-reorder: true
        # xdist queues the shutdown marker behind each worker's pre-dispatched
        # chunk, so a larger chunk delays the declared max-failures stop until
        # every worker drains its assigned items. One test per dispatch step
        # makes that stop immediate.
        parallel-schedule-chunk: 1
        profile-sort: cumulative
        profile-limit: 50
        profile-suite-filename: pytest.pstats
        profile-process-directory: profiles
        # Collect once from the canonical test root. The former list ended in
        # `.` and therefore traversed tests, source, docs, examples, scripts,
        # generated reports, and local runtime state a second time. Executable
        # documentation and auxiliary surfaces remain covered by explicit tests
        # and their lint/Markdown gates rather than duplicate pytest discovery.
        # pytest applies filterwarnings last-entry-wins; the conform phase +
        # tomlsort alpha-sort filterwarnings, so any override MUST sort AFTER
        # "error" to survive re-conform. Only module::/once:: sort after 'error'
        # ('m'/'o' > 'e'); default::/always::/ignore:: get reordered before it and
        # lose. flext-core's static-time enforcement is switched off (operator
        # order 2026-10-25; it migrates to flext-infra's declarative rules), so
        # no core enforcement warning category is filtered here; every other
        # warning stays fatal.
        standard-markers:
        - "smoke: public-interface smoke tests"
        - "unit: unit tests"
        - "integration: integration tests"
        - "functional: functional behavior tests"
        - "performance: performance and benchmark tests"
        - "slow: slow-running tests"
        - "docker: tests requiring Docker"
        - "oracle: tests requiring the shared Oracle database"
        - "ldap: tests requiring the shared LDAP service"
        - "remote: tests requiring remote/external network services"
        - "e2e: end-to-end integration tests"
        - "edge_cases: edge case tests"
        - "stress: stress tests"
        - "resilience: resilience tests"
        - "discovery: catalog and stream discovery tests"
        - "singer: Singer protocol contract tests"
        - "requires_engine: native check engine required by this test"
        # External-token gates never run inside
        # offline verification (`make test`); the runner records their exclusion.
        # Under the Make CI token the incremental global scope (`make tests`)
        # deselects them too: CI has neither Docker nor remote services, so they
        # are reported NOT EXECUTED, never skipped (operator decision 2026-11-05).
        # `make test-full` runs locally only and executes every marker once,
        # without testmon and without any time limit. Existing external tests
        # retain their declared environment and authentication requirements.
        external-gate-markers: [ remote, docker ]
        # Harness gates run only under the harness that provides their inputs
        # (ai-hub `make runtime-acceptance` names its remote suite). Local
        # `make tests` deselects them exactly as CI does and reports them NOT
        # EXECUTED; `make test-full` and a named file still select them.
        harness-gate-markers: [ remote ]
        # CI and pre-commit share make.ci.value;
        # local and pre-push execution retain slow tests. `make test-full`
        # includes these markers in every context.
        ci-excluded-markers: [ slow ]
        # Fixtures declaring local engines or resolution cannot execute in approval.
        ci-excluded-fixtures: [ resolved_make_templates, detector_project, mod_workspace, smells_project, _clear_make_ci_token ]
        # The cross-layer enforcement catalog runs strict in every suite:
        # the test-reality laws (ENFORCE-019/051/054/055/098) fail the run
        # instead of warning; warnings are never a landing state.
        # Per-item limits do not belong in baseline addopts; the runner owns
        # the aggregate wall and the slow marker owns its narrow item policy.
      tomlsort:
        process-timeout-seconds: 60
      # Bandit test ids the security gate skips; every other test stays
      # blocking. B101: assert is the tests idiom. B404 and B603: axiom
      # (operator decision 2026-11-12, "Axiom: skip B404+B603") - list-form
      # subprocess without a shell is the safe pattern, and the single
      # process-execution owner must import subprocess. B602 (shell=True)
      # stays active.
      bandit:
        skips: [ B101, B404, B603 ]
      # jscpd's own near-miss and meaning passes own clone semantics: the
      # structural pass (--similarity) compares normalized syntax trees and
      # runs everywhere; the embedding pass (--semantic) needs the declared
      # embeddings host, so the CI context records it NOT EXECUTED.
      jscpd:
        similarity: 0.8
        # Embedding model of the pass: bge-m3, by the name jscpd's own catalog
        # calibrates, so its thresholds come from jscpd and are not restated
        # here. Measured 2026-11-05 on gruponos-merges (jscpd 5.4.2, two
        # snapshots; tracker dc_recon-26p): jina-embeddings-v2-base-code
        # reported 19 pairs, most of them related rather than duplicated code;
        # bge-m3 reported 6, 5 of them real duplication, stable across runs;
        # CodeRankEmbed took about 6 minutes, over the gate budget.
        semantic:
          provider: http
          url: http://localhost:11434/v1
          model: bge-m3
        # Operator authorization 2026-10-25 (in-session answer "Autorizar
        # exclusão no jscpd"): the mandated module license header repeats in
        # every module by contract, so it is no clone to repair. jscpd matches
        # each pattern against one token, and a docstring line is one token,
        # so each header line has its own pattern (any year); the docstring
        # summary and the import block that follows stay scanned.
        # Operator extension 2026-10-28 (task "arrume todos os problemas de
        # duplicacao"): the module preamble and the generated lazy-init
        # boilerplate lines below repeat in every module by the same contract
        # (import law mandates `from __future__ import annotations`; the
        # lazy-export law mandates the initializer's MappingProxyType /
        # TYPE_CHECKING / install_lazy_exports scaffolding), so they are
        # mandated boilerplate, not clones to repair. Per-package import
        # lists and every non-mandated line stay scanned.
        # Member extension 2026-11-05: fleet members carry their own license holder and SPDX tag
        # by the same "license header repeats in every module" contract, so
        # the two header patterns cover any holder and identifier instead of
        # only the family's. Remaining generated-package body stays under
        # minLines/minTokens and keeps scanned.
        ignore-patterns:
        - "Copyright \\(c\\) [0-9]{4} .+\\. All rights reserved\\."
        - "SPDX-License-Identifier: [A-Za-z0-9._-]+"
        - "from __future__ import annotations"
        - "from typing import TYPE_CHECKING"
        - "from types import MappingProxyType"
        - "from flext_core.lazy import install_lazy_exports"

    lazy-init:
      # Canonical import layer order of the FLEXT import law
      # (operator-ruling-2026-10-08-import-law). Lower index = lower layer;
      # ``other`` holds every module whose path names no declared layer.
      # Runtime imports target equal-or-lower layers; a reverse (higher)
      # import is emitted under ``if TYPE_CHECKING:`` per
      # ``reverse_import_mode``, and a reverse runtime use stays a finding.
      import-layer-order:
      - settings
      - config
      - c
      - t
      - p
      - m
      - u
      - other
      - base
      - services
      - api
      - cli
      # Module ranking only: the core package's modules behind r/e (`_result`,
      # `_exceptions`) rank with u when the engine judges a module's imports.
      # Whether an alias is imported at runtime is not this fact: operational
      # aliases are runtime in every module (operator ruling 2026-10-24,
      # "r also runtime"), derived by the namespace import header producer.
      layer-aliases:
        r: u
        e: u
      # Stdlib backports import like the standard library everywhere (operator
      # decision 2026-10-24): the PEP 747 TypeForm special form exists only in
      # typing_extensions on this Python line, and type checkers recognize it
      # only through its own name binding (ADR-028).
      stdlib-backports: [ typing_extensions ]
      reverse-import-mode: type_checking
      forward-import-form: absolute
    # One owner per facade member (operator order 2026-10-24): the kind of the
    # runtime object a member binds selects its owner letter; any other facade
    # binding the same object is a duplicate retired by make mod, and consumers
    # are relocated to the owner. No member is listed here.
    facade-members:
      owners:
        exception: c
        enum: c
        constant: c
        type: t
        protocol: p
        model: m
        model-declaration: m
        function: u
      # Callables of these model-library modules declare models (field
      # specifiers, validators, serializers) instead of running at runtime.
      model-declaration-modules:
      - pydantic.fields
      - pydantic.functional_validators
      - pydantic.functional_serializers
      # Callables of these modules build constrained annotation types.
      type-constructor-modules:
      - pydantic.types
    # qlty owns smell detection and its thresholds (its own defaults); this
    # block owns the repair text the smells gate appends to a finding and the
    # law ids it enforces, keyed by the qlty check name (the SARIF ruleId
    # suffix).
    smells:
      fix-text:
        function-parameters: >-
          Decompose into smaller functions or pass a context/model object only when it carries domain meaning; adding a params model solely to silence this rule is abominable.
        return-statements: >-
          Refactor to a single result path; use early returns only when they improve readability.
        nested-control-flow: Extract helper functions to flatten control flow.
        boolean-logic: Simplify boolean expressions or introduce named predicates.
        function-complexity: >-
          Decompose the function into smaller, single-responsibility helpers.
        file-complexity: Split the module into focused units.
        identical-code: Extract a shared helper or canonical constant.
        similar-code: >-
          Refactor to a shared abstraction or delegate to a common helper.
      # Enforcement law ids the smells gate claims, keyed by qlty check name.
      enforce:
        function-parameters: [ ENFORCE-071 ]
        return-statements: [ ENFORCE-072 ]
        nested-control-flow: [ ENFORCE-073 ]
        boolean-logic: [ ENFORCE-074 ]
        function-complexity: [ ENFORCE-075 ]
        file-complexity: [ ENFORCE-076 ]
        identical-code: [ ENFORCE-077 ]
        similar-code: [ ENFORCE-078 ]
    # A public method whose name starts with one of these prefixes declares an
    # accessor; the accessor migration reports it with the replacement guidance.
    # The proven renames live in config/rules/rope/accessor-migrations.yaml.
    accessor-policy:
      forbidden-prefixes:
        get_: fetch_/resolve_/compute_
        set_: configure_/apply_/update_
        is_: a noun/adjective (success, expired, connected, ...)
    mod:
      scan_threads: 4
      phases:
        # Component toggles for make mod (rule: toggles are data, not flags).
        import-alignment: true
        # Native cascade: every fixable rule that is neither an owned-path rule
        # nor a Rope relocation applies
        # through ast-grep's own `scan --update-all` over the project's staged
        # sgconfig (.reports/codemod/native/<stage>/sgconfig.yml), stage by
        # stage in this order; the sequence repeats in one staged preview
        # until no byte changes, at most pass-cap times, then publishes once.
        pass-cap: 8
        stages:
        # Generated canonical import headers settle before any catalog rule.
        - name: header
          kind: native
          shapes: [ import-header ]
        # Every other native rule of the elected catalog.
        - name: catalog
          kind: native
        # Last: prune the imports the rewrites left unused and order them.
        - name: import-fix
          kind: ruff
          select: [ F401, I001 ]
