Infra:
  tooling:
    # Canonical validated native tooling policy; diagnostics remain blocking.
    raw-check-receipt-suffix: .raw.log
    derived-tool-roots: [deptry, mypy, pyrefly, pyright, pytest, ruff, vulture]
    derived-settings:
      mypy: [python_version, mypy_path, overrides, disable_error_code]
      pyrefly: [python-version]
      pyright: [pythonVersion, executionEnvironments, extraPaths, include, exclude, venv, venvPath]
      pytest.ini_options: [flext_slow_timeout_seconds, markers]
      ruff: [target-version]
    # Native options are free key/value pairs, grouped by their tool table.
    # The same catalog drives modernization and every projected template.
    settings:
      codespell:
      - [check-filenames, true]
      - [ignore-words-list, 'crate,nd']
      pydantic-mypy:
      - [init_forbid_extra, true]
      - [init_typed, true]
      - [warn_required_dynamic_aliases, true]
      pyrefly:
      - [disable-project-excludes-heuristics, true]
      - [use-ignore-files, false]
      - - project-excludes
        - ["**/__pycache__", "**/__pyrefly_virtual__/**", "**/node_modules",
          "**/.venv/**", "**/site-packages/**", "**/typings/**", "**/venv/**",
          "**/vendor/**", ".venv/**", "typings/**", "vendor/**"]
      pyrefly.errors:
      # Preserve every diagnostic from the strict-error policy during cutover.
      - [bad-argument-count, error]
      - [bad-argument-type, error]
      - [bad-assignment, error]
      - [bad-class-definition, error]
      - [bad-context-manager, error]
      - [bad-dunder-all, error]
      - [bad-function-definition, error]
      - [bad-index, error]
      - [bad-instantiation, error]
      - [bad-keyword-argument, error]
      - [bad-match, error]
      - [bad-param-name-override, error]
      - [bad-raise, error]
      - [bad-return, error]
      - [bad-specialization, error]
      - [bad-typed-dict, error]
      - [bad-typed-dict-key, error]
      - [bad-unpacking, error]
      - [deprecated, error]
      - [implicit-abstract-class, error]
      - [implicit-any, error]
      - [implicit-import, error]
      - [implicitly-defined-attribute, error]
      - [inconsistent-inheritance, error]
      - [inconsistent-overload, error]
      - [invalid-annotation, error]
      - [invalid-argument, error]
      - [invalid-decorator, error]
      - [invalid-inheritance, error]
      - [invalid-literal, error]
      - [invalid-overload, error]
      - [invalid-param-spec, error]
      - [invalid-pattern, error]
      - [invalid-self-type, error]
      - [invalid-super-call, error]
      - [invalid-type-alias, error]
      - [invalid-type-var, error]
      - [invalid-type-var-tuple, error]
      - [invalid-variance, error]
      - [invalid-yield, error]
      - [missing-argument, error]
      - [missing-attribute, error]
      - [missing-import, error]
      - [missing-module-attribute, error]
      - [missing-override-decorator, error]
      - [missing-source, error]
      - [missing-source-for-stubs, error]
      - [no-access, error]
      - [no-matching-overload, error]
      - [not-a-type, error]
      - [not-async, error]
      - [not-callable, error]
      - [not-iterable, error]
      - [not-required-key-access, error]
      - [open-unpacking, error]
      - [protocol-implicitly-defined-attribute, error]
      - [read-only, error]
      - [redefinition, error]
      - [redundant-cast, error]
      - [redundant-condition, error]
      - [unannotated-attribute, error]
      - [unannotated-parameter, error]
      - [unannotated-return, error]
      - [unbound-name, error]
      - [unexpected-keyword, error]
      - [unexpected-positional-argument, error]
      - [unknown-name, error]
      - [unnecessary-comparison, error]
      - [unnecessary-type-conversion, error]
      - [unreachable, error]
      - [unresolvable-dunder-all, error]
      - [unsafe-overlap, error]
      - [unsupported, error]
      - [unsupported-delete, error]
      - [unsupported-operation, error]
      - [untyped-import, error]
      - [unused-coroutine, error]
      - [unused-ignore, error]
      - [variance-mismatch, error]
      - [inconsistent-overload-default, error]
      deptry:
      - [ optional_dependencies_dev_groups, [ dev ] ]
      coverage.run:
      - [ source, [ src ] ]
      - [ omit, [ "*/dependency_injector/providers.pyx", "*/protocols.py", "*/_protocols/*" ] ]
      coverage.report:
      - [ show_missing, true ]
      - [ skip_covered, false ]
      - [ precision, 2 ]
      - [ exclude_also, [ "if _t.TYPE_CHECKING:", "if TYPE_CHECKING:", "if typing.TYPE_CHECKING:" ] ]
      hatch.metadata:
      - [allow-direct-references, true]
      tomlsort:
      - [all, true]
      - [in_place, true]
      - [sort_first, [project, build-system, tool, dependency-groups]]
      vulture:
      - [exclude, ["*/_protocols/*"]]
      - [min_confidence, 100]
      - [paths, [src]]
      - [verbose, false]
      yamlfix:
      - [line_length, &formatting_width 88]
      - [preserve_quotes, true]
      - [whitelines, 1]
      - [section_whitelines, 1]
      - [explicit_start, false]
      pytest.ini_options:
      - [asyncio_default_fixture_loop_scope, function]
      - [python_files, ["*_test.py", "*_tests.py", "test_*.py"]]
      - [testpaths, [tests]]
      - [minversion, "8.0"]
      - [python_classes, ["Test*"]]
      - [filterwarnings, [error, "module::flext_core._constants.enforcement.FlextMroViolation", "once::pytest.PytestAssertRewriteWarning"]]
      - [addopts, [--benchmark-disable, --strict-markers, --markdown-docs, --durations=10, --flext-enforce-strict]]
      pyright:
      - [ pythonPlatform, Linux ]
      - [ reportCallIssue, error ]
      - [ reportConstantRedefinition, error ]
      - [ reportIncompatibleMethodOverride, error ]
      - [ reportInconsistentConstructor, error ]
      - [ reportMissingImports, error ]
      - [ reportMissingModuleSource, error ]
      - [ reportPrivateUsage, error ]
      - [ reportUnnecessaryCast, error ]
      - [ reportUnnecessaryComparison, error ]
      - [ reportUnnecessaryIsInstance, error ]
      - [ reportUnusedClass, error ]
      - [ reportUnusedFunction, error ]
      - [ reportUnusedImport, error ]
      - [ reportUnusedVariable, error ]
      - [ typeCheckingMode, strict ]
      - [ useLibraryCodeForTypes, true ]
      ruff:
      - [ extend-exclude, [ "**/.archive/**", "**/.agents/aihub-hooks/**", "**/.claude/aihub-hooks/**", "**/.codex/aihub-hooks/**", "**/.cursor/aihub-hooks/**", "**/.gemini/aihub-hooks/**" ] ]
      - [ namespace-packages, [ tests, examples, scripts ] ]
      - [ fix, false ]
      - [ line-length, *formatting_width ]
      - [ preview, true ]
      - [ respect-gitignore, true ]
      - [ show-fixes, true ]
      - [ src, [ src, tests, examples, scripts ] ]
      ruff.format:
      - [ docstring-code-format, true ]
      - [ indent-style, space ]
      - [ line-ending, lf ]
      - [ quote-style, double ]
      - [ skip-magic-trailing-comma, false ]
      ruff.lint:
      - [ select, [ ALL ] ]
      - [ ignore, [] ]
      - [ unfixable, [ multi-value-repeated-key-literal, multi-value-repeated-key-variable, p-print, print, pytest-duplicate-parametrize-test-cases ] ]
      - [ extend-safe-fixes, [ relative-imports, typing-only-first-party-import, camelcase-imported-as-lowercase ] ]
      - [ extend-select, [ missing-blank-line-after-last-section ] ]
      ruff.lint.flake8-tidy-imports:
      - [ ban-relative-imports, all ]
      - - banned-api
        - argparse: { msg: "Use cli.register_result_command + Pydantic model from flext_cli." }
          click: { msg: "Use flext_cli.cli application, registration, execution, and invocation methods." }
          rich: { msg: "Use cli.print / cli.display_message / cli.render_panel / cli.render_table." }
          tabulate: { msg: "Use cli.render_table from flext_cli." }
          typer: { msg: "Use cli.create_app_with_common_params / cli.register_command from flext_cli." }
      ruff.lint.flake8-copyright:
      - [ notice-rgx, 'Copyright \(c\) \d{4} \S[^\n]*\. All rights reserved\.' ]
      ruff.lint.isort:
      - [ combine-as-imports, true ]
      - [ force-single-line, false ]
      - [ split-on-trailing-comma, false ]
      ruff.lint.pydocstyle:
      - [ convention, google ]
      ruff.lint.pylint:
      - [ allow-dunder-method-names, [ __base__, __bases__ ] ]
      mypy:
      - [ plugins, [ pydantic.mypy ] ]
      - [ allow_redefinition, true ]
      - [ namespace_packages, true ]
      - [ explicit_package_bases, true ]
      - [ check_untyped_defs, true ]
      - [ extra_checks, true ]
      - [ follow_untyped_imports, true ]
      - [ local_partial_types, true ]
      - [ no_implicit_reexport, true ]
      - [ show_traceback, true ]
      - [ strict_equality, true ]
      - [ warn_redundant_casts, true ]
      - [ warn_return_any, true ]
      - [ warn_unreachable, true ]
      - [ warn_unused_ignores, true ]
      - [ follow_imports, normal ]
    tools:
      # Non-linter tool sections are config-owned as well.
      markdown:
        # rumdl exits 1 on any violation and 2 on an error: a repair verb
        # completes with findings under this status; any other fails it.
        findings-exit-codes: [ 1 ]
        rules:
        - [default, true]
        - [MD001, false]
          # MD013 prose and code lengths are THE markdown line contract for
          # both rumdl surfaces: `rumdl check` (markdown gate, `make fix`) and
          # `rumdl fmt` (markdown-format gate, `make fmt`) read this one rule
          # set through the generated .markdownlint.json. Headings use
          # MD013.heading_line_length because no tool can reflow a heading.
          #
          # Wrapping is hand-owned, not tool-owned: rumdl's normalize reflow
          # joins a hand-wrapped paragraph into one line and cannot re-split
          # lines containing inline-code spans. With reflow off, nobody
          # rewrites an author's breaks, and MD013 stays the check-only line
          # contract: a genuinely long line is a finding the author fixes by
          # wrapping.
        - - MD013
          - line_length: *formatting_width
            heading_line_length: 200
            code_block_line_length: *formatting_width
            tables: false
            reflow: false
        - [MD022, false]
        - [MD023, false]
        - [MD024, { siblings_only: true }]
        - [MD025, false]
        - [MD031, false]
        - [MD033, { allowed_elements: [ br, details, summary, kbd ] }]
        - [MD036, false]
        - [MD040, false]
        - [MD041, false]
        - [MD042, false]
        - [MD046, false]
        - [MD050, { style: consistent }]
        - [MD051, false]
        - [MD057, false]
        - [MD060, false]
        - [MD076, false]
        exclude:
        # AGENTS.md is a tool-managed projection (tracker and agent setup
        # blocks): gating generated output is a projection defect.
        # CLAUDE.md is its symlink and would rewrite the projection through
        # the link.
        - AGENTS.md
        - CLAUDE.md
        # GEMINI.md is the same tool-managed instruction-pointer projection
        # (generate-workspace-config); prose-wrap always rewraps its exact
        # rendered pointer and the law-surface validator then fails closed.
        - GEMINI.md
        - .kilo/**
        - .omo/**
        # ZCode session artifacts (plan files) are machine-local scratch,
        # never a live docs or markdown-gate surface.
        - .zcode/**
        - .tmp/**
        - .claude/**
        - .vscode/**
        - .serena/**
        - .snapshots/**
        - .benchmarks/**
        - .hypothesis/**
        # CHANGELOG.md files are release-please output: their bullets embed
        # compare/commit URLs that cannot reflow under the line budget, and
        # hand-wrapping them is overwritten by the next release render
        # (operator authorization 2026-10-03).
        - CHANGELOG.md
        # Codegen-managed docs projections (make gen / docs generate): the
        # renderer's output is canonical as emitted — a formatter rewriting
        # them fights the codegen fixed point and the conform gate flags
        # the drift both ways (merge-admin 2026-10-07, root evidence).
        - docs/docs_config.json
        - docs/architecture/architecture_config.json
        - .mypy_cache/**
        - .pytest_cache/**
        - .ruff_cache/**
        - .venv/**
        - __pycache__/**
        - node_modules/**
        - .reports/**
        - dist/**
        - build/**
        - htmlcov/**
        - legado/**
        - .github/**
        - site/**
        # target/ is a fully generated build tree (mise/rust-style outputs):
        # formatting generated output is a projection defect.
        - target/**
        # Provider-surface projections and tracker runtime state: never a
        # lint/format surface.
        - .agents/**
        - .gemini/**
        - .beads/**
        # Gen-emitted table projections whose emitter lives outside the
        # codegen surface; MD058 (blank lines around tables) is upstream of
        # the projection and cannot be repaired at the projection itself.
        - docs/knowledge-index.md
        - docs/architecture/communities/index.md
        # External CRG tool output: pipe-separated rows (MD075) and long JSON
        # lines (MD013) originate from code-review-graph, not hand-authored docs.
        - docs/architecture/crg-reports/**
        # Generated api-reference and project-catalog projections (make gen /
        # docs generate): the renderer's output is canonical as emitted, so
        # no formatter rewrites generated docs and the codegen fixed point
        # stays stable.
        - docs/api-reference/generated/**
        # Historical evidence documents (plans, handoffs, frozen law text):
        # their formatting is frozen evidence per operator law 11 —
        # reformatting rewrites the record. Frozen as evidence, never
        # re-rendered.
        - docs/plans/2026-09-14-stabilization-handoff/previous-handoff-source.md
        - docs/plans/2026-09-22-pipeline-integracao-continua-plano.md
        - docs/plans/2026-09-22-rope-generator-stabilization/02-achados-codegen.md
        - docs/plans/2026-09-23-handoff-mypy-stabilization-e-integracao.md
        - docs/plans/2026-09-25-v8-flext-service-base/05-phases.md
        - docs/plans/2026-09-25-v8-flext-service-base/07-sessions-guide.md
        - docs/standards/consumption-law.md
        - docs/projects/generated/**
      ruff:
        # Ruff exits 1 on findings. Remaining findings block repair acceptance;
        # the gate verifies the repaired state through the native read-only check.
        findings-exit-codes: [ 1 ]
        # Historical evidence trees (.archive/**) hold archived session
        # artifacts, never live source: they are evidence-only material
        # (operator law 11) and stay outside the lint scope of every
        # projected member.
        # Generated source trees (codegen artifacts with generated_source)
        # are appended by the projection from that one key, never listed.
        # Provider-owned AI Hub hook projections live under the tool-home
        # dot directories (.agents/.claude/.codex/.cursor/.gemini ...); the
        # operators rule (fleet learned constraint) keeps ~/.* code outside
        # the lint scope, and these hooks are distributed tool-home state,
        # not member source.
        # Lint covers every tracked Python surface; `.gitignore` alone decides
        # visibility (respect-gitignore below), never a copied exclude list.
        # tests, examples, and scripts are dev/tooling source roots (see `src`
        # below), not installed packages: they hold namespace/command modules
        # loaded by path (e.g. the scripts/<verb>/<what> dispatch pattern), so
        # ruff must not demand an __init__.py (INP001) there.
        lint:
          # The native format gate owns layout in the complete canonical
          # check/repair contract. Projection verifies that owner's election.
          rule-owners:
            missing-trailing-comma: format
          # Operator law (2026-10-05 flext-p7bxt, reiterated 2026-10-18):
          # TC001-TC004 break Pydantic model resolution — the lazy facade
          # architecture requires the runtime imports these rules would move
          # into TYPE_CHECKING blocks. Always disabled here at the SSOT and
          # projected into lint ignore; manual per-file noqa hints are
          # forbidden everywhere, including per-project overrides.
          ruling-disabled-rules:
          - runtime-import-in-type-checking-block
          - typing-only-first-party-import
          - typing-only-standard-library-import
          - typing-only-third-party-import
          # RUF067 flags the generated family __init__ files that carry the
          # install_lazy_exports call: that PEP 562 lazy facade IS the
          # canonical projection shape, so the rule is structurally
          # incompatible with the architecture.
          - non-empty-init-module
          # make fix never deletes information. The lint
          # repair applies safe fixes only (make.ruff.lint_fix rejects
          # --unsafe-fixes), and these rules are never auto-fixed at all,
          # because their fixes delete a diagnostic print, an assignment, a
          # redefinition, a duplicated key/value/test case or a version block
          # (print once deleted print(..., file=sys.stderr) from a consumer
          # script and turned its failures silent). Ruff keeps reporting them;
          # the author decides. Also guards direct and IDE Ruff runs.
          # OPERATOR LAW 2026-10-05 (direct order, OBLIGATORY, NEVER DISABLED
          # AGAIN): `make fix` ALWAYS applies Ruff's unsafe fixes — the
          # mandatory lint_fix surface carries --unsafe-fix in codegen.yaml
          # and MakeRuffSpec fails validation without it. This list keeps its
          # historical evidence records for the rules whose fixes were proven
          # semantics-preserving while the channel was opt-in; it no longer
          # gates the channel (nothing needs promotion into a channel that is
          # always on). Rules whose fixes would destroy information remain in
          # `unfixable` above — that is rule selection, never disabling the
          # mandatory unsafe channel.
          # Operator ruling 2026-10-14 (docstring campaign flext-ez35p):
          # D413 missing-blank-line-after-last-section is re-enabled on top of
          # the Google convention: every docstring closes with one blank line
          # between its last section block and the closing quotes. Explicit
          # selectors take precedence over the convention baseline in Ruff.
          # Every import is absolute: make mod rewrites relative imports and
          # the lazy-init generator renders absolute import statements.
          # Every module carries the copyright notice (CPY001) in the shape the
          # scaffold templates render from the project's declared author and
          # copyright year. The fix recipe writes the module's project-relative
          # path, without its shared suffix, between that sentence and the
          # SPDX line so the notice is not one stamp.
          # Repairs make fix applies after Ruff's own fixes, to findings Ruff
          # reports without a fix: each Ruff rule name maps to one recipe the
          # lint gate derives from the source (docstring sections from the
          # signature, summary and raise statement; summaries from the declared
          # name; the notice from the project's declared author and copyright
          # year; a method that never reads its instance becomes a static
          # method, its signature and decorators edited and its body kept
          # byte for byte; an inline import runs through the import-law engine,
          # operator-ruling-2026-10-08-import-law; a long string literal or
          # comment Ruff format cannot wrap is split without changing the AST).
          fix-recipes:
            missing-copyright-notice: copyright-notice
            undocumented-public-class: summary-docstring
            undocumented-public-method: summary-docstring
            undocumented-public-function: summary-docstring
            docstring-missing-returns: returns-section
            docstring-missing-yields: yields-section
            docstring-missing-exception: raises-section
            no-self-use: static-method
            import-outside-top-level: normalize-imports
            line-too-long: wrap-long-line
          # Phases run in order and Ruff re-reads the tree after each: imports
          # settle first (their rewrite can shorten or lengthen lines), a new
          # summary exposes the sections its function needs, and line wrapping
          # runs last over the final text.
          fix-recipe-phases:
          - [ normalize-imports ]
          - [ summary-docstring, copyright-notice, static-method ]
          - [ returns-section, yields-section, raises-section ]
          - [ wrap-long-line ]
          # Pydantic evaluates model field annotations at runtime, so an
          # import used only in a model annotation is runtime, not typing-only.
          # Ruff follows imported bases only by qualified name: codegen derives
          # every project class base that subclasses a root below into
          # runtime-evaluated-base-classes (tooling_runtime), never a list here.
          flake8-type-checking:
            runtime-evaluated-roots:
            - pydantic.BaseModel
          # Banned API messages are policy data, never template literals.
          # Operator ruling 2026-10-01 (docstring convention): docstrings follow
          # the Google convention, the shape the docstring fix recipes render.
          # Ruff then disables the docstring rules that convention does not
          # use, one of each mutually exclusive pair select ALL enables
          # (D203/D211, multi-line-summary-first-line/D213) included, so no run warns about them.
          # Authority: tracker memory operator-ruling-2026-10-09-ruff-dunder-descriptors.
          # Python type.__base__ is the native layout base; type.__bases__ is
          # the tuple of direct bases. Protocols expose both as read-only
          # properties without changing their signatures or native identity.
          # https://docs.python.org/3.13/reference/datamodel.html#type.__base__
          # https://docs.python.org/3.13/reference/datamodel.html#type.__bases__
          # https://docs.astral.sh/ruff/rules/bad-dunder-method-name/
          # PLW3201 remains enabled for every other unrecognized dunder name.
      mypy:
        # Wall-time bound for the bounded Mypy execution (SSOT). A project
        # config/tooling.yaml overlay may only lower it; no environment
        # variable changes it.
        # Leave admission and receipt-publication time within the operator's
        # two-minute command limit; profile and repair work exceeding this bound.
        timeout_seconds: 90
        # Pydantic 2 and pydantic.mypy are mandatory (operator 2026-10-05).
        # Missing, empty, and v1 plugin declarations fail validation rather
        # than being silently repaired by schema defaults.
          # Analyze source distributions that have real annotations but omit
          # the PEP 561 marker. Rope 1.14 is one such runtime owner; skipping
          # it converts every public boundary into Any and makes its imports
          # fail before our typed protocols can validate them.
          # strict_concatenate is deprecated in mypy 1.20+; extra_checks covers it
        # Operator ruling 2026-10-05 (mypy-pydantic law): call-arg and
        # prop-decorator stay suspended until the fleet facade-alias family
        # is cured; pydantic.mypy remains mandatory. Mutating these codes is
        # a regression to revert.
        ruling-disable-error-codes: [ call-arg, prop-decorator ]
        overrides:
        - modules: [ rope.* ]
          settings: [ [ follow_untyped_imports, true ] ]
          justification: >-
            Analyze Rope's installed source without suppressing import-untyped; https://mypy.readthedocs.io/en/stable/config_file.html#follow-untyped-imports
      pyright:
        path-rules:
          # Source and tracked consumer surfaces are all
          # first-class environments so no analyzer can hide their diagnostics.
          source-dir: src
          project-root: .
          env-dirs: [ src, tests, examples, scripts ]
          test-like-dirs: [ tests, examples, scripts ]
          default-excludes:
          - "**/node_modules"
          - "**/__pycache__"
          - "**/__pyrefly_virtual__/**"
          - "**/.mypy_cache"
          - "**/.ruff_cache"
          - "**/.pytest_cache"
          - "**/.*"
          - .git
          - .reports
          - vendor
          - .venv
          - "**/.venv"
          - "**/.venv/**"
          - "**/venv"
          - "**/venv/**"
          - "**/site-packages"
          - "**/site-packages/**"
          - "**/dist-packages"
          - "**/dist-packages/**"
          root-typings-paths: []
          project-typings-paths: []
          ignored-diagnostic-globs: []
          diagnostic-path-overrides: []
          source-report-private-usage: error
          test-like-report-private-usage: error
          other-report-private-usage: error
      pyrefly:
        path-rules:
          source-dir: src
          project-root: .
          env-dirs: [ src, tests, examples, scripts ]
          root-typings-paths: []
          project-typings-paths: []
          workspace-include-children: false
          workspace-include-child-env-dirs: []
          # Empty: scripts/ owns scripts/__init__.py, so every script module
          # resolves as `scripts.*` with the repo root as CWD. Adding "." or
          # "scripts" here makes the same file reachable under a second module
          # name, which mypy reports as source-file-found-twice. scripts/ is
          # analyzed because `files` names it, not because the search path
          # does.
          project-shared-search-paths: []
      pytest:
        # Scaffold and modernizer share the aggregate execution policy. Ordinary
        # items have no per-item deadline; the runner owns the invocation wall.
        # Slow marks are a narrow integration-harness budget, not permission
        # for an unbounded test. Cases that exceed it require owner repair.
        slow-timeout-seconds: 30
        # The run budget covers the budgeted phase only; items carrying this
        # native pytest marker run in their own phase, each within
        # slow-timeout-seconds (pytest-timeout marker), selected with the
        # native -m expression.
        slow-marker: slow
        # A local suite that cannot finish within run-timeout-seconds is a
        # performance defect. The generated process wall is derived from this
        # value and the termination grace by the typed model; no second timeout
        # source exists.
        run-timeout-seconds: 120
        run-timeout-overrides:
          # `make profile-test` on 2026-09-30 selected 3354 cases in 26.04s;
          # the 120s entry clock stopped the suite after 112 cases/25.62s.
          # This measurement ceiling permits a complete cold profile before
          # tightening the limit to the observed full-suite runtime.
          flext-infra: 1200
          # cosmos-charts cold suite measured on a 12-core local runner:
          # the 120s entry clock SIGTERM'd the suite at 51% (~235s projected
          # full runtime; the member CI completes inside the fleet default on
          # its runners). This measurement ceiling permits a complete cold
          # local run of the 241-case suite.
          cosmos-charts: 600
          # algar-oud-mig budgeted suite measured on 2026-10-03 (operator
          # exception docs/guides/testing.md: the global budget is 180s):
          # the 124s entry clock SIGTERM'd the suite at 64% (~194s projected
          # full runtime) once every OUD-bound case started owning a per-test
          # LDAP namespace (worker+run token, teardown included). This
          # measurement ceiling covers the documented operator budget plus
          # the namespace lifecycle overhead before the measured
          # parallel-worker ceiling lands.
          algar-oud-mig: 300
          # cosmos-docgen slow phase measured on 2026-10-06: the slow-marker
          # selection (~44 real-work cases: isolated-workspace builds, deck
          # and document renders, subprocess resolvers) reaches ~150s wall on
          # a cold testmon database, so the 120s entry clock SIGTERM'd the
          # phase with 43 cases green. This measurement ceiling permits a
          # complete cold slow phase; the budgeted phase completes inside the
          # fleet default.
          cosmos-docgen: 600
        termination-grace-seconds: 2
        # One failure stops the invocation. The next run starts from the
        # corrected owner instead of accumulating a backlog of unrelated
        # failures.
        max-failures: 1
        enforcement-plugin: flext_tests_enforcement
        # Retain the complete selection, but expose known failures first.
        progress-args: [ --verbose, --failed-first ]
        report-args: [ -ra, --durations=25, --durations-min=0.001, --tb=short ]
        diagnostic-args: [ -rA, --durations=0, --tb=long, --showlocals ]
        # One worker makes maxfail exact: no second in-flight case can fail
        # after the first failure has stopped the invocation.
        parallel-workers: 1
        # Per declared-project worker ceilings ([project].name → workers),
        # resolved by the runner over the default above: a consumer whose
        # measured suite cannot fit the single-worker process boundary
        # declares its ceiling here, inside the fleet cycle, instead of
        # patching projections. With workers > 1 maxfail still stops the
        # invocation; in-flight cases may report after the stop, which the
        # declaring consumer accepts by declaring.
        parallel-worker-overrides:
          cosmos-docgen:
            workers: 4
          # The measured ceiling for this suite; higher ceilings regressed the
          # cold run because per-window dispatch overhead dominates.
          flext-infra:
            workers: 4
          # flext-tests slow phase measured 2026-10-02 (load ~7, 20 cores):
          # 34 slow items, 89.4s of call time across 32 of them; every item
          # passes, but each pytester case boots a child pytest with the full
          # facade stack, so the serial phase reached the 120s entry clock at
          # its 33rd item. The cases are host-lock and namespace isolated.
          flext-tests:
            workers: 1
          # CPU-fraction ceilings (cpu_fraction: "n/d") resolve at runtime
          # against the process CPU count.
          # Reserve physical memory for each xdist worker and its child process
          # tree; this bound may reduce the tested ceiling on smaller hosts.
          # Reserve physical memory for each xdist worker and its child process
          # tree; this bound may reduce the tested ceiling on smaller hosts.
        parallel-worker-memory-gb: 2
        # Keep scheduling centralized within the measured worker budget.
        parallel-distribution: load
        # Preserve xdist's native scope-size ordering unless a project declares
        # collection order as part of its loadscope execution contract.
        loadscope-reorder: true
        # xdist queues the shutdown marker behind each worker's pre-dispatched
        # chunk, so a larger chunk delays the declared max-failures stop until
        # every worker drains its assigned items. One test per dispatch step
        # makes that stop immediate.
        parallel-schedule-chunk: 1
        profile-sort: cumulative
        profile-limit: 50
        profile-suite-filename: pytest.pstats
        profile-process-directory: profiles
        # Collect once from the canonical test root. The former list ended in
        # `.` and therefore traversed tests, source, docs, examples, scripts,
        # generated reports, and local runtime state a second time. Executable
        # documentation and auxiliary surfaces remain covered by explicit tests
        # and their lint/Markdown gates rather than duplicate pytest discovery.
        # pytest applies filterwarnings last-entry-wins; the conform phase +
        # tomlsort alpha-sort filterwarnings, so any override MUST sort AFTER
        # "error" to survive re-conform. Only module::/once:: sort after 'error'
        # ('m'/'o' > 'e'); default::/always::/ignore:: get reordered before it and
        # lose. The entry names FlextMroViolation because FlextSmellViolation is
        # its SUBCLASS: a filter on the child leaves the parent fatal, which is
        # how MRO violations become errors when a regeneration drops the
        # entry. One entry on the parent keeps
        # both VISIBLE-but-non-fatal, matching the non-strict enforcement policy
        # (flext-tests registers default::{category}); all other warnings stay
        # fatal. See flext-core test_enforcement_warning_visibility.
        standard-markers:
        - "smoke: public-interface smoke tests"
        - "unit: unit tests"
        - "integration: integration tests"
        - "functional: functional behavior tests"
        - "performance: performance and benchmark tests"
        - "slow: slow-running tests"
        - "docker: tests requiring Docker"
        - "oracle: tests requiring the shared Oracle database"
        - "remote: tests requiring remote/external network services"
        - "e2e: end-to-end integration tests"
        - "edge_cases: edge case tests"
        - "stress: stress tests"
        - "resilience: resilience tests"
        - "discovery: catalog and stream discovery tests"
        - "singer: Singer protocol contract tests"
        - "requires_engine: native check engine required by this test"
        # External-token gates never run inside
        # offline verification (`make test`); the runner records their exclusion.
        # `make test-full` runs locally only and executes every marker once,
        # without testmon and without any time limit. Existing external tests
        # retain their declared environment and authentication requirements.
        external-gate-markers: [ remote, docker ]
        # CI and pre-commit share make.ci.value;
        # local and pre-push execution retain slow tests. `make test-full`
        # includes these markers in every context.
        ci-excluded-markers: [ slow ]
        # Fixtures declaring local engines or resolution cannot execute in approval.
        ci-excluded-fixtures: [ resolved_make_templates, detector_project, mod_workspace, smells_project, _clear_make_ci_token ]
        # The cross-layer enforcement catalog runs strict in every suite:
        # the test-reality laws (ENFORCE-019/051/054/055/098) fail the run
        # instead of warning; warnings are never a landing state.
        # Per-item limits do not belong in baseline addopts; the runner owns
        # the aggregate wall and the slow marker owns its narrow item policy.
      tomlsort:
        process-timeout-seconds: 60

    lazy-init:
      # Canonical import layer order of the FLEXT import law
      # (operator-ruling-2026-10-08-import-law). Lower index = lower layer;
      # ``other`` holds every module whose path names no declared layer.
      # Runtime imports target equal-or-lower layers; a reverse (higher)
      # import is emitted under ``if TYPE_CHECKING:`` per
      # ``reverse_import_mode``, and a reverse runtime use stays a finding.
      import-layer-order:
      - settings
      - config
      - c
      - t
      - p
      - m
      - u
      - other
      - base
      - services
      - api
      - cli
      reverse-import-mode: type_checking
      forward-import-form: absolute
    mod:
      phases:
        # Component toggles for make mod (rule: toggles are data, not flags).
        import-alignment: true
