# Class Nesting Refactor Rule
#
# Selects the Rope-backed class-nesting file rule. The target family of every
# loose class is derived from the module's own `__all__` facade by the
# namespace policy owner; no namespace list or mapping registry is declared
# here. Per-family gates live in class-policy-v2.yml.

rules:
  - id: class-nesting-refactor
    name: "Class Nesting Refactor"
    description: "Nest loose classes under the facade family their module declares"
    enabled: true
    severity: error
    auto_fix: true
    fix_action: nest_classes
