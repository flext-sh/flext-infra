# Generic class-nesting rule. Ownership is derived by u.Infra.class_nesting_plan
# from the module's declared public namespace and Rope semantic inventory.
rules:
  - id: class-nesting-refactor
    name: Class Nesting Refactor
    description: Nest extra top-level classes under the declared module owner
    enabled: true
    severity: error
    auto_fix: true
    fix_action: nest_classes
