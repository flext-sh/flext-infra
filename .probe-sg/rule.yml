id: probe-family-import
language: python
severity: error
files:
  - "**/*.py"
rule:
  all:
    - inside:
        kind: module
        stopBy: end
        has:
          stopBy: end
          pattern: t.CosmosCharts
    - pattern: from cosmos_charts import $$$I
fix: |-
  from cosmos_charts.typings import CosmosChartsTypes
  from cosmos_charts import $$$I
message: probe
