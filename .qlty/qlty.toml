# @flext-regenerate: make gen
# @flext-ssot: flext-infra/config/codegen.yaml + flext-infra/src/flext_infra/templates/project/base/qlty.toml.j2
# @flext-maintenance: do not edit generated projections; edit the SSOT and regenerate
# Generated by flext_infra codegen conform.

config_version = "0"

# Generated scaffolding (lazy exports, derived protocols and the family facades)
# is identical by construction; the smells gate evaluates only authored code.
# Consistent with the `_protocols/**` exclusion already declared in the project's
# jscpd configuration.
exclude_patterns = [
  "**/__init__.py",
  "**/_constants/**",
  "**/_models/**",
  "**/_protocols/**",
  "**/_typings/**",
  "**/constants.py",
  "**/models.py",
  "**/protocols.py",
  "**/typings.py",
  "**/utilities.py",
]

[smells]
mode = "block"

# The promoted-command framework mandates a PEP 723 `# /// script` block in
# every executable script. That block is command metadata, not authored code,
# and comments carry no executable behavior, so repetition among them is never
# a code-duplication smell (operator axiom, 2026-11-14). Declaring
# filter_patterns replaces qlty's default list, so the built-in Python import
# filter is restated here.
[language.python.smells.duplication]
filter_patterns = ["(import_statement _)", "(comment)"]

[[source]]
name = "default"
default = true
