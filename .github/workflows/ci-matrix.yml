# Generated by `flext_infra codegen conform` for flext-infra.
# === SECTION: header (managed) ===
# Source: template (base/.github/workflows/ci-matrix.yml.j2)
# Free: no
# End SECTION: header
# Multi-environment CI base: proves the project bootstrap and canonical Make
# verbs work identically across distros, macOS, and Windows. The CI invokes
# the project's own Make surface; it never reimplements bootstrap.
---
name: ci-matrix

# === SECTION: triggers (managed) ===
# Source: config:github_actions_promotion
"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
# End SECTION: triggers

# === SECTION: permissions (managed) ===
# Source: template (minimal read-only permissions)
permissions:
  contents: read
# End SECTION: permissions

# === SECTION: concurrency (managed) ===
# Source: template (one run per workflow+ref)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# End SECTION: concurrency

jobs:
  # === SECTION: distro-matrix (managed) ===
  # Source: template + config:github_actions.checkout (distro list is template literal by design)
  distro-matrix:
    if: >-
      github.base_ref == 'main' &&
      contains(fromJSON('["dev", "develop", "0.12.0-dev"]'), github.head_ref)
    # Clean-machine proof per distro: build the distro image, then run the
    # complete CI lifecycle once in one persistent container.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, debian, fedora, alpine, arch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
      - name: Build ${{ matrix.distro }} image
        run: >-
          docker build
          -f ci/docker/${{ matrix.distro }}.Dockerfile
          -t ci-matrix-${{ matrix.distro }}
          .
      - name: Canonical lifecycle (${{ matrix.distro }})
        run: |
          docker run --rm ci-matrix-${{ matrix.distro }} /bin/bash -lc '
            make setup CI=Y &&
            make fmt APPLY=Y CI=Y &&
            make fix APPLY=Y CI=Y &&
            make check CI=Y &&
            make test CI=Y
          '
      # End SECTION: distro-matrix

  # === SECTION: macos (managed) ===
  # Source: template + config:github_actions.checkout/setup-python/setup-go/mise/setup-uv
  macos:
    if: >-
      github.base_ref == 'main' &&
      contains(fromJSON('["dev", "develop", "0.12.0-dev"]'), github.head_ref)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - name: Setup Go build dependency
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Install mise toolchain
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4.1.0
        with:
          version: "2026.7.16"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Bootstrap
        run: make setup CI=Y
      - name: Format
        run: make fmt APPLY=Y CI=Y
      - name: Fix
        run: make fix APPLY=Y CI=Y
      - name: Check
        run: make check CI=Y
      - name: Test
        run: make test CI=Y
  # End SECTION: macos

  # === SECTION: windows (managed) ===
  # Source: template + config:github_actions.checkout/setup-python/setup-go/mise/setup-uv
  windows:
    if: >-
      github.base_ref == 'main' &&
      contains(fromJSON('["dev", "develop", "0.12.0-dev"]'), github.head_ref)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - name: Setup Go build dependency
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Install mise toolchain
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4.1.0
        with:
          version: "2026.7.16"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Bootstrap
        shell: bash
        run: make setup CI=Y
      - name: Format
        shell: bash
        run: make fmt APPLY=Y CI=Y
      - name: Fix
        shell: bash
        run: make fix APPLY=Y CI=Y
      - name: Check
        shell: bash
        run: make check CI=Y
      - name: Test
        shell: bash
        run: make test CI=Y
# End SECTION: windows
