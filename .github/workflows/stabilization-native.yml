# Isolated evidence driver; this file is not part of the landing PR.
name: Stabilization native validation

"on":
  push:
    branches:
      - fix/green-green-native-validation

permissions:
  contents: read

concurrency:
  group: stabilization-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Export immutable tracked source
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/flext-source"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/head.txt"
          git archive --format=tar.gz HEAD > "$evidence/source.tar.gz"
          sha256sum "$evidence/source.tar.gz" > "$evidence/source.sha256"
      - name: Upload source evidence
        uses: actions/upload-artifact@v4
        with:
          name: flext-source-${{ github.sha }}
          path: ${{ runner.temp }}/flext-source/
          if-no-files-found: error
          retention-days: 7
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: check-y
            context: Y
            target: check
          - label: check-n
            context: N
            target: check
          - label: test
            context: Y
            target: test
    env:
      CI: Y
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
      - name: Normalize checkout modes
        run: chmod -R go-w .
      - name: Native setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: CI=Y make setup
      - name: Generate through canonical owner
        run: CI=Y make gen
      - name: Prove generated fixed point
        run: CI=Y make conform
      - name: Record exact generated output
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/flext-stabilization"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/head.txt"
          git status --short > "$evidence/git-status.txt"
          git diff --name-only > "$evidence/generated-paths.txt"
          git diff --binary > "$evidence/generated.patch"
          cp .github/workflows/ci.yml "$evidence/ci.yml"
          git hash-object .github/workflows/ci.yml > "$evidence/ci-blob.txt"
      - name: Upload exact generated evidence
        uses: actions/upload-artifact@v4
        with:
          name: flext-generated-${{ matrix.label }}-${{ github.sha }}
          path: ${{ runner.temp }}/flext-stabilization/
          if-no-files-found: error
          retention-days: 7
      - name: Native ${{ matrix.label }} (blocking)
        env:
          NATIVE_CONTEXT: ${{ matrix.context }}
          NATIVE_TARGET: ${{ matrix.target }}
        run: CI="$NATIVE_CONTEXT" make "$NATIVE_TARGET"
      - name: List report paths
        if: ${{ always() }}
        run: |
          if [ -d .reports ]; then
            find .reports -type f -print
          fi
      - name: Upload structured quality evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: flext-quality-${{ matrix.label }}-${{ github.sha }}
          path: |
            .reports/check/**/*.json
            .reports/check/**/*.sarif
            .reports/check/**/*.txt
            .reports/**/junit.xml
            .reports/**/coverage.xml
            .reports/**/coverage.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
