# Generated by `flext-infra codegen conform` — DO NOT EDIT.
#
# This is the generation requirements contract (.gen) for flext-infra.
# It enforces strict compliance for the Make Gen system:
# - Declares which managed-file policies are allowed (eliminating bypass policies)
# - Declares the hierarchical config layers that own generation state
# - Guarantees all generation steps are mandatory and cannot be skipped
#
# The .j2 templates in templates/project/ remain the content generators;
# this file is the compliance contract that governs how they execute.
version: 1

# Hierarchical configuration architecture (SSOT):
# Layer 1: config (immutable business rules) — config/codegen.yaml
# Layer 2: config overrides (project-specific parameters) — config/codegen-overrides.yaml
# All generation processes are driven EXCLUSIVELY by these authoritative files.
config_layers:
  primary:
    description: "Immutable fleet-wide business rules for code generation"
    path: config/codegen.yaml
    mutable: false
  overrides:
    description: "Project-specific parameter overrides layered on top of primary config"
    path: config/codegen-overrides.yaml
    mutable: true

# Mandatory generation requirements — all must pass for conform to succeed.
requirements:
  # All managed files MUST go through generation; bypass policies are forbidden.
  # Allowed: full (overwrite every run), merge (owner-merge dispatch)
  # Forbidden: manual (skip conform), delegated (skip conform),
  #            create-only (create-if-absent, never overwrite — enables drift)
  managed_file_policies:
    allowed: [full, merge]
    forbidden: [manual, delegated, create-only]
    enforcement: strict

  # Generation steps must be mandatory — no step may silently skip.
  generation_steps:
    mandatory: true
    skip_on_no_change: false
    fail_on_drift: true

  # All generation must be driven by the authoritative config layers.
  # No inline values, hardcoded defaults, or manual edits to managed files.
  config_authority:
    requires_config: true
    requires_overrides: true
    reject_manual_edits: true

  # Fixed-point validation: after generation, re-conform must find zero drift.
  fixed_point:
    required: true
    max_replans: 1

  # Externally-managed files: these are owned by other systems (operator,
  # workspace, make) and are NOT generated from .j2 templates, but they ARE
  # subject to .gen compliance validation. Each entry declares the owner
  # and the validation contract the file must satisfy. This replaces the
  # old bypass policies (manual/delegated/create-only) with explicit,
  # auditable external ownership declarations.
  externally_managed:
    # Operator-owned topology SSOT — handwritten, not generated.
    config/workspace.yaml:
      owner: workspace
      validation: exists_and_validated
      description: "Handwritten workspace topology SSOT consumed by codegen conform"
    .gitmodules:
      owner: workspace
      validation: exists_and_validated
      description: "Repository submodule topology, operator-owned"
    # Make-owned bootstrap — delegated to the make contract system.
    base.mk:
      owner: make
      validation: conforms_to_layout
      description: "Generated Make bootstrap, delegated to internal make engine"
    # Project-owned custom handler — created once, never overwritten.
    custom.mk:
      owner: custom
      validation: exists_or_absent
      description: "Project extension hooks; create-only by project convention"
    # Project-owned LICENSE and README — created once, never overwritten.
    LICENSE:
      owner: codegen
      validation: exists_or_absent
      description: "Project license file"
    README.md:
      owner: codegen
      validation: exists_or_absent
      description: "Project README"
    .env.example:
      owner: codegen
      validation: exists_or_absent
      description: "Environment variable documentation"
