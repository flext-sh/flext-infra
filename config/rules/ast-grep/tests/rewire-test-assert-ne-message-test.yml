id: rewire-test-assert-ne-message
valid:
  - "assert result.key != other.key, 'keys differ'"
  - |
    from tests import tm
    assert left != right
  - |
    from tests import tm
    assert lower != middle != upper, explain()
  - |
    from tests import tm
    try:
        perform()
    except ValueError:
        assert left != right, explain()
invalid:
  - |
    from tests import tm
    assert result.key != other.key, 'keys differ'
  - |
    from flext_tests import tm
    assert left() != right(), explain()
  - |
    from tests import tm
    assert (left if choose() else fallback()) != (right or other()), explain()
  - |
    from tests import tm
    assert (seen := left()) != right(), explain(seen)
