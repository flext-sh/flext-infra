id: pydantic-empty-default-annotated
# `valid` MUST NOT match: the canonical default, a plain (non-Annotated)
# field, or an Annotated union/Optional/ClassVar contract with no empty
# collection value.
valid:
  - |
    class Spec(m.BaseModel):
        items: Annotated[t.JsonMapping, u.Field(description="d")] = u.Field(
            default_factory=u.empty(TypeForm(t.JsonMapping)),
        )
  - |
    class Spec(m.BaseModel):
        items: t.JsonMapping = u.Field(default_factory=dict)
  - |
    class Spec(m.BaseModel):
        items: Annotated[list[str] | None, u.Field(description="d")] = u.Field(default_factory=list)
  - |
    class Spec(m.BaseModel):
        items: Annotated[Optional[list[str]], u.Field(description="d")] = u.Field(default_factory=list)
# `invalid` MUST match: a raw empty collection default on an Annotated field;
# the fix uses the inner contract, never the metadata.
invalid:
  - |
    class Spec(m.BaseModel):
        items: Annotated[t.JsonMapping, u.Field(description="d")] = u.Field(default_factory=dict)
  - |
    class Spec(m.BaseModel):
        rows: Annotated[
            list[dict[str, int]],
            m.Field(description="Rows."),
        ] = m.Field(default_factory=list)
  - |
    class Spec(m.BaseModel):
        names: Annotated[t.SequenceOf[str], u.Field(description="d")] = u.Field(default_factory=tuple)
