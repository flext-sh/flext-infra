id: pydantic-empty-default-typeform-import
# `valid` MUST NOT match: the module already imports TypeForm, or uses no
# canonical empty default.
valid:
  - |
    from __future__ import annotations

    from typing_extensions import TypeForm


    class Spec(m.BaseModel):
        items: t.JsonMapping = u.Field(default_factory=u.empty(TypeForm(t.JsonMapping)))
  - |
    from __future__ import annotations


    class Spec(m.BaseModel):
        name: str = "x"
# `invalid` MUST match: a canonical empty default without the TypeForm import.
invalid:
  - |
    from __future__ import annotations


    class Spec(m.BaseModel):
        items: t.JsonMapping = u.Field(default_factory=u.empty(TypeForm(t.JsonMapping)))
  - |
    from __future__ import annotations

    from typing_extensions import override


    class Spec(m.BaseModel):
        tags: t.StrSequence = m.Field(default_factory=m.empty(TypeForm(t.StrSequence)))
