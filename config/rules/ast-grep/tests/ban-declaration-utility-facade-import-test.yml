id: ban-declaration-utility-facade-import
# Method-local imports remain separate import-placement findings.
valid:
  - |
    def run() -> None:
        from flext_infra import u

        u.Infra.run()
  - from flext_infra import c, m
  - from flext_infra.detectors import FlextInfraLspDiagnosticsDetector
# Declaration imports elect the semantic owner regardless of provider namespace.
invalid:
  - from flext_infra import u
  - from flext_infra import c, m, u
  - from flext_cli import m, t, u
  - from peripheral_package import u as utilities
