# Shape only: the engine admits a finding when the imported module's root is
# the scanned project's own package (context own-package). Locally every
# `from <root> import <letter>` shape below matches on syntax alone, so the
# valid cases are the shapes this law structurally excludes: private submodule
# imports, non-letter and aliased bindings, non-root plain imports, and
# imports nested in a body.
id: ban-facade-own-namespace-import
valid:
  # The canonical producer form: the sibling declaration through its private
  # submodule.
  - |
    from ai_hub._typings.base import AiHubTypingsBase
  # A non-letter root binding is the public class export, not a letter.
  - |
    from ai_hub import AiHubSettings
  # The letter regex is anchored: a name that merely starts with a letter is a
  # different binding.
  - |
    from ai_hub import carbon
  # An aliased member binds the alias, not the letter.
  - |
    from ai_hub import t as typings
  # A root binding without a letter component reaches no family facade.
  - |
    import ai_hub
  - |
    import os.path
  # Body-nested imports bind nothing at module scope.
  - |
    def load() -> None:
        from ai_hub import c
  - |
    import typing

    if typing.TYPE_CHECKING:
        from ai_hub import t
invalid:
  # The producer binds its own letter from the own root.
  - |
    from ai_hub import c
  - |
    from ai_hub import c, m, u
  - |
    from ai_hub import settings
  # The plain-import form reaches the letter as a submodule of the root.
  - |
    import ai_hub.c
  - |
    import ai_hub.c as cc
