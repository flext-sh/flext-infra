id: typing-dict-to-mapping-kv
# `valid` MUST NOT match: already canonical, `Dict` not bound from typing, the
# module lacks `t` (that case belongs to typing-dict-missing-t-import), or the
# text is a string/docstring/comment rather than a type node. The last three
# cases are the exact corruption the retired regex transformers caused.
valid:
  # already canonical
  - |
    from flext_core import t
    def f(x: t.MappingKV[str, int]) -> None: ...
  # `Dict` is a locally defined class, not typing.Dict
  - |
    from flext_core import t
    class Dict: ...
    def f(x: Dict[str, int]) -> None: ...
  # aliased import binds `D`, not `Dict`
  - |
    from flext_core import t
    from typing import Dict as D
    def f(x: Dict[str, int]) -> None: ...
  # module does not bind `t` -> typing-dict-missing-t-import owns this
  - |
    from typing import Dict
    def f(x: Dict[str, int]) -> None: ...
  # docstring text describing the pattern is not a type node
  - |
    """Rewrite ``Dict[K, V]`` to ``t.MappingKV[K, V]``."""
    from flext_core import t
    from typing import Dict
  # a string literal in a rewrite table is not a type node
  - |
    from flext_core import t
    from typing import Dict
    _REWRITES = (("Dict[", "t.MappingKV"), ("typing.Dict[", "t.MappingKV"))
  # a comment is not a type node
  - |
    from flext_core import t
    from typing import Dict
    # Dict[...] named in a comment stays.
    VALUE = 1
  # Values remain values even inside statements declaring annotations.
  - |
    from flext_core import t
    from typing import Dict
    ALIAS = Dict[str, int]
    VALUE = Dict[str, int]()
    def f(factory=Dict[str, int]): ...
    field = Field(default_factory=Dict[str, int])
    class Derived(Dict[str, int]): ...
  - |
    from flext_core import t
    import typing
    ALIAS: type = typing.Dict[str, int]
    def f(factory: type = typing.Dict[str, int]): ...
    field = Field(default_factory=typing.Dict[str, int])
    class Derived(typing.Dict[str, int]): ...
  # An import in another lexical scope does not bind the module annotation.
  - |
    from typing import Dict
    def local():
        from flext_core import t
    value: Dict[str, int]
  - |
    from typing import Dict, TYPE_CHECKING
    if TYPE_CHECKING:
        from flext_core import t
    value: Dict[str, int]
  - |
    from flext_core import t
    from typing import Annotated, Dict
    value: Annotated[int, Dict[str, int]]
  - |
    from flext_core import t
    from typing import Dict, Literal
    value: Literal[Dict[str, int]]
  - |
    from flext_core import t
    import typing
    value: typing.Annotated[int, typing.Dict[str, int]]
  - |
    from flext_core import t
    import typing
    value: typing.Literal[typing.Dict[str, int]]
  - |
    from unrelated import t
    from typing import Dict
    value: Dict[str, int]
  - |
    from flext_core import u as t
    from typing import Dict
    value: Dict[str, int]
  - |
    from flext_core import t
    from typing import Dict
    def f(t, value: Dict[str, int]): ...
  - |
    from flext_core import t
    from typing import Dict
    t = None
    value: Dict[str, int]
  - |
    from flext_core import t
    from unrelated import t
    from typing import Dict
    value: Dict[str, int]
# `invalid` MUST match and fix to the exact dict alias, never an abstraction.
invalid:
  # bare name in a parameter annotation
  - |
    from flext_core import t
    from typing import Dict
    def f(x: Dict[str, int]) -> None: ...
  # bare name in a return annotation
  - |
    from flext_core import t
    from typing import Dict
    def f() -> Dict[str, int]: ...
  # bare name in a module-level variable annotation
  - |
    from flext_core import t
    from typing import Dict
    ALIAS: Dict[str, int] = {}
  # PEP 695 declares a type, unlike ordinary runtime alias assignment.
  - |
    from flext_core import t
    from typing import Dict
    type ALIAS = Dict[str, int]
  # attribute form needs no typing-import guard
  - |
    from flext_core import t
    import typing
    def f(y: typing.Dict[str, int]) -> None: ...
  - |
    from flext_core import t
    import typing
    type ALIAS = typing.Dict[str, int]
  - |
    from flext_core import t
    from typing import Dict
    value: tuple[Dict[str, int], ...] | None = None
  - |
    from flext_core import t
    from typing import Dict
    def f(value: Dict[str, int] = dict[str, int]()) -> Dict[str, int]:
        return value
  - |
    from flext_core import t
    import typing
    value: typing.Dict[str, int] = Field(default_factory=dict[str, int])
  - |
    from flext_core import t
    import typing
    def f(value: typing.Dict[str, int] = typing.Dict[str, int]): ...
  - |
    from flext_core import t
    from typing import Annotated, Dict
    value: Annotated[Dict[str, int], Field(default_factory=Dict[str, int])]
  - |
    from flext_core import t
    import typing
    value: typing.Annotated[typing.Dict[str, int], typing.Dict[str, int]]
  # Executed after native fixes: concrete APIs and runtime values remain intact.
  - |
    from flext_core import m, t
    from typing import Dict, get_origin
    LEGACY = Dict[str, int]
    FACTORY = dict[str, int]
    type Contract = Dict[str, int]
    class LegacyBase(Dict[str, int]): ...
    class Payload(m.ArbitraryTypesModel):
        values: Dict[str, int] = m.Field(default_factory=dict[str, int])
    def make(values: Dict[str, int] = dict[str, int]()) -> Dict[str, int]:
        return values
    assert get_origin(LEGACY) is dict
    assert FACTORY() == {}
    assert isinstance(LegacyBase(), dict)
    assert Payload().values == {}
    assert Payload().values is not Payload().values
    payload = Payload()
    payload.values["example"] = 1
    assert payload.values["example"] == 1
    payload.values.update({"updated": 2})
    assert payload.values.copy() | {"last": 3} == {"example": 1, "updated": 2, "last": 3}
    payload.values |= {"last": 3}
    assert payload.values.pop("last") == 3
    assert Payload.model_validate({"values": {"input": "4"}}).values == {"input": 4}
    assert Payload.model_json_schema()["properties"]["values"]["type"] == "object"
    assert make() == {}
    assert not callable(get_origin(Contract.__value__))
    assert Contract.__value__ == make.__annotations__["return"]
