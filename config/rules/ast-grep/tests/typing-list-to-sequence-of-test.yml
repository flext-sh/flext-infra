  # Executed after native fixes: concrete APIs and runtime values remain intact.
  - |
    from flext_core import m, t
    from typing import List, get_origin
    LEGACY = List[str]
    FACTORY = list[str]
    type Contract = List[str]
    class LegacyBase(List[str]): ...
    class Payload(m.ArbitraryTypesModel):
        values: List[str] = m.Field(default_factory=list[str])
    def make(values: List[str] = list[str]()) -> List[str]:
        return values
    assert get_origin(LEGACY) is list
    assert FACTORY() == []
    assert isinstance(LegacyBase(), list)
    assert Payload().values == []
    assert Payload().values is not Payload().values
    payload = Payload()
    payload.values.append("example")
    assert payload.values == ["example"]
    payload.values[0] = "updated"
    payload.values.extend(["another"])
    payload.values.sort()
    assert payload.values.copy() + ["last"] == ["another", "updated", "last"]
    assert Payload.model_validate({"values": ("input",)}, strict=False).values == ["input"]
    assert Payload.model_validate_json(payload.model_dump_json()).values == payload.values
    assert make() == []
    assert not callable(get_origin(Contract.__value__))
    assert Contract.__value__ == make.__annotations__["return"]
