id: typing-list-to-sequence-of
# `valid` MUST NOT match: an unbound or aliased `List`, a module with no `t`
# binding (owned by the detection-only companion), the already canonical form,
# or the literal text inside a docstring, a string constant, a tuple literal or
# a comment -- the exact data the retired regex corrupted.
valid:
  - |
    from flext_core import t
    from typing import List as L
    ALIAS = L[str]
  - |
    from flext_core import t
    from project.collections import List
    ALIAS = List[str]
  - |
    from typing import List
    ALIAS = List[str]
  - |
    from flext_core import t
    ALIAS = t.SequenceOf[str]
  - |
    from flext_core import t
    from typing import List

    REWRITE_TABLE = (("Dict[", "t.MappingKV"), ("List[", "t.SequenceOf"))
  - |
    from flext_core import t
    from typing import List

    HELP = "annotate with List[str] rather than list[str]"
  - |
    """Module docstring describing a regex that matches List[ tokens."""

    from flext_core import t
    from typing import List
  - |
    from flext_core import t
    from typing import List

    # A comment mentioning List[str] and typing.List[int] survives untouched.
    value = 1
  - |
    from flext_core import t
    from typing import List
    ALIAS = List[str]
    VALUE = List[str]()
    def f(factory=List[str]): ...
    field = Field(default_factory=List[str])
    class Derived(List[str]): ...
  - |
    from flext_core import t
    import typing
    ALIAS: type = typing.List[str]
    def f(factory: type = typing.List[str]): ...
    field = Field(default_factory=typing.List[str])
    class Derived(typing.List[str]): ...
  - |
    from typing import List
    def local():
        from flext_core import t
    value: List[str]
  - |
    from typing import List, TYPE_CHECKING
    if TYPE_CHECKING:
        from flext_core import t
    value: List[str]
  - |
    from flext_core import t
    from typing import Annotated, List
    value: Annotated[int, List[str]]
  - |
    from flext_core import t
    from typing import List, Literal
    value: Literal[List[str]]
  - |
    from flext_core import t
    import typing
    value: typing.Annotated[int, typing.List[str]]
  - |
    from flext_core import t
    import typing
    value: typing.Literal[typing.List[str]]
# `invalid` MUST match: a real generic in a module that binds both `List` and
# `t`, plus the dotted form which needs no `List` binding.
invalid:
  - |
    from flext_core import t
    from typing import List

    def f(x: List[str]) -> None: ...
  - |
    from flext_core import t
    from typing import List

    type ALIAS = List[str]
  - |
    from flext_core import t
    import typing

    type ALIAS = typing.List[str]
  - |
    from flext_core import t
    from typing import List
    def f() -> List[str]: ...
  - |
    from flext_core import t
    from typing import List
    value: tuple[List[str], ...] | None = None
  - |
    from flext_core import t
    from typing import List
    def f(value: List[str] = list[str]()) -> List[str]:
        return value
  - |
    from flext_core import t
    import typing
    value: typing.List[str] = Field(default_factory=list[str])
  - |
    from flext_core import t
    import typing
    def f(value: typing.List[str] = typing.List[str]): ...
  - |
    from flext_core import t
    from typing import Annotated, List
    value: Annotated[List[str], Field(default_factory=List[str])]
  - |
    from flext_core import t
    import typing
    value: typing.Annotated[typing.List[str], typing.List[str]]
  # Executed after the engine fixes it: aliases are types, factories are values.
  - |
    from flext_core import m, t
    from typing import List, get_origin
    LEGACY = List[str]
    FACTORY = list[str]
    type Contract = List[str]
    class LegacyBase(List[str]): ...
    class Payload(m.ArbitraryTypesModel):
        values: List[str] = m.Field(default_factory=list[str])
    def make(values: List[str] = list[str]()) -> List[str]:
        return values
    assert get_origin(LEGACY) is list
    assert FACTORY() == []
    assert isinstance(LegacyBase(), list)
    assert Payload().values == []
    assert Payload().values is not Payload().values
    payload = Payload()
    payload.values.append("example")
    assert payload.values == ["example"]
    assert make() == []
    assert not callable(get_origin(Contract.__value__))
    assert Contract.__value__ == make.__annotations__["return"]
