# Canonical direct facade import, not proof that an abstraction is substitutable.
# Reject lexical rebinding conservatively across the module: a syntactic guard
# cannot certify the reference's Rope identity when scopes shadow the facade.
id: t-locally-bound
language: python
rule:
  all:
    - kind: import_from_statement
    - has:
        field: module_name
        regex: "^flext(?:_[a-z0-9_]+)?$"
    - has:
        pattern: t
        stopBy: end
    - not:
        has:
          kind: aliased_import
          stopBy: end
          has:
            pattern: t
            stopBy: end
    - inside:
        kind: module
        not:
          has:
            stopBy: end
            any:
              - all:
                  - any:
                      - kind: assignment
                      - kind: augmented_assignment
                      - kind: type_alias_statement
                  - has:
                      field: left
                      regex: "\\bt\\b"
              - all:
                  - any:
                      - kind: function_definition
                      - kind: class_definition
                  - has:
                      field: name
                      regex: "^t$"
              - all:
                  - any:
                      - kind: parameters
                      - kind: lambda_parameters
                  - regex: "(^|[(,])\\s*\\**t\\s*[:,)=]"
              - all:
                  - kind: aliased_import
                  - has:
                      field: alias
                      regex: "^t$"
              - all:
                  - any:
                      - kind: for_statement
                      - kind: for_in_clause
                  - has:
                      field: left
                      regex: "\\bt\\b"
              - all:
                  - any:
                      - kind: with_item
                      - kind: except_clause
                  - regex: "\\bas\\s+t\\b"
              - all:
                  - kind: named_expression
                  - has:
                      field: name
                      regex: "^t$"
              - all:
                  - kind: import_from_statement
                  - has:
                      pattern: t
                      stopBy: end
                  - not:
                      has:
                        field: module_name
                        regex: "^flext(?:_[a-z0-9_]+)?$"
              - all:
                  - kind: import_statement
                  - has:
                      pattern: t
                      stopBy: end
              - all:
                  - any:
                      - kind: delete_statement
                      - kind: case_pattern
                      - kind: type_parameter
                  - regex: "\\bt\\b"
