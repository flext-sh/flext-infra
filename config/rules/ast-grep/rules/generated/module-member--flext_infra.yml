        kind: nonlocal_statement
    - inside:
        kind: type_parameter
        stopBy: end
    - inside:
        kind: case_pattern
        stopBy: end
    - inside:
        any:
        - kind: pattern_list
        - kind: tuple_pattern
        - kind: list_pattern
        inside:
          field: left
          kind: assignment
        stopBy: end
    - inside:
        any:
        - kind: pattern_list
        - kind: tuple_pattern
        - kind: list_pattern
        inside:
          field: left
          kind: for_statement
        stopBy: end
    - inside:
        any:
        - kind: pattern_list
        - kind: tuple_pattern
        - kind: list_pattern
        inside:
          field: left
          kind: for_in_clause
        stopBy: end
    kind: identifier
  local-binding:
    all:
    - matches: binding
    - not:
        inside:
          kind: import_from_statement
          stopBy: end
    - not:
        inside:
          kind: import_statement
          stopBy: end
  use:
    all:
    - kind: identifier
    - not:
        matches: binding
    - not:
        inside:
          field: attribute
          kind: attribute
    - not:
        inside:
          field: name
          kind: keyword_argument
