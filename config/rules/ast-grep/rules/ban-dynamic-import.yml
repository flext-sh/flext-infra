# Module-level facts stay module-level: a dynamic `importlib.import_module(...)`
# call hides a dependency from the module graph the import law
# (operator-ruling-2026-10-08-import-law) orders. Function-body imports are
# owned by Ruff `import-outside-top-level` and repaired by the import-law engine
# (`make fix` recipe normalize-imports, `make mod` import normalization), so this
# rule detects only the dynamic form Ruff cannot see.
#
# The named owners below load modules by design and are out of scope, each with
# its own justification:
# - package initialisers and the lazy-export owner (`flext_core/lazy.py` plus
#   its `_lazy_parts/` engine) are the loader itself;
# - the beartype bootstrap and engine helpers install/patch before any facade
#   import can run (`_beartype_bootstrap.py`, `_beartype/**`);
# - ADR-005 lazy singletons resolve cross-package services at runtime to break
#   construction cycles a module-level import would re-create;
# - the lazy-export and enforcement-provenance contract tests exercise exactly
#   the dynamic-loading contract, with data-driven module names.
id: ban-dynamic-import
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/__init__.py"
  - "**/flext_core/lazy.py"
  - "**/_lazy_parts/**"
  - "**/beartype/**"
  - "**/_beartype/**"
  - "**/_beartype_bootstrap.py"
  - "**/flext_core/_utilities/model.py"
  - "**/flext_core/_utilities/model_runtime.py"
  - "**/flext_core/_utilities/generators.py"
  - "**/flext_core/_utilities/family_surface.py"
  - "**/tests/unit/test_lazy_exports.py"
  - "**/tests/unit/test_lazy_relative_packages.py"
  - "**/tests/unit/test_enforcement_catalog.py"
  - "**/tests/unit/test_enforcement_import_provenance.py"
  - "**/tests/unit/test_enforcement_integration.py"
  - "**/tests/unit/test_enforcement_namespace.py"
  - "**/tests/unit/test_beartype_engine_import_hooks.py"
  - "**/tests/unit/test_config_user_preferences.py"
rule:
  matches: dynamic-import
message: >-
  Dynamic import: declare the dependency as a module-level import so the
  import law and the module graph can see it.
