# FlextResult raw asserts rewired to the result matchers.
#
# Family law, guard, and exclusions are documented in
# rewire-test-assert-comparison.yml; this file adds the result shapes. A
# `.success`/`.failure` attribute read in a test tier is a FlextResult read,
# so the truthiness assert becomes the causal matcher:
#   * `assert result.success` -> `tm.ok(result)`;
#   * `assert result.failure` -> `tm.fail(result)`;
#   * `assert not result.success` -> `tm.fail(result)`;
#   * `assert not result.failure` -> `tm.ok(result)`.
#
# The ok/fail matchers report the error text on the unexpected outcome, which
# the raw truthiness assert discarded.
id: rewire-test-assert-result-ok
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - pattern: "assert $R.success"
    - not:
        has:
          nthChild: 2
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - inside:
        kind: module
        stopBy: end
        has:
          matches: tm-imported-from-flext
          stopBy: end
fix: tm.ok($R)
message: Assert result success through the tm result matcher.
