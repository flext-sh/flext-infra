# Result-attribute raw asserts rewired to the tm native truth criterion.
#
# Family law, guard, and exclusions are documented in
# rewire-test-assert-comparison.yml; this file adds the result shapes:
#   * `assert result.success` -> `tm.that(result.success, truth=True)`;
#   * `assert result.failure` -> `tm.that(result.failure, truth=True)`;
#   * `assert not result.success` -> `tm.that(result.success, truth=False)`;
#   * `assert not result.failure` -> `tm.that(result.failure, truth=False)`.
#
# Retain the actual attribute read without inferring a result type or reading
# another attribute; the native truth criterion evaluates its truth once.
id: rewire-test-assert-result-ok
language: Python
severity: error
metadata:
  context:
    R:
      is: emitted-symbol
      arg: tm flext_tests tm
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - pattern: "assert $R.success"
    - not:
        has:
          nthChild: 2
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - inside:
        kind: module
        stopBy: end
        has:
          matches: tm-imported-from-flext
          stopBy: end
fix: tm.that($R.success, truth=True)
message: Assert result success through the tm result matcher.
