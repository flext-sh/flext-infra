# Presence and membership raw asserts rewired to the tm matcher facade.
#
# Family law, guard, and exclusions are documented in
# rewire-test-assert-comparison.yml; this file adds the presence shapes:
#   * `assert X is None` -> `tm.that(X is None, truth=True)`;
#   * `assert X is not None` -> `tm.not_none(X)` (the type-narrowing form);
#   * `assert item in container` -> `tm.that(item in container, truth=True)`;
#   * `assert item not in container` -> `tm.that(item not in container, truth=True)`.
#
# Membership fixes preserve operand order and native containment semantics.
# Only single-membership shapes are rewritten; chains stay for manual triage.
id: rewire-test-assert-is-none
language: Python
severity: error
metadata:
  context:
    A:
      is: emitted-symbol
      arg: tm flext_tests tm
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - pattern: "assert $A is None"
    - not:
        has:
          nthChild: 2
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - inside:
        kind: module
        stopBy: end
        has:
          matches: tm-imported-from-flext
          stopBy: end
fix: tm.that($A is None, truth=True)
message: Assert None-ness through the tm matcher facade.
