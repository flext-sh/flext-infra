# Presence and membership raw asserts rewired to the tm matcher facade.
#
# Family law, guard, and exclusions are documented in
# rewire-test-assert-comparison.yml; this file adds the presence shapes:
#   * `assert X is None` -> `tm.that(X, none=True)`;
#   * `assert X is not None` -> `tm.not_none(X)` (the type-narrowing form);
#   * `assert item in container` -> `tm.that(container, has=item)`;
#   * `assert item not in container` -> `tm.that(container, lacks=item)`.
#
# The membership fixes flip the operand order (the container becomes the tm
# subject), so only the two-operand single-membership shape is rewritten;
# membership chains stay for manual triage.
id: rewire-test-assert-is-none
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - pattern: "assert $A is None"
    - not:
        has:
          nthChild: 2
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - inside:
        kind: module
        stopBy: end
        has:
          matches: tm-imported-from-flext
          stopBy: end
fix: tm.that($A, none=True)
message: Assert None-ness through the tm matcher facade.
---
id: rewire-test-assert-not-none
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - pattern: "assert $A is not None"
    - not:
        has:
          nthChild: 2
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - inside:
        kind: module
        stopBy: end
        has:
          matches: tm-imported-from-flext
          stopBy: end
fix: tm.not_none($A)
message: Assert and narrow the non-None value through tm.not_none.
---
id: rewire-test-assert-in
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - pattern: "assert $X in $C"
    - not:
        has:
          nthChild: 2
    - not:
        has:
          kind: comparison_operator
          regex: "\\bin\\b[^,\\n]*\\bin\\b"
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - inside:
        kind: module
        stopBy: end
        has:
          matches: tm-imported-from-flext
          stopBy: end
fix: tm.that($C, has=$X)
message: Assert containment through the tm matcher facade.
---
id: rewire-test-assert-not-in
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - pattern: "assert $X not in $C"
    - not:
        has:
          nthChild: 2
    - not:
        has:
          kind: comparison_operator
          regex: "\\bin\\b[^,\\n]*\\bin\\b"
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - inside:
        kind: module
        stopBy: end
        has:
          matches: tm-imported-from-flext
          stopBy: end
fix: tm.that($C, lacks=$X)
message: Assert exclusion through the tm matcher facade.
