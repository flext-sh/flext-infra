    - pattern: "assert $A is not None"
    - not:
        has:
          nthChild: 2
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - inside:
        kind: module
        stopBy: end
        has:
          matches: tm-imported-from-flext
          stopBy: end
fix: tm.not_none($A)
message: Assert and narrow the non-None value through tm.not_none.
---
id: rewire-test-assert-in
language: Python
severity: error
metadata:
  context:
    X:
      is: emitted-symbol
      arg: tm flext_tests tm
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - pattern: "assert $X in $C"
    - not:
        has:
          nthChild: 2
    - not:
        has:
          kind: comparison_operator
          regex: "\\bin\\b[^,\\n]*\\bin\\b"
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - inside:
        kind: module
        stopBy: end
        has:
          matches: tm-imported-from-flext
          stopBy: end
fix: tm.that($X in $C, truth=True)
message: Assert containment through the tm matcher facade.
---
