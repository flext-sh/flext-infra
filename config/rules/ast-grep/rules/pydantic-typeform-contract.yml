# A pydantic field's empty collection default is the canonical
# ``default_factory=<facade>.empty(TypeForm(<field annotation>))`` (flext-core).
#
# A raw collection constructor as ``default_factory`` -- ``dict``, ``list``,
# ``set``, ``frozenset``, ``tuple``, bare or specialized -- and the
# ``lambda: MappingProxyType(...)({})`` idiom are defects:
#   * pyright cannot solve a bare generic constructor's type parameters from the
#     declared annotation, so Pylance reports ``reportUnknownVariableType``
#     (``dict[Unknown, Unknown]``) on every such field;
#   * the default diverges from the value pydantic validates for the same
#     contract: a ``MappingProxyType`` default makes ``model_dump_json()`` raise
#     and a ``tuple`` default breaks JSON round-trip equality.
# ``empty(TypeForm(T))`` is typed by every checker from the field annotation and
# yields exactly what pydantic validates an empty input into.
#
# The receiver is the facade letter of the field specifier call itself (``u`` or
# ``m``), which is therefore bound in the module. ``Annotated[T, ...]`` fields
# use their inner contract ``T``. A top-level union or ``Optional`` annotation
# has no collection empty value; it is left to the detection-only residual rule
# for owner repair, as is any raw factory outside an annotated field.
id: pydantic-empty-default
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/legado/**"
  - "**/legacy/**"
  - "**/node_modules/**"
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
rule:
  all:
    - matches: raw-empty-collection-factory
    - inside:
        stopBy:
          kind: call
        kind: call
        pattern: $FACADE.$SPEC($$$)
    - inside:
        stopBy: end
        kind: assignment
        has:
          field: type
          all:
            - pattern: $TYPE
            - not:
                has:
                  kind: union_type
            - not:
                regex: "^(?:typing\\.)?(?:Annotated|ClassVar|Optional)\\["
fix: default_factory=$FACADE.empty(TypeForm($TYPE))
message: >-
  Declare an empty collection default as
  `default_factory=<facade>.empty(TypeForm(<field annotation>))`: a raw
  collection constructor leaves its type parameters Unknown to type checkers
  and diverges from the value pydantic validates for the field contract.
---
# The same law for an ``Annotated[T, ...]`` field: the contract is the inner
# ``T``, never the metadata.
id: pydantic-empty-default-annotated
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/legado/**"
  - "**/legacy/**"
  - "**/node_modules/**"
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
rule:
  all:
    - matches: raw-empty-collection-factory
    - inside:
        stopBy:
          kind: call
        kind: call
        pattern: $FACADE.$SPEC($$$)
    - inside:
        stopBy: end
        kind: assignment
        has:
          field: type
          all:
            - regex: "^(?:typing\\.)?Annotated\\["
            - has:
                kind: generic_type
                has:
                  kind: type_parameter
                  has:
                    kind: type
                    nthChild: 1
                    all:
                      - pattern: $INNER
                      - not:
                          has:
                            kind: union_type
                      - not:
                          regex: "^(?:typing\\.)?(?:ClassVar|Optional)\\["
fix: default_factory=$FACADE.empty(TypeForm($INNER))
message: >-
  Declare an empty collection default as
  `default_factory=<facade>.empty(TypeForm(<inner annotation>))`: a raw
  collection constructor leaves its type parameters Unknown to type checkers
  and diverges from the value pydantic validates for the field contract.
---
# The same root cause at the adapter constructor: a class-scoped PEP 695 alias
# (``t.JsonMapping``, ``FlextTypesPydantic.StrictInt``, ``t.SequenceOf[str]``)
# passed where pydantic expects ``TypeForm[T]`` is read by pyright as a runtime
# ``TypeAliasType``/``GenericAlias`` value, so the adapter becomes
# ``TypeAdapter[Unknown]`` (Pylance reportUnknownVariableType). The explicit PEP
# 747 conversion ``TypeForm(<alias>)`` types the adapter exactly in pyright, mypy
# and pyrefly. The ``Annotated[<alias>, None]`` workaround that also silences
# pyright is the same conversion done by accident and is rewritten to it.
id: pydantic-adapter-typeform
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/legado/**"
  - "**/legacy/**"
  - "**/node_modules/**"
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
utils:
  typings-alias-attribute:
    kind: attribute
    has:
      field: object
      regex: "^(?:t|Flext\\w*Typ\\w*)$"
rule:
  pattern: $CONTRACT
  nthChild: 1
  any:
    - matches: typings-alias-attribute
    - all:
        - kind: subscript
        - has:
            field: value
            matches: typings-alias-attribute
  inside:
    kind: argument_list
    inside:
      kind: call
      has:
        field: function
        regex: "^(?:TypeAdapter|[um]\\.type_adapter)$"
fix: TypeForm($CONTRACT)
message: >-
  Pass a class-scoped type alias to an adapter through the PEP 747 conversion
  `TypeForm(<alias>)`; the bare alias leaves the adapter `TypeAdapter[Unknown]`.
---
# The ``Annotated[<alias>, None]`` adapter argument is the accidental form of the
# same conversion: it is rewritten to ``TypeForm(<alias>)``.
id: pydantic-adapter-typeform-annotated-none
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/legado/**"
  - "**/legacy/**"
  - "**/node_modules/**"
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
rule:
  pattern: Annotated[$CONTRACT, None]
  nthChild: 1
  inside:
    kind: argument_list
    inside:
      kind: call
      has:
        field: function
        regex: "^(?:TypeAdapter|[um]\\.type_adapter)$"
fix: TypeForm($CONTRACT)
message: >-
  `Annotated[<alias>, None]` only hides the alias from pyright; pass it through
  the PEP 747 conversion `TypeForm(<alias>)` instead.
---
# ``TypeForm`` (PEP 747) is the explicit conversion every checker needs to read a
# class-scoped ``t.*`` alias as a type expression. Every FLEXT module starts with
# ``from __future__ import annotations``; the import is added right after it and
# ordered by the formatter.
id: pydantic-empty-default-typeform-import
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/legado/**"
  - "**/legacy/**"
  - "**/node_modules/**"
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
rule:
  kind: future_import_statement
  inside:
    kind: module
    all:
      - has:
          stopBy: end
          kind: call
          regex: "^TypeForm\\("
      - not:
          has:
            stopBy: end
            kind: import_from_statement
            regex: "^from typing_extensions import[\\s\\S]*\\bTypeForm\\b"
fix: |-
  from __future__ import annotations

  from typing_extensions import TypeForm
message: >-
  A `TypeForm(...)` conversion needs `from typing_extensions import TypeForm`.
---
# Detection-only residual: a raw empty collection factory on a field specifier
# that the fixable rules cannot rewrite -- a top-level union or ``Optional``
# contract, a ``ClassVar``, or a specifier outside an annotated assignment.
id: pydantic-empty-default-residual
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/legado/**"
  - "**/legacy/**"
  - "**/node_modules/**"
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
rule:
  all:
    - matches: raw-empty-collection-factory
    - any:
        - not:
            inside:
              stopBy: end
              kind: assignment
              has:
                field: type
                regex: "."
        - inside:
            stopBy: end
            kind: assignment
            has:
              field: type
              any:
                - has:
                    kind: union_type
                - regex: "^(?:typing\\.)?(?:ClassVar|Optional)\\["
                - all:
                    - regex: "^(?:typing\\.)?Annotated\\["
                    - has:
                        kind: generic_type
                        has:
                          kind: type_parameter
                          has:
                            kind: type
                            nthChild: 1
                            any:
                              - has:
                                  kind: union_type
                              - regex: "^(?:typing\\.)?(?:ClassVar|Optional)\\["
message: >-
  A raw empty collection factory remains where no canonical rewrite applies
  (union, Optional or ClassVar contract, or no annotated field). Repair the
  owner: declare a collection contract and use
  `<facade>.empty(TypeForm(<contract>))`.
