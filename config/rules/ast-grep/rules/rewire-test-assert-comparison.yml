id: test-assert-tm-binding-required
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
metadata:
  context:
    CONDITION:
      not: emitted-symbol
      arg: tm flext_tests tm
rule:
  pattern: assert $CONDITION
message: >-
  The assertion needs the public matcher, but tm does not resolve to its owner
  at this occurrence. Repair the import or shadowed binding before rewriting.
