id: rewire-test-assert-eq-message
language: Python
severity: error
metadata:
  context:
    A:
      is: emitted-symbol
      arg: tm flext_tests tm
files:
  - "**/tests/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - pattern: "assert $A == $B, $MSG"
    - not:
        all:
          - pattern: "assert $A == $A, $MSG"
          - not:
              has:
                kind: call
                stopBy: end
    - not:
        has:
          kind: comparison_operator
          regex: "==[^,\\n]*=="
    - not:
        has:
          kind: call
          stopBy: end
          regex: "^len\\("
    - not:
        inside:
          kind: except_clause
          stopBy: end
    - inside:
        kind: module
        stopBy: end
        has:
          matches: tm-imported-from-flext
          stopBy: end
fix: |-
  if not ($A == $B):
      tm.that(False, truth=True, assertion_message=$MSG)
message: Assert equality with its message through the tm matcher facade.
