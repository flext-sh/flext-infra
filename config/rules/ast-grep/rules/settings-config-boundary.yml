# Settings/config import boundary (operator-ruling-2026-10-08-settings-config-imports
# and operator-ruling-2026-10-08-settings-config-boundary).
#
# A settings/config module is any module whose path has a segment starting with
# `settings` or `config` (with or without a leading underscore): the root
# `_settings.py`/`_config.py`, each family's `settings*.py`/`config*.py` part,
# and config subpackages such as `_models/_config/`. Inside its own namespace it
# imports nothing from its own namespace, including TYPE_CHECKING imports.
# Anything from another namespace is allowed (the own-package context decides
# which namespace is the module's own). The family internals of c/t/p/m/u may
# import settings/config, which is why settings/config stay below them. A family
# `base.py` is a leaf: it imports no other module of its own namespace except its
# own split parts, and never settings/config.
#
# Detection only: use native or valid upstream contracts at layer zero; never
# defer an invalid own-namespace dependency into a typing guard.
id: ban-settings-config-own-facade-import
language: python
severity: error
files:
  - "**/_settings*.py"
  - "**/_config*.py"
  - "**/settings*.py"
  - "**/config*.py"
  - "**/_settings*/**/*.py"
  - "**/_config*/**/*.py"
ignores:
  - "**/__init__.py"
metadata:
  context:
    MODULE:
      is: own-package
rule:
  all:
    - kind: dotted_name
    - not:
        inside:
          kind: import_from_statement
          field: module_name
    - inside:
        kind: import_from_statement
        has:
          field: module_name
          kind: dotted_name
          pattern: $MODULE
          not:
            regex: "\\."
message: >-
  Layer-zero settings/config imports from its own root `$MODULE`, including
  TYPE_CHECKING: use native or valid upstream contracts, never its own namespace.
---
id: ban-settings-config-own-module-import
language: python
severity: error
files:
  - "**/_settings*.py"
  - "**/_config*.py"
  - "**/settings*.py"
  - "**/config*.py"
  - "**/_settings*/**/*.py"
  - "**/_config*/**/*.py"
ignores:
  - "**/__init__.py"
metadata:
  context:
    MODULE:
      is: own-package
rule:
  any:
    - kind: import_from_statement
      has:
        field: module_name
        kind: dotted_name
        pattern: $MODULE
        regex: "\\."
    - kind: dotted_name
      pattern: $MODULE
      any:
        - inside:
            kind: import_statement
        - inside:
            kind: aliased_import
            field: name
            inside:
              kind: import_statement
message: >-
  Layer-zero settings/config imports its own namespace `$MODULE`, including
  TYPE_CHECKING: use native or valid upstream contracts.
---
id: ban-family-base-own-import
language: python
severity: error
files:
  - "**/_*/base.py"
metadata:
  context:
    MODULE:
      - is: own-package
      - is: family-base-file
rule:
  all:
    - kind: import_from_statement
    - has:
        field: module_name
        kind: dotted_name
        pattern: $MODULE
        not:
          regex: "\\._[a-z]+\\._base_parts(\\.|$)"
message: >-
  Family base.py imports `$MODULE` from its own namespace: a family base is a
  leaf and imports neither other own modules nor settings/config.
