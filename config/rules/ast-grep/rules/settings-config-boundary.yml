# Authored declaration layers import nothing from their own namespace.
# Generated facades alone compose their declarations through lazy packages.
# The shared import-law owner classifies layers from the family catalog.
# Annotation-only guards do not relax the boundary. Semantic relocation owns
# references that cannot be rewired to a proven external declaration.
id: ban-settings-config-own-facade-import
language: python
severity: error
files:
  - "**/*.py"
metadata:
  context:
    MODULE:
      - is: own-package
      - is: declaration-module
rule:
  kind: import_from_statement
  has:
    field: module_name
    kind: dotted_name
    pattern: $MODULE
    not:
      regex: "\\."
message: >-
  Authored declaration imports its own namespace `$MODULE`; generated facade
  composition is the only permitted own-namespace dependency.
---
id: ban-settings-config-own-module-import
language: python
severity: error
files:
  - "**/*.py"
metadata:
  context:
    MODULE:
      - is: own-package
      - is: declaration-module
rule:
  kind: import_from_statement
  has:
    field: module_name
    kind: dotted_name
    pattern: $MODULE
    regex: "\\."
message: >-
  Authored declaration imports an own-namespace module `$MODULE`; relocate
  the declaration or consume its proven external provider.
---
id: ban-family-base-own-import
language: python
severity: error
files:
  - "**/*.py"
metadata:
  context:
    MODULE:
      - is: own-package
      - is: declaration-module
rule:
  kind: dotted_name
  pattern: $MODULE
  any:
    - inside:
        kind: import_statement
    - inside:
        kind: aliased_import
        field: name
        inside:
          kind: import_statement
message: >-
  Authored declaration imports its own namespace `$MODULE`; imports under
  TYPE_CHECKING obey the same boundary.
