# Test law: tests import reality through public facades only.
#
# `ban-private-import` owns imports of ANOTHER package's private modules; this
# rule owns the OWN-package variant inside test tiers, which couples the test
# to the module's internal layout just as completely:
#
#   from algar_pkg.services._clean_search import AlgarOudMigCleanSearchMixin
#
# The `_segment` anywhere in the imported module path is the private marker
# (the layout law: every additional class lives in its own module, private
# modules start with `_`). A test that needs a private symbol is testing the
# module's shape, not its observable behavior — rewrite it against the public
# facade, or delete it.
#
# Detection-only: the replacement imports the public facade the owner exposes.
id: ban-test-own-private-import
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/examples/**/*.py"
  - "**/conftest.py"
rule:
  kind: import_from_statement
  has:
    field: module_name
    regex: '(^|\.)_\w'
message: >-
  Test imports an own-package private module ($_segment in the path). Tests
  validate observable behavior through public facades only — import the public
  facade the owner exposes, or delete the test.
