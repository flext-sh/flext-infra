# The facade letters (c, t, m, p, u) are re-aliases published at the END of
# each facade module (`t = CosmosChartsTypes`), never inside a class body the
# consumer can see through. mypy does not propagate that module-level rebind
# through a PEP-695 subclass and pyright does not resolve the re-alias plus a
# dynamic nested namespace either, so every `<letter>.CosmosCharts.<member>`
# use cascades into Unknown diagnostics fleet-wide (10.737 census findings,
# cosmos-h5y3o). The classes themselves are static, importable objects: the
# proven zero-error form is the static path
# `CosmosChartsTypes.CosmosCharts.<member>` (probes: typecensus-nsprobe*.py).
#
# These rules rewrite the namespace-USAGE and add the class import next to the
# facade import it replaces. The duplicated import form is merged by the
# import-normalization phase of the codemod loop (the same contract
# facade-import-from-own-package documents). Bare letter uses that do not
# traverse `CosmosCharts` (for example `t.Pair`) resolve through the class MRO
# and stay untouched, as does every letter bound from another package, because
# both rules require the module to bind that exact letter from its facade
# package AND to reach through `CosmosCharts`.
id: namespace-static-path-constants-usage
language: python
severity: error
files:
  - "**/*.py"
rule:
  all:
    - pattern: c.CosmosCharts
    - inside:
        kind: module
        stopBy: end
        has:
          stopBy: end
          any:
            - pattern: from cosmos_charts import c
            - pattern: from cosmos_charts import $$$A, c
            - pattern: from cosmos_charts import c, $$$B
            - pattern: from cosmos_charts import $$$A, c, $$$B
fix: CosmosChartsConstants.CosmosCharts
message: >-
  Reach constants through the static CosmosChartsConstants class path; the
  module re-alias does not propagate to mypy or pyright.
---
id: namespace-static-path-constants-import
language: python
severity: error
files:
  - "**/*.py"
rule:
  all:
    - inside:
        kind: module
        stopBy: end
        has:
          stopBy: end
          pattern: c.CosmosCharts
    - any:
        - pattern: from cosmos_charts import c
        - pattern: from cosmos_charts import $$$A, c
        - pattern: from cosmos_charts import c, $$$B
        - pattern: from cosmos_charts import $$$A, c, $$$B
fix: |-
  from cosmos_charts import $$$I
  from cosmos_charts.constants import CosmosChartsConstants
message: >-
  Import the static CosmosChartsConstants class beside the facade letter the
  module already binds; the import-normalization phase merges the form.
---
