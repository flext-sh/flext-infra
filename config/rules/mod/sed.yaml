# Declarative sed-by-list rules for the make mod text phase.
#
# Each entry is one list-driven regex rewrite applied across the governed
# scan surface and explicitly included paths. The engine proves an exact
# expected-count receipt when declared, and reaches a rewrite fixed point
# before the canonical validate gate runs.
#
# rules:
#   - id: example-rule-id          # unique text-rule identifier
#     description: rewrite intent  # optional
#     distributions: [flext-infra] # optional [project].name selector
#     include: ["**/tests/**"]     # optional fnmatch globs
#     exclude: ["**/legado/**"]    # optional fnmatch globs
#     find: "regex pattern"        # required
#     replace: "expansion"         # optional, default empty
#     flags: ["MULTILINE"]         # optional names from CODEMOD_TEXT_FLAG_NAMES
#     expected: 3                  # optional exact finding count receipt

rules:
  - id: gitmodule-input-declaration-retire-runtime-owner
    description: Relocate the Git configuration input model to its layer-zero owner.
    include: [src/flext_infra/_models/git.py]
    find: '(?ms)^    class GitSubmoduleDeclaration\(m\.ContractModel\):\n.*?(?=^    class GitCommitishRequest\()'
    replace: ''
  - id: gitmodule-input-declaration-elect-config-owner
    description: Let runtime topology consume the one parsed Git input declaration without a layer inversion.
    include: [src/flext_infra/_models/_config/workspace.py]
    find: '^(class FlextInfraConfigModelsWorkspace:\n    """Workspace manifest, integration, and policy models\."""\n)(?!\n    class GitSubmoduleDeclaration)'
    flags: [MULTILINE]
    replace: |-
      \g<1>
          class GitSubmoduleDeclaration(m.ContractModel):
              """One Git configuration section parsed by its canonical owner."""

              model_config: ClassVar[m.ConfigDict] = m.ConfigDict(
                  extra="forbid",
                  frozen=True,
              )

              path: Annotated[
                  Path,
                  m.Field(description="Submodule path relative to the superproject root"),
              ]
              url: Annotated[
                  str,
                  m.Field(description="Declared URL; empty when undeclared"),
              ]
              branch: Annotated[
                  str,
                  m.Field(description="Declared branch; empty when undeclared"),
              ]
              managed: Annotated[
                  bool | None,
                  m.Field(
                      description=(
                          "Native Git boolean: absent inherits participation; "
                          "true participates and false does not"
                      ),
                  ),
              ]

  - id: make-retire-unused-gitlink-context-resolution
    description: Stop resolving a rich member projection unused by every Make template.
    include: [src/flext_infra/codegen/_conform/*.py]
    find: '(?ms)^        gitlinks = self\._managed_gitlinks\(\n.*?^            return r\[[^\n]+\]\.from_failure\(gitlinks\)\n'
    replace: ''
  - id: make-retire-unused-gitlink-context-argument
    description: Remove the retired template projection argument from its render producers.
    include: [src/flext_infra/codegen/_conform/*.py]
    find: '^                workspace_gitlinks=gitlinks\.value,\n'
    replace: ''
    flags: [MULTILINE]
  - id: make-retire-unused-gitlink-context-resolver
    description: Remove the superseded provider baseline resolver after retiring its consumers.
    include: [src/flext_infra/codegen/_conform/context_render.py]
    find: '(?ms)^    @staticmethod\n    def _managed_gitlinks\(\n.*?(?=^    @staticmethod\n    def _repository_root_rel\()'
    replace: ''
  - id: make-retire-unused-gitlink-context-fields
    description: Keep the Make transport limited to actual template inputs.
    include: [src/flext_infra/_models/_config/contexts.py]
    find: '(?ms)^        workspace_gitlinks: Annotated\[\n.*?^        \] = \(\)\n'
    replace: ''
  - id: make-retire-unused-managed-gitlink-model
    description: Eliminate the unused rich gitlink template model after its entire consumer cut.
    include: [src/flext_infra/_models/_config/repository.py]
    find: '(?ms)^    class ManagedGitlinkSpec\(FlextInfraConfigModelsContract\.ConfigContract\):\n.*?(?=^    class ScriptDispatchSpec\()'
    replace: ''
  - id: make-retire-generated-gitlink-membership-variable
    description: Submodule provisioning observes Git declarations directly in every mode.
    include: [src/flext_infra/templates/project/base/Makefile.j2]
    find: '^MANAGED_GITLINKS :=.*\n'
    replace: ''
    flags: [MULTILINE]
  - id: make-document-live-git-provisioning-authority
    description: Explain traversal projection separately from the Git provisioning authority.
    include: [src/flext_infra/templates/project/base/Makefile.j2]
    find: '^# Computed: MANAGED_GITLINKS mirrors the read-only local \.gitmodules topology\.$'
    replace: '# Computed: traversal projects observed members; provisioning reads local .gitmodules.'
    flags: [MULTILINE]
  - id: make-retire-obsolete-generated-membership-assertion
    description: Real generated Make provisioning now proves membership discovery through Git.
    include: [tests/unit/codegen/test_gen_respects_invocation_scope.py]
    find: '(?ms)^    @staticmethod\n    def test_project_selector_resolves_members_from_repository_root\(\n.*?(?=^    (?:@|def )|\Z)'
    replace: ''
  - id: repository-policy-vocabulary-retire-constant-enums
    description: Move layer-zero repository policy enums out of the constants family.
    include: [src/flext_infra/_constants/codegen_project.py]
    find: '(?ms)^    @unique\n    class (?:RepositoryState|CodegenKind|ProjectKind)\(StrEnum\):\n.*?(?=^    @unique\n|^    [A-Z][A-Z0-9_]*:)'
    replace: ''
  - id: repository-policy-vocabulary-declare-canonical-enums
    description: Keep one layer-zero owner inherited by both config models and constants.
    include: [src/flext_infra/_models/_config/vocabulary.py]
    find: '^(class FlextInfraConfigVocabulary:\n    """Canonical closed contracts required before project facades initialize\."""\n)(?!\n    @unique\n    class RepositoryState)'
    flags: [MULTILINE]
    replace: |-
      \g<1>
          @unique
          class RepositoryState(StrEnum):
              """Lifecycle state used by repository selection."""

              ACTIVE = "active"
              EXCLUDED = "excluded"

          @unique
          class CodegenKind(StrEnum):
              """Code-generation policy applied to one repository."""

              CONFORM = "conform"
              PYTHON = "python"
              NONE = "none"

          @unique
          class ProjectKind(StrEnum):
              """Own governance profile; external forks retain upstream contracts."""

              INTERNAL_FLEXT = "internal_flext"
              INTERNAL = "internal"
              THIRD_PARTY_FORK = "third_party_fork"

  - id: repository-discovery-retire-manifest-exclusion-name
    description: Name Git-derived participation at its canonical discovery owner and consumers.
    find: '\bmanifest_nonparticipant_paths\b'
    replace: repository_nonparticipant_paths
  - id: ldif-test-case-attribute-data-consumers
    distributions: [flext-ldif]
    description: Materialize attribute case models through the test utility owner.
    include: ["tests/unit/servers/*.py"]
    find: 'c\.Tests\.APACHE_ATTRIBUTE_TEST_CASES'
    replace: 'u.Tests.attribute_test_cases(c.Tests.APACHE_ATTRIBUTE_CASE_ROWS)'
  - id: ldif-test-case-server-attribute-data-consumers
    distributions: [flext-ldif]
    description: Select dialect attribute cases from the single constant row table.
    include: ["tests/unit/servers/*.py"]
    find: 'c\.Tests\.(?P<server>DS389|NOVELL)_ATTRIBUTE_TEST_CASES'
    replace: 'u.Tests.server_attribute_test_cases(c.Tests.\g<server>)'
  - id: ldif-test-case-objectclass-data-consumers
    distributions: [flext-ldif]
    description: Materialize objectClass case models from immutable constant rows.
    include: ["tests/unit/servers/*.py"]
    find: 'c\.Tests\.(?P<server>[A-Z][A-Z0-9_]*)_OBJECTCLASS_TEST_CASES'
    replace: 'u.Tests.objectclass_test_cases(c.Tests.\g<server>_OBJECTCLASS_CASE_ROWS)'
  - id: ldif-test-case-entry-data-consumers
    distributions: [flext-ldif]
    description: Give each entry case fresh protocol attributes without mutable constants.
    include: ["tests/unit/servers/*.py"]
    find: 'c\.Tests\.(?P<server>[A-Z][A-Z0-9_]*)_ENTRY_TEST_CASES'
    replace: 'u.Tests.entry_test_cases(c.Tests.\g<server>_ENTRY_CASE_ROWS)'
  - id: codegen-main-fixture-declare-infra-provenance
    distributions: [flext-infra]
    description: Derive the synthetic consumer's Infra Git source from the repository and branch policy.
    include: [tests/unit/codegen/main_tests.py]
    find: '        repository = u\.Tests\.repository_ref\(repo\.name\)\n        \(repo / "pyproject\.toml"\)\.write_text\('
    replace: |2-
              repository = u.Tests.repository_ref(repo.name)
              infra = u.Tests.repository_ref("flext-infra")
              integration = config.Infra.codegen.branch_policy.integration_branch_preference[0]
              (repo / "pyproject.toml").write_text(
  - id: codegen-main-fixture-add-infra-requirement
    distributions: [flext-infra]
    description: Give the synthetic consumer the direct Git dependency required by strict source detection.
    include: [tests/unit/codegen/main_tests.py]
    find: '''dependencies = \["flext-core>=0\.1\.0"\]\\n\\n'''
    replace: 'f''dependencies = ["flext-core>=0.1.0", ''\n            f''"flext-infra @ git+{infra.url}@{integration}"]\\n\\n'''
  - id: testmon-lease-test-tune-start-clock
    distributions: [flext-infra]
    description: Parameterize the real runner fixture clock for a deadline-exhaustion case.
    include: [tests/unit/validate/pytest_runner_zero_test_tests.py]
    find: '        slow_phase: bool = False,\n    \) -> FlextInfraPytestRunner:'
    replace: '        slow_phase: bool = False,\n        elapsed_seconds: float = 0.0,\n    ) -> FlextInfraPytestRunner:'
  - id: testmon-lease-test-use-fixture-clock
    distributions: [flext-infra]
    description: Apply the fixture clock to the public runner constructor.
    include: [tests/unit/validate/pytest_runner_zero_test_tests.py]
    find: 'started_at_monotonic=time\.monotonic\(\),'
    replace: 'started_at_monotonic=time.monotonic() - elapsed_seconds,'
  - id: testmon-lease-test-deadline-exhaustion
    distributions: [flext-infra]
    description: Keep the held-lease failure test bounded by the declared suite deadline.
    include: [tests/unit/validate/pytest_runner_zero_test_tests.py]
    find: '(?s)(def test_held_testmon_database_lease_refuses_a_concurrent_run\(\n        self,\n        tmp_path: Path,\n    \) -> None:\n        """A second run on one shared database fails loud before any effect\."""\n        project = self\._zero_test_project\(tmp_path\)\n)        runner = self\._runner\(project, tmp_path\)'
    replace: '\g<1>        runner = self._runner(\n            project,\n            tmp_path,\n            elapsed_seconds=config.Infra.tooling.tools.pytest.run_timeout_seconds,\n        )'
  - id: testmon-serialize-within-declared-suite-deadline
    distributions: [flext-infra]
    description: Wait for the shared testmon lease within the existing typed suite deadline.
    include: [src/flext_infra/validate/_pytest_runner/execution.py]
    find: '(?s)        # The digest, the run and the post-run integrity inspection read one\n        # shared database: a concurrent run on it would make the integrity\n        # verdict describe the other run.s writes\. One native lease serializes\n        # it; a held lease refuses at once instead of spending this deadline\.\n        with u\.Infra\.codegen_transaction_lease\(self\.testmon_db, wait_seconds=0\):'
    replace: |2-
              # Selection, execution, and integrity inspection share one database.
              # Serialize competing worktrees within this invocation's typed deadline.
              deadline = self._process_deadline()
              wait_seconds = max(
                  0.0,
                  deadline.expires_at_monotonic
                  - deadline.termination_grace_seconds
                  - time.monotonic(),
              )
              with u.Infra.codegen_transaction_lease(
                  self.testmon_db,
                  wait_seconds=wait_seconds,
              ):
  - id: testmon-lease-monotonic-import
    distributions: [flext-infra]
    description: Import the monotonic clock used by the shared testmon lease budget.
    include: [src/flext_infra/validate/_pytest_runner/execution.py]
    find: '^import shlex\nimport sys\n(?!import time\n)'
    replace: 'import shlex\nimport sys\nimport time\n'
    flags: [MULTILINE]
  - id: lazy-init-fixture-declare-author-isort
    distributions: [flext-infra]
    description: Keep synthetic project metadata complete for strict lazy-init copyright rendering.
    include: [tests/unit/codegen/lazy_init_generation_tests.py]
    find: 'version = "1\.0\.0"\\n\{isort_table\}'
    replace: 'version = "1.0.0"\\nauthors = [{{ name = "Fixture Author" }}]\\n{isort_table}'
  - id: lazy-init-fixture-declare-author-empty-policy
    distributions: [flext-infra]
    description: Keep synthetic project metadata complete for strict lazy-init copyright rendering.
    include: [tests/unit/codegen/lazy_init_generation_tests.py]
    find: 'version = "1\.0\.0"\\n\{table\}'
    replace: 'version = "1.0.0"\\nauthors = [{{ name = "Fixture Author" }}]\\n{table}'
  - id: mise-lock-merge-test-signature-format
    distributions: [flext-infra]
    description: Render the merge-conflict regression test signature in the Qlty layout.
    include: [tests/unit/codegen/test_mise_lock_transaction.py]
    find: 'def test_publish_regenerates_an_unmerged_generated_lock\(\n        self, tmp_path: Path\n    \) -> None:'
    replace: 'def test_publish_regenerates_an_unmerged_generated_lock(\n        self,\n        tmp_path: Path,\n    ) -> None:'
  - id: config-retire-shadowed-sed-model-pair
    distributions: [flext-infra]
    description: Remove the earlier SedPatternSpec and SedPatternsSpec declarations shadowed by the strict canonical pair.
    include: [src/flext_infra/_models/_config/artifact.py]
    find: '(?s)^    class SedPatternSpec\(FlextInfraConfigModelsContract\.ConfigContract\):\n.*?(?=^    class RefactorCsvCampaignsSpec\()'
    replace: ''
    flags: [MULTILINE]
  - id: codegen-test-ci-branches-from-config
    distributions: [flext-infra]
    description: Derive CI trigger branches from the same branch policy as the renderer.
    include: [tests/utilities.py]
    find: |-
      (?s)            # Why: ci_trigger_branches is no longer config-owned.*?            @staticmethod
                  def synthetic_private_submodules
    replace: |2-
                  @staticmethod
                  def ci_trigger_branches(repository_branch: str) -> t.VariadicTuple[str]:
                      """Derive the repository trigger set from the configured policy."""
                      return tuple(dict.fromkeys((
                          *config.Infra.codegen.branch_policy.ci_trigger_branches,
                          repository_branch,
                      )))

                  @staticmethod
                  def synthetic_private_submodules
  - id: codegen-test-retire-unused-classvar-import
    distributions: [flext-infra]
    description: Remove the import made obsolete by the configured CI branch policy.
    include: [tests/utilities.py]
    find: '^from typing import ClassVar\n'
    replace: ''
    flags: [MULTILINE]
  - id: codegen-test-ci-branch-consumers
    distributions: [flext-infra]
    description: Pass each fixture repository branch to the canonical configured derivation.
    include:
      - tests/unit/codegen/ci_custom_steps_tests.py
      - tests/unit/codegen/test_template_formatter_fixed_point.py
    find: '(?P<prefix>repository_branch="(?P<branch>[^"]+)",\n[ \t]+ci_trigger_branches=)(?P<owner>(?:tests\.)?utilities\.TestsFlextInfraUtilities\.CodegenTestSupport\.Ci)\.CI_TRIGGER_BASELINE_BRANCHES'
    replace: '\g<prefix>\g<owner>.ci_trigger_branches("\g<branch>")'
  - id: codegen-test-retire-shadowed-facade-imports
    distributions: [flext-infra]
    description: Keep the test c/m/t facades after Rope moves their shared helper.
    include: [tests/utilities.py]
    find: '^from flext_infra import FlextInfraUtilities, c, config, m, t$'
    replace: 'from flext_infra import FlextInfraUtilities, config'
    flags: [MULTILINE]
  - id: codegen-test-retire-shadowed-utility-import
    distributions: [flext-infra]
    description: Let the test u facade supply inherited production utilities.
    include:
      - tests/unit/codegen/test_release_checkout_credentials.py
      - tests/unit/codegen/test_ci_declared_secrets_contract.py
      - tests/unit/codegen/test_ci_integration_branch_triggers.py
      - tests/unit/codegen/test_ci_package_registry_read.py
      - tests/unit/codegen/test_ci_system_packages.py
    find: '^from flext_infra import ((?:\w+, )*\w+), u$'
    replace: 'from flext_infra import \g<1>'
    flags: [MULTILINE]
  - id: docs-strict-python-fence-ruff-ignores
    distributions: [flext-infra]
    description: Retain only syntax-context docstring and package exceptions for isolated executable fences.
    include: [src/flext_infra/_constants/docs.py]
    find: '^        "(?:D101|D102|D103|D106|PLR2004|S101|T201|T203|ANN001|ANN002|ANN003|ANN201|ANN202|ANN204|ANN205|PLC0415|B018|F821|F811|SLF001|S106|PT004|E402|PLW0127|PLC0414)",\n'
    replace: ''
    flags: [MULTILINE]
  - id: docs-strict-python-fence-rationale
    distributions: [flext-infra]
    description: Explain the bounded exceptions kept for standalone Markdown fence files.
    include: [src/flext_infra/_constants/docs.py]
    find: '(?s)    """Rules ignored for executable docs snippets.*?lazy-export pattern itself teaches\)\."""'
    replace: |2-
          """Only module-docstring and package rules are inapplicable to a
          standalone Markdown fence. All names, behavior, types, and security
          rules remain active and require correction in the authored source."""
  - id: checked-command-output-receipts
    distributions: [flext-infra]
    description: Preserve checked execution while retaining command output in assigned test receipts.
    include:
      - tests/unit/codegen/test_upg_lock_atomic_publication.py
      - tests/unit/codemod/test_apply_renames.py
      - tests/unit/codemod/test_rename_campaign_mod.py
      - tests/unit/codemod/test_rename_preflight.py
    find: '(^[ \t]+(?:observed|output|namespace|consumer)[ \t]*=[ \t]*tm\.ok\(\s*u\.Cli\.)run_checked(?=\()'
    replace: '\g<1>run'
    flags: [MULTILINE]
  - id: pytest-interrupt-never-normalized
    distributions: [flext-infra]
    description: Preserve pytest interruption as a red suite receipt even after the last selected test.
    include: [src/flext_infra/validate/_pytest_runner/execution.py]
    find: '(?s)        # The suite stop instant can land on the last selected test.*?        # A graceful stop at the suite stop instant publishes the executed'
    replace: |2-
              final_exit = (
                  0 if (accepted_cache_hit or accepted_zero_tests) else raw_return_code or int(rejected)
              )
              # A graceful stop at the suite stop instant publishes the executed
  - id: standalone-fixture-author-projection
    distributions: [flext-infra]
    description: Render conform-required author metadata from the typed fixture project specification.
    include: [tests/utilities_fixture_workspace.py]
    find: '(?m)^(?P<indent>            )f''name = "\{name\}"\\n''$(?!\n            f''authors = )'
    replace: |-
      \g<indent>f'name = "{name}"\\n'
      \g<indent>f'authors = [{{name = "{TestsFlextInfraUtilitiesProjectFixtureMixin.project_spec(name).author_name}", email = "{TestsFlextInfraUtilitiesProjectFixtureMixin.project_spec(name).author_email}"}}]\\n'
  - id: standalone-fixture-author-owner
    distributions: [flext-infra]
    description: Route the fixture author through the imported typed project fixture owner.
    include: [tests/utilities_fixture_workspace.py]
    find: 'fixture\.project_spec\(name\)'
    replace: 'TestsFlextInfraUtilitiesProjectFixtureMixin.project_spec(name)'
  - id: standalone-fixture-upstream-dependency
    distributions: [flext-infra]
    description: Derive the fixture runtime dependency from the typed scaffold upstream declaration.
    include: [tests/utilities_fixture_workspace.py]
    find: '"dependencies = \[\]\\n"'
    replace: |-
      f'dependencies = ["{TestsFlextInfraUtilitiesProjectFixtureMixin.flext_source(TestsFlextInfraUtilitiesProjectFixtureMixin.project_spec(name).upstream)}"]\\n'
  - id: root-artifact-fixture-project-owner
    distributions: [flext-infra]
    description: Resolve conform test metadata through the typed fixture project owner.
    include: [tests/unit/codegen/test_root_artifact_ownership.py]
    find: '(?m)^(        root = infra_git_repo)\n(        u\.Tests\.write_project_beads_config\(root, "flext-demo"\))$'
    replace: '\g<1>\n        project = u.Tests.project_spec("flext-demo")\n\g<2>'
  - id: root-artifact-fixture-author
    distributions: [flext-infra]
    description: Declare conform-required author metadata from the fixture project model.
    include: [tests/unit/codegen/test_root_artifact_ownership.py]
    find: '(?m)^(                    ''version = "0\.1\.0"\\n'')$(?!\n                    f''authors = )'
    replace: |-
      \g<1>
                          f'authors = [{{name = "{project.author_name}", email = "{project.author_email}"}}]\\n'
  - id: root-artifact-fixture-upstream
    distributions: [flext-infra]
    description: Preserve the fixture scaffold upstream as a direct Git runtime dependency.
    include: [tests/unit/codegen/test_root_artifact_ownership.py]
    find: '"dependencies = \[\]\\n"'
    replace: |-
      f'dependencies = ["{u.Tests.flext_source(project.upstream)}"]\\n'
  - id: bootstrap-source-document-declared-surface
    distributions: [flext-infra]
    description: Describe the declared multi-file Make bootstrap instead of a retired single-file contract.
    include: [src/flext_infra/codegen/make_bootstrap.py]
    find: 'Makefile-only bootstrap|one Makefile projection|Makefile projection'
    replace: 'declared Make bootstrap surface'
  - id: candidate-bootstrap-destination-error
    distributions: [flext-infra]
    description: Report a missing declared bootstrap surface without asserting a single Makefile destination.
    include: [src/flext_infra/services/candidate_bootstrap.py]
    find: 'candidate bootstrap must plan exactly one Makefile:'
    replace: 'candidate bootstrap has no declared destinations:'
  - id: cli-process-options-model-owner
    description: >-
      flext-cli declares the process launch options as the model
      m.Cli.ProcessOptions (and the protocol p.Cli.ProcessOptions); no
      u.Cli.ProcessOptions exists, so every construction names the model.
    find: '\bu\.Cli\.ProcessOptions\('
    replace: 'm.Cli.ProcessOptions('
  - id: process-options-tests-import-models-c-u
    distributions: [flext-infra]
