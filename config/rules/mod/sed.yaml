# Declarative sed-by-list rules for the make mod text phase.
#
# Each entry is one list-driven regex rewrite applied across the governed
# scan surface and explicitly included paths. The engine proves an exact
# expected-count receipt when declared, and reaches a rewrite fixed point
# before the canonical validate gate runs.
#
# rules:
#   - id: example-rule-id          # unique text-rule identifier
#     description: rewrite intent  # optional
#     distributions: [flext-infra] # optional [project].name selector
#     include: ["**/tests/**"]     # optional fnmatch globs
#     exclude: ["**/legado/**"]    # optional fnmatch globs
#     find: "regex pattern"        # required
#     replace: "expansion"         # optional, default empty
#     flags: ["MULTILINE"]         # optional names from CODEMOD_TEXT_FLAG_NAMES
#     expected: 3                  # optional exact finding count receipt

# One-shot migrations are deleted at fleet census zero (ADR-028 Decision 18).
#
# acf561f13b renamed the gitignore/docs-audit family (gitignore -> ignore,
# docs_audit -> audit); src was reverted to the original owners, the tests
# were left on the post-acf names. These rules rewire the tests back to the
# live owners; the ".ignore" file literal becomes the owner constant.
rules:
- id: rewire-render-project-gitignore
  description: renderer owner is render_project_gitignore
  include: [ "tests/**" ]
  find: "\\brender_project_ignore\\b"
  replace: render_project_gitignore
  expected: 25
- id: rewire-gitignore-sections
  description: workspace spec owner is gitignore_sections
  include: [ "tests/**" ]
  find: "\\.ignore_sections\\b"
  replace: .gitignore_sections
  expected: 3
- id: rewire-gitignore-additions
  description: project spec owner is gitignore_additions
  include: [ "tests/**" ]
  find: "\\.ignore_additions\\b"
  replace: .gitignore_additions
  expected: 3
- id: rewire-docs-audit-markdown
  description: docs utility owner is docs_audit_markdown
  include: [ "tests/**" ]
  find: "\\.audit_markdown\\b"
  replace: .docs_audit_markdown
  expected: 2
- id: rewire-docs-audit-policy
  description: docs utility owner is docs_audit_policy
  include: [ "tests/**" ]
  find: "\\.audit_policy\\b"
  replace: .docs_audit_policy
  expected: 1
- id: rewire-artifact-gitignore
  description: artifact spec field is gitignore
  include: [ "tests/**" ]
  find: "\\bartifact\\.ignore\\b"
  replace: artifact.gitignore
  expected: 3
- id: rewire-workspace-docs-audit
  description: workspace spec field is docs_audit
  include: [ "tests/**" ]
  find: "\\bworkspace\\.audit\\b"
  replace: workspace.docs_audit
  expected: 2
- id: rewire-manifest-docs-audit-argument
  description: workspace manifest field is docs_audit
  include: [ "tests/**" ]
  find: "\\baudit=observed\\.audit\\b"
  replace: docs_audit=observed.docs_audit
  expected: 1
- id: rewire-gitignore-file-constant
  description: the ignore file name has one owner, c.Infra.GITIGNORE
  include: [ "tests/**" ]
  find: "\"\\.ignore\""
  replace: c.Infra.GITIGNORE
  expected: 30
- id: import-c-for-gitignore-constant-tm-u
  description: the two tests that now read c.Infra.GITIGNORE import c
  include:
  - tests/unit/_utilities/test_git_worktree_state.py
  - tests/unit/validate/scanner_helpers_tests.py
  find: "^from tests import p, tm, u$"
  replace: from tests import c, p, tm, u
  flags: [ "MULTILINE" ]
  expected: 2
- id: import-c-for-gitignore-constant-tm
  description: the gate test that now reads c.Infra.GITIGNORE imports c
  include:
  - tests/unit/gates/index_declarations_gate_tests.py
  find: "^from tests import p, tm$"
  replace: from tests import c, p, tm
  flags: [ "MULTILINE" ]
  expected: 1
# af7b4deecd rewired worktree.py to u.Infra.{setup_lane,update_lane,
# rollback_new_lane}, but the two owners lacked the FlextInfraUtilities
# prefix the facade generator composes, so u.Infra never carried them
# (AttributeError at runtime). The declaring modules take the family
# name; make gen then composes them into u.Infra.
- id: utilities-family-worktree-provisioning
  description: worktree provisioning joins the u.Infra utilities family
  include: [ "src/flext_infra/_utilities/worktree_provisioning.py" ]
  find: "\\bFlextInfraWorktreeProvisioning\\b"
  replace: FlextInfraUtilitiesWorktreeProvisioning
  expected: 2
- id: utilities-family-worktree-lifecycle
  description: worktree lifecycle joins the u.Infra utilities family
  include: [ "src/flext_infra/_utilities/worktree_lifecycle.py" ]
  find: "\\bFlextInfraWorktreeLifecycle\\b"
  replace: FlextInfraUtilitiesWorktreeLifecycle
  expected: 4
- id: rewire-gitignore-file-prose
  description: docstrings name the real file
  include: [ "tests/**" ]
  find: "``\\.ignore``"
  replace: "``.gitignore``"
  expected: 3
