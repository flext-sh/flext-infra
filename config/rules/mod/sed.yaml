# Declarative sed-by-list rules for the make mod text phase.
#
# Each entry is one list-driven regex rewrite applied across the governed
# scan surface and explicitly included paths. The engine proves an exact
# expected-count receipt when declared, and reaches a rewrite fixed point
# before the canonical validate gate runs.
#
# rules:
#   - id: example-rule-id          # unique text-rule identifier
#     description: rewrite intent  # optional
#     distributions: [flext-infra] # optional [project].name selector
#     include: ["**/tests/**"]     # optional fnmatch globs
#     exclude: ["**/legado/**"]    # optional fnmatch globs
#     find: "regex pattern"        # required
#     replace: "expansion"         # optional, default empty
#     flags: ["MULTILINE"]         # optional names from CODEMOD_TEXT_FLAG_NAMES
#     expected: 3                  # optional exact finding count receipt

rules:
  - id: topology-retire-legacy-identity-comparison
    description: Runtime identity is observed from Git and metadata, never compared with a duplicated catalog.
    include: [src/flext_infra/workspace/detector.py]
    find: '(?ms)^    @staticmethod\n    def _manifest_git_contradictions\(\n.*?(?=^    @staticmethod\n    def _configured_repository_ref\()'
    replace: ''
  - id: topology-integration-line-uses-repository-policy-owner
    description: Elect the repository's declared integration policy before observing published Git refs.
    include: [src/flext_infra/workspace/detector.py]
    find: 'baseline = u\.Infra\.repository_baseline_branch\('
    replace: 'baseline = u.Infra.resolve_integration_branch('
  - id: topology-retire-member-catalog-reader
    description: Git declarations exclusively own workspace composition.
    include: [src/flext_infra/workspace/detector.py]
    find: '(?ms)^    @classmethod\n    def _declared_members\(\n.*?(?=^    @classmethod\n    def _load_subproject\()'
    replace: ''
  - id: topology-retire-catalog-recovery-route
    description: Unprovisioned Git links carry declarations without invented package identities.
    include: [src/flext_infra/workspace/detector.py]
    find: '(?ms)^    @classmethod\n    def _declared_subproject\(\n.*?(?=^    @classmethod\n    def _undeclared_subproject\()'
    replace: ''
  - id: topology-retire-member-catalog-loads
    include: [src/flext_infra/workspace/detector.py]
    find: '(?m)^        (members = cls\._declared_members\(repository_root\)\n        if members\.failure:\n            return result_type\.from_failure\(members\)\n|superproject_members = cls\._declared_members\(superproject_root\)\n        if superproject_members\.failure:\n            return result_type\.from_failure\(superproject_members\)\n)'
    replace: ''
  - id: topology-retire-member-catalog-parameter
    include: [src/flext_infra/workspace/detector.py]
    find: '(?m)^        declared_member: m\.Infra\.RepositoryRef \| None,\n|^ {12,16}declared_member=(members\.value\.get\(declaration\.path\)|superproject_members\.value\.get\(member_path\)),\n'
    replace: ''
  - id: topology-retire-member-catalog-dispatch
    include: [src/flext_infra/workspace/detector.py]
    find: '(?ms)^        if declared_member is not None:\n            return cls\._declared_subproject\(\n.*?(?=^        return cls\._undeclared_subproject\()'
    replace: ''
  - id: topology-retire-member-catalog-identity-parameter
    include: [src/flext_infra/workspace/detector.py]
    find: '(?m)^        declared_repository: m\.Infra\.RepositoryRef \| None = None,\n'
    replace: ''
  - id: topology-derive-package-identity-from-checkout
    include: [src/flext_infra/workspace/detector.py]
    find: '(?ms)^        if declared_repository is None:\n            metadata = u\.Infra\.read_project_metadata_result\(repository_root\)\n            if metadata\.failure:\n                return r\[m\.Infra\.RepositoryRef\]\.from_failure\(metadata\)\n            project_name = metadata\.value\.project\.name\n        else:\n            project_name = declared_repository\.distribution\n'
    replace: '        metadata = u.Infra.read_project_metadata_result(repository_root)\n        if metadata.failure:\n            return r[m.Infra.RepositoryRef].from_failure(metadata)\n        project_name = metadata.value.project.name\n'
  - id: topology-observe-package-participation-from-layout
    include: [src/flext_infra/workspace/detector.py]
    find: 'package=\(\n                    declared_repository\.package\n                    if declared_repository is not None\n                    else u\.Infra\.layout\(repository_root\) is not None\n                \),'
    replace: 'package=u.Infra.layout(repository_root) is not None,'
  - id: topology-checkout-identity-documentation
    include: [src/flext_infra/workspace/detector.py]
    find: 'Build identity from declared recovery topology or validated live metadata\.'
    replace: 'Build identity from validated checkout metadata and native Git inputs.'
  - id: topology-native-participation-documentation
    include: [src/flext_infra/workspace/detector.py]
    find: '(?ms)^(        )A submodule whose ``\.gitmodules`` section explicitly sets\n.*?(?=\n        Returns:\n)'
    replace: |-
      \g<1>A native Git false management declaration marks a read-only external
              dependency. An absent flag inherits participation. Managed entries
              resolve their package identity from a provisioned checkout; setup may
              retain an unprovisioned entry as its parsed Git declaration only.
  - id: topology-retain-unprovisioned-managed-declaration
    description: Missing managed checkouts fail strict discovery and retain only their native Git input during setup.
    include: [src/flext_infra/workspace/detector.py]
    find: '(?ms)^(    )@classmethod\n    def _undeclared_subproject\(\n(?=(?:(?!^    @classmethod).)*"""Load an entry the manifest does not declare).*?(?=^    @classmethod\n    def _checkout_subproject\()'
    replace: |+
      \g<1>@classmethod
          def _undeclared_subproject(
              cls,
              repository_root: Path,
              subproject_root: Path,
              path: Path,
              *,
              declared_url: str,
              context: m.Infra.SubprojectLoadContext,
          ) -> p.Result[m.Infra.RepositoryRef | Path | m.Infra.GitSubmoduleDeclaration]:
              """Resolve a provisioned checkout without a second identity catalog.

              Returns:
                  Its observed identity, or its pending Git declaration for setup.
              """
              result_type = r[
                  m.Infra.RepositoryRef | Path | m.Infra.GitSubmoduleDeclaration
              ]
              if not (subproject_root / c.Infra.GIT_DIR).exists():
                  if not context.allow_unprovisioned_members:
                      error = FileNotFoundError(
                          f"governed subproject checkout is missing: {path.as_posix()}",
                      )
                      return result_type.fail(str(error), exception=error)
                  return u.Infra.git_submodule_declaration(
                      m.Infra.GitSubmoduleContractRequest(
                          repo_root=repository_root,
                          member_path=path.as_posix(),
                      ),
                  ).map(lambda declaration: declaration)
              return cls._checkout_subproject(
                  subproject_root,
                  path,
                  declared_url=declared_url,
                  context=context,
              )

  - id: topology-pending-subproject-result-contract
    include: [src/flext_infra/workspace/detector.py]
    find: '(p\.Result|r)\[m\.Infra\.RepositoryRef \| Path\]'
    replace: '\g<1>[m.Infra.RepositoryRef | Path | m.Infra.GitSubmoduleDeclaration]'
  - id: topology-pending-workspace-tuple-contract
    include: [src/flext_infra/workspace/detector.py]
    find: 't\.Pair\[t\.SequenceOf\[m\.Infra\.RepositoryRef\], t\.SequenceOf\[Path\]\]'
    replace: 't.Triple[t.SequenceOf[m.Infra.RepositoryRef], t.SequenceOf[Path], t.SequenceOf[m.Infra.GitSubmoduleDeclaration]]'
  - id: topology-pending-workspace-local-contract
    include: [src/flext_infra/workspace/detector.py]
    find: 't\.Pair\[t\.VariadicTuple\[m\.Infra\.RepositoryRef\], t\.VariadicTuple\[Path\]\]|tuple\[tuple\[m\.Infra\.RepositoryRef, \.\.\.\], t\.VariadicTuple\[Path\]\]'
    replace: 't.Triple[t.VariadicTuple[m.Infra.RepositoryRef], t.VariadicTuple[Path], t.VariadicTuple[m.Infra.GitSubmoduleDeclaration]]'
  - id: topology-pending-workspace-accounting
    include: [src/flext_infra/workspace/detector.py]
    find: '(?m)^(        external: list\[Path\] = \[\]\n)(?!        pending:)'
    replace: '\g<1>        pending: list[m.Infra.GitSubmoduleDeclaration] = []\n'
  - id: topology-pending-workspace-classification
    include: [src/flext_infra/workspace/detector.py]
    find: '(?m)^(            if loaded\.failure:\n                return result_type\.from_failure\(loaded\)\n)(            if isinstance\(loaded\.value, Path\):\n)'
    replace: '\g<1>            if isinstance(loaded.value, m.Infra.GitSubmoduleDeclaration):\n                pending.append(loaded.value)\n                continue\n\g<2>'
  - id: topology-pending-workspace-return
    include: [src/flext_infra/workspace/detector.py]
    find: 'return result_type\.ok\(\(tuple\(subprojects\), tuple\(external\)\)\)'
    replace: 'return result_type.ok((tuple(subprojects), tuple(external), tuple(pending)))'
  - id: topology-pending-workspace-unpack
    include: [src/flext_infra/workspace/detector.py]
    find: 'subprojects, external = topology\.value'
    replace: 'subprojects, external, pending = topology.value'
  - id: topology-pending-workspace-spec-unpack
    include: [src/flext_infra/workspace/detector.py]
    find: '\(subprojects, external\) = \(\n            refs\.value'
    replace: '(subprojects, external, pending) = (\n            refs.value'
  - id: topology-pending-workspace-spec-projection
    include: [src/flext_infra/workspace/detector.py]
    find: '(?m)^(                subprojects=tuple\(subprojects\),\n)(?!                pending_subprojects=)'
    replace: '\g<1>                pending_subprojects=tuple(pending),\n'
  - id: topology-inherited-member-requires-observed-identity
    include: [src/flext_infra/workspace/detector.py]
    find: 'if isinstance\(member_ref, Path\):'
    replace: 'if not isinstance(member_ref, m.Infra.RepositoryRef):'
  - id: topology-locked-provenance-uses-observed-workspace
    description: Validate lock provenance against the same detector and Git topology as setup.
    include: [src/flext_infra/workspace/environment_provenance.py]
    find: '(?ms)^        manifests = u\.Infra\.load_workspace_manifest\(repository_root\)\n.*?(?=^        members = \{\n)'
    replace: '        observed = FlextInfraWorkspaceDetector.load_workspace_spec(repository_root)\n        if observed.failure:\n            return r[int].from_failure(observed)\n        workspace = observed.value\n'
  - id: topology-pending-workspace-role
    include: [src/flext_infra/workspace/detector.py]
    find: 'if subprojects or external\n'
    replace: 'if subprojects or external or pending\n'
  - id: topology-pending-workspace-reference-result
    include: [src/flext_infra/workspace/detector.py]
    find: 'return result_type\.ok\(\(declared_repository\.value, \(subprojects, external\)\)\)'
    replace: 'return result_type.ok((declared_repository.value, (subprojects, external, pending)))'
  - id: topology-dependency-url-retire-member-catalog
    description: Discover dependency URLs from Git declarations and actual distribution metadata.
    include: [src/flext_infra/_utilities/repository.py]
    find: '(?ms)^(    )@staticmethod\n    def _manifest_declared_url\(\n.*?(?=^    @staticmethod\n    def repository_provider\()'
    replace: |+
      \g<1>@classmethod
          def _git_declared_distribution_url(
              cls,
              *,
              repository_root: Path,
              distribution: str,
          ) -> p.Result[str]:
              """Resolve a composed distribution from its actual checkout.

              Returns:
                  The matching native Git URL, or an empty absence payload.
              """
              result_type = r[str]
              declarations = (
                  FlextInfraUtilitiesGitWorktreeDiscoveryMixin.git_submodule_declarations(
                      repository_root,
                  )
              )
              if declarations.failure:
                  return result_type.from_failure(declarations)
              for declaration in declarations.value:
                  if declaration.managed is False:
                      continue
                  member_root = (repository_root / declaration.path).resolve()
                  if not member_root.is_relative_to(repository_root.resolve()):
                      error = ValueError(
                          f"subproject escapes workspace root: {declaration.path}",
                      )
                      return result_type.fail(str(error), exception=error)
                  if not (member_root / c.Infra.GIT_DIR).exists():
                      error = FileNotFoundError(
                          "distribution discovery requires a provisioned checkout: "
                          f"{declaration.path}",
                      )
                      return result_type.fail(str(error), exception=error)
                  if not (member_root / c.PYPROJECT_FILENAME).is_file():
                      continue
                  metadata = FlextInfraUtilitiesPyproject.read_project_metadata_result(
                      member_root,
                  )
                  if metadata.failure:
                      return result_type.from_failure(metadata)
                  if metadata.value.project.name == distribution:
                      return cls._canonical_https_url(declaration.url)
              return result_type.ok("")

  - id: topology-dependency-url-elect-git-owner
    include: [src/flext_infra/_utilities/repository.py]
    find: 'cls\._manifest_declared_url\('
    replace: 'cls._git_declared_distribution_url('
  - id: gitmodule-input-declaration-retire-runtime-owner
    description: Relocate the Git configuration input model to its layer-zero owner.
    include: [src/flext_infra/_models/git.py]
    find: '(?ms)^    class GitSubmoduleDeclaration\(m\.ContractModel\):\n.*?(?=^    class GitCommitishRequest\()'
    replace: ''
  - id: gitmodule-input-declaration-elect-config-owner
    description: Let runtime topology consume the one parsed Git input declaration without a layer inversion.
    include: [src/flext_infra/_models/_config/workspace.py]
    find: '^(class FlextInfraConfigModelsWorkspace:\n    """Workspace manifest, integration, and policy models\."""\n)(?!\n    class GitSubmoduleDeclaration)'
    flags: [MULTILINE]
    replace: |-
      \g<1>
          class GitSubmoduleDeclaration(m.ContractModel):
              """One Git configuration section parsed by its canonical owner."""

              model_config: ClassVar[m.ConfigDict] = m.ConfigDict(
                  extra="forbid",
                  frozen=True,
              )

              path: Annotated[
                  Path,
                  m.Field(description="Submodule path relative to the superproject root"),
              ]
              url: Annotated[
                  str,
                  m.Field(description="Declared URL; empty when undeclared"),
              ]
              branch: Annotated[
                  str,
                  m.Field(description="Declared branch; empty when undeclared"),
              ]
              managed: Annotated[
                  bool | None,
                  m.Field(
                      description=(
                          "Native Git boolean: absent inherits participation; "
                          "true participates and false does not"
                      ),
                  ),
              ]

  - id: duplicate-cure-model-owner-ast-import
    description: Bind the native AST contract in the census declaration owner.
    include: [src/flext_infra/_models/census.py]
    find: '(?m)(?<!import ast\n)^(from collections\.abc import MutableSet)$'
    replace: 'import ast\n\g<1>'
  - id: duplicate-cure-model-owner-declarations
    description: Declare frozen duplicate cure payloads beside the existing census contracts.
    include: [src/flext_infra/_models/census.py]
    find: '(?ms)\A(?!.*^    class DuplicateDefinition\()(.*?)(^    class DuplicateGroup\(m\.ArbitraryTypesModel\):)$'
    replace: |-
      \g<1>
          class DuplicateDefinition(m.ArbitraryTypesModel):
              """One verified duplicate definition and its native syntax node."""

              model_config: ClassVar[m.ConfigDict] = m.ConfigDict(frozen=True)

              item: Annotated[
                  FlextInfraModelsCensus.Object,
                  m.Field(description="Canonical census object"),
              ]
              path: Annotated[Path, m.Field(description="Definition source path")]
              source: Annotated[str, m.Field(description="Captured module source")]
              statement: Annotated[
                  ast.stmt | None,
                  m.Field(description="Original parsed definition node"),
              ]
              body: Annotated[str, m.Field(description="Definition source span")]
              consumers: Annotated[int, m.Field(description="Proven consumer count")]
              layer: Annotated[int, m.Field(description="Discovered project layer")]

          class DuplicateCopyCure(m.ArbitraryTypesModel):
              """One duplicate removal and its proven consumer rebindings."""

              model_config: ClassVar[m.ConfigDict] = m.ConfigDict(frozen=True)

              definition: Annotated[
                  FlextInfraModelsCensus.DuplicateDefinition,
                  m.Field(description="Verified duplicate definition"),
              ]
              consumer_files: Annotated[
                  t.VariadicTuple[Path],
                  m.Field(description="Consumers requiring import rebindings"),
              ]
              in_module_uses: Annotated[
                  int,
                  m.Field(description="References within the definition module"),
              ]

          class DuplicateGroupCure(m.ArbitraryTypesModel):
              """One elected owner and the complete duplicate publication plan."""

              model_config: ClassVar[m.ConfigDict] = m.ConfigDict(frozen=True)

              owner: Annotated[
                  FlextInfraModelsCensus.DuplicateCopyCure,
                  m.Field(description="Elected definition and its bindings"),
              ]
              copies: Annotated[
                  t.VariadicTuple[FlextInfraModelsCensus.DuplicateCopyCure],
                  m.Field(description="Copies with proven removal contracts"),
              ]
              edits: Annotated[
                  t.VariadicTuple[FlextInfraModelsTransformers.SemanticMigrationEdit],
                  m.Field(description="Complete proposed source edits"),
              ]

          class DuplicateDeletion(m.ContractModel):
              """One duplicate definition scheduled for removal."""

              model_config: ClassVar[m.ConfigDict] = m.ConfigDict(frozen=True)

              path: Annotated[Path, m.Field(description="Copy source path")]
              name: Annotated[str, m.Field(description="Duplicate object name")]
              line: Annotated[int, m.Field(description="Copy definition line")]
              project: Annotated[str, m.Field(description="Discovered project identity")]

          class DuplicateGroup(m.ArbitraryTypesModel):
  - id: duplicate-cure-runtime-retire-tuple-declarations
    description: Remove superseded runtime DTOs after electing the census model owner.
    include: [src/flext_infra/codemod/duplicate_apply.py]
    find: '(?ms)^class _Definition\(NamedTuple\):\n.*?(?=^class FlextInfraCodemodDuplicateApply\()'
    replace: ''
  - id: duplicate-cure-runtime-definition-binding
    description: Route verified definition payloads through the census model facade.
    include: [src/flext_infra/codemod/duplicate_apply.py]
    find: '\b_Definition\b'
    replace: m.Infra.DuplicateDefinition
  - id: duplicate-cure-runtime-copy-binding
    description: Route copy cure payloads through the census model facade.
    include: [src/flext_infra/codemod/duplicate_apply.py]
    find: '\b_CopyCure\b'
    replace: m.Infra.DuplicateCopyCure
  - id: duplicate-cure-runtime-group-binding
    description: Route group cure payloads through the census model facade.
    include: [src/flext_infra/codemod/duplicate_apply.py]
    find: '\b_GroupCure\b'
    replace: m.Infra.DuplicateGroupCure
  - id: duplicate-cure-runtime-deletion-binding
    description: Route deletion payloads through the census model facade.
    include: [src/flext_infra/codemod/duplicate_apply.py]
    find: '\b_Deletion\b'
    replace: m.Infra.DuplicateDeletion
  - id: duplicate-cure-runtime-retire-declaration-imports
    description: Retire NamedTuple and ClassVar imports from the behavior owner.
    include: [src/flext_infra/codemod/duplicate_apply.py]
    find: '(?m)^from typing import TYPE_CHECKING, ClassVar, NamedTuple$'
    replace: from typing import TYPE_CHECKING
  - id: duplicate-cure-constant-owner-builtins-import
    description: Derive native builtin names in the canonical constants owner.
    include: [src/flext_infra/_constants/census.py]
    find: '(?m)(?<!import builtins\n)^(from enum import StrEnum, unique)$'
    replace: 'import builtins\n\g<1>'
  - id: duplicate-cure-constant-owner-declarations
    description: Elect census as owner of immutable duplicate cure grammar.
    include: [src/flext_infra/_constants/census.py]
    find: '(?m)^(    """Census pipeline constants for object detection and classification\."""\n)(?!\n    DUPLICATE_BUILTIN_NAMES)'
    replace: |-
      \g<1>
          DUPLICATE_BUILTIN_NAMES: ClassVar[frozenset[str]] = frozenset(dir(builtins))
          "Native builtin bindings available to pure duplicate definitions."
          DUPLICATE_PURE_CONSTRUCTORS: ClassVar[frozenset[str]] = frozenset({
              "bool", "bytes", "complex", "dict", "float", "frozenset",
              "int", "list", "range", "set", "str", "tuple",
          })
          "Builtin constructors admitted by the duplicate purity grammar."
          DUPLICATE_TRIVIAL_KINDS: ClassVar[frozenset[str]] = frozenset({
              "assignment", "class", "constant", "function",
          })
          "Census object kinds supporting identity-proven cure planning."
          DUPLICATE_DELETE_ACTION: ClassVar[str] = "delete-copy"
          "Removal action recorded by the public duplicate cure receipt."
          DUPLICATE_REBIND_ACTION: ClassVar[str] = "rebind-import"
          "Consumer import migration action."
          DUPLICATE_BIND_ACTION: ClassVar[str] = "bind-owner"
          "Binding of the elected duplicate owner."
          DUPLICATE_KEEP_ACTION: ClassVar[str] = "keep-owner"
          "Preservation of the elected duplicate owner."
  - id: duplicate-cure-runtime-retire-policy-declarations
    description: Remove immutable grammar duplicated in the behavior owner.
    include: [src/flext_infra/codemod/duplicate_apply.py]
    find: '(?ms)^    _BUILTIN_NAMES: ClassVar\[frozenset\[str\]\].*?^    _KEEP_ACTION: str = "keep-owner"\n'
    replace: ''
  - id: duplicate-cure-runtime-policy-bindings
    description: Consume the canonical duplicate grammar through the constants facade.
    include: [src/flext_infra/codemod/duplicate_apply.py]
    find: '\bcls\._(BUILTIN_NAMES|PURE_CONSTRUCTORS|TRIVIAL_KINDS|DELETE_ACTION|REBIND_ACTION|BIND_ACTION|KEEP_ACTION)\b'
    replace: 'c.Infra.DUPLICATE_\g<1>'
  - id: duplicate-cure-runtime-retire-builtins-import
    description: Native builtin inventory belongs to the constants declaration owner.
    include: [src/flext_infra/codemod/duplicate_apply.py]
    find: '(?m)^import builtins\n'
    replace: ''
  - id: duplicate-cure-structural-plan-automation-proof
    description: Report the missing semantic proof for structural extraction without claiming a permanent automation prohibition.
    include: [src/flext_infra/codemod/duplicate_apply.py]
    find: '"structural clone: similar but not identical code is never auto-unified"'
    replace: >-
      "structural clone: automated extraction has no proven owner, "
      "captured-binding, and consumer-rebinding contract"

