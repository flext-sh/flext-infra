    description: Tests that build m.Cli.ProcessOptions import the models facade from the tests namespace.
    include: [tests/unit/codegen/test_codegen_make_member_runtime.py]
    find: '(?m)^from tests import c, t, u$'
    replace: 'from tests import c, m, t, u'
  - id: process-options-tests-import-models-c-p-t-u
    distributions: [flext-infra]
    description: Tests that build m.Cli.ProcessOptions import the models facade from the tests namespace.
    include: [tests/unit/codegen/test_workspace_root_setup_submodules.py]
    find: '(?m)^from tests import c, p, t, u$'
    replace: 'from tests import c, m, p, t, u'
  - id: process-options-tests-import-models-u
    distributions: [flext-infra]
    description: Tests that build m.Cli.ProcessOptions import the models facade from the tests namespace.
    include: [tests/unit/workspace/test_binding_install.py]
    find: '(?m)^from tests import u$'
    replace: 'from tests import m, u'
  - id: process-options-tests-import-models-t-u
    distributions: [flext-infra]
    description: Tests that build m.Cli.ProcessOptions import the models facade from the tests namespace.
    include: [tests/unit/workspace/test_flext_worktree_binding.py]
    find: '(?m)^from tests import t, u$'
    replace: 'from tests import m, t, u'
  - id: retire-own-facet-import-shadowed-by-parent
    description: >-
      Drop an own-namespace facet alias that the very next line re-imports from
      the parent package, so the parent's facade is the single binding and no
      self-namespace cycle is introduced. Applies to every project.
    find: '^from (?P<own>\w+(?:\.\w+)*) import (?P<names>(?:\w+, )*\w+), (?P<facet>[ctpmu])\nfrom (?P<parent>\w+(?:\.\w+)*) import (?P=facet)$'
    replace: 'from \g<own> import \g<names>\nfrom \g<parent> import \g<facet>'
    flags: [MULTILINE]
