rules:
- id: rope-declared-source-admission-owner
  pattern: '${receiver}.require_source_module(${value})'
  goal: 'FlextInfraUtilitiesRopeRuntimeTypes.require_source_module(${value})'
  arguments:
    receiver: object=flext_infra._utilities._rope.runtime_types.FlextInfraUtilitiesRopeRuntimeTypes
  imports:
    FlextInfraUtilitiesRopeRuntimeTypes: from flext_infra._utilities._rope import FlextInfraUtilitiesRopeRuntimeTypes
  bindings:
    FlextInfraUtilitiesRopeRuntimeTypes.require_source_module: flext_infra._utilities._rope.runtime_types.FlextInfraUtilitiesRopeRuntimeTypes.require_source_module
- id: rope-native-lexical-scope-admission
  pattern: '${check}(${value}, ${scope})'
  goal: 'FlextInfraUtilitiesRopeRuntimeTypes.native_scope(${value})'
  arguments:
    check: name=builtins.isinstance
    scope: name=flext_infra._protocols.rope_runtime.FlextInfraProtocolsRopeRuntime.RopeScope
  imports:
    FlextInfraUtilitiesRopeRuntimeTypes: from flext_infra._utilities._rope import FlextInfraUtilitiesRopeRuntimeTypes
  bindings:
    FlextInfraUtilitiesRopeRuntimeTypes.native_scope: flext_infra._utilities._rope.runtime_types.FlextInfraUtilitiesRopeRuntimeTypes.native_scope
- id: pydantic-exhaustive-strenum-annotation
  operation: normalize-exhaustive-enum
  pattern: '${literal}[${members}]'
  goal: '${literal}'
  arguments:
    literal: name=typing.Literal
  model_bases: [pydantic.BaseModel]
  scope_kinds: [Class]
- id: constant-source-native-ancestry
  phase: constant-consumers
  pattern: '${receiver}._constant_derives_from'
  goal: 'cls.ConstantSources._constant_derives_from'
  arguments:
    receiver: name=flext_infra._utilities._semantic_cutover.constant_consumers.FlextInfraUtilitiesSemanticConstantConsumers
  bindings:
    cls.ConstantSources._constant_derives_from: flext_infra._utilities._semantic_cutover.FlextInfraUtilitiesSemanticConstantSources._constant_derives_from
  ownership_transfer: [ flext_infra._utilities._semantic_cutover.constant_consumers, FlextInfraUtilitiesSemanticConstantConsumers._constant_derives_from ]
- id: constant-source-native-assignment-inventory
  phase: constant-consumers
  pattern: '${receiver}._constant_declaration_bindings'
  goal: 'cls.ConstantSources._constant_declaration_bindings'
  arguments:
    receiver: name=flext_infra._utilities._semantic_cutover.constant_consumers.FlextInfraUtilitiesSemanticConstantConsumers
  bindings:
    cls.ConstantSources._constant_declaration_bindings: flext_infra._utilities._semantic_cutover.FlextInfraUtilitiesSemanticConstantSources._constant_declaration_bindings
  ownership_transfer: [ flext_infra._utilities._semantic_cutover.constant_consumers, FlextInfraUtilitiesSemanticConstantConsumers._constant_declaration_bindings ]
- id: constant-source-native-assignment-identity
  phase: constant-consumers
  pattern: '${receiver}._binding_statement_matches'
  goal: 'cls.ConstantSources._binding_statement_matches'
  arguments:
    receiver: name=flext_infra._utilities._semantic_cutover.constant_consumers.FlextInfraUtilitiesSemanticConstantConsumers
  bindings:
    cls.ConstantSources._binding_statement_matches: flext_infra._utilities._semantic_cutover.FlextInfraUtilitiesSemanticConstantSources._binding_statement_matches
  ownership_transfer: [ flext_infra._utilities._semantic_cutover.constant_consumers, FlextInfraUtilitiesSemanticConstantConsumers._binding_statement_matches ]
- id: constant-source-native-literal-patterns
  phase: constant-consumers
  pattern: '${receiver}._literal_constant_patterns'
  goal: 'cls.ConstantSources._literal_constant_patterns'
  arguments:
    receiver: name=flext_infra._utilities._semantic_cutover.constant_consumers.FlextInfraUtilitiesSemanticConstantConsumers
  bindings:
    cls.ConstantSources._literal_constant_patterns: flext_infra._utilities._semantic_cutover.FlextInfraUtilitiesSemanticConstantSources._literal_constant_patterns
  ownership_transfer: [ flext_infra._utilities._semantic_cutover.constant_consumers, FlextInfraUtilitiesSemanticConstantConsumers._literal_constant_patterns ]
- id: constant-source-native-import-provenance
  phase: constant-consumers
  pattern: '${receiver}._constant_terminal'
  goal: 'cls.ConstantSources._constant_terminal'
  arguments:
    receiver: name=flext_infra._utilities._semantic_cutover.constant_consumers.FlextInfraUtilitiesSemanticConstantConsumers
  bindings:
    cls.ConstantSources._constant_terminal: flext_infra._utilities._semantic_cutover.FlextInfraUtilitiesSemanticConstantSources._constant_terminal
  ownership_transfer: [ flext_infra._utilities._semantic_cutover.constant_consumers, FlextInfraUtilitiesSemanticConstantConsumers._constant_terminal ]
- id: constant-source-native-module-provider
  phase: constant-consumers
  pattern: '${receiver}._constant_import_module'
  goal: 'cls.ConstantSources._constant_import_module'
  arguments:
    receiver: name=flext_infra._utilities._semantic_cutover.constant_consumers.FlextInfraUtilitiesSemanticConstantConsumers
  bindings:
    cls.ConstantSources._constant_import_module: flext_infra._utilities._semantic_cutover.FlextInfraUtilitiesSemanticConstantSources._constant_import_module
  ownership_transfer: [ flext_infra._utilities._semantic_cutover.constant_consumers, FlextInfraUtilitiesSemanticConstantConsumers._constant_import_module ]
- id: constant-source-native-public-reference
  phase: constant-consumers
  pattern: '${receiver}._constant_reference'
  goal: 'cls.ConstantSources._constant_reference'
  arguments:
    receiver: name=flext_infra._utilities._semantic_cutover.constant_consumers.FlextInfraUtilitiesSemanticConstantConsumers
  bindings:
    cls.ConstantSources._constant_reference: flext_infra._utilities._semantic_cutover.FlextInfraUtilitiesSemanticConstantSources._constant_reference
  ownership_transfer: [ flext_infra._utilities._semantic_cutover.constant_consumers, FlextInfraUtilitiesSemanticConstantConsumers._constant_reference ]
- id: constant-source-native-class-publication
  phase: constant-consumers
  pattern: '${receiver}._constant_public_paths'
  goal: 'cls.ConstantSources._constant_public_paths'
  arguments:
    receiver: name=flext_infra._utilities._semantic_cutover.constant_consumers.FlextInfraUtilitiesSemanticConstantConsumers
  bindings:
    cls.ConstantSources._constant_public_paths: flext_infra._utilities._semantic_cutover.FlextInfraUtilitiesSemanticConstantSources._constant_public_paths
  ownership_transfer: [ flext_infra._utilities._semantic_cutover.constant_consumers, FlextInfraUtilitiesSemanticConstantConsumers._constant_public_paths ]
- id: constant-source-native-provider-identity
  phase: constant-consumers
  pattern: '${receiver}._constant_owner_binding'
  goal: 'cls.ConstantSources._constant_owner_binding'
  arguments:
    receiver: name=flext_infra._utilities._semantic_cutover.constant_consumers.FlextInfraUtilitiesSemanticConstantConsumers
  bindings:
    cls.ConstantSources._constant_owner_binding: flext_infra._utilities._semantic_cutover.FlextInfraUtilitiesSemanticConstantSources._constant_owner_binding
  ownership_transfer: [ flext_infra._utilities._semantic_cutover.constant_consumers, FlextInfraUtilitiesSemanticConstantConsumers._constant_owner_binding ]
method_transfers:
- id: rope-native-module-query-ownership
  destination:
  - flext_infra._utilities._rope.runtime_module_queries
  - FlextInfraUtilitiesRopeRuntimeModuleQueries
  methods:
  - [flext_infra._utilities._rope.runtime_modules, FlextInfraUtilitiesRopeRuntimeModules.native_object_identity]
  - [flext_infra._utilities._rope.runtime_modules, FlextInfraUtilitiesRopeRuntimeModules.lexical_scope]
  - [flext_infra._utilities._rope.runtime_types, FlextInfraUtilitiesRopeRuntimeTypes.require_declared_source_module]
