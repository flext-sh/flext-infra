Infra:
  codegen:
    # NOTE(mro-wkii.17.5, agent implement_manifest): declarative SSOT for deterministic project conformance.
    version: 1

    toolchain:
      # Single-source Python minor line. The environment resolves the newest
      # compatible 3.13 patch; no patch is pinned in generated repositories.
      # Derived as computed fields on ToolchainSpec:
      #   python_required_version -> >=3.13,<3.14
      # uv is supplied by the caller environment and is deliberately not pinned.
      # Dependency floors live in pyproject; uv.lock owns resolved versions.
      python_version: "3.13"
      uv_link_mode: copy
      # Non-Python toolchain pins consumed by generated .mise.toml and CI.
      kubectl_version: "1.32.0"
      helm_version: "3.19.4"
      kind_version: "0.31.0"
      taplo_version: "0.10.0"
      ast_grep_version: "0.45.0"
      gitleaks_version: "8.30.1"
      tokei_version: "14.0.0"
      mise_version: "2026.7.16"
      # The shared mro Dolt ledger is at schema v61; the newest official
      # gastownhall release (1.1.2) only knows v53 and fails preflight with
      # "schema version mismatch". Pin the go-module commit that migrated the
      # ledger. Its `bd version` self-reports the module version (1.1.0), so
      # reported_version feeds the conform preflight gate; the immutable commit
      # stays the installed selector version. The artifact identity is
      # content-proven: checksum is the SHA-256 of the pinned binary, and
      # expected_schema is the ledger schema the binary must know.
      beads:
        selector: go:github.com/steveyegge/beads/cmd/bd
        version: "423afdcb2813e36b2bc4c96b07e0fc3516a34495"
        reported_version: "1.1.0"
        checksum: "452efe298061b448e87f6b09d56a1733a9e23134e103793e742ff90737f66df7"
        expected_schema: 61
        # Machine-wide shared Dolt server facts: every FLEXT ledger on this
        # host routes through this server; a repository-local server is never
        # used. Rendered into .beads/config.yaml and .beads/metadata.json by
        # codegen for ledger owners (workspace-root) and attached standalones
        # (routing only).
        server:
          mode: server
          backend: dolt
          shared_server: true
          host: 127.0.0.1
          port: 3308
          user: root
          auto_commit: "on"

    # Why (ai-hub-qwoc): the ast-grep project contract for every governed
    # repository. A provider manifest may declare sgconfig.yml as a required
    # surface, so it is rendered from here instead of hand-written per repo.
    sgconfig:
      rule_dirs:
        - ast-grep-rules
      test_dirs:
        - ast-grep-rule-tests

    # actions/checkout submodules mode for every generated workflow.
    # 'false' is the safe default: the workflow GITHUB_TOKEN cannot clone
    # sibling PRIVATE repositories, so 'recursive' aborts the job at checkout
    # with "Repository not found" before any code runs. Only projects that
    # really exercise their subprojects in CI opt in through the override map.
    checkout_submodules: "false"
    checkout_submodules_overrides:
      cosmos-docgen: recursive

    github_actions:
      checkout:
        repository: actions/checkout
        version: v7.0.1
        sha: 3d3c42e5aac5ba805825da76410c181273ba90b1
      setup-python:
        repository: actions/setup-python
        version: v7.0.0
        sha: 5fda3b95a4ea91299a34e894583c3862153e4b97
      setup-uv:
        repository: astral-sh/setup-uv
        version: v9.0.0
        sha: c771a70e6277c0a99b617c7a806ffedaca235ff9
      mise:
        repository: jdx/mise-action
        version: v4.1.0
        sha: dba19683ed58901619b14f395a24841710cb4925
      kind:
        repository: helm/kind-action
        version: v1.14.0
        sha: ef37e7f390d99f746eb8b610417061a60e82a6cc
      upload-artifact:
        repository: actions/upload-artifact
        version: v4.6.2
        sha: ea165f8d65b6e75b540449e92b4886f43607fa02
      configure-pages:
        repository: actions/configure-pages
        version: v6.0.0
        sha: 45bfe0192ca1faeb007ade9deae92b16b8254a0d
      upload-pages-artifact:
        repository: actions/upload-pages-artifact
        version: v5.0.0
        sha: fc324d3547104276b827a68afc52ff2a11cc49c9
      deploy-pages:
        repository: actions/deploy-pages
        version: v5.0.0
        sha: cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

    uv_exclude_dependencies:
      # Standalone flext-infra installs flext-tests from its dev group, while
      # flext-tests also declares flext-infra for its own tooling. Scope the
      # official uv exclusion to that transitive self-edge only; every other
      # flext-tests dependency remains part of bootstrap and release validation.
      - project: flext-infra
        package:
          name: flext-tests
        dependencies: [flext-infra]

    providers:
      - name: flext-sh
        organization: flext-sh
        base_url: https://github.com/flext-sh
        branch: 0.12.0-dev
      # External consumer organization: standalone repositories governed by
      # conform through their own config/workspace.yaml (develop-based integration line per cosmos ADR-134).
      - name: datacosmos-br
        organization: datacosmos-br
        base_url: https://github.com/datacosmos-br
        branch: develop
    branch_policy:
      technical_branch_patterns:
        - __dolt_remote_info__
        - dolt/*
        - gh-readonly-queue/*
      # FLEXT branch model: main is the produced release (tagged + published to
      # PyPI) and 0.20.0-dev is the future line on hold. Both must carry the
      # current development line, so both are gated. Parked releases (0.10.0-dev,
      # 0.11.0-dev), snapshots and lane branches are inventoried but never gated.
      governed_branch_patterns:
        - main
        - 0.12.0-dev
        - 0.20.0-dev
    profiles:
      - name: workspace-root
        environment_scope: root
        setup_scope: root-and-members
        execution_scope: root
        discovery_scope: manifest
      - name: standalone
        environment_scope: self
        setup_scope: self
        execution_scope: self
        discovery_scope: none

    make:
      selector: WHAT
      apply_variable: APPLY
      apply_value: Y
      apply_absent_value: N
      ci:
        variable: CI
        value: Y
      workflow:
        # `setup` provisions the environment and runs `git submodule`, which
        # fails inside pre-commit: the hook framework has already moved the
        # working tree, so git reports "cannot be used without a working tree".
        - { verb: setup, apply: false, contexts: [local, ci] }
        - { verb: gen, apply: true, contexts: [local, ci, pre_commit] }
        - { verb: fmt, apply: true, contexts: [local, ci, pre_commit] }
        - { verb: fix, apply: true, contexts: [local, ci, pre_commit] }
        - { verb: check, apply: false, contexts: [local, ci, pre_commit] }
        - { verb: test, apply: false, contexts: [local, ci, pre_commit] }
      bootstrap:
        environment: isolated
        dependency_groups: all
        extras: all
      docs:
        mutable_actions: [generate, fix]
        reports_dir: .reports/docs
        cross_project_relative_link_pattern: '^(?:\.\./)+flext-[a-z0-9-]+(?:/|$)'
      serialization:
        lock_path: .state/flext-infra/make-validation.lock
        single_flight_lock_path: .state/flext-infra/make-single-flight.lock
        # Every apply-guarded verb mutates the checkout, so every one of them is
        # serialized: deps/clean/worktree became guarded once their recipes were
        # found to call _require_apply, and the two lists must stay equal.
        mutation_verbs: [gen, fmt, fix, deps, clean, worktree]
        snapshot_excludes:
          - .state/flext-infra/make-validation.lock
          - .state/flext-infra/make-single-flight.lock
          - .reports
          - .pytest_cache
          - .coverage
        timeout_seconds: 1800
        # Serialized surface: the read-only validators plus every mutation verb,
        # so no two lanes mutate one checkout concurrently.
        verbs: [check, test, gen, fmt, fix, deps, clean, worktree, run]
      verbs:
        - name: help
          default_what: usage
          whats: [usage]
          apply_guarded: false
        - name: setup
          default_what: environment
          whats: [environment]
          apply_guarded: false
        - name: deps
          default_what: check
          whats: [check, lock, upgrade]
          # `lock` and `upgrade` rewrite the lockfile and call _require_apply,
          # so declaring the verb unguarded made them unreachable: the dispatch
          # rejected APPLY=Y while the recipe demanded it.
          apply_guarded: true
          apply_what: upgrade
        - name: build
          default_what: artifacts
          whats: [artifacts]
          apply_guarded: false
        - name: check
          default_what: all
          whats: [all]
          apply_guarded: false
        - name: test
          default_what: all
          whats: [all]
          apply_guarded: false
        - name: fmt
          default_what: check
          whats: [check, all]
          apply_guarded: true
          apply_what: all
        - name: fix
          default_what: check
          whats: [check, all]
          apply_guarded: true
          apply_what: all
        - name: run
          default_what: default
          whats: [default]
          # Custom `_custom_run_*` handlers may mutate under APPLY=Y; they must
          # not take the serialized mutation lock on every invocation.
          apply_guarded: false
          apply_what: default
        - name: status
          default_what: diagnostics
          whats: [diagnostics]
          apply_guarded: false
        - name: docs
          default_what: all
          whats: [all, generate, fix, audit, build, validate]
          apply_guarded: false
        - name: clean
          default_what: generated
          whats: [generated]
          # `clean generated` deletes generated output and calls _require_apply.
          apply_guarded: true
          apply_what: generated
        - name: release
          default_what: status
          whats: [status]
          apply_guarded: false
        - name: gen
          default_what: check
          whats: [check, all]
          apply_guarded: true
          apply_what: all
        - name: worktree
          default_what: list
          whats: [list, add, update, remove]
          # `add`/`update`/`remove` mutate worktrees and call _require_apply;
          # only `list` is read-only, so it stays the default WHAT.
          apply_guarded: true
          apply_what: update
      custom_handler_policy:
        filename: custom.mk
        # Why (ai-hub-qwoc): base_verbs.mk.j2's _run_custom_what/_run_verb_body
        # dispatch every unknown WHAT to a `_custom_<verb>_<what>` handler --
        # that IS the canonical extension mechanism for new WHATs, distinct
        # from pre-/post- lifecycle hooks. The validator must accept both
        # shapes the runtime itself dispatches to, or every project that
        # defines a custom WHAT handler fails `codegen conform` outright.
        target_pattern: "^((pre|post)-(help|setup|deps|build|check|test|fmt|fix|run|status|docs|clean|release|gen|worktree)(-[a-z0-9][a-z0-9-]*)?|_custom_(help|setup|deps|build|check|test|fmt|fix|run|status|docs|clean|release|gen|worktree)_[a-z0-9][a-z0-9_-]*)$"
        allow_public_targets: false
        allow_toolchain_declarations: false
      custom_handler_profile_overrides:
        workspace-root:
          allow_public_targets: true
          allow_toolchain_declarations: true

    # NOTE (mro-jnm1.1 / mro-jnm1.4): SINGLE SSOT for ephemeral/generated
    # resources. VS Code files.exclude/search.exclude (vscode_exclude),
    # files.watcherExclude (watch_exclude), and source_scan.ignored_resources
    # (source_scan_ignore) are DERIVED from this list by CodegenConfigSpec
    # computed fields. Add a tool cache/build dir here only — never in the
    # consuming projections. Ordering reproduces the historical derived maps.
    artifacts:
      - { name: __pycache__, source_scan_ignore: true }
      - { name: __pyrefly_virtual__ }
      - { name: .agents }
      - { name: .beads }
      - { name: .benchmarks }
      # mro-0wuz: archive-not-delete target for the layout engine; the generated
      # .gitignore projection must never track archived loose files.
      - { name: .bkp }
      - { name: .cache, source_scan_ignore: true }
      # mro-j47u: agent worktrees are duplicate repositories, never production input.
      - { name: .claude, source_scan_ignore: true }
      # mro-jnm1.2: gitignore-only entries absorbed from the removed
      # REQUIRED_GITIGNORE_ENTRIES constant; .direnv keeps the legacy vscode/
      # watch/source-scan projections (order-sensitive, after .claude).
      - { name: .direnv, source_scan_ignore: true }
      - { name: .code-review-graph }
      - { name: .codegraph }
      - { name: .dolt }
      - { name: .dolt_dropped_databases }
      - { name: .doltcfg }
      - { name: .hypothesis }
      - { name: .git, gitignore: false, source_scan_ignore: true }
      - { name: .mypy_cache, source_scan_ignore: true }
      - { name: .omo }
      - { name: .pylance_cache, vscode_exclude: false }
      - { name: .pytest_cache, source_scan_ignore: true }
      - { name: .reports, source_scan_ignore: true }
      - { name: .ropeproject }
      - { name: .ruff_cache, source_scan_ignore: true }
      - { name: .scope }
      - { name: .serena }
      - { name: .sisyphus }
      - { name: .state }
      - { name: .superpowers }
      - { name: .trash }
      - { name: .turbo }
      - { name: .venv, source_scan_ignore: true }
      - { name: .venv.* }
      - { name: "*.egg-info", vscode_exclude: false }
      - { name: build, source_scan_ignore: true }
      - { name: dist, source_scan_ignore: true }
      - { name: node_modules, source_scan_ignore: true }
      - { name: site, watch_exclude: false }
      - { name: target }
      - {
          name: .pyrefly_cache,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: .tox,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: conftest.py,
          is_dir: false,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: dist-packages,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: legado,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: site-packages,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: vendor,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: venv,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      # mro-jnm1.2: gitignore-only entries absorbed from the removed
      # REQUIRED_GITIGNORE_ENTRIES constant; they feed no other projection.
      # NOTA: .flext-deps foi removido — o cutover para fontes git eliminou o
      # cache, e o gate de actions proibe qualquer referencia ao mecanismo.
      - {
          name: .flext-sync.lock,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: .sync.lock,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - { name: .planning, vscode_exclude: false, watch_exclude: false }
      - {
          name: skill-create-output,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: .debug-journal.md,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: .mcp.json,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: CLAUDE.local.md,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }

    vscode:
      # Canonical .vscode/settings.json content injected with merge semantics:
      # scalar/list keys are enforced, map keys are union-merged (project entries
      # are preserved). Recursive "**" venv search globs are forbidden: they make
      # the Python Environments locator (pet) walk entire repository trees and
      # hang interpreter discovery on large monorepos.
      scalar_settings:
        files.autoSave: afterDelay
        python.analysis.diagnosticMode: workspace
        python.analysis.typeCheckingMode: strict
        python.defaultInterpreterPath: ${workspaceFolder}/.venv/bin/python
        python.terminal.activateEnvInCurrentTerminal: true
        python.terminal.activateEnvironment: true
        ruff.configurationPreference: filesystemFirst
        ruff.format.preview: true
        ruff.importStrategy: fromEnvironment
        ruff.lint.preview: true
        ruff.nativeServer: on
        shellcheck.useWorkspaceRootAsCwd: true
      list_settings:
        python-envs.workspaceSearchPaths:
          - ./.venv
          - ./*/.venv
      map_union_settings:
        python.analysis.diagnosticSeverityOverrides:
          reportUntypedBaseClass: none
        terminal.integrated.env.linux:
          PATH: ${workspaceFolder}/.venv/bin:${env:PATH}
          VIRTUAL_ENV: ${workspaceFolder}/.venv

    # NOTE(mro-0wuz, epic mro-hzox): declarative project-layout SSOT consumed by
    # the layout engine (codegen/layout.py) and the layout quality gate. Every
    # move/archive/gitignore decision derives from this section — the engine
    # carries zero hardcoded layout knowledge. severity=warning keeps the gate
    # report-only; flipping to error makes violations fail the check pipeline.
    layout:
      version: 1
      severity: warning
      # Archive-not-delete root: archived entries land in <archive_root>/<project>/.
      archive_root: .bkp
      docs_target: docs
      examples_target: examples
      diagrams_target: docs/diagrams
      allow_hidden: true
      canonical_root_files:
        - pyproject.toml
        - Makefile
        - base.mk
        - custom.mk
        - README.md
        - LICENSE
        - CHANGELOG.md
        - CONTRIBUTING.md
        - AGENTS.md
        - CLAUDE.md
        - conftest.py
        - mkdocs.yml
        - uv.lock
      canonical_root_dotfiles:
        - .gitignore
        - .gitattributes
        - .gitmodules
        - .envrc
        - .env.example
        - .python-version
        - .pre-commit-config.yaml
        - .mise.toml
        - .mcp.json
        - .waza.yaml
        - .sonarcloud.properties
        - sonar-project.properties
      canonical_root_dirs:
        - src
        - tests
        - docs
        - examples
        - scripts
        - config
        - ci
        - dist
        - docker
        - dbt_packages
      # Per-project-type extra canonical root files; the profile of a project
      # is resolved by matching its name against profile_project_patterns.
      profile_extra_root_files:
        dbt:
          - dbt_project.yml
          - packages.yml
          - profiles.yml
          - package-lock.yml
        meltano:
          - meltano.yml
          - docker-compose.test.yml
      profile_project_patterns:
        dbt:
          - flext-dbt-*
        meltano:
          - flext-meltano
          - flext-tap-*
      # Root documentation directories moved under <docs_target>/<name>/.
      move_docs_dirs:
        - api-reference
        - architecture
        - guides
        - releases
        - roadmap
        - standards
        - development
        - improvements
        - refactor
        - refactoring
        - maintenance
        - integration
        - adr
        - diagrams
        - api
        - configuration
        - notebook
        - getting-started
        - troubleshooting
        - testing
        - overview
      # Root Markdown documents moved under <docs_target>/.
      move_docs_files:
        - index.md
        - getting-started.md
        - configuration.md
        - development.md
        - architecture.md
        - api-reference.md
        - testing.md
        - troubleshooting.md
        - quick-start.md
        - overview.md
        - integration.md
        - c4-model.md
        - TODOS.md
        - TODO.md
        - REFACTOR_STATUS.md
        - DOCUMENTATION_UPDATE_SUMMARY.md
        - CONTRACT_BUDGET.md
        - DUPLICATION-DETECTION.md
        - HOOK_WARNINGS.md
        - PLUGIN-ARCHITECTURE.md
        - RULE_MODIFICATION.md
        - TESTING_WARNING_SYSTEM.md
        - FLEXT_0_12_BEADS_LANE_REORGANIZATION_PLAN.md
      # Sample data files moved under <examples_target>/.
      move_example_files:
        - directory.ldif
        - oid_schema.ldif
        - config.json.example
      # Diagram sources moved under <diagrams_target>/.
      move_diagram_globs:
        - "*.puml"
      # Root entries archived into <archive_root>/<project>/ (never deleted).
      # Names match files or directories; globs use fnmatch semantics.
      archive_names:
        - $OUT
        - max
        - "=4.0.0"
        - nohup.out
        - poetry.lock
        - history
        - history.json
        - index.md.bak-legacy-docs-layout
        - dbt_project_migrated.yml
        - processed_directory.ldif
        - output.ldif
        - replace_list.yml
        - maintenance_config.yaml
        - rules.json
        - output
        - logs
        - complete_pipeline_results
        - legado
        - __pycache__
        - b-pipeline
        - debug-pipeline
        - exec-pipeline
        - noexec-pipeline
        - probe
        - status-pipeline
      archive_globs:
        - "*.log"
        - pytest_*.txt
        - pyright_errors*.log
        - test_output.txt
        - mro-to59-*
      # Per-project overrides: extra archives (with the matching .gitignore
      # additions), explicit nested moves, and empty-directory archives.
      project_overrides:
        flext-cli:
          archive_names:
            - settings.json
          gitignore_additions:
            - settings.json
        flext-core:
          archive_names:
            - config.json
        flext-tap-oracle-wms:
          archive_names:
            - config.json
          gitignore_additions:
            - config.json
        flext-target-oracle-oic:
          archive_names:
            - config.json
          gitignore_additions:
            - config.json
        flext-oracle-oic:
          archive_names:
            - config.json
          gitignore_additions:
            - config.json
        flext-dbt-ldif:
          moves:
            - { source: profiles/profiles.yml, target: profiles.yml }
          archive_empty_dirs:
            - profiles
        flext-dbt-oracle-wms:
          moves:
            - { source: models/reference.md, target: docs/reference.md }
          archive_empty_dirs:
            - models

    managed_files:
      - path: .github/ci-template/ci.yml
        owner: codegen
        policy: full
      - path: .github/copilot-instructions.md
        owner: codegen
        policy: full
      - path: .github/dependabot.yml
        owner: codegen
        policy: full
      - path: .github/prompts/flext-aggressive-scale-refactor.prompt.md
        owner: codegen
        policy: full
      - path: .github/prompts/flext-strict-jsonvalue-session-continuation.prompt.md
        owner: codegen
        policy: full
      - path: .github/scripts/check-beads-policy.sh
        owner: codegen
        policy: full
      - path: .github/scripts/check-cqrs-compliance.sh
        owner: codegen
        policy: full
      - path: .github/scripts/flext-law-loop.sh
        owner: codegen
        policy: full
      - path: .github/scripts/install-git-hooks.sh
        owner: codegen
        policy: full
      - path: tests/fixtures/ci/docker/alpine.Dockerfile
        owner: codegen
        policy: full
      - path: tests/fixtures/ci/docker/arch.Dockerfile
        owner: codegen
        policy: full
      - path: tests/fixtures/ci/docker/debian.Dockerfile
        owner: codegen
        policy: full
      - path: tests/fixtures/ci/docker/fedora.Dockerfile
        owner: codegen
        policy: full
      - path: tests/fixtures/ci/docker/ubuntu.Dockerfile
        owner: codegen
        policy: full
      - path: .github/workflows/ci-matrix.yml
        owner: codegen
        policy: full
      - path: .github/workflows/ci.yml
        owner: codegen
        policy: full
      - path: .github/workflows/docs.yml
        owner: codegen
        policy: full
      - path: .github/workflows/release.yml
        owner: codegen
        policy: full
      - path: .beads/config.yaml
        owner: codegen
        policy: full
      - path: .beads/metadata.json
        owner: codegen
        policy: full
      - path: .env.example
        owner: codegen
        policy: create-only
      - path: .envrc
        owner: codegen
        policy: full
      # Why (ai-hub-qwoc): codegen owns the ast-grep contract end to end, so the
      # rendered file is fully managed and never hand-edited.
      - path: sgconfig.yml
        owner: codegen
        policy: full
      - path: .gitignore
        owner: codegen
        policy: merge
      - path: .gitmodules
        owner: codegen
        policy: merge
      - path: .mise.toml
        owner: codegen
        policy: full
      - path: .pre-commit-config.yaml
        owner: pre-commit
        policy: full
      - path: .python-version
        owner: codegen
        policy: full
      - path: .vscode/settings.json
        owner: vscode
        policy: merge
      - path: LICENSE
        owner: codegen
        policy: create-only
      - path: Makefile
        owner: make
        policy: full
      - path: README.md
        owner: codegen
        policy: create-only
      - path: base.mk
        owner: make
        policy: delegated
      - path: config/workspace.yaml
        owner: workspace
        policy: manual
      - path: custom.mk
        owner: custom
        policy: create-only
      - path: pyproject.toml
        owner: codegen
        policy: merge

    scaffold:
      build:
        backend: hatchling.build
        requirements: [hatchling]
      project:
        readme: README.md
        supported_licenses: [MIT, Proprietary]
        classifiers:
          - "Development Status :: 4 - Beta"
          - "Intended Audience :: Developers"
          - "Operating System :: OS Independent"
          - "Programming Language :: Python :: 3 :: Only"
          - "Programming Language :: Python :: 3.13"
          - "Topic :: Software Development :: Libraries :: Python Modules"
          - "Typing :: Typed"
        keywords: [clean-architecture, flext, integration, typed]
        dev:
          - actionlint-py>=1.7.12.24
          # The security gate (flext_infra.gates.bandit) runs unconditionally for
          # every project owning src/, so the tool it shells out to must be a
          # declared dev dependency of every generated project.
          - bandit>=1.8
          - flext-tests
          # Floors let uv select the newest compatible tools; no upper cap or
          # exact tool version is imposed by generated project metadata.
          - mypy>=2.3.0
          - pyrefly>=1.1.1
          - pyright>=1.1.411
          - pytest>=9.0.3
          - ruff>=0.15.12
          - rumdl>=0.2.46
          - vulture>=2.16
          - yamlfix>=1.19.1
        dependency_profiles:
          # NOTE: a workspace manifest may declare an upstream distribution;
          # conformance must model that upstream relationship generically.
          - upstream: flext_core
            runtime:
              - flext-core
              - pydantic>=2.13.3
              - pydantic-settings>=2.14.0
            codegen: [flext-infra]
          - upstream: flext_cli
            runtime:
              - flext-cli
              - flext-core
              - pydantic>=2.13.3
              - pydantic-settings>=2.14.0
            codegen: [flext-infra]
      ping_example:
        command_name: ping
        help_text: Return the configured health response.
        success_message: pong
        enabled_default: true
        reply: pong
        disabled_reply: disabled
      # mro-jnm1.2: the first section is merged AFTER the artifact-SSOT derived
      # patterns by the CodegenConfigSpec.gitignore_sections projection
      # (deduplicated, SSOT wins); declare here only what the SSOT cannot
      # express (file globs, secrets, editor/OS noise). Per-project exception
      # fields are added by mro-jnm1.3.
      gitignore_sections:
        - name: "BLOCK EVERYTHING BY DEFAULT"
          profiles: [workspace-root]
          patterns:
            - "/*"
            - "/*/"
            - "!/LICENSE"
        # NOTE: governed member directories are NOT declared here. They are
        # derived from the live workspace topology (`config/workspace.yaml`
        # members) by conform._render_gitignore, so declaring a member in the
        # manifest is the single source that makes it trackable. A hardcoded
        # name glob here would be a second, silently-diverging source.
        - name: "WHITELIST: Workspace Directories"
          profiles: [workspace-root]
          patterns:
            - "!docker/"
            - "!docs/"
            - "!examples/"
            - "!.github/"
            - "!src/"
            - "!tests/"
            - "!typings/"
            - "!libs/"
            - "!.vscode/"
            - "!.code-review-graph/"
            - "!.claude/"
            - "!.claude-plugin/"
            - "!/config/"
            - "!.claude/CLAUDE.md"
            - "!.claude/settings.json"
            - "!.claude/settings.local.json"
            - "!.agents/"
            - "!.agents/**"
            - ".agents/skills/*/report.json"
        - name: "Workspace topology manifest"
          profiles: [workspace-root]
          patterns:
            - "!/config/workspace.yaml"
        - name: "Dispatcher-based command surface (Make SSOT)"
          profiles: [workspace-root]
          patterns:
            - "!scripts/"
            - "!scripts/cmd/"
            - "!scripts/cmd/**"
            - "scripts/*.py"
            - "scripts/*.sh"
            - "scripts/*.md"
            - "scripts/maintenance/"
            - "!scripts/dispatch.py"
            - "!scripts/__init__.py"
        - name: "TRACK: Beads team config; keep Dolt data, runtime state, and JSONL exports local."
          profiles: [workspace-root]
          patterns:
            - "!.beads/"
            - ".beads/*"
            - "!.beads/config.yaml"
            # metadata.json is what bd reads to resolve the ledger. Without it
            # bd warns "no beads configuration found" and silently falls back
            # to the default database, so beads created from a clean clone land
            # in a throwaway store (mro-9wv8). In workspace-root the file holds
            # only facts already declared in the generated config.yaml
            # (backend/dolt_mode/dolt_database) -- no secret and no per-machine
            # value -- so it is safe to track. Members keep it ignored: their
            # embedded-mode file carries a per-machine project_id UUID.
            - "!.beads/metadata.json"
        - name: "Python configuration"
          profiles: [workspace-root]
          patterns:
            - "!pyproject.toml"
            - "!uv.lock"
            - "!.taplo.toml"
            - "!pyrefly.toml"
            - "!poetry.lock"
            - "!uv.lock"
            - "!ruff-shared.toml"
            - "!uv.lock"
        - name: "mise toolchain pinning"
          profiles: [workspace-root]
          patterns:
            - "!.mise.toml"
            - "!.default-python-packages"
            - "!.python-version"
        - name: "Docker configuration"
          profiles: [workspace-root]
          patterns:
            - "!.dockerignore"
        - name: "Build and automation"
          profiles: [workspace-root]
          patterns:
            - "!Makefile"
            - "!Makefile.flext-docker"
            - "!*.mk"
        - name: "Documentation"
          profiles: [workspace-root]
          patterns:
            - "!README.md"
            - "!AGENTS.md"
            - "!AGENTS.md"
            - "!codex.md"
            - "!.markdownlint.json"
            - "!.markdownlintignore"
            - "!.shellcheckrc"
        - name: "Git configuration"
          profiles: [workspace-root]
          patterns:
            - "!.gitignore"
            - "!.gitmodules"
            - "!.gitattributes"
        - name: "direnv environment (no secrets \u2014 venv activation only)"
          profiles: [workspace-root]
          patterns:
            - "!.envrc"
            - "!.envrc.local"
        - name: "Environment templates (NOT .env - keep secrets out!)"
          profiles: [workspace-root]
          patterns:
            - "!.env.test"
            - "!.env.example"
            - "!.env.template"
        - name: "WHITELIST: Contents Inside Allowed Directories"
          profiles: [workspace-root]
          patterns:
            - "!docker/**"
            - "!docs/**"
            - "!examples/**"
            - "!.github/**"
            - "!src/**"
            - "!tests/**"
            - "!typings/**"
            - "!libs/**"
            - "!.vscode/**"
            - "!.claude/**"
            - "!.claude-plugin/**"
        # NOTE: member contents are emitted by the same derived section as the
        # member directories themselves (see the note above), so both come from
        # the live workspace topology and can never diverge from each other.
        - name: "BLOCK: AI/Agent Local Data (NEVER track these)"
          patterns:
            - ".claude/*"
            - "!.agents/skills/"
            - "!.agents/skills/**"
        - name: "Skill scan reports (transient, regenerated by skill_validate.py)"
          patterns:
            - ".agents/skills/*/report.json"
        - name: "Aider AI data"
          patterns:
            - ".aider/"
            - ".aider.conf.yml"
            - ".aider.chat.history.md"
            - "**/.aider/"
        - name: "Other AI assistants"
          patterns:
            - ".cursor/"
            - ".copilot/"
            - ".codeium/"
        - name: "Oracle dump files"
          patterns:
            - "**/*.dmp"
            - "**/*.DMP"
        - name: "Oracle logs"
          patterns:
            - "**/*.trc"
            - "**/*.aud"
        - name: "Oracle wallet files"
          patterns:
            - "**/cwallet.sso"
            - "**/ewallet.p12"
            - "**/tnsnames.ora"
            - "**/sqlnet.ora"
        - name: "Oracle test/reference data directories"
          patterns:
            - "**/oracle_data/"
            - "**/oracle_dump/"
            - "**/oracle_export/"
            - "**/oracle_import/"
            - "**/expdp_*/"
            - "**/impdp_*/"
        - name: "Python artifacts inside allowed directories"
          patterns:
            - "**/__pycache__/"
            - "**/*.pyc"
            - "**/*.pyo"
            - "**/*.pyd"
            - "**/*.so"
            - "**/*.egg"
            - "**/*.egg-info/"
            - "**/dist/"
            - "**/build/"
            - "!scripts/cmd/build/"
            - "**/.eggs/"
        - name: "Skill validation temporary reports"
          patterns:
            - "baseline.json"
            - "report.json"
            - "fix-report.json"
            - "*.rej"
        - name: "Python caches inside allowed directories"
          patterns:
            - "**/.mypy_cache/"
            - "**/.ruff_cache/"
            - "**/.pytest_cache/"
            - "**/.hypothesis/"
            - "**/.tox/"
            - "**/.nox/"
            - "**/.benchmarks/"
        - name: "Coverage reports inside allowed directories"
          patterns:
            - "**/htmlcov/"
            - "**/.coverage"
            - "**/coverage.json"
            - "**/.coverage.*"
            - "**/coverage.xml"
            - "**/*.cover"
        - name: "Virtual environments inside allowed directories (should never be committed)"
          patterns:
            - "**/.venv/"
            - "**/venv/"
            - "**/env/"
            - "**/ENV/"
            - "**/.virtualenv/"
        - name: "Native build artifacts inside allowed directories"
          patterns:
            - "**/*.exe"
            - "**/*.exe~"
            - "**/*.dll"
            - "**/*.dylib"
            - "**/*.test"
            - "**/*.out"
            - "vendor/"
        - name: "Node.js inside allowed directories"
          patterns:
            - "**/node_modules/"
            - "**/npm-debug.log"
            - "**/yarn-error.log"
            - "**/.npm/"
            - "**/.yarn/"
        - name: "IDE and editor files inside allowed directories"
          patterns:
            - "**/.idea/"
            - "**/*.iml"
            - "**/.vscode/*.code-workspace"
            - "**/.vscode/internal.invalid.json"
            - "**/*.swp"
            - "**/*.swo"
            - "**/*~"
            - "**/.*.sw?"
        - name: "OS files inside allowed directories"
          patterns:
            - "**/.DS_Store"
            - "**/Thumbs.db"
            - "**/Desktop.ini"
        - name: "Temporary and log files inside allowed directories"
          patterns:
            - "**/*.log"
            - "**/*.tmp"
            - "**/*.temp"
            - "**/tmp/"
            - "**/temp/"
            - "**/.tmp/"
        - name: "Build and quality tool artifacts inside allowed directories"
          patterns:
            - "**/.qlty/"
            - "**/.meltano/"
            - "**/.serena/"
        - name: "Backup files inside allowed directories"
          patterns:
            - "**/*.bak"
            - "**/*.bkp"
            - "**/*.bkp?"
            - "**/*.backup"
            - "**/*.orig"
            - "**/*_backup"
            - "**/*_backup_*"
            - "**/*.md.backup"
            - "**/archived/"
        - name: "Autofix rejection artifacts (run_skill_autofix.sh rollback output)"
          patterns:
            - "**/*.rej-*.bak"
            - "**/*.rej-*.rej"
        - name: "Database files inside allowed directories"
          patterns:
            - "**/*.db"
            - "**/*.sqlite"
            - "**/*.sqlite3"
        - name: "Compiled files inside allowed directories"
          patterns:
            - "**/*.class"
            - "**/*.o"
            - "**/*.obj"
            - "**/*.a"
        - name: "Archive files inside allowed directories (usually shouldn't be in git)"
          patterns:
            - "**/*.zip"
            - "**/*.tar"
            - "**/*.tar.gz"
            - "**/*.tgz"
            - "**/*.rar"
            - "**/*.7z"
        - name: "Environment files with actual secrets"
          patterns:
            - ".env"
            - ".internal.invalid"
            - ".env.production"
            - ".env.development"
            - "**/.env"
        - name: "Credentials and keys"
          patterns:
            - "*.key"
            - "*.pem"
            - "*.p12"
            - "*.pfx"
            - "credentials.json"
            - "**/credentials.json"
            - "secrets.yaml"
            - "secrets.yml"
            - "**/.credentials*"
        - name: "ALLOW: Preserve Empty Directories"
          patterns:
            - "!**/.gitkeep"
        - name: "Ensure these are NEVER committed, even if explicitly added"
          patterns:
            - ".milvus/"
            - ".claude-data/"
            - ".devcontainer/.host-gitsettings"
            - ".devcontainer/.env"
            - ".github/*.rej"
        - name: "--- codegen conform: tracked owner inputs ---"
          patterns:
            - "!base.mk"
        # This final policy re-ignores .beads/* for every profile, so the
        # workspace-root exception for metadata.json is re-stated in a
        # workspace-root-scoped section immediately after it (last rule wins).
        # Members are deliberately NOT covered: their embedded-mode
        # metadata.json carries a per-machine project_id UUID.
        - name: "FINAL BEADS TRACKING POLICY"
          patterns:
            - "!.beads/"
            - ".beads/*"
            - ".beads/.*"
            - "!.beads/config.yaml"
            - ".beads/proxieddb/"
            - ".dolt/"
            - "*.db"
            - ".beads-credential-key"
            - ".worktrees/"
            - "legado/"
        - name: "Beads ledger identity (workspace-root only; see mro-9wv8)"
          profiles: [workspace-root]
          patterns:
            - "!.beads/metadata.json"
        - name: "codegen module-standardizer reject artifacts (ADR-005 \u00a79)"
          patterns:
            - "*.tpl.rej"
        - name: "--- codegen conform: generated runtime ignores ---"
          patterns:
            - ".direnv/"
            - ".reports/"
            - ".venv/"
            - ".bin/"
            - ".tools/"
            - "__pycache__/"
            - "base.mk"
            - "!.pre-commit-config.yaml"
    templates:
      root: project
      entries:
        - source: base/.github/ci-template/ci.yml.j2
          destination: .github/ci-template/ci.yml
          profiles: [workspace-root]
          delegate: render
          overwrite: false
        - source: base/.github/copilot-instructions.md.j2
          destination: .github/copilot-instructions.md
          profiles: [workspace-root]
          delegate: render
          overwrite: false
        - source: base/.github/dependabot.yml.j2
          destination: .github/dependabot.yml
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/.github/prompts/flext-aggressive-scale-refactor.prompt.md.j2
          destination: .github/prompts/flext-aggressive-scale-refactor.prompt.md
          profiles: [workspace-root]
          delegate: render
          overwrite: false
        - source: base/.github/prompts/flext-strict-jsonvalue-session-continuation.prompt.md.j2
          destination: .github/prompts/flext-strict-jsonvalue-session-continuation.prompt.md
          profiles: [workspace-root]
          delegate: render
          overwrite: false
        - source: base/.github/scripts/check-beads-policy.sh.j2
          destination: .github/scripts/check-beads-policy.sh
          profiles: [workspace-root]
          delegate: render
          overwrite: false
        - source: base/.github/scripts/check-cqrs-compliance.sh.j2
          destination: .github/scripts/check-cqrs-compliance.sh
          profiles: [workspace-root]
          delegate: render
          overwrite: false
        - source: base/.github/scripts/flext-law-loop.sh.j2
          destination: .github/scripts/flext-law-loop.sh
          profiles: [workspace-root]
          delegate: render
          overwrite: false
        - source: base/.github/scripts/install-git-hooks.sh.j2
          destination: .github/scripts/install-git-hooks.sh
          profiles: [workspace-root]
          delegate: render
          overwrite: false
        # Multi-environment CI base: reusable ci-matrix workflow + per-distro
        # clean-machine images validating bootstrap and make verbs everywhere.
        - source: base/.github/workflows/ci-matrix.yml.j2
          destination: .github/workflows/ci-matrix.yml
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/.github/workflows/ci.yml.j2
          destination: .github/workflows/ci.yml
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/.pre-commit-config.yaml.j2
          destination: .pre-commit-config.yaml
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/README.md.j2
          destination: README.md
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/LICENSE.j2
          destination: LICENSE
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/gitignore.j2
          destination: .gitignore
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        # Why (ai-hub-qwoc): a provider manifest may declare sgconfig.yml as a
        # required surface. Without a generator it was hand-written in one
        # repository and absent in another, so provider discovery failed closed
        # with "missing declared file: sgconfig.yml". Rendering it from the SSOT
        # gives every governed repository the same ast-grep contract.
        - source: base/sgconfig.yml.j2
          destination: sgconfig.yml
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/python-version.j2
          destination: .python-version
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/env.example.j2
          destination: .env.example
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/.mise.toml.j2
          destination: .mise.toml
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        # Ledger routing config: rendered only for the workspace root (owned
        # ledger) and marker-attached standalones (routing-only); the engine
        # planner skips every other profile/class (mro-z89e governance).
        - source: base/beads-config.yaml.j2
          destination: .beads/config.yaml
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        # Ledger-resolution marker: bd binds a checkout to its Dolt database
        # through this file and `bd init` never writes it, so a clone carrying
        # only config.yaml fell back to the default "beads" database (mro-9wv8).
        - source: base/beads-metadata.json.j2
          destination: .beads/metadata.json
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/.envrc.j2
          destination: .envrc
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/.github/workflows/docs.yml.j2
          destination: .github/workflows/docs.yml
          profiles: [workspace-root]
          delegate: render
          overwrite: false
        - source: base/.github/workflows/release.yml.j2
          destination: .github/workflows/release.yml
          profiles: [workspace-root]
          delegate: render
          overwrite: false
        - source: base/tests/fixtures/ci/docker/ubuntu.Dockerfile.j2
          destination: tests/fixtures/ci/docker/ubuntu.Dockerfile
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/tests/fixtures/ci/docker/debian.Dockerfile.j2
          destination: tests/fixtures/ci/docker/debian.Dockerfile
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/tests/fixtures/ci/docker/fedora.Dockerfile.j2
          destination: tests/fixtures/ci/docker/fedora.Dockerfile
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/tests/fixtures/ci/docker/alpine.Dockerfile.j2
          destination: tests/fixtures/ci/docker/alpine.Dockerfile
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/tests/fixtures/ci/docker/arch.Dockerfile.j2
          destination: tests/fixtures/ci/docker/arch.Dockerfile
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        # NOTE(mro-wkii.17.11, agent codex): workspace topology owns git submodules;
        # environment activation is owned by mise + the generated Makefile.
        - source: base/gitmodules.j2
          destination: .gitmodules
          profiles: [workspace-root]
          delegate: render
          overwrite: true
        - source: base/Makefile.j2
          destination: Makefile
          # The generic conform engine is the single Makefile owner for every
          # profile; workspace-root fan-out is selected inside this template.
          # Fully generated (overwrite: true): a project never owns a verb.
          # `overwrite: false` froze every existing Makefile at the shape it
          # had when first written, so new builtin verbs never reached the
          # fleet. Customisation lives exclusively in custom.mk, through
          # pre-/post-verb hooks, and may not redefine a verb.
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: true
        - source: base/custom.mk.j2
          destination: custom.mk
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/pyproject.toml.j2
          destination: pyproject.toml
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/config/workspace.yaml.j2
          destination: config/workspace.yaml
          profiles: [workspace-root, workspace-member, standalone]
          delegate: manifest
          overwrite: false
        - source: base/src/__init__.py.j2
          destination: "src/{package_name}/__init__.py"
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/src/api.py.j2
          destination: "src/{package_name}/api.py"
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/src/cli.py.j2
          destination: "src/{package_name}/cli.py"
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/src/__main__.py.j2
          destination: "src/{package_name}/__main__.py"
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/src/base.py.j2
          destination: "src/{package_name}/base.py"
          profiles: [workspace-root, workspace-member, standalone]
