Infra:
  codegen:
    # NOTE(mro-wkii.17.5, agent implement_manifest): declarative SSOT for deterministic project conformance.
    version: 1

    toolchain:
      # Single-source Python minor line. The environment resolves the newest
      # compatible 3.13 patch; no patch is pinned in generated repositories.
      # Derived as computed fields on ToolchainSpec:
      #   python_required_version -> >=3.13,<3.14
      # uv is supplied by the caller environment and is deliberately not pinned.
      # Dependency floors live in pyproject; uv.lock owns resolved versions.
      python_version: "3.13"
      uv_link_mode: copy
      # Non-Python toolchain pins consumed by generated .mise.toml and CI.
      kubectl_version: "1.32.0"
      helm_version: "3.19.4"
      kind_version: "0.31.0"
      taplo_version: "0.10.0"
      ast_grep_version: "0.45.0"
      gitleaks_version: "8.30.1"
      qlty:
        selector: github:qltysh/qlty
        version: "0.640.0"
        reported_version: "0.640.0"
      mise_version: "2026.7.16"
      # The shared mro Dolt ledger is at schema v61; the newest official
      # gastownhall release (1.1.2) only knows v53 and fails preflight with
      # "schema version mismatch". Pin the go-module commit that migrated the
      # ledger. Its `bd version` self-reports the module version (1.1.0), so
      # reported_version feeds the conform preflight gate; the immutable commit
      # stays the installed selector version. The artifact identity is
      # content-proven: checksum is the SHA-256 of the pinned binary, and
      # expected_schema is the ledger schema the binary must know.
      beads:
        selector: go:github.com/steveyegge/beads/cmd/bd
        version: "423afdcb2813e36b2bc4c96b07e0fc3516a34495"
        reported_version: "1.1.0"
        checksum: "452efe298061b448e87f6b09d56a1733a9e23134e103793e742ff90737f66df7"
        expected_schema: 61
        # Machine-wide shared Dolt server facts: every FLEXT ledger on this
        # host routes through this server; a repository-local server is never
        # used. Rendered into .beads/config.yaml by codegen for ledger owners
        # (workspace-root) and attached standalones (routing only).
        server:
          mode: server
          shared_server: true
          host: 127.0.0.1
          port: 3308
          user: root
          auto_commit: "on"

    # Why (ai-hub-qwoc): the ast-grep project contract for every governed
    # repository. A provider manifest may declare sgconfig.yml as a required
    # surface, so it is rendered from here instead of hand-written per repo.
    sgconfig:
      rule_dirs:
        - ast-grep-rules
      test_dirs:
        - ast-grep-rule-tests

    # actions/checkout submodules mode for every generated workflow.
    # 'false' is the safe default: the workflow GITHUB_TOKEN cannot clone
    # sibling PRIVATE repositories, so 'recursive' aborts the job at checkout
    # with "Repository not found" before any code runs. Only projects that
    # really exercise their subprojects in CI opt in through the override map.
    checkout_submodules: "false"
    checkout_submodules_overrides:
      cosmos-docgen: recursive

    github_actions:
      checkout:
        repository: actions/checkout
        version: v7.0.1
        sha: 3d3c42e5aac5ba805825da76410c181273ba90b1
      setup-python:
        repository: actions/setup-python
        version: v7.0.0
        sha: 5fda3b95a4ea91299a34e894583c3862153e4b97
      setup-uv:
        repository: astral-sh/setup-uv
        version: v9.0.0
        sha: c771a70e6277c0a99b617c7a806ffedaca235ff9
      mise:
        repository: jdx/mise-action
        version: v4.1.0
        sha: dba19683ed58901619b14f395a24841710cb4925
      kind:
        repository: helm/kind-action
        version: v1.14.0
        sha: ef37e7f390d99f746eb8b610417061a60e82a6cc
      upload-artifact:
        repository: actions/upload-artifact
        version: v4.6.2
        sha: ea165f8d65b6e75b540449e92b4886f43607fa02
      configure-pages:
        repository: actions/configure-pages
        version: v6.0.0
        sha: 45bfe0192ca1faeb007ade9deae92b16b8254a0d
      upload-pages-artifact:
        repository: actions/upload-pages-artifact
        version: v5.0.0
        sha: fc324d3547104276b827a68afc52ff2a11cc49c9
      deploy-pages:
        repository: actions/deploy-pages
        version: v5.0.0
        sha: cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

    uv_exclude_dependencies:
      # Standalone flext-infra installs flext-tests from its dev group, while
      # flext-tests also declares flext-infra for its own tooling. Scope the
      # official uv exclusion to that transitive self-edge only; every other
      # flext-tests dependency remains part of bootstrap and release validation.
      - project: flext-infra
        package:
          name: flext-tests
        dependencies: [flext-infra]

    providers:
      - name: flext-sh
        organization: flext-sh
        base_url: https://github.com/flext-sh
        branch: 0.12.0-dev
      # External consumer organization: standalone repositories governed by
      # conform through their own config/workspace.yaml (develop-based integration line per cosmos ADR-134).
      - name: datacosmos-br
        organization: datacosmos-br
        base_url: https://github.com/datacosmos-br
        branch: develop
    default_provider: flext-sh
    branch_policy:
      production_branch: main
      technical_branch_patterns:
        - __dolt_remote_info__
        - dolt/*
        - gh-readonly-queue/*
      # Extra governed lines only. Production and every provider integration
      # branch are derived automatically from their owning rows above.
      additional_governed_branch_patterns:
        - 0.20.0-dev
    profiles:
      - name: workspace-root
        environment_scope: root
        setup_scope: root-and-members
        execution_scope: root
        discovery_scope: manifest
      - name: workspace-member
        environment_scope: root
        setup_scope: root
        execution_scope: self
        discovery_scope: root
      - name: standalone
        environment_scope: self
        setup_scope: self
        execution_scope: self
        discovery_scope: none

    make:
      executor:
        group: workspace
        route: serialize-make
      selector: WHAT
      apply_variable: APPLY
      apply_value: Y
      apply_absent_value: N
      input_environment_prefix: FLEXT_MAKE_INPUT_
      ci:
        variable: CI
        value: Y
        target_scope: self
      bootstrap:
        environment: isolated
        dependency_groups: all
        extras: all
      docs:
        reports_dir: .reports/docs
        cross_project_relative_link_pattern: '^(?:\.\./)+flext-[a-z0-9-]+(?:/|$)'
      test:
        reports_dir: .reports/tests
      check:
        gates:
          - { id: lint, profiles: [safe-execution] }
          - { id: pyrefly, profiles: [safe-execution] }
          - { id: mypy, profiles: [safe-execution] }
          - { id: pyright, profiles: [safe-execution] }
          - { id: silent-failure }
          - { id: security }
          - { id: markdown }
          - { id: actionlint }
          - { id: canonical-alias }
          - { id: runtime-census }
          - { id: namespace }
          - { id: layout }
          - { id: tier-whitelist }
          - id: smells
            execution_scope: workspace
            command:
              - qlty
              - --no-upgrade-check
              - smells
              - --all
              - --sarif
              - --include-tests
              - --no-snippets
              - --quiet
      serialization:
        lock_path: .state/flext-infra/make-validation.lock
        snapshot_excludes:
          - .state/flext-infra/make-validation.lock
          - .reports
          - .pytest_cache
          - .coverage
        timeout_seconds: 1800
      inputs:
        - { name: projects, variables: [PROJECT, PROJECTS], codec: project-selection }
        - { name: gates, variables: [CHECK_GATES], codec: gate-selection }
        - { name: fail-fast, variables: [FAIL_FAST], codec: boolean }
        - { name: dependency, variables: [DEPENDENCY], codec: distribution-name }
        - { name: branch, variables: [BRANCH], codec: branch }
        - { name: base, variables: [BASE], codec: branch }
        - { name: args, variables: [ARGS], codec: argv }
        - { name: file, variables: [FILE], codec: path-nodeid }
        - { name: match, variables: [MATCH], codec: expression }
        - { name: workspace, variables: [WORKSPACE], codec: path }
        - { name: diag, variables: [DIAG], codec: boolean }
        - { name: verbose, variables: [VERBOSE], codec: boolean }
      operations:
        - { name: lifecycle.help, executor: bootstrap, scope: self, requires: [managed] }
        - name: environment.setup
          executor: bootstrap
          scope: environment-owner
          consistency: single-flight
          mutation: always
          requires: [managed, git]
        - name: dependencies.manage
          executor: runtime
          scope: governed-selection
          consistency: single-flight
          mutation: apply
          requires: [managed, environment, package]
          inputs: [projects, dependency]
        - name: package.build
          executor: runtime
          scope: governed-selection
          consistency: single-flight
          mutation: always
          requires: [managed, environment, package]
          inputs: [projects]
        - name: quality.check
          executor: runtime
          scope: governed-selection
          consistency: single-flight
          requires: [managed, environment]
          inputs: [projects, gates, fail-fast]
        - name: quality.test
          executor: runtime
          scope: governed-selection
          consistency: single-flight
          requires: [managed, environment]
          inputs: [projects, file, match, fail-fast, diag, verbose]
        - name: quality.format
          executor: runtime
          scope: governed-selection
          consistency: single-flight
          mutation: apply
          requires: [managed, environment]
          inputs: [projects]
        - name: quality.fix
          executor: runtime
          scope: governed-selection
          consistency: single-flight
          mutation: apply
          requires: [managed, environment]
          inputs: [projects]
        - name: application.run
          executor: runtime
          scope: self
          requires: [managed, environment, package]
          inputs: [args]
        - name: environment.status
          executor: runtime
          scope: self
          requires: [managed, environment, git]
        - name: documentation.manage
          executor: runtime
          scope: governed-selection
          consistency: single-flight
          mutation: apply
          requires: [managed, environment]
          inputs: [projects]
        - name: artifacts.clean
          executor: bootstrap
          scope: governed-selection
          consistency: single-flight
          mutation: apply
          requires: [managed]
        - name: release.status
          executor: runtime
          scope: self
          consistency: single-flight
          requires: [managed, environment, git]
        - name: conformance.project
          executor: runtime
          scope: governed-selection
          consistency: single-flight
          requires: [managed, environment]
        - name: generation.project
          executor: generation
          scope: governed-selection
          consistency: single-flight
          mutation: apply
          requires: [managed, environment]
        - name: worktree.manage
          executor: runtime
          scope: self
          consistency: single-flight
          mutation: apply
          requires: [managed, git]
          inputs: [workspace, branch, base]
        - name: script.dispatch
          executor: script
          scope: self
          consistency: single-flight
          mutation: apply
          requires: [managed, environment, script]
          inputs: [args]
      verbs:
        - name: help
          operation: lifecycle.help
          handlers:
            - what: usage
              default: true
        - name: setup
          operation: environment.setup
          handlers:
            - what: environment
              default: true
              workflow: { order: 1, contexts: [local, ci, pre_commit] }
        - name: deps
          operation: dependencies.manage
          handlers:
            - what: check
              default: true
            - what: lock
              apply_policy: required
            - what: upgrade
              apply_policy: required
        - name: build
          operation: package.build
          handlers:
            - what: artifacts
              default: true
        - name: check
          operation: quality.check
          handlers:
            - what: all
              default: true
              workflow: { order: 5, contexts: [local, ci, pre_commit] }
        - name: test
          operation: quality.test
          handlers:
            - what: all
              default: true
              workflow: { order: 6, contexts: [local, ci, pre_commit] }
        - name: fmt
          operation: quality.format
          handlers:
            - what: check
              default: true
            - what: all
              apply_policy: required
              apply_default: true
              workflow: { order: 3, contexts: [local, ci, pre_commit] }
        - name: fix
          operation: quality.fix
          handlers:
            - what: all
              default: true
              apply_policy: required
              apply_default: true
              workflow: { order: 4, contexts: [local, ci, pre_commit] }
        - name: run
          operation: application.run
          handlers:
            - what: default
              default: true
        - name: status
          operation: environment.status
          handlers:
            - what: diagnostics
              default: true
        - name: docs
          operation: documentation.manage
          handlers:
            - what: all
              default: true
              apply_policy: optional
            - what: generate
              apply_policy: optional
            - what: fix
              apply_policy: optional
            - what: audit
            - what: build
            - what: validate
        - name: clean
          operation: artifacts.clean
          handlers:
            - what: generated
              default: true
              apply_policy: required
        - name: release
          operation: release.status
          handlers:
            - what: status
              default: true
        - name: conform
          operation: conformance.project
          handlers:
            - what: all
              default: true
        - name: gen
          operation: generation.project
          handlers:
            - what: all
              default: true
              apply_policy: required
              apply_default: true
              workflow: { order: 2, contexts: [local, ci, pre_commit] }
        - name: worktree
          operation: worktree.manage
          handlers:
            - what: list
              default: true
            - what: add
              apply_policy: required
              required_inputs: [branch, base]
            - what: update
              apply_policy: required
              required_inputs: [branch, base]
            - what: remove
              apply_policy: required
              required_inputs: [branch]
    cli_transactions:
      - routes:
          - check:fix-enforcement
          - check:fix-pyrefly-settings
          - codegen:auto-fix
          - codegen:consolidate
          - codegen:init
          - codegen:new
          - codegen:pipeline
          - codegen:py-typed
          - codegen:scaffold
          - codegen:version-file
          - deps:extra-paths
          - deps:modernize
          - refactor:accessor-migrate
          - refactor:apply-renames
          - refactor:migrate-mro
          - refactor:modernize-cli
          - refactor:modernize-logging
          - refactor:modernize-patterns
          - refactor:modernize-pydantic
          - refactor:modernize-result-di
          - refactor:namespace-enforce
          - refactor:wrapper-root-namespace
        apply_option: --apply
        check_options: [--check, --check-only]
        strip_options: [--check, --check-only, --dry-run]
        path_options:
          - { name: --workspace, workspace_root: true }
          - { name: --root, workspace_root: true, scope: true }
          - { name: --output-root, scope: true }
          - { name: --project, scope: true, relative_to: workspace }
          - { name: --projects, scope: true, relative_to: workspace }
    # NOTE (mro-jnm1.1 / mro-jnm1.4): SINGLE SSOT for ephemeral/generated
    # resources. VS Code files.exclude/search.exclude (vscode_exclude),
    # files.watcherExclude (watch_exclude), and source_scan.ignored_resources
    # (source_scan_ignore) are DERIVED from this list by CodegenConfigSpec
    # computed fields. Add a tool cache/build dir here only — never in the
    # consuming projections. Ordering reproduces the historical derived maps.
    artifacts:
      - { name: __pycache__, source_scan_ignore: true, cleanup: recursive }
      - { name: __pyrefly_virtual__, cleanup: root }
      - { name: .agents }
      - { name: .beads }
      - { name: .benchmarks }
      # mro-0wuz: archive-not-delete target for the layout engine; the generated
      # .gitignore projection must never track archived loose files.
      - { name: .bkp }
      - { name: .cache, source_scan_ignore: true }
      # mro-j47u: agent worktrees are duplicate repositories, never production input.
      - { name: .claude, source_scan_ignore: true }
      # mro-jnm1.2: gitignore-only entries absorbed from the removed
      # REQUIRED_GITIGNORE_ENTRIES constant; .direnv keeps the legacy vscode/
      # watch/source-scan projections (order-sensitive, after .claude).
      - { name: .direnv, source_scan_ignore: true }
      - { name: .code-review-graph }
      - { name: .codegraph }
      - { name: .dolt }
      - { name: .dolt_dropped_databases }
      - { name: .doltcfg }
      - { name: .hypothesis }
      - { name: .git, gitignore: false, source_scan_ignore: true }
      - { name: .mypy_cache, source_scan_ignore: true, cleanup: root }
      - { name: .omo }
      - { name: .pylance_cache, vscode_exclude: false }
      - { name: .pytest_cache, source_scan_ignore: true, cleanup: root }
      - { name: .reports, source_scan_ignore: true }
      - { name: .ropeproject }
      - { name: .ruff_cache, source_scan_ignore: true, cleanup: root }
      - { name: .scope }
      - { name: .serena }
      - { name: .sisyphus }
      - { name: .state }
      - { name: .superpowers }
      - { name: .trash }
      - { name: .turbo }
      - { name: .venv, source_scan_ignore: true }
      - { name: .venv.* }
      - { name: "*.egg-info", vscode_exclude: false }
      - { name: .coverage, is_dir: false, cleanup: root }
      - { name: build, source_scan_ignore: true, cleanup: root }
      - { name: dist, source_scan_ignore: true, cleanup: root }
      - { name: htmlcov, cleanup: root }
      - { name: node_modules, source_scan_ignore: true }
      - { name: site, watch_exclude: false }
      - { name: target }
      - {
          name: .pyrefly_cache,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
          cleanup: root,
        }
      - {
          name: .tox,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: conftest.py,
          is_dir: false,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: dist-packages,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: legado,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: site-packages,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: vendor,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: venv,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      # mro-jnm1.2: gitignore-only entries absorbed from the removed
      # REQUIRED_GITIGNORE_ENTRIES constant; they feed no other projection.
      # NOTA: .flext-deps foi removido — o cutover para fontes git eliminou o
      # cache, e o gate de actions proibe qualquer referencia ao mecanismo.
      - {
          name: .flext-sync.lock,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: .sync.lock,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - { name: .planning, vscode_exclude: false, watch_exclude: false }
      - {
          name: skill-create-output,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: .debug-journal.md,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: .mcp.json,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: CLAUDE.local.md,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }

    vscode:
      # Canonical .vscode/settings.json content injected with merge semantics:
      # scalar/list keys are enforced, map keys are union-merged (project entries
      # are preserved). Recursive "**" venv search globs are forbidden: they make
      # the Python Environments locator (pet) walk entire repository trees and
      # hang interpreter discovery on large monorepos.
      scalar_settings:
        files.autoSave: afterDelay
        python.analysis.diagnosticMode: workspace
        python.analysis.typeCheckingMode: strict
        python.defaultInterpreterPath: ${workspaceFolder}/.venv/bin/python
        python.terminal.activateEnvInCurrentTerminal: true
        python.terminal.activateEnvironment: true
        ruff.configurationPreference: filesystemFirst
        ruff.format.preview: true
        ruff.importStrategy: fromEnvironment
        ruff.lint.preview: true
        ruff.nativeServer: on
        shellcheck.useWorkspaceRootAsCwd: true
      list_settings:
        python-envs.workspaceSearchPaths:
          - ./.venv
          - ./*/.venv
      map_union_settings:
        python.analysis.diagnosticSeverityOverrides:
          reportUntypedBaseClass: none
        terminal.integrated.env.linux:
          PATH: ${workspaceFolder}/.venv/bin:${env:PATH}
          VIRTUAL_ENV: ${workspaceFolder}/.venv

    # NOTE(mro-0wuz, epic mro-hzox): declarative project-layout SSOT consumed by
    # the layout engine (codegen/layout.py) and the layout quality gate. Every
    # move/archive/gitignore decision derives from this section — the engine
    # carries zero hardcoded layout knowledge. severity=warning keeps the gate
    # report-only; flipping to error makes violations fail the check pipeline.
    layout:
      version: 1
      severity: warning
      # Archive-not-delete root: archived entries land in <archive_root>/<project>/.
      archive_root: .bkp
      docs_target: docs
      examples_target: examples
      diagrams_target: docs/diagrams
      allow_hidden: true
      canonical_root_files:
        - pyproject.toml
        - Makefile
        - base.mk
        - README.md
        - LICENSE
        - CHANGELOG.md
        - CONTRIBUTING.md
        - AGENTS.md
        - CLAUDE.md
        - conftest.py
        - mkdocs.yml
        - uv.lock
      canonical_root_dotfiles:
        - .gitignore
        - .gitattributes
        - .gitmodules
        - .envrc
        - .env.example
        - .python-version
        - .pre-commit-config.yaml
        - .mise.toml
        - .mcp.json
        - .waza.yaml
        - .sonarcloud.properties
        - sonar-project.properties
      canonical_root_dirs:
        - src
        - tests
        - docs
        - examples
        - scripts
        - config
        - ci
        - dist
        - docker
        - dbt_packages
      # Per-project-type extra canonical root files; the profile of a project
      # is resolved by matching its name against profile_project_patterns.
      profile_extra_root_files:
        dbt:
          - dbt_project.yml
          - packages.yml
          - profiles.yml
          - package-lock.yml
        meltano:
          - meltano.yml
          - docker-compose.test.yml
      profile_project_patterns:
        dbt:
          - flext-dbt-*
        meltano:
          - flext-meltano
          - flext-tap-*
      # Root documentation directories moved under <docs_target>/<name>/.
      move_docs_dirs:
        - api-reference
        - architecture
        - guides
        - releases
        - roadmap
        - standards
        - development
        - improvements
        - refactor
        - refactoring
        - maintenance
        - integration
        - adr
        - diagrams
        - api
        - configuration
        - notebook
        - getting-started
        - troubleshooting
        - testing
        - overview
      # Root Markdown documents moved under <docs_target>/.
      move_docs_files:
        - index.md
        - getting-started.md
        - configuration.md
        - development.md
        - architecture.md
        - api-reference.md
        - testing.md
        - troubleshooting.md
        - quick-start.md
        - overview.md
        - integration.md
        - c4-model.md
        - TODOS.md
        - TODO.md
        - REFACTOR_STATUS.md
        - DOCUMENTATION_UPDATE_SUMMARY.md
        - CONTRACT_BUDGET.md
        - DUPLICATION-DETECTION.md
        - HOOK_WARNINGS.md
        - PLUGIN-ARCHITECTURE.md
        - RULE_MODIFICATION.md
        - TESTING_WARNING_SYSTEM.md
        - FLEXT_0_12_BEADS_LANE_REORGANIZATION_PLAN.md
      # Sample data files moved under <examples_target>/.
      move_example_files:
        - directory.ldif
        - oid_schema.ldif
        - config.json.example
      # Diagram sources moved under <diagrams_target>/.
      move_diagram_globs:
        - "*.puml"
      # Root entries archived into <archive_root>/<project>/ (never deleted).
      # Names match files or directories; globs use fnmatch semantics.
      archive_names:
        - $OUT
        - max
        - "=4.0.0"
        - nohup.out
        - poetry.lock
        - history
        - history.json
        - index.md.bak-legacy-docs-layout
        - dbt_project_migrated.yml
        - processed_directory.ldif
        - output.ldif
        - replace_list.yml
        - maintenance_config.yaml
        - rules.json
        - output
        - logs
        - complete_pipeline_results
        - legado
        - __pycache__
        - b-pipeline
        - debug-pipeline
        - exec-pipeline
        - noexec-pipeline
        - probe
        - status-pipeline
      archive_globs:
        - "*.log"
        - pytest_*.txt
        - pyright_errors*.log
        - test_output.txt
        - mro-to59-*
      # Per-project overrides: extra archives (with the matching .gitignore
      # additions), explicit nested moves, and empty-directory archives.
      project_overrides:
        flext-cli:
          archive_names:
            - settings.json
          gitignore_additions:
            - settings.json
        flext-core:
          archive_names:
            - config.json
        flext-tap-oracle-wms:
          archive_names:
            - config.json
          gitignore_additions:
            - config.json
        flext-target-oracle-oic:
          archive_names:
            - config.json
          gitignore_additions:
            - config.json
        flext-oracle-oic:
          archive_names:
            - config.json
          gitignore_additions:
            - config.json
        flext-dbt-ldif:
          moves:
            - { source: profiles/profiles.yml, target: profiles.yml }
          archive_empty_dirs:
            - profiles
        flext-dbt-oracle-wms:
          moves:
            - { source: models/reference.md, target: docs/reference.md }
          archive_empty_dirs:
            - models

    scaffold:
      build:
        backend: hatchling.build
        requirements: [hatchling]
      project:
        readme: README.md
        supported_licenses: [MIT, Proprietary]
        classifiers:
          - "Development Status :: 4 - Beta"
          - "Intended Audience :: Developers"
          - "Operating System :: OS Independent"
          - "Programming Language :: Python :: 3 :: Only"
          - "Programming Language :: Python :: 3.13"
          - "Topic :: Software Development :: Libraries :: Python Modules"
          - "Typing :: Typed"
        keywords: [clean-architecture, flext, integration, typed]
        dev:
          - actionlint-py>=1.7.12.24
          # The security gate (flext_infra.gates.bandit) runs unconditionally for
          # every project owning src/, so the tool it shells out to must be a
          # declared dev dependency of every generated project.
          - bandit>=1.8
          - flext-tests
          # Floors let uv select the newest compatible tools; no upper cap or
          # exact tool version is imposed by generated project metadata.
          - mypy>=2.3.0
          - pyrefly>=1.1.1
          - pyright>=1.1.411
          - pytest>=9.0.3
          - ruff>=0.15.12
          - rumdl>=0.2.46
          - vulture>=2.16
          - yamlfix>=1.19.1
        dependency_profiles:
          # NOTE: a workspace manifest may declare an upstream distribution;
          # conformance must model that upstream relationship generically.
          - upstream: flext_core
            runtime:
              - flext-core
              - pydantic>=2.13.3
              - pydantic-settings>=2.14.0
            codegen: [flext-infra]
          - upstream: flext_cli
            runtime:
              - flext-cli
              - flext-core
              - pydantic>=2.13.3
              - pydantic-settings>=2.14.0
            codegen: [flext-infra]
      ping_example:
        command_name: ping
        help_text: Return the configured health response.
        success_message: pong
        enabled_default: true
        reply: pong
        disabled_reply: disabled
      # mro-jnm1.2: the first section is merged AFTER the artifact-SSOT derived
      # patterns by the CodegenConfigSpec.gitignore_sections projection
      # (deduplicated, SSOT wins); declare here only what the SSOT cannot
      # express (file globs, secrets, editor/OS noise). Per-project exception
      # fields are added by mro-jnm1.3.
      gitignore_sections:
        - name: "BLOCK EVERYTHING BY DEFAULT"
          profiles: [workspace-root]
          patterns:
            - "/*"
            - "/*/"
            - "!/LICENSE"
        # NOTE: governed member directories are NOT declared here. They are
        # derived from the live workspace topology (`config/workspace.yaml`
        # members) by conform._render_gitignore, so declaring a member in the
        # manifest is the single source that makes it trackable. A hardcoded
        # name glob here would be a second, silently-diverging source.
        - name: "WHITELIST: Workspace Directories"
          profiles: [workspace-root]
          patterns:
            - "!docker/"
            - "!docs/"
            - "!examples/"
            - "!.github/"
            - "!src/"
            - "!tests/"
            - "!typings/"
            - "!libs/"
            - "!.vscode/"
            - "!.code-review-graph/"
            - "!.claude/"
            - "!.claude-plugin/"
            - "!/config/"
            - "!.claude/CLAUDE.md"
            - "!.claude/settings.json"
            - "!.claude/settings.local.json"
            - "!.agents/"
            - "!.agents/**"
            - ".agents/skills/*/report.json"
        - name: "Workspace topology manifest"
          profiles: [workspace-root]
          patterns:
            - "!/config/workspace.yaml"
        - name: "Dispatcher-based command surface (Make SSOT)"
          profiles: [workspace-root]
          patterns:
            - "!scripts/"
            - "!scripts/cmd/"
            - "!scripts/cmd/**"
            - "scripts/*.py"
            - "scripts/*.sh"
            - "scripts/*.md"
            - "scripts/maintenance/"
            - "!scripts/dispatch.py"
            - "!scripts/__init__.py"
        - name: "TRACK: Beads team config; keep Dolt data, runtime state, and JSONL exports local."
          profiles: [workspace-root]
          patterns:
            - "!.beads/"
            - ".beads/*"
            - "!.beads/config.yaml"
        - name: "Python configuration"
          profiles: [workspace-root]
          patterns:
            - "!pyproject.toml"
            - "!uv.lock"
            - "!.taplo.toml"
            - "!pyrefly.toml"
            - "!poetry.lock"
            - "!uv.lock"
            - "!ruff-shared.toml"
            - "!uv.lock"
        - name: "mise toolchain pinning"
          profiles: [workspace-root]
          patterns:
            - "!.mise.toml"
            - "!.default-python-packages"
            - "!.python-version"
        - name: "Docker configuration"
          profiles: [workspace-root]
          patterns:
            - "!.dockerignore"
        - name: "Build and automation"
          profiles: [workspace-root]
          patterns:
            - "!Makefile"
            - "!Makefile.flext-docker"
            - "!*.mk"
        - name: "Documentation"
          profiles: [workspace-root]
          patterns:
            - "!README.md"
            - "!AGENTS.md"
            - "!AGENTS.md"
            - "!codex.md"
            - "!.markdownlint.json"
            - "!.markdownlintignore"
            - "!.shellcheckrc"
        - name: "Git configuration"
          profiles: [workspace-root]
          patterns:
            - "!.gitignore"
            - "!.gitmodules"
            - "!.gitattributes"
        - name: "direnv environment (no secrets \u2014 venv activation only)"
          profiles: [workspace-root]
          patterns:
            - "!.envrc"
            - "!.envrc.local"
        - name: "Environment templates (NOT .env - keep secrets out!)"
          profiles: [workspace-root]
          patterns:
            - "!.env.test"
            - "!.env.example"
            - "!.env.template"
        - name: "WHITELIST: Contents Inside Allowed Directories"
          profiles: [workspace-root]
          patterns:
            - "!docker/**"
            - "!docs/**"
            - "!examples/**"
            - "!.github/**"
            - "!src/**"
            - "!tests/**"
            - "!typings/**"
            - "!libs/**"
            - "!.vscode/**"
            - "!.claude/**"
            - "!.claude-plugin/**"
        # NOTE: member contents are emitted by the same derived section as the
        # member directories themselves (see the note above), so both come from
        # the live workspace topology and can never diverge from each other.
        - name: "BLOCK: AI/Agent Local Data (NEVER track these)"
          patterns:
            - ".claude/*"
            - "!.agents/skills/"
            - "!.agents/skills/**"
        - name: "Skill scan reports (transient, regenerated by skill_validate.py)"
          patterns:
            - ".agents/skills/*/report.json"
        - name: "Aider AI data"
          patterns:
            - ".aider/"
            - ".aider.conf.yml"
            - ".aider.chat.history.md"
            - "**/.aider/"
        - name: "Other AI assistants"
          patterns:
            - ".cursor/"
            - ".copilot/"
            - ".codeium/"
        - name: "Oracle dump files"
          patterns:
            - "**/*.dmp"
            - "**/*.DMP"
        - name: "Oracle logs"
          patterns:
            - "**/*.trc"
            - "**/*.aud"
        - name: "Oracle wallet files"
          patterns:
            - "**/cwallet.sso"
            - "**/ewallet.p12"
            - "**/tnsnames.ora"
            - "**/sqlnet.ora"
        - name: "Oracle test/reference data directories"
          patterns:
            - "**/oracle_data/"
            - "**/oracle_dump/"
            - "**/oracle_export/"
            - "**/oracle_import/"
            - "**/expdp_*/"
            - "**/impdp_*/"
        - name: "Python artifacts inside allowed directories"
          patterns:
            - "**/__pycache__/"
            - "**/*.pyc"
            - "**/*.pyo"
            - "**/*.pyd"
            - "**/*.so"
            - "**/*.egg"
            - "**/*.egg-info/"
            - "**/dist/"
            - "**/build/"
            - "!scripts/cmd/build/"
            - "**/.eggs/"
        - name: "Skill validation temporary reports"
          patterns:
            - "baseline.json"
            - "report.json"
            - "fix-report.json"
            - "*.rej"
        - name: "Python caches inside allowed directories"
          patterns:
            - "**/.mypy_cache/"
            - "**/.ruff_cache/"
            - "**/.pytest_cache/"
            - "**/.hypothesis/"
            - "**/.tox/"
            - "**/.nox/"
            - "**/.benchmarks/"
        - name: "Coverage reports inside allowed directories"
          patterns:
            - "**/htmlcov/"
            - "**/.coverage"
            - "**/coverage.json"
            - "**/.coverage.*"
            - "**/coverage.xml"
            - "**/*.cover"
        - name: "Virtual environments inside allowed directories (should never be committed)"
          patterns:
            - "**/.venv/"
            - "**/venv/"
            - "**/env/"
            - "**/ENV/"
            - "**/.virtualenv/"
        - name: "Native build artifacts inside allowed directories"
          patterns:
            - "**/*.exe"
            - "**/*.exe~"
            - "**/*.dll"
            - "**/*.dylib"
            - "**/*.test"
            - "**/*.out"
            - "vendor/"
        - name: "Node.js inside allowed directories"
          patterns:
            - "**/node_modules/"
            - "**/npm-debug.log"
            - "**/yarn-error.log"
            - "**/.npm/"
            - "**/.yarn/"
        - name: "IDE and editor files inside allowed directories"
          patterns:
            - "**/.idea/"
            - "**/*.iml"
            - "**/.vscode/*.code-workspace"
            - "**/.vscode/internal.invalid.json"
            - "**/*.swp"
            - "**/*.swo"
            - "**/*~"
            - "**/.*.sw?"
        - name: "OS files inside allowed directories"
          patterns:
            - "**/.DS_Store"
            - "**/Thumbs.db"
            - "**/Desktop.ini"
        - name: "Temporary and log files inside allowed directories"
          patterns:
            - "**/*.log"
            - "**/*.tmp"
            - "**/*.temp"
            - "**/tmp/"
            - "**/temp/"
            - "**/.tmp/"
        - name: "Build and quality tool artifacts inside allowed directories"
          patterns:
            - "**/.meltano/"
            - "**/.serena/"
        - name: "Backup files inside allowed directories"
          patterns:
            - "**/*.bak"
            - "**/*.bkp"
            - "**/*.bkp?"
            - "**/*.backup"
            - "**/*.orig"
            - "**/*_backup"
            - "**/*_backup_*"
            - "**/*.md.backup"
            - "**/archived/"
        - name: "Autofix rejection artifacts (run_skill_autofix.sh rollback output)"
          patterns:
            - "**/*.rej-*.bak"
            - "**/*.rej-*.rej"
        - name: "Database files inside allowed directories"
          patterns:
            - "**/*.db"
            - "**/*.sqlite"
            - "**/*.sqlite3"
        - name: "Compiled files inside allowed directories"
          patterns:
            - "**/*.class"
            - "**/*.o"
            - "**/*.obj"
            - "**/*.a"
        - name: "Archive files inside allowed directories (usually shouldn't be in git)"
          patterns:
            - "**/*.zip"
            - "**/*.tar"
            - "**/*.tar.gz"
            - "**/*.tgz"
            - "**/*.rar"
            - "**/*.7z"
        - name: "Environment files with actual secrets"
          patterns:
            - ".env"
            - ".internal.invalid"
            - ".env.production"
            - ".env.development"
            - "**/.env"
        - name: "Credentials and keys"
          patterns:
            - "*.key"
            - "*.pem"
            - "*.p12"
            - "*.pfx"
            - "credentials.json"
            - "**/credentials.json"
            - "secrets.yaml"
            - "secrets.yml"
            - "**/.credentials*"
        - name: "ALLOW: Preserve Empty Directories"
          patterns:
            - "!**/.gitkeep"
        - name: "Ensure these are NEVER committed, even if explicitly added"
          patterns:
            - ".milvus/"
            - ".claude-data/"
            - ".devcontainer/.host-gitsettings"
            - ".devcontainer/.env"
            - ".github/*.rej"
        - name: "FINAL BEADS TRACKING POLICY"
          patterns:
            - "!.beads/"
            - ".beads/*"
            - ".beads/.*"
            - "!.beads/config.yaml"
            - ".beads/proxieddb/"
            - ".dolt/"
            - "*.db"
            - ".beads-credential-key"
            - ".worktrees/"
            - "legado/"
        - name: "codegen module-standardizer reject artifacts (ADR-005 \u00a79)"
          patterns:
            - "*.tpl.rej"
        - name: "--- generated runtime ignores ---"
          patterns:
            - ".direnv/"
            - ".reports/"
            - ".venv/"
            - ".bin/"
            - ".tools/"
            - "__pycache__/"
            - "!.pre-commit-config.yaml"
    surfaces:
