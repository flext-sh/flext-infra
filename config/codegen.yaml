        owner: codegen
        policy: full
      # Why (ai-hub-qwoc): codegen owns the ast-grep contract end to end, so the
      # rendered file is fully managed and never hand-edited.
      - path: sgconfig.yml
        owner: codegen
        policy: full
      - path: .gitignore
        owner: codegen
        policy: merge
      - path: .mise.toml
        owner: codegen
        policy: full
      - path: .pre-commit-config.yaml
        owner: pre-commit
        policy: full
      - path: .python-version
        owner: codegen
        policy: full
      - path: .vscode/settings.json
        owner: vscode
        policy: merge
      - path: LICENSE
        owner: codegen
        policy: create-only
      - path: Makefile
        owner: make
        policy: full
      - path: README.md
        owner: codegen
        policy: create-only
      - path: base.mk
        owner: make
        policy: delegated
      - path: custom.mk
        owner: custom
        policy: create-only
      - path: pyproject.toml
        owner: codegen
        policy: merge
        # Sections codegen renders, so a conflict in them is resolved by
        # re-rendering instead of by hand. per-file-ignores renders from
        # tooling.yaml exactly like the pytest and uv sections; leaving it
        # undeclared made absorbing an integration base that still carried the
        # previous lint projection unresolvable through the canonical surface.
        conflict_sections:
          - tool.pytest.ini_options
          - tool.uv
          - tool.ruff.lint.per-file-ignores

    # Automated semantic versioning, owned by the market tool rather than by a
    # local implementation. python-semantic-release reads Conventional Commits,
    # decides major/minor/patch, writes the version, generates the changelog and
    # creates the tag. We already had bump_version/parse_semver and a release
    # orchestrator, but nothing DERIVED the bump: a human still passed
    # `bump=minor` by hand, which is exactly the judgement call the commit
    # history already encodes and the one a human gets wrong.
    #
    # Declared here so every generated pyproject carries the same contract and
    # no project hand-rolls its own. Exceptions belong in `overrides` below,
    # never in a project-local edit.
    release:
      tool: python-semantic-release
      # `uv` is the runner: no separate install step, no global state.
      runner: uv
      # Commit parser and the branch that produces releases. FLEXT branch model:
      # 0.12.0-dev is the integration branch, main is the produced release.
      commit_parser: conventional
      release_branch: 0.12.0-dev
      # Where the version lives. Both are kept in step by the tool itself, so a
      # tag can never disagree with the packaged metadata.
      version_variables:
        - src/{package}/version.py:__version__
      version_toml:
        - pyproject.toml:project.version
      # Build through the canonical verb so a release artifact is produced the
      # same way a local build is; a second build path is a second contract.
      build_command: uv build
      # Tag shape shared with the workspace release workflow.
      tag_format: "v{version}"
      # Changelog is generated, never hand-maintained.
      changelog_file: CHANGELOG.md
      # Per-distribution exceptions. A project lands here only when its release
      # contract genuinely differs -- not to opt out of the standard.
      overrides: {}

    scaffold:
      build:
        backend: hatchling.build
        requirements: [hatchling]
      project:
        readme: README.md
        supported_licenses: [MIT, Proprietary]
        classifiers:
          - "Development Status :: 4 - Beta"
          - "Intended Audience :: Developers"
          - "Operating System :: OS Independent"
          - "Programming Language :: Python :: 3 :: Only"
          - "Programming Language :: Python :: 3.13"
          - "Topic :: Software Development :: Libraries :: Python Modules"
          - "Typing :: Typed"
        keywords: [clean-architecture, flext, integration, typed]
        dev:
          - actionlint-py>=1.7.12.24
          # The security gate (flext_infra.gates.bandit) runs unconditionally for
          # every project owning src/, so the tool it shells out to must be a
          # declared dev dependency of every generated project.
          - bandit>=1.8
          - flext-tests
          # Floors let uv select the newest compatible tools; no upper cap or
          # exact tool version is imposed by generated project metadata.
          - mypy>=2.3.0
          - pyrefly>=1.1.1
          - pyright>=1.1.411
          # `gen` installs the git hooks it just wrote, so the tool that owns
          # them has to exist in the environment running codegen — including CI,
          # which provisions only the declared groups.
          # Why (flext-6itas.4): restored after merge 0d4d07b33 resolved a
          # conflict by keeping parent2's pre-02475b0f7 content, silently
          # dropping this entry (proven: parent1 8675f171c has the line,
          # parent2 648ca5707 never did).
          - pre-commit>=4.6.1
          - pytest>=9.0.3
          - pytest-testmon>=2.2.0
          - ruff>=0.15.12
          - rumdl>=0.2.45
          - vulture>=2.16
          - yamlfix>=1.19.1
        dependency_profiles:
          # NOTE: a workspace manifest may declare an upstream distribution;
          # conformance must model that upstream relationship generically.
          - upstream: flext_core
            runtime:
              - flext-core
              - pydantic>=2.13.3
              - pydantic-settings>=2.14.0
            codegen: [flext-infra]
          - upstream: flext_cli
            runtime:
              - flext-cli
              - flext-core
              - pydantic>=2.13.3
              - pydantic-settings>=2.14.0
            codegen: [flext-infra]
      ping_example:
        command_name: ping
        help_text: Return the configured health response.
        success_message: pong
        enabled_default: true
        reply: pong
        disabled_reply: disabled
      # mro-jnm1.2: the first section is merged AFTER the artifact-SSOT derived
      # patterns by the CodegenConfigSpec.gitignore_sections projection
      # (deduplicated, SSOT wins); declare here only what the SSOT cannot
      # express (file globs, secrets, editor/OS noise). Per-project exception
      # fields are added by mro-jnm1.3.
      gitignore_sections:
        - name: "BLOCK EVERYTHING BY DEFAULT"
          profiles: [workspace]
          patterns:
            - "/*"
            - "/*/"
            - "!/LICENSE"
        # Governed subproject directories are derived from local .gitmodules by
        # conform._render_gitignore; no project catalog is duplicated here.
        - name: "WHITELIST: Workspace Directories"
          profiles: [workspace]
          patterns:
            - "!docker/"
            - "!docs/"
            - "!examples/"
            - "!.github/"
            - "!src/"
            - "!tests/"
            - "!typings/"
            - "!libs/"
            - "!.vscode/"
            - "!.code-review-graph/"
            - "!.claude/"
            - "!.claude-plugin/"
            - "!/config/"
            - "!.claude/CLAUDE.md"
            - "!.claude/settings.json"
            - "!.claude/settings.local.json"
            - "!.agents/"
            - "!.agents/**"
            - ".agents/skills/*/report.json"
        - name: "Dispatcher-based command surface (Make SSOT)"
          profiles: [workspace]
          patterns:
            - "!scripts/"
            - "!scripts/cmd/"
            - "!scripts/cmd/**"
            - "scripts/*.py"
            - "scripts/*.sh"
            - "scripts/*.md"
            - "scripts/maintenance/"
            - "!scripts/dispatch.py"
            - "!scripts/__init__.py"
        - name: "TRACK: Beads team config; keep Dolt data, runtime state, and JSONL exports local."
          profiles: [workspace, standalone]
          patterns:
            - "!.beads/"
            - ".beads/*"
            - "!.beads/config.yaml"
            # metadata.json is what bd reads to resolve the ledger. Without it
            # bd warns "no beads configuration found" and silently falls back
            # to the default database, so beads created from a clean clone land
            # in a throwaway store (mro-9wv8). In workspace and standalone
            # the file holds only the portable storage and database identity
            # declared by config/beads.yaml -- no secret and no per-machine
            # value -- so it is safe to track. Members keep it
            # ignored: their embedded-mode file carries a per-machine
            # project_id UUID.
            - "!.beads/metadata.json"
        - name: "Python configuration"
          profiles: [workspace]
          patterns:
            - "!pyproject.toml"
            - "!uv.lock"
            - "!.taplo.toml"
            - "!pyrefly.toml"
            - "!poetry.lock"
            - "!uv.lock"
            - "!ruff-shared.toml"
            - "!uv.lock"
        - name: "mise toolchain pinning"
          profiles: [workspace]
          patterns:
            - "!.mise.toml"
            - "!.default-python-packages"
            - "!.python-version"
        - name: "Docker configuration"
          profiles: [workspace]
          patterns:
            - "!.dockerignore"
        - name: "Build and automation"
          profiles: [workspace]
          patterns:
            - "!Makefile"
            - "!Makefile.flext-docker"
            - "!*.mk"
        - name: "Documentation"
          profiles: [workspace]
          patterns:
            - "!README.md"
            - "!AGENTS.md"
            - "!AGENTS.md"
            - "!codex.md"
            - "!.markdownlint.json"
            - "!.markdownlintignore"
            - "!.shellcheckrc"
        - name: "Git configuration"
          profiles: [workspace]
          patterns:
            - "!.gitignore"
            - "!.gitmodules"
            - "!.gitattributes"
        - name: "direnv environment (no secrets \u2014 venv activation only)"
          profiles: [workspace]
          patterns:
            - "!.envrc"
            - "!.envrc.local"
        - name: "Environment templates (NOT .env - keep secrets out!)"
          profiles: [workspace]
          patterns:
            - "!.env.test"
            - "!.env.example"
            - "!.env.template"
        - name: "WHITELIST: Contents Inside Allowed Directories"
          profiles: [workspace]
          patterns:
            - "!docker/**"
            - "!docs/**"
            - "!examples/**"
            - "!.github/**"
            - "!src/**"
            - "!tests/**"
            - "!typings/**"
            - "!libs/**"
            - "!.vscode/**"
            - "!.claude/**"
            - "!.claude-plugin/**"
        # NOTE: member contents are emitted by the same derived section as the
        # member directories themselves (see the note above), so both come from
        # the live workspace topology and can never diverge from each other.
        - name: "BLOCK: AI/Agent Local Data (NEVER track these)"
          patterns:
            - ".claude/*"
        # mro-zmoc6: `uv sync` inside a member lane writes a member-local
        # uv.lock. Only the workspace root resolves and tracks a lockfile
        # (whitelisted in "Python configuration" above); for a member the
        # file is a local build artifact of that shared resolution. Left
        # undeclared it surfaced as untracked in every freshly created lane
        # and made the retired Make lane lifecycle refuse a committed increment
        # with "requires a clean lane worktree".
        - name: "BLOCK: member-local lockfile (the workspace root owns uv.lock)"
          profiles: [standalone]
          patterns:
            - "uv.lock"
        # Only the workspace root owns agent skills as real versioned files.
        # Non-root checkouts keep `.agents/` gitignored: ai-hub materializes
        # provider surfaces as real local files via generate-workspace-config
        # (never mode-120000 symlinks). Out-of-bounds symlinks make the ArgoCD
        # repo-server refuse the repository, so subprojects must not track them.
        - name: "BLOCK: Agent surface outside the workspace root"
          profiles: [standalone]
          patterns:
            - ".agents/"
        - name: "WHITELIST: Agent skills owned by the workspace root"
          profiles: [workspace]
          patterns:
            - "!.agents/skills/"
            - "!.agents/skills/**"
        - name: "Skill scan reports (transient, regenerated by skill_validate.py)"
          patterns:
            - ".agents/skills/*/report.json"
        - name: "Aider AI data"
          patterns:
            - ".aider/"
            - ".aider.conf.yml"
            - ".aider.chat.history.md"
            - "**/.aider/"
        - name: "Other AI assistants"
          patterns:
            - ".cursor/"
            - ".copilot/"
            - ".codeium/"
        - name: "Oracle dump files"
          patterns:
            - "**/*.dmp"
            - "**/*.DMP"
        - name: "Oracle logs"
          patterns:
            - "**/*.trc"
            - "**/*.aud"
        - name: "Oracle wallet files"
          patterns:
            - "**/cwallet.sso"
            - "**/ewallet.p12"
            - "**/tnsnames.ora"
            - "**/sqlnet.ora"
        - name: "Oracle test/reference data directories"
          patterns:
            - "**/oracle_data/"
            - "**/oracle_dump/"
            - "**/oracle_export/"
            - "**/oracle_import/"
            - "**/expdp_*/"
            - "**/impdp_*/"
        - name: "Python artifacts inside allowed directories"
          patterns:
            - "**/__pycache__/"
            - "**/*.pyc"
            - "**/*.pyo"
            - "**/*.pyd"
            - "**/*.so"
            - "**/*.egg"
            - "**/*.egg-info/"
            - "**/dist/"
            - "**/build/"
            - "!scripts/cmd/build/"
            - "**/.eggs/"
        - name: "Skill validation temporary reports"
          patterns:
            - "baseline.json"
            - "report.json"
            - "fix-report.json"
            - "*.rej"
        - name: "Python caches inside allowed directories"
          patterns:
            - "**/.mypy_cache/"
            - "**/.ruff_cache/"
            - "**/.pytest_cache/"
            - "**/.hypothesis/"
            - "**/.tox/"
            - "**/.nox/"
            - "**/.benchmarks/"
        - name: "Coverage reports inside allowed directories"
          patterns:
            - "**/htmlcov/"
            - "**/.coverage"
            - "**/coverage.json"
            - "**/.coverage.*"
            - "**/coverage.xml"
            - "**/*.cover"
        - name: "Docs verb report artifacts inside docs trees"
          patterns:
            - "**/docs/generate-report.md"
            - "**/docs/generate-summary.json"
            - "**/docs/fix-report.md"
            - "**/docs/fix-summary.json"
            - "**/docs/audit-report.md"
            - "**/docs/audit-summary.json"
        - name: "Virtual environments inside allowed directories (should never be committed)"
          patterns:
            - "**/.venv"
            - "**/.venv/"
            - "**/venv/"
            - "**/env/"
            - "**/ENV/"
            - "**/.virtualenv/"
        - name: "Native build artifacts inside allowed directories"
          patterns:
            - "**/*.exe"
            - "**/*.exe~"
            - "**/*.dll"
            - "**/*.dylib"
            - "**/*.test"
            - "**/*.out"
            - "vendor/"
        - name: "Node.js inside allowed directories"
          patterns:
            - "**/node_modules/"
            - "**/npm-debug.log"
            - "**/yarn-error.log"
            - "**/.npm/"
            - "**/.yarn/"
        - name: "IDE and editor files inside allowed directories"
          patterns:
            - "**/.idea/"
            - "**/*.iml"
            - "**/.vscode/*.code-workspace"
            - "**/.vscode/internal.invalid.json"
            - "**/*.swp"
            - "**/*.swo"
            - "**/*~"
            - "**/.*.sw?"
        - name: "OS files inside allowed directories"
          patterns:
            - "**/.DS_Store"
            - "**/Thumbs.db"
            - "**/Desktop.ini"
        - name: "Temporary and log files inside allowed directories"
          patterns:
            - "**/*.log"
            - "**/*.tmp"
            - "**/*.temp"
            - "**/tmp/"
            - "**/temp/"
            - "**/.tmp/"
        - name: "Build and quality tool artifacts inside allowed directories"
          patterns:
            - "**/.qlty/"
            - "**/.meltano/"
            - "**/.serena/"
        - name: "Backup files inside allowed directories"
          patterns:
            - "**/*.bak"
            - "**/*.bkp"
            - "**/*.bkp?"
            - "**/*.backup"
            - "**/*.orig"
            - "**/*_backup"
            - "**/*_backup_*"
            - "**/*.md.backup"
            - "**/archived/"
        - name: "Autofix rejection artifacts (run_skill_autofix.sh rollback output)"
          patterns:
            - "**/*.rej-*.bak"
            - "**/*.rej-*.rej"
        - name: "Database files inside allowed directories"
          patterns:
            - "**/*.db"
            - "**/*.sqlite"
            - "**/*.sqlite3"
        - name: "Compiled files inside allowed directories"
          patterns:
            - "**/*.class"
            - "**/*.o"
            - "**/*.obj"
            - "**/*.a"
        - name: "Archive files inside allowed directories (usually shouldn't be in git)"
          patterns:
            - "**/*.zip"
            - "**/*.tar"
            - "**/*.tar.gz"
            - "**/*.tgz"
            - "**/*.rar"
            - "**/*.7z"
        - name: "Environment files with actual secrets"
          patterns:
            - ".env"
            - ".internal.invalid"
            - ".env.production"
            - ".env.development"
            - "**/.env"
        - name: "Credentials and keys"
          patterns:
            - "*.key"
            - "*.pem"
            - "*.p12"
            - "*.pfx"
            - "credentials.json"
            - "**/credentials.json"
            - "secrets.yaml"
            - "secrets.yml"
            - "**/.credentials*"
        - name: "ALLOW: Preserve Empty Directories"
          patterns:
            - "!**/.gitkeep"
        - name: "Ensure these are NEVER committed, even if explicitly added"
          patterns:
            - ".milvus/"
            - ".claude-data/"
            - ".devcontainer/.host-gitsettings"
            - ".devcontainer/.env"
            - ".github/*.rej"
        - name: "--- codegen conform: tracked owner inputs ---"
          patterns:
            - "!base.mk"
        # This final policy re-ignores .beads/* for every profile, so the
        # workspace exception for metadata.json is re-stated in a
        # workspace-scoped section immediately after it (last rule wins).
        # Members are deliberately NOT covered: their embedded-mode
        # metadata.json carries a per-machine project_id UUID.
        - name: "FINAL BEADS TRACKING POLICY"
          patterns:
            - "!.beads/"
            - ".beads/*"
            - ".beads/.*"
            - "!.beads/config.yaml"
            - ".beads/proxieddb/"
            # The bd gate lock is per-run runtime state written at the
            # REPOSITORY ROOT, not inside .beads/, so the .beads/* rules above
            # never reach it. Every profile runs bd, so every profile must
            # ignore it. Without this the lock reappears after every bd
            # invocation and dirties the checkout -- in a submodule that also
            # dirties the superproject gitlink, which is enough to fail
            # `make release WHAT=status` and block the release verb outright.
            - ".beads.gate.lock"
            - ".dolt/"
            - "*.db"
            - ".beads-credential-key"
            - ".worktrees/"
            - "legado/"
        - name: "Beads ledger identity (workspace and standalone; see mro-9wv8)"
          profiles: [workspace, standalone]
          patterns:
            - "!.beads/metadata.json"
        - name: "codegen module-standardizer reject artifacts (ADR-005 \u00a79)"
          patterns:
            - "*.tpl.rej"
        - name: "--- codegen conform: generated runtime ignores ---"
          patterns:
            - ".direnv/"
            - ".reports/"
            - ".venv"
            - ".venv/"
            - ".bin/"
            - ".tools/"
            - "__pycache__/"
            - "base.mk"
            - "!.pre-commit-config.yaml"
    templates:
      root: project
      entries:
        - source: base/.github/ci-template/ci.yml.j2
          destination: .github/ci-template/ci.yml
          profiles: [workspace]
          delegate: render
          overwrite: false
        - source: base/.github/copilot-instructions.md.j2
          destination: .github/copilot-instructions.md
          profiles: [workspace]
          delegate: render
          overwrite: false
        - source: base/.github/dependabot.yml.j2
          destination: .github/dependabot.yml
          profiles: [workspace, standalone]
          delegate: render
          overwrite: false
        - source: base/.github/prompts/flext-aggressive-scale-refactor.prompt.md.j2
          destination: .github/prompts/flext-aggressive-scale-refactor.prompt.md
          profiles: [workspace]
          delegate: render
          overwrite: false
        - source: base/.github/prompts/flext-strict-jsonvalue-session-continuation.prompt.md.j2
          destination: .github/prompts/flext-strict-jsonvalue-session-continuation.prompt.md
          profiles: [workspace]
          delegate: render
          overwrite: false
        - source: base/.github/scripts/check-cqrs-compliance.sh.j2
          destination: .github/scripts/check-cqrs-compliance.sh
          profiles: [workspace]
          delegate: render
          overwrite: false
        - source: base/.github/scripts/flext-law-loop.sh.j2
          destination: .github/scripts/flext-law-loop.sh
          profiles: [workspace]
          delegate: render
          overwrite: false
        - source: base/.github/scripts/install-git-hooks.sh.j2
          destination: .github/scripts/install-git-hooks.sh
          profiles: [workspace]
          delegate: render
          overwrite: true
        # Multi-environment CI base: reusable ci-matrix workflow + per-distro
        # clean-machine images validating bootstrap and make verbs everywhere.
        - source: base/.github/workflows/ci-matrix.yml.j2
          destination: .github/workflows/ci-matrix.yml
          # Workspace subprojects are covered by the root matrix; do not duplicate.
          profiles: [workspace, standalone]
          delegate: render
          overwrite: false
        - source: base/.github/workflows/ci.yml.j2
          destination: .github/workflows/ci.yml
          profiles: [workspace, standalone]
          delegate: render
          overwrite: false
        - source: base/.pre-commit-config.yaml.j2
          destination: .pre-commit-config.yaml
          profiles: [workspace, standalone]
          delegate: render
          overwrite: false
        - source: base/README.md.j2
          destination: README.md
          profiles: [workspace, standalone]
          delegate: render
          overwrite: false
        - source: base/LICENSE.j2
          destination: LICENSE
          profiles: [workspace, standalone]
          delegate: render
          overwrite: false
        - source: base/gitignore.j2
          destination: .gitignore
          profiles: [workspace, standalone]
          delegate: render
          overwrite: false
        # Why (ai-hub-qwoc): a provider manifest may declare sgconfig.yml as a
        # required surface. Without a generator it was hand-written in one
        # repository and absent in another, so provider discovery failed closed
        # with "missing declared file: sgconfig.yml". Rendering it from the SSOT
        # gives every governed repository the same ast-grep contract.
        - source: base/sgconfig.yml.j2
          destination: sgconfig.yml
          profiles: [workspace, standalone]
          delegate: render
          overwrite: false
        - source: base/python-version.j2
          destination: .python-version
          profiles: [workspace, standalone]
          delegate: render
          overwrite: false
        - source: base/env.example.j2
          destination: .env.example
          profiles: [workspace, standalone]
          delegate: render
          overwrite: false
        - source: base/.mise.toml.j2
          destination: .mise.toml
          profiles: [workspace, standalone]
          delegate: render
          overwrite: false
        # Static repository-local projection rendered for every governed
        # workspace root and standalone repository.
        - source: base/beads-config.yaml.j2
          destination: .beads/config.yaml
          profiles: [workspace, standalone]
          delegate: render
          overwrite: false
        # Static repository-local storage, database, and endpoint projection.
        - source: base/beads-metadata.json.j2
          destination: .beads/metadata.json
          profiles: [workspace, standalone]
          delegate: render
          overwrite: false
        - source: base/config/beads.yaml.j2
          destination: config/beads.yaml
          profiles: [workspace, standalone]
          delegate: render
          overwrite: false
        - source: base/.envrc.j2
          destination: .envrc
          profiles: [workspace, standalone]
          delegate: render
          overwrite: false
        - source: base/.github/workflows/docs.yml.j2
          destination: .github/workflows/docs.yml
          # The workflow installs every declared tool from the canonical mise lock.
          profiles: [workspace, standalone]
          delegate: render
          overwrite: true
        - source: base/.github/workflows/release.yml.j2
          destination: .github/workflows/release.yml
          profiles: [workspace]
          delegate: render
          overwrite: false
        - source: base/tests/fixtures/ci/docker/ubuntu.Dockerfile.j2
          destination: tests/fixtures/ci/docker/ubuntu.Dockerfile
          profiles: [workspace, standalone]
          delegate: render
          overwrite: false
        - source: base/tests/fixtures/ci/docker/debian.Dockerfile.j2
          destination: tests/fixtures/ci/docker/debian.Dockerfile
          profiles: [workspace, standalone]
          delegate: render
          overwrite: false
        - source: base/tests/fixtures/ci/docker/fedora.Dockerfile.j2
          destination: tests/fixtures/ci/docker/fedora.Dockerfile
          profiles: [workspace, standalone]
          delegate: render
          overwrite: false
        - source: base/tests/fixtures/ci/docker/alpine.Dockerfile.j2
          destination: tests/fixtures/ci/docker/alpine.Dockerfile
          profiles: [workspace, standalone]
          delegate: render
          overwrite: false
        - source: base/tests/fixtures/ci/docker/arch.Dockerfile.j2
          destination: tests/fixtures/ci/docker/arch.Dockerfile
          profiles: [workspace, standalone]
          delegate: render
          overwrite: false
        - source: base/Makefile.j2
          destination: Makefile
          # The generic conform engine is the single Makefile owner for every
          # profile; workspace fan-out is selected inside this template.
          # Fully generated (overwrite: true): a project never owns a verb.
          # `overwrite: false` froze every existing Makefile at the shape it
          # had when first written, so new builtin verbs never reached the
          # fleet. Customisation lives exclusively in custom.mk, through
          # pre-/post-verb hooks, and may not redefine a verb.
          profiles: [workspace, standalone]
          delegate: render
          overwrite: true
        - source: base/custom.mk.j2
          destination: custom.mk
          profiles: [workspace, standalone]
          delegate: render
          overwrite: false
        - source: base/pyproject.toml.j2
          destination: pyproject.toml
          profiles: [workspace, standalone]
          delegate: render
          overwrite: false
