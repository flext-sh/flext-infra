Infra:
  codegen:
    repository:
      project:
        package_name: flext_infra
        class_stem: FlextInfra
        namespace: Infra
        constant_name: flext-infra
        namespace_attribute: infra
        alias: infra
        environment_prefix: FLEXT_INFRA_
        description: FLEXT Infrastructure Tooling - Build automation, code generation,
          and workspace management
        license: MIT
        author_name: FLEXT Team
        author_email: team@flext.sh
        upstream: flext_cli
        namespace_scan_dirs: []
        homepage: https://github.com/flext-sh/flext-infra
        documentation: https://github.com/flext-sh/flext-infra/blob/main/README.md
        repository_root_rel: .
        year: 2026
      namespace_scan_dirs:
      - src
      publishes_release: true
      extra_verbs:
      - name: mod-snapshots
        description: Regenerate every owned ast-grep rule-test snapshot and report changes for review.
    branch_policy:
      integration_branch: 0.12.0-dev
