        - name: "--- workspace-sync: required ignores (auto-managed) ---"
          patterns:
            - ".direnv/"
            - ".reports/"
            - ".venv/"
            - "__pycache__/"
            - "base.mk"
            - "!.pre-commit-config.yaml"
