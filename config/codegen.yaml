Infra:
  codegen:
    # NOTE(mro-wkii.17.5, agent implement_manifest): declarative SSOT for deterministic project conformance.
    version: 1

    toolchain:
      # Single-source Python minor line. The environment resolves the newest
      # compatible 3.13 patch; no patch is pinned in generated repositories.
      # Derived as computed fields on ToolchainSpec:
      #   python_required_version -> >=3.13,<3.14
      # uv is supplied by the caller environment and is deliberately not pinned.
      # Dependency floors live in pyproject; uv.lock owns resolved versions.
      python_version: "3.13"
      uv_link_mode: copy
      # Non-Python toolchain pins consumed by generated .mise.toml and CI.
      kubectl_version: "1.32.0"
      helm_version: "3.19.4"
      kind_version: "0.31.0"
      taplo_version: "0.10.0"
      ast_grep_version: "0.45.0"
      gitleaks_version: "8.30.1"
      tokei_version: "14.0.0"
      mise_version: "2026.7.16"
      beads:
        selector: github:gastownhall/beads
        version: "1.1.2"

    github_actions:
      checkout:
        repository: actions/checkout
        version: v7.0.1
        sha: 3d3c42e5aac5ba805825da76410c181273ba90b1
      setup-python:
        repository: actions/setup-python
        version: v7.0.0
        sha: 5fda3b95a4ea91299a34e894583c3862153e4b97
      setup-uv:
        repository: astral-sh/setup-uv
        version: v9.0.0
        sha: c771a70e6277c0a99b617c7a806ffedaca235ff9
      mise:
        repository: jdx/mise-action
        version: v4.1.0
        sha: dba19683ed58901619b14f395a24841710cb4925
      kind:
        repository: helm/kind-action
        version: v1.14.0
        sha: ef37e7f390d99f746eb8b610417061a60e82a6cc

    uv_exclude_dependencies:
      - project: flext-infra
        package:
          name: flext-tests
        dependencies: [flext-infra]

    providers:
      - name: flext-sh
        organization: flext-sh
        base_url: https://github.com/flext-sh
        branch: 0.12.0-dev
    branch_policy:
      technical_branch_patterns:
        - __dolt_remote_info__
        - dolt/*
        - gh-readonly-queue/*
    profiles:
      - name: workspace-root
        environment_scope: root
        setup_scope: root-and-members
        execution_scope: root
        discovery_scope: manifest
      - name: standalone
        environment_scope: self
        setup_scope: self
        execution_scope: self
        discovery_scope: none

    make:
      selector: WHAT
      apply_variable: APPLY
      apply_value: Y
      docs:
        actions: [all, generate, fix, audit, build, validate]
        default_action: all
        mutable_actions: [generate, fix]
        reports_dir: .reports/docs
        cross_project_relative_link_pattern: '^(?:\.\./)+flext-[a-z0-9-]+(?:/|$)'
      serialization:
        lock_path: .state/flext-infra/make-validation.lock
        single_flight_lock_path: .state/flext-infra/make-single-flight.lock
        mutation_fixed_points:
          codegen:
            apply: check
        snapshot_excludes:
          - .state/flext-infra/make-validation.lock
          - .state/flext-infra/make-single-flight.lock
          - .reports
          - .pytest_cache
          - .coverage
        timeout_seconds: 1800
        verbs: [check, test, codegen]
      verbs:
        - name: help
          default_what: usage
          apply_guarded: false
        - name: setup
          default_what: environment
          apply_guarded: false
        - name: deps
          default_what: check
          apply_guarded: false
        - name: build
          default_what: artifacts
          apply_guarded: false
        - name: check
          default_what: all
          apply_guarded: false
        - name: test
          default_what: all
          apply_guarded: false
        - name: fmt
          default_what: check
          apply_guarded: true
        - name: run
          default_what: default
          apply_guarded: false
        - name: status
          default_what: diagnostics
          apply_guarded: false
        - name: docs
          default_what: all
          apply_guarded: false
        - name: clean
          default_what: generated
          apply_guarded: false
        - name: release
          default_what: status
          apply_guarded: false
        - name: codegen
          default_what: check
          apply_guarded: true
        - name: worktree
          default_what: list
          apply_guarded: false
      custom_handler_policy:
        filename: custom.mk
        target_pattern: "^(_custom_(help|setup|deps|build|check|test|fmt|run|status|docs|clean|release|codegen|worktree|basemk)_[a-z0-9][a-z0-9-]*|(pre|post)-(help|setup|deps|build|check|test|fmt|run|status|docs|clean|release|codegen|worktree|basemk)(-[a-z0-9][a-z0-9-]*)?)$"
        allow_public_targets: false
        allow_toolchain_declarations: false
      custom_handler_profile_overrides:
        workspace-root:
          allow_public_targets: true
          allow_toolchain_declarations: true

    # NOTE (mro-jnm1.1 / mro-jnm1.4): SINGLE SSOT for ephemeral/generated
    # resources. VS Code files.exclude/search.exclude (vscode_exclude),
    # files.watcherExclude (watch_exclude), and source_scan.ignored_resources
    # (source_scan_ignore) are DERIVED from this list by CodegenConfigSpec
    # computed fields. Add a tool cache/build dir here only — never in the
    # consuming projections. Ordering reproduces the historical derived maps.
    artifacts:
      - { name: __pycache__, source_scan_ignore: true }
      - { name: __pyrefly_virtual__ }
      - { name: .agents }
      - { name: .beads }
      - { name: .benchmarks }
      # mro-0wuz: archive-not-delete target for the layout engine; the generated
      # .gitignore projection must never track archived loose files.
      - { name: .bkp }
      - { name: .cache, source_scan_ignore: true }
      # mro-j47u: agent worktrees are duplicate repositories, never production input.
      - { name: .claude, source_scan_ignore: true }
      # mro-jnm1.2: gitignore-only entries absorbed from the removed
      # REQUIRED_GITIGNORE_ENTRIES constant; .direnv keeps the legacy vscode/
      # watch/source-scan projections (order-sensitive, after .claude).
      - { name: .direnv, source_scan_ignore: true }
      - { name: .code-review-graph }
      - { name: .codegraph }
      - { name: .dolt }
      - { name: .dolt_dropped_databases }
      - { name: .doltcfg }
      - { name: .hypothesis }
      - { name: .git, gitignore: false, source_scan_ignore: true }
      - { name: .mypy_cache, source_scan_ignore: true }
      - { name: .omo }
      - { name: .pylance_cache, vscode_exclude: false }
      - { name: .pytest_cache, source_scan_ignore: true }
      - { name: .reports, source_scan_ignore: true }
      - { name: .ropeproject }
      - { name: .ruff_cache, source_scan_ignore: true }
      - { name: .scope }
      - { name: .serena }
      - { name: .sisyphus }
      - { name: .state }
      - { name: .superpowers }
      - { name: .trash }
      - { name: .turbo }
      - { name: .venv, source_scan_ignore: true }
      - { name: .venv.* }
      - { name: "*.egg-info", vscode_exclude: false }
      - { name: build, source_scan_ignore: true }
      - { name: dist, source_scan_ignore: true }
      - { name: node_modules, source_scan_ignore: true }
      - { name: site, watch_exclude: false }
      - { name: target }
      - {
          name: .pyrefly_cache,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: .tox,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: conftest.py,
          is_dir: false,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: dist-packages,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: legado,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: site-packages,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: vendor,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: venv,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      # mro-jnm1.2: gitignore-only entries absorbed from the removed
      # REQUIRED_GITIGNORE_ENTRIES constant; they feed no other projection.
      - { name: .flext-deps, vscode_exclude: false, watch_exclude: false }
      - {
          name: .flext-sync.lock,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: .sync.lock,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - { name: .planning, vscode_exclude: false, watch_exclude: false }
      - {
          name: skill-create-output,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: .debug-journal.md,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: .mcp.json,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: CLAUDE.local.md,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }

    vscode:
      # Canonical .vscode/settings.json content injected with merge semantics:
      # scalar/list keys are enforced, map keys are union-merged (project entries
      # are preserved). Recursive "**" venv search globs are forbidden: they make
      # the Python Environments locator (pet) walk entire repository trees and
      # hang interpreter discovery on large monorepos.
      scalar_settings:
        files.autoSave: afterDelay
        python.analysis.diagnosticMode: workspace
        python.analysis.typeCheckingMode: strict
        python.defaultInterpreterPath: ${workspaceFolder}/.venv/bin/python
        python.terminal.activateEnvInCurrentTerminal: true
        python.terminal.activateEnvironment: true
        ruff.configurationPreference: filesystemFirst
        ruff.format.preview: true
        ruff.importStrategy: fromEnvironment
        ruff.lint.preview: true
        ruff.nativeServer: on
        shellcheck.useWorkspaceRootAsCwd: true
      list_settings:
        python-envs.workspaceSearchPaths:
          - ./.venv
          - ./*/.venv
      map_union_settings:
        python.analysis.diagnosticSeverityOverrides:
          reportUntypedBaseClass: none
        terminal.integrated.env.linux:
          PATH: ${workspaceFolder}/.venv/bin:${env:PATH}
          VIRTUAL_ENV: ${workspaceFolder}/.venv

    # NOTE(mro-0wuz, epic mro-hzox): declarative project-layout SSOT consumed by
    # the layout engine (codegen/layout.py) and the layout quality gate. Every
    # move/archive/gitignore decision derives from this section — the engine
    # carries zero hardcoded layout knowledge. severity=warning keeps the gate
    # report-only; flipping to error makes violations fail the check pipeline.
    layout:
      version: 1
      severity: warning
      # Archive-not-delete root: archived entries land in <archive_root>/<project>/.
      archive_root: .bkp
      docs_target: docs
      examples_target: examples
      diagrams_target: docs/diagrams
      allow_hidden: true
      canonical_root_files:
        - pyproject.toml
        - Makefile
        - base.mk
        - custom.mk
        - README.md
        - LICENSE
        - CHANGELOG.md
        - CONTRIBUTING.md
        - AGENTS.md
        - CLAUDE.md
        - conftest.py
        - mkdocs.yml
        - uv.lock
      canonical_root_dotfiles:
        - .gitignore
        - .gitattributes
        - .gitmodules
        - .envrc
        - .env.example
        - .python-version
        - .pre-commit-config.yaml
        - .mise.toml
        - .mcp.json
        - .waza.yaml
        - .sonarcloud.properties
        - sonar-project.properties
      canonical_root_dirs:
        - src
        - tests
        - docs
        - examples
        - scripts
        - config
        - ci
        - dist
        - docker
        - dbt_packages
      # Per-project-type extra canonical root files; the profile of a project
      # is resolved by matching its name against profile_project_patterns.
      profile_extra_root_files:
        dbt:
          - dbt_project.yml
          - packages.yml
          - profiles.yml
          - package-lock.yml
        meltano:
          - meltano.yml
          - docker-compose.test.yml
      profile_project_patterns:
        dbt:
          - flext-dbt-*
        meltano:
          - flext-meltano
          - flext-tap-*
      # Root documentation directories moved under <docs_target>/<name>/.
      move_docs_dirs:
        - api-reference
        - architecture
        - guides
        - releases
        - roadmap
        - standards
        - development
        - improvements
        - refactor
        - refactoring
        - maintenance
        - integration
        - adr
        - diagrams
        - api
        - configuration
        - notebook
        - getting-started
        - troubleshooting
        - testing
        - overview
      # Root Markdown documents moved under <docs_target>/.
      move_docs_files:
        - index.md
        - getting-started.md
        - configuration.md
        - development.md
        - architecture.md
        - api-reference.md
        - testing.md
        - troubleshooting.md
        - quick-start.md
        - overview.md
        - integration.md
        - c4-model.md
        - TODOS.md
        - TODO.md
        - REFACTOR_STATUS.md
        - DOCUMENTATION_UPDATE_SUMMARY.md
        - CONTRACT_BUDGET.md
        - DUPLICATION-DETECTION.md
        - HOOK_WARNINGS.md
        - PLUGIN-ARCHITECTURE.md
        - RULE_MODIFICATION.md
        - TESTING_WARNING_SYSTEM.md
        - FLEXT_0_12_BEADS_LANE_REORGANIZATION_PLAN.md
      # Sample data files moved under <examples_target>/.
      move_example_files:
        - directory.ldif
        - oid_schema.ldif
        - config.json.example
      # Diagram sources moved under <diagrams_target>/.
      move_diagram_globs:
        - "*.puml"
      # Root entries archived into <archive_root>/<project>/ (never deleted).
      # Names match files or directories; globs use fnmatch semantics.
      archive_names:
        - $OUT
        - max
        - "=4.0.0"
        - nohup.out
        - poetry.lock
        - history
        - history.json
        - index.md.bak-legacy-docs-layout
        - dbt_project_migrated.yml
        - processed_directory.ldif
        - output.ldif
        - replace_list.yml
        - maintenance_config.yaml
        - rules.json
        - output
        - logs
        - complete_pipeline_results
        - legado
        - __pycache__
        - b-pipeline
        - debug-pipeline
        - exec-pipeline
        - noexec-pipeline
        - probe
        - status-pipeline
      archive_globs:
        - "*.log"
        - pytest_*.txt
        - pyright_errors*.log
        - test_output.txt
        - mro-to59-*
      # Per-project overrides: extra archives (with the matching .gitignore
      # additions), explicit nested moves, and empty-directory archives.
      project_overrides:
        flext-cli:
          archive_names:
            - settings.json
          gitignore_additions:
            - settings.json
        flext-tap-oracle-wms:
          archive_names:
            - config.json
          gitignore_additions:
            - config.json
        flext-target-oracle-oic:
          archive_names:
            - config.json
          gitignore_additions:
            - config.json
        flext-oracle-oic:
          archive_names:
            - config.json
          gitignore_additions:
            - config.json
        flext-dbt-ldif:
          moves:
            - { source: profiles/profiles.yml, target: profiles.yml }
          archive_empty_dirs:
            - profiles
        flext-dbt-oracle-wms:
          moves:
            - { source: models/reference.md, target: docs/reference.md }
          archive_empty_dirs:
            - models

    managed_files:
      - path: ci/docker/alpine.Dockerfile
        owner: codegen
        policy: full
      - path: ci/docker/arch.Dockerfile
        owner: codegen
        policy: full
      - path: ci/docker/debian.Dockerfile
        owner: codegen
        policy: full
      - path: ci/docker/fedora.Dockerfile
        owner: codegen
        policy: full
      - path: ci/docker/ubuntu.Dockerfile
        owner: codegen
        policy: full
      - path: .github/workflows/ci-matrix.yml
        owner: codegen
        policy: full
      - path: .github/workflows/ci.yml
        owner: codegen
        policy: full
      - path: .env.example
        owner: codegen
        policy: create-only
      - path: .envrc
        owner: codegen
        policy: full
      - path: .gitignore
        owner: codegen
        policy: merge
      - path: .gitmodules
        owner: codegen
        policy: merge
      - path: .mise.toml
        owner: codegen
        policy: full
      - path: .pre-commit-config.yaml
        owner: pre-commit
        policy: full
      - path: .python-version
        owner: codegen
        policy: full
      - path: .vscode/settings.json
        owner: vscode
        policy: merge
      - path: LICENSE
        owner: codegen
        policy: create-only
      - path: Makefile
        owner: make
        policy: full
      - path: README.md
        owner: codegen
        policy: create-only
      - path: base.mk
        owner: make
        policy: delegated
      - path: config/workspace.yaml
        owner: workspace
        policy: manual
      - path: custom.mk
        owner: custom
        policy: create-only
      - path: pyproject.toml
        owner: codegen
        policy: merge

    scaffold:
      build:
        backend: hatchling.build
        requirements: [hatchling]
      project:
        readme: README.md
        supported_licenses: [MIT, Proprietary]
        classifiers:
          - "Development Status :: 4 - Beta"
          - "Intended Audience :: Developers"
          - "Operating System :: OS Independent"
          - "Programming Language :: Python :: 3 :: Only"
          - "Programming Language :: Python :: 3.13"
          - "Topic :: Software Development :: Libraries :: Python Modules"
          - "Typing :: Typed"
        keywords: [clean-architecture, flext, integration, typed]
        dev:
          - actionlint-py>=1.7.12.24
          - flext-tests
          # Floors let uv select the newest compatible tools; no upper cap or
          # exact tool version is imposed by generated project metadata.
          - mypy>=2.3.0
          - pyrefly>=1.1.1
          - pyright>=1.1.411
          - pytest>=9.0.3
          - ruff>=0.15.12
          - vulture>=2.16
          - yamlfix>=1.19.1
        dependency_profiles:
          # NOTE: a workspace manifest may declare an upstream distribution;
          # conformance must model that upstream relationship generically.
          - upstream: flext_core
            runtime:
              - flext-core
              - pydantic>=2.13.3
              - pydantic-settings>=2.14.0
            codegen: [flext-infra]
          - upstream: flext_cli
            runtime:
              - flext-cli
              - flext-core
              - pydantic>=2.13.3
              - pydantic-settings>=2.14.0
            codegen: [flext-infra]
      ping_example:
        command_name: ping
        help_text: Return the configured health response.
        success_message: pong
        enabled_default: true
        reply: pong
        disabled_reply: disabled
      # mro-jnm1.2: the first section is merged AFTER the artifact-SSOT derived
      # patterns by the CodegenConfigSpec.gitignore_sections projection
      # (deduplicated, SSOT wins); declare here only what the SSOT cannot
      # express (file globs, secrets, editor/OS noise). Per-project exception
      # fields are added by mro-jnm1.3.
      gitignore_sections:
        - name: "BLOCK EVERYTHING BY DEFAULT"
          profiles: [workspace-root]
          patterns:
            - "/*"
            - "/*/"
            - "!/LICENSE"
        - name: "Allow all FLEXT ecosystem project directories"
          profiles: [workspace-root]
          patterns:
            - "!flext-*/"
        - name: "WHITELIST: Workspace Directories"
          profiles: [workspace-root]
          patterns:
            - "!docker/"
            - "!docs/"
            - "!examples/"
            - "!.github/"
            - "!src/"
            - "!tests/"
            - "!typings/"
            - "!libs/"
            - "!.vscode/"
            - "!.code-review-graph/"
            - "!.claude/"
            - "!.claude-plugin/"
            - "!/config/"
            - "!.claude/CLAUDE.md"
            - "!.claude/settings.json"
            - "!.claude/settings.local.json"
            - "!.agents/"
            - "!.agents/**"
            - ".agents/skills/*/report.json"
        - name: "Workspace topology manifest"
          profiles: [workspace-root]
          patterns:
            - "!/config/workspace.yaml"
        - name: "Dispatcher-based command surface (Make SSOT)"
          profiles: [workspace-root]
          patterns:
            - "!scripts/"
            - "!scripts/cmd/"
            - "!scripts/cmd/**"
            - "scripts/*.py"
            - "scripts/*.sh"
            - "scripts/*.md"
            - "scripts/maintenance/"
            - "!scripts/dispatch.py"
            - "!scripts/__init__.py"
        - name: "TRACK: Beads team config; keep Dolt data, runtime state, and JSONL exports local."
          profiles: [workspace-root]
          patterns:
            - "!.beads/"
            - ".beads/*"
            - "!.beads/config.yaml"
        - name: "Python configuration"
          profiles: [workspace-root]
          patterns:
            - "!pyproject.toml"
            - "!uv.lock"
            - "!.taplo.toml"
            - "!pyrefly.toml"
            - "!poetry.lock"
            - "!uv.lock"
            - "!ruff-shared.toml"
            - "!uv.lock"
        - name: "mise toolchain pinning"
          profiles: [workspace-root]
          patterns:
            - "!.mise.toml"
            - "!.default-python-packages"
            - "!.python-version"
        - name: "Docker configuration"
          profiles: [workspace-root]
          patterns:
            - "!.dockerignore"
        - name: "Build and automation"
          profiles: [workspace-root]
          patterns:
            - "!Makefile"
            - "!Makefile.flext-docker"
            - "!*.mk"
        - name: "Documentation"
          profiles: [workspace-root]
          patterns:
            - "!README.md"
            - "!AGENTS.md"
            - "!AGENTS.md"
            - "!codex.md"
            - "!.markdownlint.json"
            - "!.markdownlintignore"
            - "!.shellcheckrc"
        - name: "Git configuration"
          profiles: [workspace-root]
          patterns:
            - "!.gitignore"
            - "!.gitmodules"
            - "!.gitattributes"
        - name: "direnv environment (no secrets \u2014 venv activation only)"
          profiles: [workspace-root]
          patterns:
            - "!.envrc"
            - "!.envrc.local"
        - name: "Environment templates (NOT .env - keep secrets out!)"
          profiles: [workspace-root]
          patterns:
            - "!.env.test"
            - "!.env.example"
            - "!.env.template"
        - name: "WHITELIST: Contents Inside Allowed Directories"
          profiles: [workspace-root]
          patterns:
            - "!docker/**"
            - "!docs/**"
            - "!examples/**"
            - "!.github/**"
            - "!src/**"
            - "!tests/**"
            - "!typings/**"
            - "!libs/**"
            - "!.vscode/**"
            - "!.claude/**"
            - "!.claude-plugin/**"
        - name: "Workspace member contents"
          profiles: [workspace-root]
          patterns:
            - "!flext-*/**"
        - name: "BLOCK: AI/Agent Local Data (NEVER track these)"
          patterns:
            - ".claude/*"
            - "!.agents/skills/"
            - "!.agents/skills/**"
        - name: "Skill scan reports (transient, regenerated by skill_validate.py)"
          patterns:
            - ".agents/skills/*/report.json"
        - name: "Aider AI data"
          patterns:
            - ".aider/"
            - ".aider.conf.yml"
            - ".aider.chat.history.md"
            - "**/.aider/"
        - name: "Other AI assistants"
          patterns:
            - ".cursor/"
            - ".copilot/"
            - ".codeium/"
        - name: "Oracle dump files"
          patterns:
            - "**/*.dmp"
            - "**/*.DMP"
        - name: "Oracle logs"
          patterns:
            - "**/*.trc"
            - "**/*.aud"
        - name: "Oracle wallet files"
          patterns:
            - "**/cwallet.sso"
            - "**/ewallet.p12"
            - "**/tnsnames.ora"
            - "**/sqlnet.ora"
        - name: "Oracle test/reference data directories"
          patterns:
            - "**/oracle_data/"
            - "**/oracle_dump/"
            - "**/oracle_export/"
            - "**/oracle_import/"
            - "**/expdp_*/"
            - "**/impdp_*/"
        - name: "Python artifacts inside allowed directories"
          patterns:
            - "**/__pycache__/"
            - "**/*.pyc"
            - "**/*.pyo"
            - "**/*.pyd"
            - "**/*.so"
            - "**/*.egg"
            - "**/*.egg-info/"
            - "**/dist/"
            - "**/build/"
            - "!scripts/cmd/build/"
            - "**/.eggs/"
        - name: "Skill validation temporary reports"
          patterns:
            - "baseline.json"
            - "report.json"
            - "fix-report.json"
            - "*.rej"
        - name: "Python caches inside allowed directories"
          patterns:
            - "**/.mypy_cache/"
            - "**/.ruff_cache/"
            - "**/.pytest_cache/"
            - "**/.hypothesis/"
            - "**/.tox/"
            - "**/.nox/"
            - "**/.benchmarks/"
        - name: "Coverage reports inside allowed directories"
          patterns:
            - "**/htmlcov/"
            - "**/.coverage"
            - "**/coverage.json"
            - "**/.coverage.*"
            - "**/coverage.xml"
            - "**/*.cover"
        - name: "Virtual environments inside allowed directories (should never be committed)"
          patterns:
            - "**/.venv/"
            - "**/venv/"
            - "**/env/"
            - "**/ENV/"
            - "**/.virtualenv/"
        - name: "Native build artifacts inside allowed directories"
          patterns:
            - "**/*.exe"
            - "**/*.exe~"
            - "**/*.dll"
            - "**/*.dylib"
            - "**/*.test"
            - "**/*.out"
            - "vendor/"
        - name: "Node.js inside allowed directories"
          patterns:
            - "**/node_modules/"
            - "**/npm-debug.log"
            - "**/yarn-error.log"
            - "**/.npm/"
            - "**/.yarn/"
        - name: "IDE and editor files inside allowed directories"
          patterns:
            - "**/.idea/"
            - "**/*.iml"
            - "**/.vscode/*.code-workspace"
            - "**/.vscode/internal.invalid.json"
            - "**/*.swp"
            - "**/*.swo"
            - "**/*~"
            - "**/.*.sw?"
        - name: "OS files inside allowed directories"
          patterns:
            - "**/.DS_Store"
            - "**/Thumbs.db"
            - "**/Desktop.ini"
        - name: "Temporary and log files inside allowed directories"
          patterns:
            - "**/*.log"
            - "**/*.tmp"
            - "**/*.temp"
            - "**/tmp/"
            - "**/temp/"
            - "**/.tmp/"
        - name: "Build and quality tool artifacts inside allowed directories"
          patterns:
            - "**/.qlty/"
            - "**/.meltano/"
            - "**/.serena/"
        - name: "Backup files inside allowed directories"
          patterns:
            - "**/*.bak"
            - "**/*.bkp"
            - "**/*.bkp?"
            - "**/*.backup"
            - "**/*.orig"
            - "**/*_backup"
            - "**/*_backup_*"
            - "**/*.md.backup"
            - "**/archived/"
        - name: "Autofix rejection artifacts (run_skill_autofix.sh rollback output)"
          patterns:
            - "**/*.rej-*.bak"
            - "**/*.rej-*.rej"
        - name: "Database files inside allowed directories"
          patterns:
            - "**/*.db"
            - "**/*.sqlite"
            - "**/*.sqlite3"
        - name: "Compiled files inside allowed directories"
          patterns:
            - "**/*.class"
            - "**/*.o"
            - "**/*.obj"
            - "**/*.a"
        - name: "Archive files inside allowed directories (usually shouldn't be in git)"
          patterns:
            - "**/*.zip"
            - "**/*.tar"
            - "**/*.tar.gz"
            - "**/*.tgz"
            - "**/*.rar"
            - "**/*.7z"
        - name: "Environment files with actual secrets"
          patterns:
            - ".env"
            - ".internal.invalid"
            - ".env.production"
            - ".env.development"
            - "**/.env"
        - name: "Credentials and keys"
          patterns:
            - "*.key"
            - "*.pem"
            - "*.p12"
            - "*.pfx"
            - "credentials.json"
            - "**/credentials.json"
            - "secrets.yaml"
            - "secrets.yml"
            - "**/.credentials*"
        - name: "ALLOW: Preserve Empty Directories"
          patterns:
            - "!**/.gitkeep"
        - name: "Ensure these are NEVER committed, even if explicitly added"
          patterns:
            - ".milvus/"
            - ".claude-data/"
            - ".devcontainer/.host-gitsettings"
            - ".devcontainer/.env"
            - ".github/*.rej"
        - name: "--- codegen conform: tracked owner inputs ---"
          patterns:
            - "!base.mk"
        - name: "FINAL BEADS TRACKING POLICY"
          patterns:
            - "!.beads/"
            - ".beads/*"
            - ".beads/.*"
            - "!.beads/config.yaml"
            - ".beads/proxieddb/"
            - ".dolt/"
            - "*.db"
            - ".beads-credential-key"
            - ".worktrees/"
            - "legado/"
        - name: "codegen module-standardizer reject artifacts (ADR-005 \u00a79)"
          patterns:
            - "*.tpl.rej"
        - name: "--- codegen conform: generated runtime ignores ---"
          patterns:
            - ".direnv/"
            - ".reports/"
            - ".venv/"
            - "__pycache__/"
            - "base.mk"
            - "!.pre-commit-config.yaml"
    templates:
      root: project
      entries:
        - source: base/.github/workflows/ci.yml.j2
          destination: .github/workflows/ci.yml
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        - source: base/README.md.j2
          destination: README.md
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        - source: base/LICENSE.j2
          destination: LICENSE
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        - source: base/gitignore.j2
          destination: .gitignore
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        - source: base/python-version.j2
          destination: .python-version
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        - source: base/env.example.j2
          destination: .env.example
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        - source: base/.mise.toml.j2
          destination: .mise.toml
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        - source: base/.envrc.j2
          destination: .envrc
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        # Multi-environment CI base: reusable ci-matrix workflow + per-distro
        # clean-machine images validating bootstrap and make verbs everywhere.
        - source: base/.github/workflows/ci-matrix.yml.j2
          destination: .github/workflows/ci-matrix.yml
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        - source: base/ci/docker/ubuntu.Dockerfile.j2
          destination: ci/docker/ubuntu.Dockerfile
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        - source: base/ci/docker/debian.Dockerfile.j2
          destination: ci/docker/debian.Dockerfile
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        - source: base/ci/docker/fedora.Dockerfile.j2
          destination: ci/docker/fedora.Dockerfile
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        - source: base/ci/docker/alpine.Dockerfile.j2
          destination: ci/docker/alpine.Dockerfile
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        - source: base/ci/docker/arch.Dockerfile.j2
          destination: ci/docker/arch.Dockerfile
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        # NOTE(mro-wkii.17.11, agent codex): workspace topology owns git submodules;
        # environment activation is owned by mise + the generated Makefile.
        - source: base/gitmodules.j2
          destination: .gitmodules
          profiles: [workspace-root]
          delegate: render
          overwrite: true
        - source: base/Makefile.j2
          destination: Makefile
          # The generic conform engine is the single Makefile owner for every
          # profile; workspace-root fan-out is selected inside this template.
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        - source: base/custom.mk.j2
          destination: custom.mk
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        - source: base/pyproject.toml.j2
          destination: pyproject.toml
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        - source: base/config/workspace.yaml.j2
          destination: config/workspace.yaml
          profiles: [workspace-root, standalone]
          delegate: manifest
          overwrite: false
        - source: base/src/__init__.py.j2
          destination: "src/{package_name}/__init__.py"
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        - source: base/src/api.py.j2
          destination: "src/{package_name}/api.py"
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        - source: base/src/cli.py.j2
          destination: "src/{package_name}/cli.py"
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        - source: base/src/__main__.py.j2
          destination: "src/{package_name}/__main__.py"
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        - source: base/src/base.py.j2
          destination: "src/{package_name}/base.py"
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        - source: base/src/models.py.j2
          destination: "src/{package_name}/models.py"
          profiles: [workspace-root, standalone]
          delegate: render
          overwrite: false
        - source: base/src/typings.py.j2
