Infra:
  codegen:
    # NOTE(mro-wkii.17.5, agent implement_manifest): declarative SSOT for deterministic project conformance.
    version: 1

    toolchain:
      # Single-source Python minor line. The environment resolves the newest
      # compatible 3.13 patch; no patch is pinned in generated repositories.
      # Derived as computed fields on ToolchainSpec:
      #   python_required_version -> >=3.13,<3.14
      # uv is supplied by the caller environment and is deliberately not pinned.
      # Dependency floors live in pyproject; uv.lock owns resolved versions.
      python_version: "3.13"
      uv_link_mode: copy
      # Supply-chain cooldown SSOT (CWE-829): projected to uv exclude-newer and
      # every Dependabot ecosystem so updates never raise floors that uv blocks.
      dependency_cooldown_days: 7
      # Security updates are not delayed by Dependabot; match that behavior in
      # uv only for explicitly reviewed security floors.
      dependency_cooldown_exclusions: [cryptography]
      # Per-package cutoffs for floors published after the shared window. The
      # cooldown is one date for the whole resolution, so a dependency whose
      # required floor is newer than that date makes the project unsatisfiable:
      # uv refuses to resolve and names exclude-newer-package as the remedy.
      # Switching the cooldown off is the wrong instrument here — the cutoff has
      # to move to the instant that admits the floor and no further, which keeps
      # the guard in force for every other release of the same package.
      # Each entry below was reviewed against the floor that requires it.
      dependency_cooldown_overrides:
        # floor >=2.0.6; 2.0.7 published 2026-08-17, after the shared cutoff
        mkdocstrings-python: "2026-08-18T00:00:00Z"
        mypy: "2026-08-15T03:04:00Z"
        django-stubs: "2026-08-13T00:00:00Z"
        types-setuptools: "2026-08-13T00:00:00Z"
      # Non-Python toolchain floors consumed by generated .mise.toml and CI.
      #
      # VERSION POLICY: patch releases float; minor and major do not.
      # A patch is a fix within a contract we already validated, so holding it
      # back only keeps known bugs. A minor or major can change behaviour, so it
      # must not arrive silently: mise resolves the newest patch inside the
      # declared minor and STOPS there. When a tool publishes a new minor/major,
      # the gate that consumes it fails, and that failure is the signal to read
      # the changelog, validate our code against it, fix what broke, and only
      # then raise the floor here. An exact "1.2.3" pin cannot express this — it
      # freezes patches too and turns every upgrade into a manual sweep, which
      # is why these were drifting versions behind.
      #
      # `python` already uses this form ("3.13") and is the reference.
      # uv (hq-36xk): .mise.toml.j2 pins uv so local and clean-machine setups
      # agree, but no owner declared the version and every render failed with
      # "'uv_version' is undefined". The toolchain owns tool versions, so it is
      # declared here beside its peers, as a minor floor like the rest.
      uv_version: "0.12"
      kubectl_version: "1.32"
      helm_version: "3.19"
      kind_version: "0.31"
      taplo_version: "0.10"
      ast_grep_version: "0.45"
      gitleaks_version: "8.30"
      tokei_version: "14.0"
      # qlty (hq-36xk): same missing-owner defect as uv_version above.
      qlty_version: "0.642"
      mise_version: "2026.8.14"
      mise_lock_platforms:
        - linux-x64
        - linux-arm64
        - linux-x64-musl
        - linux-arm64-musl
        - macos-x64
        - macos-arm64
        - windows-x64
      mise_lock_platform_exclusions:
        ast-grep:
          - linux-x64-musl
          - linux-arm64-musl
        tokei:
          - linux-x64
          - linux-arm64
          - linux-x64-musl
          - linux-arm64-musl
          - macos-x64
          - macos-arm64
          - windows-x64
      protected_mise_tools:
        - beads
      beads:
        selector_patterns:
          - bd
          - beads
          - "*:*/beads"
          - "*:*/beads/cmd/bd"
        selector: github:gastownhall/beads
        version: "1.2.2"
        prerelease: false
        minimum_release_age: null

    # Why (ai-hub-qwoc): the ast-grep project contract for every governed
    # repository. A provider manifest may declare sgconfig.yml as a required
    # surface, so it is rendered from here instead of hand-written per repo.
    sgconfig:
      rule_dirs:
        - ast-grep-rules
      test_dirs:
        - ast-grep-rule-tests

    # actions/checkout submodules mode for every generated workflow.
    # 'false' is the safe default: the workflow GITHUB_TOKEN cannot clone
    # sibling PRIVATE repositories, so 'recursive' aborts the job at checkout
    # with "Repository not found" before any code runs.
    checkout_submodules: "false"
    github_actions:
      checkout:
        repository: actions/checkout
        version: v7.0.1
        sha: 3d3c42e5aac5ba805825da76410c181273ba90b1
      setup-python:
        repository: actions/setup-python
        version: v7.0.0
        sha: 5fda3b95a4ea91299a34e894583c3862153e4b97
      setup-uv:
        repository: astral-sh/setup-uv
        version: v10.0.1
        sha: 20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      mise:
        repository: jdx/mise-action
        version: v4.2.5
        sha: 3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
      kind:
        repository: helm/kind-action
        version: v1.14.0
        sha: ef37e7f390d99f746eb8b610417061a60e82a6cc
      upload-artifact:
        repository: actions/upload-artifact
        version: v4.6.2
        sha: ea165f8d65b6e75b540449e92b4886f43607fa02
      cache:
        repository: actions/cache
        version: v4.3.0
        sha: 0057852bfaa89a56745cba8c7296529d2fc39830
      configure-pages:
        repository: actions/configure-pages
        version: v6.0.0
        sha: 45bfe0192ca1faeb007ade9deae92b16b8254a0d
      upload-pages-artifact:
        repository: actions/upload-pages-artifact
        version: v5.0.0
        sha: fc324d3547104276b827a68afc52ff2a11cc49c9
      deploy-pages:
        repository: actions/deploy-pages
        version: v5.0.0
        sha: cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

    uv_exclude_dependencies:
      # Standalone CI installs the project editable while sibling flext packages
      # declare the same package via git+https@integration. uv rejects that as
      # conflicting URLs. Scope official exclude-dependencies to the reverse
      # edges only; every other transitive dependency stays in resolution.
      - project: flext-infra
        package:
          name: flext-tests
        dependencies: [flext-infra]
      - project: flext-core
        package:
          name: flext-infra
        dependencies: [flext-core]
      - project: flext-core
        package:
          name: flext-tests
        dependencies: [flext-core]
      - project: flext-core
        package:
          name: flext-cli
        dependencies: [flext-core]
      - project: flext-cli
        package:
          name: flext-infra
        dependencies: [flext-cli]
      - project: flext-cli
        package:
          name: flext-core
        dependencies: [flext-cli]
      - project: flext-cli
        package:
          name: flext-tests
        dependencies: [flext-cli]
      - project: flext-tests
        package:
          name: flext-infra
        dependencies: [flext-tests]

    providers:
      - name: flext-sh
        organization: flext-sh
        base_url: https://github.com/flext-sh
        branch: 0.12.0-dev
      # External consumer organization: repositories governed through their
      # own pyproject.toml and live Git facts. A linha de integracao
      # e 'develop', fixada pela ADR-134 do operador, que proibe 'dev' e
      # 'master' como sinonimos. Verificado na API do GitHub em 2026-08-03:
      # cosmos-main, cosmos-charts e cosmos-gitops tem default_branch=develop
      # e nenhum deles publica 'dev' (GET /branches/dev responde 404).
      - name: datacosmos-br
        organization: datacosmos-br
        base_url: https://github.com/datacosmos-br
        branch: develop
    make:
      selector: WHAT
      bootstrap:
        environment: isolated
        dependency_groups: all
        extras: all
      work_in_progress:
        # Operator law (mro-g3zl2): pre-push gates skip WIP branches and GitHub
        # draft PRs; merges into develop/0.12.0-dev are blocked for those states.
        # Restored (hq-36xk): a merge resolution dropped this block while
        # ci.yml.j2 and .pre-commit-config.yaml.j2 kept consuming it, so no
        # repository could regenerate its CI.
        draft_pr: true
        branch_patterns:
          - '^wip/'
          - 'WIP'
        merge_lock_target_branches:
          - develop
          - 0.12.0-dev
      # Why (mro-dipb): adaptive testmon GitHub Actions cache policy.
      # save_enabled stays false while storage-limit API returns HTTP 402 /
      # flext-infra sits near the default Actions cache ceiling (QUOTA_HOLD).
      testmon_cache:
        schema_version: 1
        mode: bootstrap
        save_enabled: false
        max_bootstrap_generations: 3
        max_stable_generations: 2
        per_repo_budget_bytes: 536870912
        warning_threshold_percent: 70
        maintenance_threshold_percent: 75
        block_threshold_percent: 80
        allowed_save_refs: [refs/heads/0.12.0-dev]
        key_prefix: testmon-v1
      apply_variable: APPLY
      apply_value: Y
      apply_absent_value: N
      ci:
        variable: CI
        value: Y
        # local_value (hq-36xk): the local arm of the same ternary. Only the
        # exact `value` disables coverage and narrows CHECK_GATES, so pre-push
        # sets this instead to keep every gate and the complete pytest+coverage
        # run. The templates consumed `make.ci.local_value` while no owner
        # declared it, so no repository could render its pre-commit config.
        local_value: N
        # RULING 2 (rules, not a skip-list): local_check_gates is the ONLY
        # declared set. CI=Y runs its strict complement, derived in
        # MakeCiSpec.check_gates, so the two contexts can never overlap nor
        # leave a gate unowned; an unset CI runs every allowed gate. `format`
        # is not a check gate at all -- it mutates files, so it belongs to
        # make fmt / make fix APPLY=Y only. This supersedes the earlier
        # check_gates_skip list, which could drift out of sync with the set it
        # was meant to complement.
        # RULING 1: CI is ternary (Y/N/absent). CI=Y and absent run Testmon;
        # CI=N is the explicit local coverage context.
        #
        # The set is the SLOW whole-program type checkers, matching
        # PROJECT_CHECK_GATES_LOCAL_VALUES: those are the gates worth deferring
        # off the fast CI leg, and they are what CI=N exists to own. `lint` is
        # not here -- ruff is cheap, so making CI skip it buys nothing and
        # leaves the fast leg without a linter.
        local_check_gates: [pyrefly, mypy]
      # Why (operator law 2026-08-24): git-hook stages are disabled by default;
      # the workflow below still declares stage membership so re-enabling is a
      # one-key change, case by case.
      pre_commit: false
      pre_push: false
      workflow:
        # Local hooks may apply their declared mutations. The CI renderer uses
        # these same verbs with their read-only defaults and never forwards
        # APPLY=Y. Pre-push adds gen+test.
        - { verb: setup, apply: false, contexts: [local, ci] }
        - { verb: gen, apply: true, contexts: [local, ci, pre_push] }
        - { verb: fmt, apply: true, contexts: [local, ci, pre_commit] }
        - { verb: fix, apply: true, contexts: [local, ci, pre_commit] }
        - { verb: check, apply: false, contexts: [local, ci, pre_push, pre_commit] }
        - { verb: test, apply: false, what: full, contexts: [local, ci, pre_push] }
      # Stale caches cause FALSE DIAGNOSES — a stale __pycache__ produced a
      # pydantic ValidationError for source that was already correct, and stale
      # .reports made a green suite look failed. `clean` owns the full
      # disposable set as DATA so no recipe hardcodes it and every project
      # cleans identically.
      clean:
        # Directories removed anywhere under the tree.
        cache_dirs:
          - __pycache__
          - .mypy_cache
          - .pytest_cache
          - .ruff_cache
          - .pyrefly_cache
          - .benchmarks
          - .hypothesis
        # Directories removed at the project root only.
        root_dirs:
          - build
          - dist
          - htmlcov
          - .reports
        # Files removed at the project root only.
        root_files:
          - .coverage
          - .testmondata
        # Trace/profile artifacts removed anywhere under the tree.
        trace_globs:
          - "*.pstats"
      docs:
        api_modules:
          ai-hub:
            - api
            - base
            - cli
            - constants
            - models
            - protocols
            - typings
            - utilities
          flext-infra:
            - api
            - base
            - base_selection
            - cli
            - constants
            - git
            - iteration
            - models
            - protocols
            - typings
            - utilities
            - worktree
        mutable_actions: [generate, fix]
        reports_dir: .reports/docs
        cross_project_relative_link_pattern: '^(?:\.\./)+flext-[a-z0-9-]+(?:/|$)'
        stale_github_organizations:
          - organization
        github_repos:
          - organization: flext-sh
            repository: flext
            branch: 0.12.0-dev
            local_checkout: ~/flext
          - organization: flext-sh
            repository: flext-core
            branch: 0.12.0-dev
            local_checkout: ~/flext/flext-core
          - organization: flext-sh
            repository: flext-infra
            branch: 0.12.0-dev
            local_checkout: ~/flext/flext-infra
          - organization: datacosmos-br
            repository: ai-hub
            branch: develop
            local_checkout: ~/.ai-hub
          - organization: datacosmos-br
            repository: cosmos-docgen
            branch: develop
            local_checkout: ~/cosmos-docgen
          - organization: datacosmos-br
            repository: cosmos-main
            branch: develop
            local_checkout: ~/cosmos-main
          - organization: marlonsc
            repository: invest
            branch: main
            local_checkout: ~/invest
      verbs:
      - name: help
        default_what: usage
        whats: [usage]
        apply_guarded: false
      - name: setup
        default_what: environment
        whats: [environment]
        apply_guarded: false
      - name: deps
        default_what: check
        whats: [check, lock, upgrade]
        # `lock` and `upgrade` rewrite the lockfile and call _require_apply,
        # so declaring the verb unguarded made them unreachable: the dispatch
        # rejected APPLY=Y while the recipe demanded it.
        apply_guarded: true
        apply_what: upgrade
      - name: build
        default_what: artifacts
        whats: [artifacts]
        apply_guarded: false
      - name: check
        default_what: all
        whats: [all]
        apply_guarded: false
      - name: test
        default_what: all
        # all/full/CI keep Testmon impact selection active. Exact FILE/MATCH
        # invalidates only a bounded cached selector before forceselect.
        # cache-* inspect/checkpoint .testmondata without global deletion.
        whats: [all, full, cache-status, cache-checkpoint]
        apply_guarded: false
      - name: fmt
        default_what: check
        whats: [check, all, apply]
        apply_guarded: true
        apply_what: apply
      - name: fix
        default_what: check
        whats: [check, all, apply]
        apply_guarded: true
        apply_what: apply
      - name: run
        default_what: default
        whats: [default]
        apply_guarded: false
        accepts_apply: true
        apply_what: default
      - name: status
        default_what: diagnostics
        whats: [diagnostics]
        apply_guarded: false
      - name: docs
        # `validate` is the read-only fixed-point after mutation (must differ
        # from apply_what so the fixed-point re-checks without APPLY=Y).
        # `WHAT=all` remains the explicit full pipeline meta-selector.
        default_what: validate
        whats: [all, generate, fix, audit, build, validate]
        # generate/fix materialize artifacts: the generated handler picks
        # --apply or --check from APPLY, and the docs workflow calls
        # `make docs WHAT=generate APPLY=Y`. Without apply_guarded the
        # dispatcher omits _APPLY_WHAT_docs and rejects APPLY as read-only.
        apply_guarded: true
        apply_what: generate
      - name: clean
        default_what: status
        whats: [status, generated]
        # `clean generated` deletes generated output and calls _require_apply.
        # `clean status` is the read-only fixed-point after mutation (must differ
        # from apply_what so the fixed-point re-checks without APPLY=Y).
        apply_guarded: true
        apply_what: generated
      - name: release
        default_what: status
        whats: [status]
        apply_guarded: false
      - name: gen
        default_what: check
        # `init` is the narrow package-initializer owner. It intentionally
        # bypasses conform so regenerating lazy ``__init__.py`` files never
        # discovers workspace topology or inspects external runtime state.
        whats: [check, all, apply, init]
        apply_guarded: true
        apply_what: apply
      - name: mod
        default_what: check
        whats: [check, all, apply]
        # `mod` batch-applies the sgconfig ast-grep rules under the
        # ruff/pyrefly rollback circuit (checkpoint + re-measure); check is
        # the read-only dry-run fixed-point after mutation.
        apply_guarded: true
        apply_what: apply
    # NOTE (mro-jnm1.1 / mro-jnm1.4): SINGLE SSOT for ephemeral/generated
    # resources. VS Code files.exclude/search.exclude (vscode_exclude),
    # files.watcherExclude (watch_exclude), and source_scan.ignored_resources
    # (source_scan_ignore) are DERIVED from this list by CodegenConfigSpec
    # computed fields. Add a tool cache/build dir here only — never in the
    # consuming projections. Ordering reproduces the historical derived maps.
    artifacts:
      - { name: __pycache__, source_scan_ignore: true }
      - { name: __pyrefly_virtual__ }
      - { name: .agents }
      - { name: .benchmarks }
      # mro-0wuz: archive-not-delete target for the layout engine; the generated
      # .gitignore projection must never track archived loose files.
      - { name: .bkp }
      - { name: .cache, source_scan_ignore: true }
      # mro-j47u: agent worktrees are duplicate repositories, never production input.
      - { name: .claude, source_scan_ignore: true }
      # mro-jnm1.2: gitignore-only entries absorbed from the removed
      # REQUIRED_GITIGNORE_ENTRIES constant; .direnv keeps the legacy vscode/
      # watch/source-scan projections (order-sensitive, after .claude).
      - { name: .direnv, source_scan_ignore: true }
      - { name: .code-review-graph }
      - { name: .codegraph }
      - { name: .hypothesis }
      - { name: .git, gitignore: false, source_scan_ignore: true }
      - { name: .mypy_cache, source_scan_ignore: true }
      - { name: .omo }
      - { name: .pylance_cache, vscode_exclude: false }
      - { name: .pytest_cache, source_scan_ignore: true }
      # Project-local scratch owned by generated .envrc (TMPDIR/GOTMPDIR).
      - { name: .test-tmp, source_scan_ignore: true }
      - { name: .testmondata, is_dir: false, source_scan_ignore: true }
      - { name: .testmondata-wal, is_dir: false, source_scan_ignore: true }
      - { name: .testmondata-shm, is_dir: false, source_scan_ignore: true }
      - { name: .reports, source_scan_ignore: true }
      - { name: .ropeproject }
      - { name: .ruff_cache, source_scan_ignore: true }
      - { name: .scope }
      - { name: .serena }
      - { name: .sisyphus }
      - { name: .state }
      - { name: .superpowers }
      - { name: .trash }
      - { name: .turbo }
      - { name: .venv, source_scan_ignore: true }
      - { name: .venv.* }
      - { name: "*.egg-info", vscode_exclude: false }
      - { name: build, source_scan_ignore: true }
      - { name: dist, source_scan_ignore: true }
      - { name: node_modules, source_scan_ignore: true }
      - { name: site, watch_exclude: false }
      - { name: target }
      - {
          name: .pyrefly_cache,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: .tox,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: conftest.py,
          is_dir: false,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: dist-packages,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: legado,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: site-packages,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: vendor,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: venv,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      # mro-jnm1.2: gitignore-only entries absorbed from the removed
      # REQUIRED_GITIGNORE_ENTRIES constant; they feed no other projection.
      # NOTA: .flext-deps foi removido — o cutover para fontes git eliminou o
      # cache, e o gate de actions proibe qualquer referencia ao mecanismo.
      - {
          name: .flext-sync.lock,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: .sync.lock,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - { name: .planning, vscode_exclude: false, watch_exclude: false }
      - {
          name: skill-create-output,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: .debug-journal.md,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: .mcp.json,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: CLAUDE.local.md,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }

    vscode:
      # Canonical .vscode/settings.json content injected with merge semantics:
      # scalar/list keys are enforced, map keys are union-merged (project entries
      # are preserved). Recursive "**" venv search globs are forbidden: they make
      # the Python Environments locator (pet) walk entire repository trees and
      # hang interpreter discovery on large monorepos.
      scalar_settings:
        files.autoSave: afterDelay
        python.analysis.diagnosticMode: workspace
        python.analysis.typeCheckingMode: strict
        python.defaultInterpreterPath: ${workspaceFolder}/.venv/bin/python
        python.terminal.activateEnvInCurrentTerminal: true
        python.terminal.activateEnvironment: true
        ruff.configurationPreference: filesystemFirst
        ruff.format.preview: true
        ruff.importStrategy: fromEnvironment
        ruff.lint.preview: true
        ruff.nativeServer: on
        shellcheck.useWorkspaceRootAsCwd: true
      list_settings:
        python-envs.workspaceSearchPaths:
          - ./.venv
          - ./*/.venv
      map_union_settings:
        python.analysis.diagnosticSeverityOverrides:
          reportUntypedBaseClass: none
        terminal.integrated.env.linux:
          PATH: ${workspaceFolder}/.venv/bin:${env:PATH}
          VIRTUAL_ENV: ${workspaceFolder}/.venv

    # NOTE(mro-0wuz, epic mro-hzox): declarative project-layout SSOT consumed by
    # the layout engine (codegen/layout.py) and the layout quality gate. Every
    # move/archive/gitignore decision derives from this section — the engine
    # carries zero hardcoded layout knowledge. severity=warning keeps the gate
    # report-only; flipping to error makes violations fail the check pipeline.
    layout:
      version: 1
      severity: warning
      # Archive-not-delete root: archived entries land in <archive_root>/<project>/.
      archive_root: .bkp
      docs_target: docs
      examples_target: examples
      diagrams_target: docs/diagrams
      allow_hidden: true
      canonical_root_files:
        - pyproject.toml
        - Makefile
        - README.md
        - LICENSE
        - CHANGELOG.md
        - CONTRIBUTING.md
        - AGENTS.md
        - CLAUDE.md
        - conftest.py
