Infra:
  codegen:
    repository:
      project:
        package_name: flext_infra
        class_stem: FlextInfra
        namespace: Infra
        constant_name: flext-infra
        namespace_attribute: infra
        alias: infra
        environment_prefix: FLEXT_INFRA_
        description: FLEXT Infrastructure Tooling - Build automation, code generation,
          and workspace management
        license: MIT
        author_name: FLEXT Team
        author_email: team@flext.sh
        upstream: flext_cli
        namespace_scan_dirs: []
        homepage: https://github.com/flext-sh/flext-infra
        documentation: https://github.com/flext-sh/flext-infra/blob/main/README.md
        repository_root_rel: .
        year: 2026
      namespace_scan_dirs:
      - src
    branch_policy:
      integration_branch: 0.12.0-dev
    toolchain:
      # Use the declared workspace integration cohort; make upg records its
      # exact commits for frozen replay instead of normalizing old CLI input.
      uv_override_dependencies:
        - "flext-cli @ git+https://github.com/flext-sh/flext-cli.git@upload-20261007"
        - "flext-core @ git+https://github.com/flext-sh/flext-core.git@upload-20261007"
        - "flext-tests @ git+https://github.com/flext-sh/flext-tests.git@upload-20261007"
