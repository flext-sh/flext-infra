Infra:
  codegen:
    # NOTE(mro-wkii.17.5, agent implement_manifest): declarative SSOT for deterministic project conformance.
    version: 1

    toolchain:
      # Single-source Python minor line. The environment resolves the newest
      # compatible 3.13 patch; no patch is pinned in generated repositories.
      # Derived as computed fields on ToolchainSpec:
      #   python_required_version -> >=3.13,<3.14
      # uv is supplied by the caller environment and is deliberately not pinned.
      # Dependency floors live in pyproject; uv.lock owns resolved versions.
      python_version: "3.13"
      uv_link_mode: copy
      # Non-Python toolchain pins consumed by generated .mise.toml and CI.
      kubectl_version: "1.32.0"
      helm_version: "3.19.4"
      kind_version: "0.31.0"
      taplo_version: "0.10.0"
      ast_grep_version: "0.45.0"
      gitleaks_version: "8.30.1"
      tokei_version: "14.0.0"

    github_actions:
      checkout:
        repository: actions/checkout
        version: v7.0.1
        sha: 3d3c42e5aac5ba805825da76410c181273ba90b1
      setup-python:
        repository: actions/setup-python
        version: v7.0.0
        sha: 5fda3b95a4ea91299a34e894583c3862153e4b97
      setup-uv:
        repository: astral-sh/setup-uv
        version: v9.0.0
        sha: c771a70e6277c0a99b617c7a806ffedaca235ff9
      mise:
        repository: jdx/mise-action
        version: v4.1.0
        sha: dba19683ed58901619b14f395a24841710cb4925
      kind:
        repository: helm/kind-action
        version: v1.14.0
        sha: ef37e7f390d99f746eb8b610417061a60e82a6cc

    uv_exclude_dependencies:
      - project: flext-infra
        package:
          name: flext-tests
        dependencies: [flext-infra]

    providers:
      - name: flext-sh
        organization: flext-sh
        base_url: https://github.com/flext-sh
        branch: 0.12.0-dev
    profiles:
      - name: workspace-root
        environment_scope: root
        setup_scope: root-and-members
        execution_scope: root
        discovery_scope: manifest
      - name: workspace-member
        environment_scope: root-when-attached
        setup_scope: delegate-root-when-attached
        execution_scope: root-when-attached
        discovery_scope: none
      - name: standalone
        environment_scope: self
        setup_scope: self
        execution_scope: self
        discovery_scope: none

    make:
      selector: WHAT
      apply_variable: APPLY
      apply_value: Y
      docs_phases: [generate, fix, audit, build, validate]
      cprofile:
        target: flext_infra
        default_args: [codegen, pipeline, --help]
        sort_by: cumulative
        max_rows: 50
        timeout_seconds: 58
        profile_path: .reports/cprofile/flext-infra.prof
        report_path: .reports/cprofile/flext-infra.txt
      serialization:
        lock_path: .state/flext-infra/make-validation.lock
        single_flight_lock_path: .state/flext-infra/make-single-flight.lock
        mutation_fixed_points:
          codegen:
            apply: check
        snapshot_excludes:
          - .state/flext-infra/make-validation.lock
          - .state/flext-infra/make-single-flight.lock
          - .reports
          - .pytest_cache
          - .coverage
        timeout_seconds: 1800
        verbs: [check, test, codegen]
      verbs:
        - name: help
          default_what: usage
          apply_guarded: false
        - name: setup
          default_what: environment
          apply_guarded: false
        - name: deps
          default_what: check
          apply_guarded: false
        - name: build
          default_what: artifacts
          apply_guarded: false
        - name: check
          default_what: all
          apply_guarded: false
        - name: test
          default_what: all
          apply_guarded: false
        - name: fmt
          default_what: check
          apply_guarded: true
        - name: run
          default_what: default
          apply_guarded: false
        - name: status
          default_what: diagnostics
          apply_guarded: false
        - name: docs
          default_what: check
          apply_guarded: false
        - name: clean
          default_what: generated
          apply_guarded: false
        - name: release
          default_what: status
          apply_guarded: false
        - name: codegen
          default_what: check
          apply_guarded: true
        - name: worktree
          default_what: list
          apply_guarded: false
      custom_handler_policy:
        filename: custom.mk
        target_pattern: "^(_custom_(help|setup|deps|build|check|test|fmt|run|status|docs|clean|release|codegen|worktree|basemk)_[a-z0-9][a-z0-9-]*|(pre|post)-(help|setup|deps|build|check|test|fmt|run|status|docs|clean|release|codegen|worktree|basemk)(-[a-z0-9][a-z0-9-]*)?)$"
        allow_public_targets: false
        allow_toolchain_declarations: false
      custom_handler_profile_overrides:
        workspace-root:
          allow_public_targets: true
          allow_toolchain_declarations: true

    cli_registry:
      repository: flext-infra
      output_path: src/flext_infra/cli_registry.py
      options:
        - { name: -h, arity: 0 }
        - { name: --help, arity: 0 }
        - { name: --apply, arity: 0 }
        - { name: --check, arity: 0 }
        - { name: --check-only, arity: 0 }
        - { name: --dry-run, arity: 0 }
        - { name: --fail-fast, arity: 0 }
        - { name: --verbose, arity: 0 }
        - { name: --quiet, arity: 0 }
        - { name: --no-fail, arity: 0 }
        - { name: --typings, arity: 0 }
        - { name: --apply-typings, arity: 0 }
        - { name: --no-pip-check, arity: 0 }
        - { name: --skip-check, arity: 0 }
        - { name: --skip-comments, arity: 0 }
        - { name: --audit, arity: 0 }
        - { name: --rewrite-constraints, arity: 0 }
        - { name: --checks, arity: 1 }
        - { name: --docstring-min, arity: 1 }
        - { name: --workspace, arity: 1 }
        - { name: --projects, arity: 1 }
        - { name: --project, arity: 1 }
        - { name: --module, arity: 1 }
        - { name: --namespace, arity: 1 }
        - { name: --gates, arity: 1 }
        - { name: --what, arity: 1 }
        - { name: --format, arity: 1 }
        - { name: --output, arity: 1 }
        - { name: --report, arity: 1 }
        - { name: --output-dir, arity: 1 }
        - { name: --json-output, arity: 1 }
        - { name: --reports-dir, arity: 1 }
        - { name: --root, arity: 1 }
        - { name: --ruff-args, arity: 1 }
        - { name: --pyright-args, arity: 1 }
        - { name: --operation, arity: 1 }
        - { name: --branch, arity: 1 }
        - { name: --base, arity: 1 }
        - { name: --profile-module, arity: 1 }
        - { name: --arguments, arity: 1 }
        - { name: --profile, arity: 1 }
        - { name: --sort, arity: 1 }
        - { name: --limit, arity: 1 }
        - { name: --timeout-seconds, arity: 1 }
      groups:
        - name: basemk
          help_text: Base.mk template generation
          what_strategy: none
          commands:
            - name: generate
              help_text: Generate base.mk content from the canonical template
              loader_ref: flext_infra.services.cli_routes_codegen:CodegenRoutes.load_generate
        - name: check
          help_text: Lint gates and pyrefly settings management
          what_strategy: check-run
          commands:
            - name: run
              help_text: Run workspace quality gates
              loader_ref: flext_infra.services.cli_routes_codegen:CodegenRoutes.load_run
            - name: fix-pyrefly-settings
              help_text: Repair [tool.pyrefly] blocks
              loader_ref: flext_infra.services.cli_routes_codegen:CodegenRoutes.load_fix_pyrefly_settings
            - name: fix-enforcement
              help_text: Auto-fix enforcement-catalog violations
              loader_ref: flext_infra.services.cli_routes_codegen:CodegenRoutes.load_fix_enforcement
        - name: codegen
          help_text: Code generation and workspace standardization
          what_strategy: none
          commands:
            - name: conform
              help_text: Conform generated project and workspace files
              loader_ref: flext_infra.services.cli_routes_codegen:CodegenRoutes.load_conform
            - name: new
              help_text: Create a new FLEXT project from the canonical templates
              loader_ref: flext_infra.services.cli_routes_codegen:CodegenRoutes.load_new
            - name: init
              help_text: Generate/refresh PEP 562 lazy-import __init__.py files
              loader_ref: flext_infra.services.cli_routes_codegen:CodegenRoutes.load_init
            - name: census
              help_text: Count namespace violations across workspace projects
              loader_ref: flext_infra.services.cli_routes_codegen:CodegenRoutes.load_census
            - name: scaffold
              help_text: Generate missing base modules in src/ and tests/
              loader_ref: flext_infra.services.cli_routes_codegen:CodegenRoutes.load_scaffold
            - name: auto-fix
              help_text: Auto-fix namespace violations (move Finals/TypeVars)
              loader_ref: flext_infra.services.cli_routes_codegen:CodegenRoutes.load_auto_fix
            - name: py-typed
              help_text: Create/remove PEP 561 py.typed markers
              loader_ref: flext_infra.services.cli_routes_codegen:CodegenRoutes.load_py_typed
            - name: pipeline
              help_text: Run full codegen pipeline
              loader_ref: flext_infra.services.cli_routes_codegen:CodegenRoutes.load_pipeline
            - name: constants-quality-gate
              help_text: Run constants migration quality gate
              loader_ref: flext_infra.services.cli_routes_codegen:CodegenRoutes.load_constants_quality_gate
            - name: consolidate
              help_text: Consolidate inline constants into c.Infra.* references
              loader_ref: flext_infra.services.cli_routes_codegen:CodegenRoutes.load_consolidate
            - name: version-file
              help_text: Generate __version__.py from project-metadata SSOT
              loader_ref: flext_infra.services.cli_routes_codegen:CodegenRoutes.load_version_file
        - name: deps
          help_text: Dependency detection and modernization
          what_strategy: none
          commands:
            - name: detect
              help_text: Detect runtime vs dev dependencies
              loader_ref: flext_infra.services.cli_routes_codegen:CodegenRoutes.load_detect
            - name: extra-paths
              help_text: Synchronize pyright/mypy extraPaths
              loader_ref: flext_infra.services.cli_routes_codegen:CodegenRoutes.load_extra_paths
            - name: modernize
              help_text: Modernize workspace pyproject files
              loader_ref: flext_infra.services.cli_routes_codegen:CodegenRoutes.load_modernize
        - name: docs
          help_text: Documentation audit, fix, build, generate, validate
          what_strategy: none
          commands:
            - name: audit
              help_text: Audit documentation for broken links and forbidden terms
              loader_ref: flext_infra.services.cli_routes_validate:ValidationRoutes.load_audit
            - name: fix
              help_text: Fix documentation issues
              loader_ref: flext_infra.services.cli_routes_validate:ValidationRoutes.load_fix
            - name: build
              help_text: Build MkDocs sites
              loader_ref: flext_infra.services.cli_routes_validate:ValidationRoutes.load_build
            - name: generate
              help_text: Generate project docs
              loader_ref: flext_infra.services.cli_routes_validate:ValidationRoutes.load_generate
            - name: serve
              help_text: Serve one MkDocs site in dev mode (blocking preview)
              loader_ref: flext_infra.services.cli_routes_validate:ValidationRoutes.load_serve
            - name: validate
              help_text: Validate documentation
              loader_ref: flext_infra.services.cli_routes_validate:ValidationRoutes.load_validate
        - name: github
          help_text: GitHub workflows, linting, and PR automation
          what_strategy: none
          commands:
            - name: workflows
              help_text: Sync GitHub workflow files across workspace
              loader_ref: flext_infra.services.cli_routes_validate:ValidationRoutes.load_workflows
            - name: lint
              help_text: Lint GitHub workflow files
              loader_ref: flext_infra.services.cli_routes_validate:ValidationRoutes.load_lint
            - name: pr
              help_text: Manage pull requests for a single project
              loader_ref: flext_infra.services.cli_routes_validate:ValidationRoutes.load_pr
            - name: pr-workspace
              help_text: Manage pull requests across workspace projects
              loader_ref: flext_infra.services.cli_routes_validate:ValidationRoutes.load_pr_workspace
        - name: maintenance
          help_text: Python version enforcement
          what_strategy: none
          commands:
            - name: run
              help_text: Enforce Python version constraints
              loader_ref: flext_infra.services.cli_routes_validate:ValidationRoutes.load_run
        - name: validate
          help_text: Infrastructure validators and diagnostics
          what_strategy: validate-command
          commands:
            - name: basemk-validate
              help_text: Validate base.mk sync
              loader_ref: flext_infra.services.cli_routes_validate_commands:ValidationCommandRoutes.load_basemk_validate
            - name: inventory
              help_text: Generate scripts inventory
              loader_ref: flext_infra.services.cli_routes_validate_commands:ValidationCommandRoutes.load_inventory
            - name: runtime-census
              help_text: Post-import Beartype enforcement census for flext_* modules
              loader_ref: flext_infra.services.cli_routes_validate_commands:ValidationCommandRoutes.load_runtime_census
            - name: pytest-diag
              help_text: Extract pytest diagnostics
              loader_ref: flext_infra.services.cli_routes_validate_commands:ValidationCommandRoutes.load_pytest_diag
            - name: cprofile-report
              help_text: Render a bounded report from a cProfile artifact
              loader_ref: flext_infra.services.cli_routes_validate_commands:ValidationCommandRoutes.load_cprofile_report
            - name: cprofile-run
              help_text: Run a module under portable cProfile supervision
              loader_ref: flext_infra.services.cli_routes_validate_commands:ValidationCommandRoutes.load_cprofile_run
            - name: scan
              help_text: Scan text files for patterns
              loader_ref: flext_infra.services.cli_routes_validate_commands:ValidationCommandRoutes.load_scan
            - name: skill-validate
              help_text: Validate a skill
              loader_ref: flext_infra.services.cli_routes_validate_commands:ValidationCommandRoutes.load_skill_validate
            - name: silent-failure
              help_text: Validate silent failure sentinel returns
              loader_ref: flext_infra.services.cli_routes_validate_commands:ValidationCommandRoutes.load_silent_failure
            - name: stub-validate
              help_text: Validate stub supply chain
              loader_ref: flext_infra.services.cli_routes_validate_commands:ValidationCommandRoutes.load_stub_validate
            - name: fresh-import
              help_text: "Guard 7: fresh-process import smoke test"
              loader_ref: flext_infra.services.cli_routes_validate_commands:ValidationCommandRoutes.load_fresh_import
            - name: import-cycles
              help_text: "Guard 1: ROPE-backed import cycle detector"
              loader_ref: flext_infra.services.cli_routes_validate_commands:ValidationCommandRoutes.load_import_cycles
            - name: lazy-map-freshness
              help_text: "Guard 2/3: lazy-map freshness validator"
              loader_ref: flext_infra.services.cli_routes_validate_commands:ValidationCommandRoutes.load_lazy_map_freshness
            - name: namespace
              help_text: "Guard: static namespace rules (NS-000..003) via rope"
              loader_ref: flext_infra.services.cli_routes_validate_commands:ValidationCommandRoutes.load_namespace
            - name: tier-whitelist
              help_text: "Guard 5: tier-whitelist/abstraction-boundary enforcer"
              loader_ref: flext_infra.services.cli_routes_validate_commands:ValidationCommandRoutes.load_tier_whitelist
            - name: metadata-discipline
              help_text: "Guard 8: centralized metadata parser discipline"
              loader_ref: flext_infra.services.cli_routes_validate_commands:ValidationCommandRoutes.load_metadata_discipline
            - name: manual-cmd
              help_text: "Manual-command blocker (§5): pre-commit config drift gate"
              loader_ref: flext_infra.services.cli_routes_validate_commands:ValidationCommandRoutes.load_manual_cmd
        - name: refactor
          help_text: Declarative refactoring and modernization
          what_strategy: none
          commands:
            - name: apply-renames
              help_text: Check or apply an old,new CSV rename list
              loader_ref: flext_infra.services.cli_routes_refactor:RefactorRoutes.load_apply_renames
            - name: migrate-mro
              help_text: Migrate loose declarations into MRO facade classes
              loader_ref: flext_infra.services.cli_routes_refactor:RefactorRoutes.load_migrate_mro
            - name: namespace-enforce
              help_text: Scan workspace for namespace governance violations
              loader_ref: flext_infra.services.cli_routes_refactor:RefactorRoutes.load_namespace_enforce
            - name: census
              help_text: Run a Rope-only workspace census for Python objects
              loader_ref: flext_infra.services.cli_routes_refactor:RefactorRoutes.load_census
            - name: accessor-migrate
              help_text: Preview or apply automated get_/set_/is_ migration
              loader_ref: flext_infra.services.cli_routes_refactor:RefactorRoutes.load_accessor_migrate
            - name: wrapper-root-namespace
              help_text: Normalize wrapper alias imports to wrapper root and flatten *.Core.Tests paths
              loader_ref: flext_infra.services.cli_routes_refactor:RefactorRoutes.load_wrapper_root_namespace
            - name: modernize-patterns
              help_text: "Fix u.Cli.print(), pdb, bare except and open() encoding in library code"
              loader_ref: flext_infra.services.cli_routes_refactor:RefactorRoutes.load_modernize_patterns
            - name: modernize-pydantic
              help_text: Migrate Pydantic v1/legacy patterns to Pydantic v2
              loader_ref: flext_infra.services.cli_routes_refactor:RefactorRoutes.load_modernize_pydantic
            - name: modernize-logging
              help_text: Migrate logging usage to u.fetch_logger
              loader_ref: flext_infra.services.cli_routes_refactor:RefactorRoutes.load_modernize_logging
            - name: modernize-result-di
              help_text: Migrate result-flow and dependency-injector patterns to FLEXT canonical forms
              loader_ref: flext_infra.services.cli_routes_refactor:RefactorRoutes.load_modernize_result_di
            - name: modernize-cli
              help_text: Remove banned CLI helper imports and route u.Cli.print() to cli.display_text()
              loader_ref: flext_infra.services.cli_routes_refactor:RefactorRoutes.load_modernize_cli
        - name: release
          help_text: Release orchestration
          what_strategy: none
          commands:
            - name: run
              help_text: Run release orchestration CLI flow
              loader_ref: flext_infra.services.cli_routes_workspace:WorkspaceRoutes.load_run
        - name: workspace
          help_text: Workspace detection, sync, orchestration, migration
          what_strategy: none
          commands:
            - name: verify-environment
              help_text: Verify live workspace editable provenance
              loader_ref: flext_infra.services.cli_routes_workspace:WorkspaceRoutes.load_verify_environment
            - name: detect
              help_text: Detect workspace or standalone mode
              loader_ref: flext_infra.services.cli_routes_workspace:WorkspaceRoutes.load_detect
            - name: sync
              help_text: Sync base.mk to project root
              loader_ref: flext_infra.services.cli_routes_workspace:WorkspaceRoutes.load_sync
            - name: orchestrate
              help_text: Run make verb across projects
              loader_ref: flext_infra.services.cli_routes_workspace:WorkspaceRoutes.load_orchestrate
            - name: serialize-make
              help_text: Run one state-sensitive Make verb under its checkout lock
              loader_ref: flext_infra.services.cli_routes_workspace:WorkspaceRoutes.load_serialize_make
            - name: migrate
              help_text: Migrate workspace projects to flext_infra tooling
              loader_ref: flext_infra.services.cli_routes_workspace:WorkspaceRoutes.load_migrate
            - name: worktree
              help_text: Manage repository-local development worktrees
              loader_ref: flext_infra.services.cli_routes_workspace:WorkspaceRoutes.load_worktree

    # NOTE (mro-jnm1.1 / mro-jnm1.4): SINGLE SSOT for ephemeral/generated
    # resources. VS Code files.exclude/search.exclude (vscode_exclude),
    # files.watcherExclude (watch_exclude), and source_scan.ignored_resources
    # (source_scan_ignore) are DERIVED from this list by CodegenConfigSpec
    # computed fields. Add a tool cache/build dir here only — never in the
    # consuming projections. Ordering reproduces the historical derived maps.
    artifacts:
      - { name: __pycache__, source_scan_ignore: true }
      - { name: __pyrefly_virtual__ }
      - { name: .agents }
      - { name: .beads }
      - { name: .benchmarks }
      - { name: .cache, source_scan_ignore: true }
      # mro-j47u: agent worktrees are duplicate repositories, never production input.
      - { name: .claude, source_scan_ignore: true }
      # mro-jnm1.2: gitignore-only entries absorbed from the removed
      # REQUIRED_GITIGNORE_ENTRIES constant; .direnv keeps the legacy vscode/
      # watch/source-scan projections (order-sensitive, after .claude).
      - { name: .direnv, source_scan_ignore: true }
      - { name: .code-review-graph }
      - { name: .codegraph }
      - { name: .dolt }
      - { name: .dolt_dropped_databases }
      - { name: .doltcfg }
      - { name: .hypothesis }
      - { name: .git, gitignore: false, source_scan_ignore: true }
      - { name: .mypy_cache, source_scan_ignore: true }
      - { name: .omo }
      - { name: .pylance_cache, vscode_exclude: false }
      - { name: .pytest_cache, source_scan_ignore: true }
      - { name: .reports, source_scan_ignore: true }
      - { name: .ropeproject }
      - { name: .ruff_cache, source_scan_ignore: true }
      - { name: .scope }
      - { name: .serena }
      - { name: .sisyphus }
      - { name: .state }
      - { name: .superpowers }
      - { name: .trash }
      - { name: .turbo }
      - { name: .venv, source_scan_ignore: true }
      - { name: .venv.* }
      - { name: "*.egg-info", vscode_exclude: false }
      - { name: build, source_scan_ignore: true }
      - { name: dist, source_scan_ignore: true }
      - { name: node_modules, source_scan_ignore: true }
      - { name: site, watch_exclude: false }
      - { name: target }
      - {
          name: .pyrefly_cache,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: .tox,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: conftest.py,
          is_dir: false,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: dist-packages,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: legado,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: site-packages,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: vendor,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: venv,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      # mro-jnm1.2: gitignore-only entries absorbed from the removed
      # REQUIRED_GITIGNORE_ENTRIES constant; they feed no other projection.
      - { name: .flext-deps, vscode_exclude: false, watch_exclude: false }
      - {
          name: .flext-sync.lock,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: .sync.lock,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - { name: .planning, vscode_exclude: false, watch_exclude: false }
      - {
          name: skill-create-output,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: .debug-journal.md,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: .mcp.json,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: CLAUDE.local.md,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }

    vscode:
      # Canonical .vscode/settings.json content injected with merge semantics:
      # scalar/list keys are enforced, map keys are union-merged (project entries
      # are preserved). Recursive "**" venv search globs are forbidden: they make
      # the Python Environments locator (pet) walk entire repository trees and
      # hang interpreter discovery on large monorepos.
      scalar_settings:
        files.autoSave: afterDelay
        python.analysis.diagnosticMode: workspace
        python.analysis.typeCheckingMode: strict
        python.defaultInterpreterPath: ${workspaceFolder}/.venv/bin/python
        python.terminal.activateEnvInCurrentTerminal: true
        python.terminal.activateEnvironment: true
        ruff.configurationPreference: filesystemFirst
        ruff.format.preview: true
        ruff.importStrategy: fromEnvironment
        ruff.lint.preview: true
        ruff.nativeServer: on
        shellcheck.useWorkspaceRootAsCwd: true
      list_settings:
        python-envs.workspaceSearchPaths:
          - ./.venv
          - ./*/.venv
      map_union_settings:
        python.analysis.diagnosticSeverityOverrides:
          reportUntypedBaseClass: none
        terminal.integrated.env.linux:
          PATH: ${workspaceFolder}/.venv/bin:${env:PATH}
          VIRTUAL_ENV: ${workspaceFolder}/.venv

    managed_files:
      - path: ci/docker/alpine.Dockerfile
        owner: codegen
        policy: full
      - path: ci/docker/arch.Dockerfile
        owner: codegen
        policy: full
      - path: ci/docker/debian.Dockerfile
        owner: codegen
        policy: full
      - path: ci/docker/fedora.Dockerfile
        owner: codegen
        policy: full
      - path: ci/docker/ubuntu.Dockerfile
        owner: codegen
        policy: full
      - path: .github/workflows/ci-matrix.yml
        owner: codegen
        policy: full
      - path: .github/workflows/ci.yml
        owner: codegen
        policy: full
      - path: .env.example
        owner: codegen
        policy: create-only
      - path: .envrc
        owner: environment
        policy: create-only
      - path: .gitignore
        owner: codegen
        policy: merge
      - path: .gitmodules
        owner: codegen
        policy: full
      - path: .mise.toml
        owner: environment
        policy: merge
      - path: .pre-commit-config.yaml
        owner: pre-commit
        policy: full
      - path: .python-version
        owner: codegen
        policy: full
      - path: .vscode/settings.json
        owner: vscode
        policy: merge
      - path: LICENSE
        owner: codegen
        policy: create-only
      - path: Makefile
        owner: make
        policy: full
      - path: README.md
        owner: codegen
        policy: create-only
      - path: base.mk
        owner: make
        policy: delegated
      - path: config/workspace.yaml
        owner: workspace
        policy: manual
      - path: custom.mk
        owner: custom
        policy: create-only
      - path: pyproject.toml
        owner: codegen
        policy: merge

    scaffold:
      build:
        backend: hatchling.build
        requirements: [hatchling]
      project:
        readme: README.md
        supported_licenses: [MIT, Proprietary]
        classifiers:
          - "Development Status :: 4 - Beta"
          - "Intended Audience :: Developers"
          - "Operating System :: OS Independent"
          - "Programming Language :: Python :: 3 :: Only"
          - "Programming Language :: Python :: 3.13"
          - "Topic :: Software Development :: Libraries :: Python Modules"
          - "Typing :: Typed"
        keywords: [clean-architecture, flext, integration, typed]
        dev:
          - actionlint-py>=1.7.12.24
          - flext-tests
          # Floors let uv select the newest compatible tools; no upper cap or
          # exact tool version is imposed by generated project metadata.
          - mypy>=2.3.0
          - pyrefly>=1.1.1
          - pyright>=1.1.411
          - pytest>=9.0.3
          - ruff>=0.15.12
          - vulture>=2.16
          - yamlfix>=1.19.1
        dependency_profiles:
          # NOTE: a workspace manifest may declare an upstream distribution;
          # conformance must model that upstream relationship generically.
          - upstream: flext_core
            runtime:
              - flext-core
              - pydantic>=2.13.3
              - pydantic-settings>=2.14.0
            codegen: [flext-infra]
          - upstream: flext_cli
            runtime:
              - flext-cli
              - flext-core
              - pydantic>=2.13.3
              - pydantic-settings>=2.14.0
            codegen: [flext-infra]
      ping_example:
        command_name: ping
        help_text: Return the configured health response.
        success_message: pong
        enabled_default: true
        reply: pong
        disabled_reply: disabled
      # mro-jnm1.2: the first section is merged AFTER the artifact-SSOT derived
      # patterns by the CodegenConfigSpec.gitignore_sections projection
      # (deduplicated, SSOT wins); declare here only what the SSOT cannot
      # express (file globs, secrets, editor/OS noise). Per-project exception
      # fields are added by mro-jnm1.3.
      gitignore_sections:
        - name: "BLOCK EVERYTHING BY DEFAULT"
          profiles: [workspace-root]
          patterns:
            - "/*"
            - "/*/"
            - "!/LICENSE"
        - name: "Allow all FLEXT ecosystem project directories"
          profiles: [workspace-root]
          patterns:
            - "!flext-*/"
        - name: "WHITELIST: Workspace Directories"
          profiles: [workspace-root]
          patterns:
            - "!docker/"
            - "!docs/"
            - "!examples/"
            - "!.github/"
            - "!src/"
            - "!tests/"
            - "!typings/"
            - "!libs/"
            - "!.vscode/"
            - "!.code-review-graph/"
            - "!.claude/"
            - "!.claude-plugin/"
            - "!/config/"
            - "!.claude/CLAUDE.md"
            - "!.claude/settings.json"
            - "!.claude/settings.local.json"
            - "!.agents/"
            - "!.agents/**"
            - ".agents/skills/*/report.json"
        - name: "Workspace topology manifest"
          profiles: [workspace-root]
          patterns:
            - "!/config/workspace.yaml"
        - name: "Dispatcher-based command surface (Make SSOT)"
          profiles: [workspace-root]
          patterns:
            - "!scripts/"
            - "!scripts/cmd/"
            - "!scripts/cmd/**"
            - "scripts/*.py"
            - "scripts/*.sh"
            - "scripts/*.md"
            - "scripts/maintenance/"
            - "!scripts/dispatch.py"
            - "!scripts/__init__.py"
        - name: "TRACK: Beads team config; keep Dolt data, runtime state, and JSONL exports local."
          profiles: [workspace-root]
          patterns:
            - "!.beads/"
            - ".beads/*"
            - "!.beads/config.yaml"
        - name: "Python configuration"
          profiles: [workspace-root]
          patterns:
            - "!pyproject.toml"
            - "!uv.lock"
            - "!.taplo.toml"
            - "!pyrefly.toml"
            - "!poetry.lock"
            - "!uv.lock"
            - "!ruff-shared.toml"
            - "!uv.lock"
        - name: "mise toolchain pinning"
          profiles: [workspace-root]
          patterns:
            - "!.mise.toml"
            - "!.default-python-packages"
            - "!.python-version"
        - name: "Docker configuration"
          profiles: [workspace-root]
          patterns:
            - "!.dockerignore"
        - name: "Build and automation"
          profiles: [workspace-root]
          patterns:
            - "!Makefile"
            - "!Makefile.flext-docker"
            - "!*.mk"
        - name: "Documentation"
          profiles: [workspace-root]
          patterns:
            - "!README.md"
            - "!AGENTS.md"
            - "!AGENTS.md"
            - "!codex.md"
            - "!.markdownlint.json"
            - "!.markdownlintignore"
            - "!.shellcheckrc"
        - name: "Git configuration"
          profiles: [workspace-root]
          patterns:
            - "!.gitignore"
            - "!.gitmodules"
            - "!.gitattributes"
        - name: "direnv environment (no secrets \u2014 venv activation only)"
          profiles: [workspace-root]
          patterns:
            - "!.envrc"
            - "!.envrc.local"
        - name: "Environment templates (NOT .env - keep secrets out!)"
          profiles: [workspace-root]
          patterns:
            - "!.env.test"
            - "!.env.example"
            - "!.env.template"
        - name: "WHITELIST: Contents Inside Allowed Directories"
          profiles: [workspace-root]
          patterns:
            - "!docker/**"
            - "!docs/**"
            - "!examples/**"
            - "!.github/**"
            - "!src/**"
            - "!tests/**"
            - "!typings/**"
            - "!libs/**"
            - "!.vscode/**"
            - "!.claude/**"
            - "!.claude-plugin/**"
        - name: "Workspace member contents"
          profiles: [workspace-root]
          patterns:
            - "!flext-*/**"
        - name: "BLOCK: AI/Agent Local Data (NEVER track these)"
          patterns:
            - ".claude/*"
            - "!.agents/skills/"
            - "!.agents/skills/**"
        - name: "Skill scan reports (transient, regenerated by skill_validate.py)"
          patterns:
            - ".agents/skills/*/report.json"
        - name: "Aider AI data"
          patterns:
            - ".aider/"
            - ".aider.conf.yml"
            - ".aider.chat.history.md"
            - "**/.aider/"
        - name: "Other AI assistants"
          patterns:
            - ".cursor/"
            - ".copilot/"
            - ".codeium/"
        - name: "Oracle dump files"
          patterns:
            - "**/*.dmp"
            - "**/*.DMP"
        - name: "Oracle logs"
          patterns:
            - "**/*.trc"
            - "**/*.aud"
        - name: "Oracle wallet files"
          patterns:
            - "**/cwallet.sso"
            - "**/ewallet.p12"
            - "**/tnsnames.ora"
            - "**/sqlnet.ora"
        - name: "Oracle test/reference data directories"
          patterns:
            - "**/oracle_data/"
            - "**/oracle_dump/"
            - "**/oracle_export/"
            - "**/oracle_import/"
            - "**/expdp_*/"
            - "**/impdp_*/"
        - name: "Python artifacts inside allowed directories"
          patterns:
            - "**/__pycache__/"
            - "**/*.pyc"
            - "**/*.pyo"
            - "**/*.pyd"
            - "**/*.so"
            - "**/*.egg"
            - "**/*.egg-info/"
            - "**/dist/"
