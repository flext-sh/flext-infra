Infra:
  codegen:
    # NOTE(mro-wkii.17.5, agent implement_manifest): declarative SSOT for deterministic project conformance.
    version: 1

    toolchain:
      # Single-source language-runtime versions (exact patch pins chosen by the
      # package-version updater). Derived as computed fields on ToolchainSpec:
      #   python_minor_version    -> major.minor of python_version (3.13)
      #   python_required_version -> >={python_version},<{major}.{minor+1}
      #   uv_required_version     -> =={uv_version}
      # A version bump touches ONLY python_version / uv_version. Linter pins
      # live in the pyproject dependency groups (dependency_profiles).
      python_version: "3.13.11"
      uv_version: "0.11.29"
      uv_link_mode: copy
      # Deploy toolchain pins (kubectl/helm/kind) consumed by the generated
      # .mise.toml and the ci-matrix workflow kind leg.
      kubectl_version: "1.32.0"
      helm_version: "3.19.4"
      kind_version: "0.31.0"

    providers:
      - name: flext-sh
        organization: flext-sh
        base_url: https://github.com/flext-sh
        branch: 0.12.0-dev
    profiles:
      - name: workspace-root
        environment_scope: root
        setup_scope: root-and-members
        execution_scope: root
        discovery_scope: manifest
      - name: workspace-member
        environment_scope: root-when-attached
        setup_scope: delegate-root-when-attached
        execution_scope: root-when-attached
        discovery_scope: none
      - name: standalone
        environment_scope: self
        setup_scope: self
        execution_scope: self
        discovery_scope: none

    make:
      selector: WHAT
      apply_variable: APPLY
      apply_value: Y
      verbs:
        - name: help
          default_what: usage
          apply_guarded: false
        - name: setup
          default_what: environment
          apply_guarded: false
        - name: deps
          default_what: check
          apply_guarded: false
        - name: build
          default_what: artifacts
          apply_guarded: false
        - name: check
          default_what: all
          apply_guarded: false
        - name: test
          default_what: all
          apply_guarded: false
        - name: format
          default_what: check
          apply_guarded: true
        - name: run
          default_what: default
          apply_guarded: false
        - name: status
          default_what: diagnostics
          apply_guarded: false
        - name: docs
          default_what: check
          apply_guarded: false
        - name: clean
          default_what: generated
          apply_guarded: false
        - name: release
          default_what: status
          apply_guarded: false
        - name: codegen
          default_what: check
          apply_guarded: true
      custom_handler_policy:
        filename: custom.mk
        target_pattern: "^(_custom_(help|setup|deps|build|check|test|format|run|status|docs|clean|release|codegen)_[a-z0-9][a-z0-9-]*|(pre|post)-(help|setup|deps|build|check|test|format|run|status|docs|clean|release|codegen)(-[a-z0-9][a-z0-9-]*)?)$"
        allow_public_targets: false
        allow_generated_target_redefinition: false
        allow_toolchain_declarations: false
        allow_setup_declarations: false
        allow_help_declarations: false

    # NOTE (mro-jnm1.1 / mro-jnm1.4): SINGLE SSOT for ephemeral/generated
    # resources. VS Code files.exclude/search.exclude (vscode_exclude),
    # files.watcherExclude (watch_exclude), and source_scan.ignored_resources
    # (source_scan_ignore) are DERIVED from this list by CodegenConfigSpec
    # computed fields. Add a tool cache/build dir here only — never in the
    # consuming projections. Ordering reproduces the historical derived maps.
    artifacts:
      - { name: __pycache__, source_scan_ignore: true }
      - { name: __pyrefly_virtual__ }
      - { name: .agents }
      - { name: .beads }
      - { name: .benchmarks }
      - { name: .cache, source_scan_ignore: true }
      # mro-j47u: agent worktrees are duplicate repositories, never production input.
      - { name: .claude, source_scan_ignore: true }
      # mro-jnm1.2: gitignore-only entries absorbed from the removed
      # REQUIRED_GITIGNORE_ENTRIES constant; .direnv keeps the legacy vscode/
      # watch/source-scan projections (order-sensitive, after .claude).
      - { name: .direnv, source_scan_ignore: true }
      - { name: .code-review-graph }
      - { name: .codegraph }
      - { name: .dolt }
      - { name: .dolt_dropped_databases }
      - { name: .doltcfg }
      - { name: .hypothesis }
      - { name: .git, gitignore: false, source_scan_ignore: true }
      - { name: .mypy_cache, source_scan_ignore: true }
      - { name: .omo }
      - { name: .pylance_cache, vscode_exclude: false }
      - { name: .pytest_cache, source_scan_ignore: true }
      - { name: .reports, source_scan_ignore: true }
      - { name: .ropeproject }
      - { name: .ruff_cache, source_scan_ignore: true }
      - { name: .scope }
      - { name: .serena }
      - { name: .sisyphus }
      - { name: .state }
      - { name: .superpowers }
      - { name: .trash }
      - { name: .turbo }
      - { name: .venv, source_scan_ignore: true }
      - { name: .venv.* }
      - { name: "*.egg-info", vscode_exclude: false }
      - { name: build, source_scan_ignore: true }
      - { name: dist, source_scan_ignore: true }
      - { name: node_modules, source_scan_ignore: true }
      - { name: site, watch_exclude: false }
      - { name: target }
      - {
          name: .pyrefly_cache,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: .tox,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: conftest.py,
          is_dir: false,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: dist-packages,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: legado,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: site-packages,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: vendor,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: venv,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      # mro-jnm1.2: gitignore-only entries absorbed from the removed
      # REQUIRED_GITIGNORE_ENTRIES constant; they feed no other projection.
      - { name: .flext-deps, vscode_exclude: false, watch_exclude: false }
      - {
          name: .flext-sync.lock,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: .sync.lock,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - { name: .planning, vscode_exclude: false, watch_exclude: false }
      - {
          name: skill-create-output,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: .debug-journal.md,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: .mcp.json,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: CLAUDE.local.md,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }

    vscode:
      # Canonical .vscode/settings.json content injected with merge semantics:
      # scalar/list keys are enforced, map keys are union-merged (project entries
      # are preserved). Recursive "**" venv search globs are forbidden: they make
      # the Python Environments locator (pet) walk entire repository trees and
      # hang interpreter discovery on large monorepos.
      scalar_settings:
        files.autoSave: afterDelay
        python.analysis.diagnosticMode: workspace
        python.analysis.typeCheckingMode: strict
        python.defaultInterpreterPath: ${workspaceFolder}/.venv/bin/python
        python.terminal.activateEnvInCurrentTerminal: true
        python.terminal.activateEnvironment: true
        ruff.configurationPreference: filesystemFirst
        ruff.format.preview: true
        ruff.importStrategy: fromEnvironment
        ruff.lint.preview: true
        ruff.nativeServer: on
        shellcheck.useWorkspaceRootAsCwd: true
      list_settings:
        python-envs.workspaceSearchPaths:
          - ./.venv
          - ./*/.venv
          - ./apps/*/.venv
      map_union_settings:
        python.analysis.diagnosticSeverityOverrides:
          reportUntypedBaseClass: none
        terminal.integrated.env.linux:
          PATH: ${workspaceFolder}/.venv/bin:${env:PATH}
          VIRTUAL_ENV: ${workspaceFolder}/.venv

    managed_files:
      - path: .env.example
        owner: codegen
        policy: create-only
      - path: .envrc
        owner: environment
        policy: create-only
      - path: .gitignore
        owner: codegen
        policy: merge
      - path: .gitmodules
        owner: codegen
        policy: full
      - path: .mise.toml
        owner: environment
        policy: merge
      - path: .pre-commit-config.yaml
        owner: pre-commit
        policy: full
      - path: .python-version
        owner: codegen
        policy: full
      - path: .vscode/settings.json
        owner: vscode
        policy: merge
      - path: LICENSE
        owner: codegen
        policy: create-only
      - path: Makefile
        owner: make
        policy: full
      - path: README.md
        owner: codegen
        policy: create-only
      - path: base.mk
        owner: make
        policy: delegated
      - path: config/workspace.yaml
        owner: workspace
        policy: manual
      - path: custom.mk
        owner: custom
        policy: manual
      - path: pyproject.toml
        owner: codegen
        policy: merge

    scaffold:
      build:
        backend: hatchling.build
        requirements: [hatchling]
      project:
        readme: README.md
        supported_licenses: [MIT, Proprietary]
        classifiers:
          - "Development Status :: 4 - Beta"
          - "Intended Audience :: Developers"
          - "Operating System :: OS Independent"
          - "Programming Language :: Python :: 3 :: Only"
          - "Programming Language :: Python :: 3.13"
          - "Topic :: Software Development :: Libraries :: Python Modules"
          - "Typing :: Typed"
        keywords: [clean-architecture, flext, integration, typed]
        dependency_profiles:
          # NOTE: a workspace manifest may declare an upstream distribution;
          # conformance must model that upstream relationship generically.
          - upstream: flext_core
            runtime:
              - flext-core
              - pydantic>=2.13.3
              - pydantic-settings>=2.14.0
            codegen: [flext-infra]
            dev:
              - flext-tests
              - mypy>=2.3.0
              - pyrefly>=1.1.1,<1.2
              - pyright>=1.1.411,<1.2
              - pytest>=9.0.3,<10
              - ruff>=0.15.12,<0.16
              - vulture>=2.16,<3
              - yamlfix>=1.19.1,<2
          - upstream: flext_cli
            runtime:
              - flext-cli
              - flext-core
              - pydantic>=2.13.3
              - pydantic-settings>=2.14.0
            codegen: [flext-infra]
            dev:
              - flext-tests
              # mro-45r9/mro-wkii.17.30: floor lets uv select latest mypy (2.3.0 verified 0 new errors on flext-core+flext-infra); no upper cap so DBT workspaces stay resolvable.
              - mypy>=2.3.0
              - pyrefly>=1.1.1,<1.2
              - pyright>=1.1.411,<1.2
              - pytest>=9.0.3,<10
              - ruff>=0.15.12,<0.16
              - vulture>=2.16,<3
              - yamlfix>=1.19.1,<2
      ping_example:
        command_name: ping
        help_text: Return the configured health response.
        success_message: pong
        enabled_default: true
        reply: pong
        disabled_reply: disabled
      # mro-jnm1.2: the first section is merged AFTER the artifact-SSOT derived
      # patterns by the CodegenConfigSpec.gitignore_sections projection
      # (deduplicated, SSOT wins); declare here only what the SSOT cannot
      # express (file globs, secrets, editor/OS noise). Per-project exception
      # fields are added by mro-jnm1.3.
      gitignore_sections:
        - name: "BLOCK EVERYTHING BY DEFAULT"
          patterns:
            - "/*"
            - "/*/"
            - "!/LICENSE"
        - name: "Allow all FLEXT ecosystem project directories"
          patterns:
            - "!flext-*/"
        - name: "WHITELIST: Workspace Directories"
          patterns:
            - "!docker/"
            - "!docs/"
            - "!examples/"
            - "!.github/"
            - "!src/"
            - "!tests/"
            - "!typings/"
            - "!libs/"
            - "!.vscode/"
            - "!.code-review-graph/"
            - "!.claude/"
            - "!.claude-plugin/"
            - "!/config/"
            - "!/config/workspace.yaml"
            - "!.claude/CLAUDE.md"
            - "!.claude/settings.json"
            - "!.claude/settings.local.json"
            - "!.agents/"
            - "!.agents/**"
            - ".agents/skills/*/report.json"
        - name: "Dispatcher-based command surface (Make SSOT)"
          patterns:
            - "!scripts/"
            - "!scripts/cmd/"
            - "!scripts/cmd/**"
            - "scripts/*.py"
            - "scripts/*.sh"
            - "scripts/*.md"
            - "scripts/maintenance/"
            - "!scripts/dispatch.py"
            - "!scripts/__init__.py"
        - name: "TRACK: Beads team config; keep Dolt data, runtime state, and JSONL exports local."
          patterns:
            - "!.beads/"
            - ".beads/*"
            - "!.beads/config.yaml"
        - name: "Python configuration"
          patterns:
            - "!pyproject.toml"
            - "!.taplo.toml"
            - "!pyrefly.toml"
            - "!poetry.lock"
            - "!ruff-shared.toml"
        - name: "mise toolchain pinning"
          patterns:
            - "!.mise.toml"
            - "!.default-python-packages"
        - name: "Docker configuration"
          patterns:
            - "!.dockerignore"
        - name: "Build and automation"
          patterns:
            - "!Makefile"
            - "!Makefile.flext-docker"
            - "!*.mk"
        - name: "Documentation"
          patterns:
            - "!README.md"
            - "!AGENTS.md"
            - "!AGENTS.md"
            - "!codex.md"
            - "!.markdownlint.json"
            - "!.markdownlintignore"
            - "!.shellcheckrc"
        - name: "Git configuration"
          patterns:
            - "!.gitignore"
            - "!.gitmodules"
            - "!.gitattributes"
        - name: "direnv environment (no secrets \u2014 venv activation only)"
          patterns:
            - "!.envrc"
            - "!.envrc.local"
        - name: "Environment templates (NOT .env - keep secrets out!)"
          patterns:
            - "!.env.test"
            - "!.env.example"
            - "!.env.template"
        - name: "WHITELIST: Contents Inside Allowed Directories"
          patterns:
            - "!flext-*/**"
            - "!docker/**"
            - "!docs/**"
            - "!examples/**"
            - "!.github/**"
            - "!src/**"
            - "!tests/**"
            - "!typings/**"
            - "!libs/**"
            - "!.vscode/**"
            - "!.claude/**"
            - "!.claude-plugin/**"
        - name: "BLOCK: AI/Agent Local Data (NEVER track these)"
          patterns:
            - ".claude/*"
            - "!.agents/skills/"
            - "!.agents/skills/**"
        - name: "Skill scan reports (transient, regenerated by skill_validate.py)"
          patterns:
            - ".agents/skills/*/report.json"
        - name: "Aider AI data"
          patterns:
            - ".aider/"
            - ".aider.conf.yml"
            - ".aider.chat.history.md"
            - "**/.aider/"
        - name: "Other AI assistants"
          patterns:
            - ".cursor/"
            - ".copilot/"
            - ".codeium/"
        - name: "Oracle dump files"
          patterns:
            - "**/*.dmp"
            - "**/*.DMP"
        - name: "Oracle logs"
          patterns:
            - "**/*.trc"
            - "**/*.aud"
        - name: "Oracle wallet files"
          patterns:
            - "**/cwallet.sso"
            - "**/ewallet.p12"
            - "**/tnsnames.ora"
            - "**/sqlnet.ora"
        - name: "Oracle test/reference data directories"
          patterns:
            - "**/oracle_data/"
            - "**/oracle_dump/"
            - "**/oracle_export/"
            - "**/oracle_import/"
            - "**/expdp_*/"
            - "**/impdp_*/"
        - name: "Python artifacts inside allowed directories"
          patterns:
            - "**/__pycache__/"
            - "**/*.pyc"
            - "**/*.pyo"
            - "**/*.pyd"
            - "**/*.so"
            - "**/*.egg"
            - "**/*.egg-info/"
            - "**/dist/"
            - "**/build/"
            - "!scripts/cmd/build/"
            - "**/.eggs/"
        - name: "Skill validation temporary reports"
          patterns:
            - "baseline.json"
            - "report.json"
            - "fix-report.json"
            - "*.rej"
        - name: "Python caches inside allowed directories"
          patterns:
            - "**/.mypy_cache/"
            - "**/.ruff_cache/"
            - "**/.pytest_cache/"
            - "**/.hypothesis/"
            - "**/.tox/"
            - "**/.nox/"
            - "**/.benchmarks/"
        - name: "Coverage reports inside allowed directories"
          patterns:
            - "**/htmlcov/"
            - "**/.coverage"
            - "**/coverage.json"
            - "**/.coverage.*"
            - "**/coverage.xml"
            - "**/*.cover"
        - name: "Virtual environments inside allowed directories (should never be committed)"
          patterns:
            - "**/.venv/"
            - "**/venv/"
            - "**/env/"
            - "**/ENV/"
            - "**/.virtualenv/"
        - name: "Native build artifacts inside allowed directories"
          patterns:
            - "**/*.exe"
            - "**/*.exe~"
            - "**/*.dll"
            - "**/*.dylib"
            - "**/*.test"
            - "**/*.out"
            - "vendor/"
        - name: "Node.js inside allowed directories"
          patterns:
            - "**/node_modules/"
            - "**/npm-debug.log"
            - "**/yarn-error.log"
            - "**/.npm/"
            - "**/.yarn/"
        - name: "IDE and editor files inside allowed directories"
          patterns:
            - "**/.idea/"
            - "**/*.iml"
            - "**/.vscode/*.code-workspace"
            - "**/.vscode/internal.invalid.json"
            - "**/*.swp"
            - "**/*.swo"
            - "**/*~"
            - "**/.*.sw?"
        - name: "OS files inside allowed directories"
          patterns:
            - "**/.DS_Store"
            - "**/Thumbs.db"
            - "**/Desktop.ini"
        - name: "Temporary and log files inside allowed directories"
          patterns:
            - "**/*.log"
            - "**/*.tmp"
            - "**/*.temp"
            - "**/tmp/"
            - "**/temp/"
            - "**/.tmp/"
        - name: "Build and quality tool artifacts inside allowed directories"
          patterns:
            - "**/.qlty/"
            - "**/.meltano/"
            - "**/.serena/"
        - name: "Backup files inside allowed directories"
          patterns:
            - "**/*.bak"
            - "**/*.bkp"
            - "**/*.bkp?"
            - "**/*.backup"
            - "**/*.orig"
            - "**/*_backup"
            - "**/*_backup_*"
            - "**/*.md.backup"
            - "**/archived/"
        - name: "Autofix rejection artifacts (run_skill_autofix.sh rollback output)"
          patterns:
            - "**/*.rej-*.bak"
            - "**/*.rej-*.rej"
        - name: "Database files inside allowed directories"
          patterns:
            - "**/*.db"
            - "**/*.sqlite"
            - "**/*.sqlite3"
        - name: "Compiled files inside allowed directories"
          patterns:
            - "**/*.class"
            - "**/*.o"
            - "**/*.obj"
            - "**/*.a"
        - name: "Archive files inside allowed directories (usually shouldn't be in git)"
          patterns:
            - "**/*.zip"
            - "**/*.tar"
            - "**/*.tar.gz"
            - "**/*.tgz"
            - "**/*.rar"
            - "**/*.7z"
        - name: "Environment files with actual secrets"
          patterns:
            - ".env"
            - ".internal.invalid"
            - ".env.production"
            - ".env.development"
            - "**/.env"
        - name: "Credentials and keys"
          patterns:
            - "*.key"
            - "*.pem"
            - "*.p12"
            - "*.pfx"
            - "credentials.json"
            - "**/credentials.json"
            - "secrets.yaml"
            - "secrets.yml"
            - "**/.credentials*"
        - name: "ALLOW: Preserve Empty Directories"
          patterns:
            - "!**/.gitkeep"
        - name: "Ensure these are NEVER committed, even if explicitly added"
          patterns:
            - ".milvus/"
            - ".claude-data/"
            - ".devcontainer/.host-gitsettings"
            - ".devcontainer/.env"
            - ".github/*.rej"
        - name: "--- workspace-migrate: required ignores (auto-managed) ---"
          patterns:
            - "!base.mk"
        - name: "FINAL BEADS TRACKING POLICY"
          patterns:
            - "!.beads/"
            - ".beads/*"
            - ".beads/.*"
            - "!.beads/config.yaml"
            - ".beads/proxieddb/"
            - ".dolt/"
            - "*.db"
            - ".beads-credential-key"
            - ".worktrees/"
            - "legado/"
        - name: "codegen module-standardizer reject artifacts (ADR-005 \u00a79)"
          patterns:
            - "*.tpl.rej"
        - name: "--- workspace-sync: required ignores (auto-managed) ---"
          patterns:
            - ".direnv/"
            - ".reports/"
            - ".venv/"
            - "__pycache__/"
            - "base.mk"
            - "!.pre-commit-config.yaml"
    templates:
      root: project
      entries:
        - source: base/README.md.j2
          destination: README.md
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/LICENSE.j2
          destination: LICENSE
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/gitignore.j2
          destination: .gitignore
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/python-version.j2
          destination: .python-version
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/env.example.j2
          destination: .env.example
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/.mise.toml.j2
          destination: .mise.toml
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        # Multi-environment CI base: reusable ci-matrix workflow + per-distro
        # clean-machine images validating bootstrap and make verbs everywhere.
        - source: base/.github/workflows/ci-matrix.yml.j2
          destination: .github/workflows/ci-matrix.yml
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/ci/docker/ubuntu.Dockerfile.j2
          destination: ci/docker/ubuntu.Dockerfile
          profiles: [workspace-root, workspace-member, standalone]
          delegate: render
          overwrite: false
        - source: base/ci/docker/debian.Dockerfile.j2
          destination: ci/docker/debian.Dockerfile
