        - RELEASES
        - apresentacoes
        - solutions
      # Root Markdown documents moved under <docs_target>/.
      move_docs_files:
        - index.md
        - getting-started.md
        - configuration.md
        - development.md
        - architecture.md
        - api-reference.md
        - testing.md
