# Declarative public exports manifest for flext-infra
# This is the SSOT for public API contracts (RC-B).
# When this manifest exists, the filesystem scan becomes a validator:
# divergence between scan and manifest = gen failure (never silent mutation).
#
# Update this manifest when intentionally changing public exports.
# Deleting a module -> gen MUST fail pointing to orphaned export in manifest.
# Restoring a module -> gen passes.

