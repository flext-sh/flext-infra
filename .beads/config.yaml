# @flext-managed: continuous
# @flext-regenerate: make gen WHAT=apply APPLY=Y
# @flext-ssot: config/beads.yaml + flext-infra config/codegen.yaml (toolchain.beads.server)
# @flext-maintenance: do not edit generated projections; edit the SSOT and regenerate
# Generated by `flext-infra gen conform`.
# Source: repository-local config/beads.yaml database and issue_prefix.
# Source: dolt server block = flext-infra config/codegen.yaml
# toolchain.beads.server (machine-wide shared Dolt server facts).
# Repository-local projection; conform only renders configuration and never
# initializes, starts, or verifies runtime state.
issue-prefix: "flext"

# Dolt server connection (Gas City managed server on :3307).
# The `flext` database lives there; a repository-local server is never used.
dolt:
  mode: server
  shared-server: false
  host: 127.0.0.1
  port: 3307
  user: root
  database: flext
  auto-commit: "on"
prefix: "flext"
